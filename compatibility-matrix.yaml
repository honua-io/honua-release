# Compatibility matrix — the interop rules. The product differentiator: "keeping track of version
# compatibility, iac<->server<->sdk." Enforced at build (drift tests), deploy (iac/helm preflight),
# runtime (server advertises contractVersion; SDK checks), and upgrade (preflight).
#
# rc.0 snapshot (2026-07-01): ranges encoded CONSERVATIVELY with the current shipped version as the
# floor and the next breaking boundary as the ceiling (for 0.x, the next MINOR is breaking, so the
# ceiling is the next minor; for >=1.x, the ceiling is the next MAJOR). These are initial bounds to
# make the gates real, not the final negotiated support window — widen deliberately as the compat
# suite proves pairings.
#
# Floors come from platform-manifest.yaml (same 2026-07-01 snapshot). Where a component has no
# release it is pinned by sha in the manifest and excluded from semver ranges here (noted inline).
# Release-gate PRs were still merging at snapshot; sha-pinned couplings that reference a still-open
# gate PR carry a `# pending` flag mirroring the manifest.

# Each rule: a contract surface at a version, and the component version ranges that satisfy it.
contracts:
  geoservices:
    # TODO(contract-wire): the server still does not advertise a single GeoServices REST contract
    # version (and deliberately does not emit ArcGIS `currentVersion`). Once a GeoServicesContract
    # .Version constant is wired into the service-info/capabilities response (see
    # platform-manifest.yaml honua-server.contractVersions.geoservices), set this and tighten the
    # client floors against the version the SDKs actually negotiate.
    version: v0        # PLACEHOLDER — not yet advertised by the server
    clients:
      honua-sdk-js:     ">=0.0.19-alpha.0 <0.1.0"   # 0.x: minor is breaking, so ceiling = next minor
      honua-sdk-dotnet: ">=1.4.3 <2.0.0"
      honua-sdk-python: ">=0.1.9 <0.2.0"            # 0.x: ceiling = next minor
  grpc:
    version: v1        # proto package geospatial.v1 (geospatial-grpc VERSIONING.md; server advertises grpc v1)
    # geospatial-grpc 0.1.0-alpha.2 is the schema source; SDK floors are where grpc clients live.
    clients:
      honua-sdk-dotnet: ">=1.4.3"
      honua-sdk-js:     ">=0.0.19-alpha.0"
  admin:               # console <-> server admin/control-plane API
    # REAL: advertised at /api/v1/admin/capabilities (AdminApiMajor="v1", AdminApiMajorNumber=1,
    # basePath /api/v1/admin; capabilities exposes compatibility.controlPlaneApi.major=1).
    version: v1
    clients:
      # console has no release (pinned by sha); floor is its declared package.json version.
      honua-console:    ">=0.1.0"
      # python SDK gates on this surface: baseline controlPlaneApiMajor 1
      # (honua-sdk-python compatibility/server-matrix.json).
      honua-sdk-python: ">=0.1.9"
  metadata:            # metadata surface advertised in the capabilities envelope
    version: "metadata.honua.io/v2alpha1"   # MetadataV2Constants.ApiVersion; schemaVersion 2.0.0-alpha.1
    clients:
      # NOTE(drift): honua-sdk-python compatibility/server-matrix.json still declares an expected
      # metadataSchemas version of "v1"; the server now advertises metadata.honua.io/v2alpha1. Track
      # and reconcile before promotion — the SDK's declared expectation lags the server surface.
      honua-sdk-python: ">=0.1.9"

# Deploy/runtime coupling. honua-iac and honua-helm have no releases yet (pinned by sha in the
# manifest); ranges below bound the SERVER artifact they are allowed to deploy. honua-server is
# itself pre-release (pinned by sha), so these couplings are sha-pinned, not semver-ranged.
deploy:
  honua-iac:
    # TODO: encode against a released server version once honua-server cuts a tag; today server is
    # pinned by sha (trunk == ghcr nightly-aot), so the deploy range is sha-pinned, not semver-ranged.
    deploysServerImage: "sha:264a7d3810a0ae0f8c9c60c6ce4695de286b2673"   # pending: re-pin after server #2336/#2337/#2338 land
  honua-helm:
    # Chart.yaml appVersion is "0.0.0" (placeholder); chart version is 0.4.0 (un-released).
    appVersion: "sha:264a7d3810a0ae0f8c9c60c6ce4695de286b2673"          # pending: re-pin after server #2336/#2337/#2338 land

data:
  honua-server:
    # DB schema version = highest applied migration on trunk (src/Honua.Server/Migrations/, NNN_ prefix);
    # max is 072_CreateEnrichmentDatasets.sql. DbUp journals to public.schema_versions (no single constant).
    requiresDbSchema: ">=072"

# Support window policy: server supports clients within N-2 minor of its contract version.
supportWindow:
  clientMinorsBack: 2
  deprecationReleases: 2     # deprecated surfaces carried >= 2 platform releases before removal
