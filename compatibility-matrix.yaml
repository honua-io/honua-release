# Compatibility matrix — the interop rules. The product differentiator: "keeping track of version
# compatibility, iac<->server<->sdk." Enforced at build (drift tests), deploy (iac/helm preflight),
# runtime (server advertises contractVersion; SDK checks), and upgrade (preflight).
#
# Phase 0 snapshot (2026-06-26): ranges encoded CONSERVATIVELY with the current shipped version as
# the floor and the next major as the ceiling. These are initial bounds to make the gates real, not
# the final negotiated support window — widen them deliberately as the compat suite proves pairings.
#
# Floors come from platform-manifest.yaml (same snapshot). Where a component has no release it is
# pinned by sha in the manifest and excluded from semver ranges here (noted inline).

# Each rule: a contract surface at a version, and the component version ranges that satisfy it.
contracts:
  geoservices:
    # TODO(contract-wire): the server does not yet advertise a single GeoServices REST contract
    # version (and deliberately does not emit ArcGIS `currentVersion`). Once a GeoServicesContract
    # .Version constant is wired into the service-info/capabilities response (see
    # platform-manifest.yaml honua-server.contractVersions.geoservices), set this and tighten the
    # client floors against the version the SDKs actually negotiate.
    version: v0        # PLACEHOLDER — not yet advertised by the server
    clients:
      honua-sdk-js:     ">=0.0.14-alpha.0 <0.1.0"   # 0.x: minor is breaking, so ceiling = next minor
      honua-sdk-dotnet: ">=1.3.0 <2.0.0"
      honua-sdk-python: ">=0.1.4 <0.2.0"            # 0.x: ceiling = next minor
  grpc:
    version: v1        # proto package geospatial.v1 (geospatial-grpc VERSIONING.md)
    # geospatial-grpc 0.1.0-alpha.2 is the schema source; SDK floors are where grpc clients live.
    clients:
      honua-sdk-dotnet: ">=1.3.0"
      honua-sdk-js:     ">=0.0.14-alpha.0"
  admin:               # console <-> server admin/control-plane API
    # REAL: advertised at /api/v1/admin/capabilities (AdminApiMajorNumber=1, basePath /api/v1/admin).
    version: v1
    clients:
      # console has no release (pinned by sha); floor is its declared package.json version.
      honua-console:    ">=0.1.0"
      # python SDK gates on this surface: baseline minimumServerVersion 2026.3.0, controlPlaneApiMajor 1
      # (honua-sdk-python compatibility/server-matrix.json).
      honua-sdk-python: ">=0.1.4"
  metadata:            # metadata schema advertised in the capabilities envelope
    version: v1        # MetadataV2Constants.ApiVersion
    clients:
      honua-sdk-python: ">=0.1.4"

# Deploy/runtime coupling. honua-iac and honua-helm have no releases yet (pinned by sha in the
# manifest); ranges below bound the SERVER artifact they are allowed to deploy.
deploy:
  honua-iac:
    # TODO: encode against a released server version once honua-server cuts a tag; today server is
    # pinned by sha (trunk == ghcr nightly-aot), so the deploy range is sha-pinned, not semver-ranged.
    deploysServerImage: "sha:fd89ac51500b192fdefc58267308f3c368537518"   # TODO: replace with ">=X <NEXT_MAJOR" at first server release
  honua-helm:
    # Chart.yaml appVersion is "0.0.0" (placeholder); chart version is 0.4.0 (un-released).
    appVersion: "sha:fd89ac51500b192fdefc58267308f3c368537518"          # TODO: set to server semver range once server releases

data:
  honua-server:
    # No numbered DB-schema-version constant surfaced; logical metadata schema is v1.
    requiresDbSchema: "metadata-v1"   # TODO: replace with ">=N" once a numbered migration floor is wired

# Support window policy: server supports clients within N-2 minor of its contract version.
supportWindow:
  clientMinorsBack: 2
  deprecationReleases: 2     # deprecated surfaces carried >= 2 platform releases before removal
