contracts:
  geoservices:
    version: 2.0.0
    clients:
      honua-sdk-js: '>=0.0.14-alpha.0 <0.3.0'
      honua-sdk-dotnet: '>=1.3.0 <2.0.0'
      honua-sdk-python: '>=0.1.4 <0.2.0'
  grpc:
    version: v1
    clients:
      honua-sdk-dotnet: '>=1.3.0'
      honua-sdk-js: '>=0.0.14-alpha.0'
  admin:
    version: v1
    clients:
      honua-console: '>=0.1.0'
      honua-sdk-python: '>=0.1.4'
  metadata:
    version: metadata.honua.io/v2alpha1
    clients:
      honua-sdk-python: '>=0.1.9'
deploy:
  honua-server:
    awsLambda:
      target: aws-serverless
      architectures:
        x86_64:
          status: preview
          releaseScope: preview
          qualification: pending
          evidenceGate: https://github.com/honua-io/honua-release/issues/282
          reason: '2026-10-25 founder decision (2026.1 wedge-critical re-tier) supersedes
            2026-09-06 ruling A: Lambda is Preview in 2026.1, informational and not
            GA qualified; AWS ECS stays GA. Security, isolation and integrity floors
            remain required; pending evidence is not a pass.'
          operatingEnvelope: docs/2026.1-operating-envelope.md
    awsFargate:
      architectures:
        amd64:
          status: certified
        arm64:
          status: excluded
          reason: Published child exists, but native Fargate readiness is not certified
            for 2026.1 (honua-release#98).
  honua-iac:
    deploysServerImage: sha:57782b260027b5359174f6a80665750b85c71a6a
  honua-helm:
    appVersion: sha:57782b260027b5359174f6a80665750b85c71a6a
    awsEks:
      target: aws-eks
      architectures:
        x86_64:
          status: preview
          releaseScope: preview
          qualification: pending
          evidenceGate: https://github.com/honua-io/honua-release/issues/203
          reason: '2026-10-16 owner amendment supersedes decisions 12/18: EKS/Helm
            is Preview in 2026.1, informational and not GA qualified. Security, isolation
            and integrity floors remain required; pending evidence is not a pass.'
          operatingEnvelope: docs/2026.1-operating-envelope.md
data:
  honua-server:
    requiresDbSchema: '>=115'
    metadataSchema: 2.0.0-alpha.1
lifecycle:
  ga: 'Generally available: supported for customer deployment and counted in the GA
    denominator; requires candidate-bound qualification evidence.'
  preview: Offered to customers for evaluation, with no production availability, performance
    or durability commitment; security and isolation floors still apply.
  experimental: Present in the binary, opt-in and disabled by default; no customer
    support claim.
  excluded: Not part of 2026.1 for any deployment.
  internal: Used only on Honua's own demo infrastructure. Not offered for customer
    deployment in 2026.1 and not GA, Preview or Experimental. Carries no availability,
    performance or support claim and is not counted in any GA denominator.
capabilities:
  multi-tenancy:
    lifecycle: internal
    capabilityKeys:
    - admin.multi-tenancy
    deployment: Honua's own demo stack (honua-demo-infra, demo.honua.io) only.
    reason: 'Ruling R29: no customer-facing multi-tenant claim exists; ELv2 bars third
      parties from operating Honua as a managed service.'
    ruling: https://github.com/honua-io/honua-release/issues/376
supportWindow:
  clientMinorsBack: 2
  deprecationReleases: 2
