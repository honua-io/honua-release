# Compatibility matrix — the interop rules. The product differentiator: "keeping track of version
# compatibility, iac<->server<->sdk." Enforced at build (drift tests), deploy (iac/helm preflight),
# runtime (server advertises contractVersion; SDK checks), and upgrade (preflight).
#
# rc.1 snapshot: each client range is a SUPPORT WINDOW, not a current-version pin. The
# FLOOR is the OLDEST supported client (a support commitment), and the ceiling is the next breaking
# boundary (for 0.x the next MINOR is breaking, so ceiling = next minor; for >=1.x, ceiling = next
# MAJOR). The manifest's `components.*.version` tracks the currently-shipped/pinned build — a
# DIFFERENT concept — and a newer shipped version simply sits inside this window, it does NOT move
# the floor. Raising a floor drops support for older clients, which the drift gate treats as a
# breaking change requiring a contract-version bump (see tools/validate_platform.py check_drift), so
# floors stay at the phase-0 baseline until a contract is deliberately bumped. These are initial
# bounds to make the gates real, not the final negotiated support window — widen (never silently
# narrow) as the compat suite proves pairings.
#
# Floors retain the 2026-07-01 compatibility baseline. Where a component has no
# release it is pinned by sha in the manifest and excluded from semver ranges here (noted inline).
# Release-gate PRs were still merging at snapshot; sha-pinned couplings that reference a still-open
# gate PR carry a `# pending` flag mirroring the manifest.

# Each rule: a contract surface at a version, and the component version ranges that satisfy it.
contracts:
  geoservices:
    # WIRED (honua-release#83): the server advertises this. RE-READ on 2026-08-18 from a running
    # instance of the CURRENT pinned image (ghcr.io/honua-io/honua-server:nightly-aot-6b6d3b8,
    # index sha256:4fd2c1be…), not carried forward from the aa894e1 pin —
    #   /api/v1/capabilities/manifest -> transports.items[id=geoservices-rest].contractVersion = 1.0.0
    #   (same envelope: server.deploymentRevision = 6b6d3b898f4abb6b34833d953b50d44f3d38c6c1)
    # (it still deliberately does not emit ArcGIS `currentVersion`). Client floors below are NOT
    # tightened here: raising a floor drops support for older clients and validate_platform's drift
    # check treats that as breaking, so floors stay at the phase-0 baseline until the SDKs actually
    # negotiate on this version. Nothing in honua-server#3347/#3349/#3352/#3353 moved a floor: the
    # only advertised-surface change in that range is a capability-ID set (#3349), which is not a
    # client support window.
    version: "1.0.0"
    clients:
      honua-sdk-js:     ">=0.0.14-alpha.0 <0.2.0"   # widened through browser-verified 0.1.2-beta.0
      honua-sdk-dotnet: ">=1.3.0 <2.0.0"            # floor = oldest supported (shipped is 1.6.0)
      honua-sdk-python: ">=0.1.4 <0.2.0"            # floor = oldest supported (shipped is 0.1.10); 0.x: ceiling = next minor
  # NOTE: the same capability envelope now also advertises ogc-http and stac at contractVersion
  # 1.0.0 (recorded in platform-manifest.yaml honua-server.contractVersions). They are deliberately
  # NOT given contract entries here yet: a contract row is a client SUPPORT WINDOW commitment, and
  # no SDK negotiates on those two surfaces today, so inventing floors for them would be fiction.
  grpc:
    version: v1        # proto package geospatial.v1 (geospatial-grpc VERSIONING.md; server advertises grpc v1)
    # geospatial-grpc 0.2.0-alpha.1 is the schema source; SDK floors are where grpc clients live.
    # 0.2.0-alpha.1 is a sanctioned pre-v1 wire break (geospatial-grpc#48/#69) that does NOT change
    # the proto package: the surface stays geospatial.v1, so no client floor moves. See
    # docs/GRPC-0.2.0-ALPHA.1-CUT.md.
    clients:
      honua-sdk-dotnet: ">=1.3.0"                   # floor = oldest supported (shipped is 1.6.0)
      honua-sdk-js:     ">=0.0.14-alpha.0"          # floor = oldest supported (shipped is 0.1.7-beta.0)
  admin:               # console <-> server admin/control-plane API
    # REAL: advertised at /api/v1/admin/capabilities (AdminApiMajor="v1", AdminApiMajorNumber=1,
    # basePath /api/v1/admin; capabilities exposes compatibility.controlPlaneApi.major=1).
    version: v1
    clients:
      # console has no release (pinned by sha); floor is its declared package.json version.
      honua-console:    ">=0.1.0"
      # python SDK gates on this surface: baseline controlPlaneApiMajor 1
      # (honua-sdk-python compatibility/server-matrix.json).
      honua-sdk-python: ">=0.1.4"                   # floor = oldest supported (shipped is 0.1.10)
  metadata:            # metadata surface advertised in the capabilities envelope
    version: "metadata.honua.io/v2alpha1"   # MetadataV2Constants.ApiVersion; schemaVersion 2.0.0-alpha.1
    clients:
      # NOTE(drift): honua-sdk-python compatibility/server-matrix.json still declares an expected
      # metadataSchemas version of "v1"; the server now advertises metadata.honua.io/v2alpha1. Now
      # TRACKED in honua-sdk-python#161 (reconcile the SDK fixture to accept v2alpha1 before 2026.1
      # promotion) — the fix lands in that repo's CI. rc.1 keeps this lag explicit until that gate
      # is reconciled.
      honua-sdk-python: ">=0.1.9"

# Deploy/runtime coupling. honua-iac and honua-helm have no releases yet (pinned by sha in the
# manifest); ranges below bound the SERVER artifact they are allowed to deploy. honua-server is
# itself pre-release (pinned by sha), so these couplings are sha-pinned, not semver-ranged.
deploy:
  honua-iac:
    # TODO: encode against a released server version once honua-server cuts a tag; today server is
    # pinned by sha and immutable GHCR digest, so the deploy range is sha-pinned, not semver-ranged.
    # Tracks components.honua-server.sha by construction — validate_platform.check_coherence hard-fails
    # if it drifts. Advanced with the 2026-08-27 working-snapshot refresh (e3ab87ce -> 4bd184a9).
    deploysServerImage: "sha:4bd184a93118fc480f4e1c9735598622483172f2"
  honua-helm:
    # Chart.yaml appVersion is "0.0.0" (placeholder); chart version is 0.4.0 (un-released).
    # Same coupling as honua-iac above; advanced with the 2026-08-27 refresh.
    appVersion: "sha:4bd184a93118fc480f4e1c9735598622483172f2"

data:
  honua-server:
    # DB schema version = highest applied migration in the PINNED server source
    # (src/Honua.Server/Migrations/, NNN_ prefix); max at 6b6d3b8 is
    # 106_CreateManagedUsersAndScimGroups.sql — RE-VERIFIED at this pin, not carried forward (none of
    # honua-server#3347/#3349/#3352/#3353 adds a migration). DbUp journals to public.schema_versions
    # (no single constant), so the filename list is not the verdict; the pinned image was run against
    # postgres and the journal read back:
    #   docker exec <pg> psql -U honua -d honua -c \
    #     "select scriptname from public.schema_versions order by scriptname desc limit 1;"
    #   -> Honua.Server.Migrations.106_CreateManagedUsersAndScimGroups.sql
    requiresDbSchema: ">=106"

# Support window policy: server supports clients within N-2 minor of its contract version.
supportWindow:
  clientMinorsBack: 2
  deprecationReleases: 2     # deprecated surfaces carried >= 2 platform releases before removal
