    sha: "82260338008180fcb28cc63b19ca561c9cf81b0e"   # branch: trunk
    artifact: "npm:@honua-io/sdk-js"
    # companion package @honua-io/mcp-server also tagged mcp-server-v0.0.19-alpha.0.

  honua-sdk-python:
