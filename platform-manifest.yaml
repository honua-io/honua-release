# Platform manifest — the pinned, certified set of component versions for a platform release.
# A "Honua YYYY.N" release IS this file at a given tag. The release train writes/validates it;
# customers consume it to deploy/upgrade a coherent set.
#
# Phase 0 snapshot: populated with REAL data observed on 2026-06-26 (latest GitHub release/tag
# per repo + current default-branch HEAD sha). This is a pre-train hand snapshot, NOT yet a
# certified RC — the release train (Phase 2) will regenerate and validate this file.
#
# Conventions:
#   - version: the latest GitHub *release* tag's semver if one exists; otherwise (no releases AND
#     no tags) the literal "pre-release" sentinel — the component is identified by its `sha`.
#     "Do not invent versions": a repo with no release is pinned by sha, not a guessed number.
#   - sha: default-branch HEAD at snapshot time (the branch name is noted where it isn't `trunk`).
#   - Source-declared (but un-released) versions from Chart.yaml/package.json are kept in comments
#     so signal isn't lost, but they are NOT promoted to `version` until a release/tag exists.

platformRelease: "2026.1-rc.0"        # calendar label; -rc.N until promoted
status: draft                          # draft | rc | released
snapshotDate: "2026-06-26"             # when the versions/shas below were observed
snapshotKind: pre-train-hand-snapshot  # replaced by train-generated manifest in Phase 2

components:
  honua-server:
    version: "pre-release"             # no GitHub releases or tags; pinned by sha
    sha: "fd89ac51500b192fdefc58267308f3c368537518"   # branch: trunk
    image: "ghcr.io/honua-io/honua-server:nightly-aot"  # :latest only moves on v* releases; trunk == nightly-aot
    contractVersions:
      # admin/control-plane API is REAL and advertised at /api/v1/admin/capabilities
      # (src/Honua.Server/Features/Admin/AdminInfoEndpoints.cs: AdminApiMajorNumber=1, AdminApiMajor="v1").
      admin: v1
      # metadata schema advertised in the same capabilities envelope (MetadataV2Constants.ApiVersion).
      metadata: v1
      # TODO(contract-wire): GeoServices/OGC/STAC surfaces do NOT advertise a single wire-contract
      # version constant today (and deliberately do not emit ArcGIS `currentVersion` — Honua is not
      # ArcGIS Server). Per-feature contract tags exist (e.g. tiles contractVersion=1,
      # honua.package_review.v1, Reporting ContractVersionV1) but no rolled-up surface version.
      # Wire a GeoServicesContract.Version / OgcContract.Version / StacContract.Version constant and
      # advertise it in the service-info / capabilities response, then replace the v0 placeholders.
      geoservices: v0   # TODO: not yet advertised — see note above
      ogc: v0           # TODO: not yet advertised
      stac: v0          # TODO: not yet advertised
    # TODO(db-schema): no single numbered DB-schema-version constant surfaced. Logical metadata
    # schema is v1 (MetadataV2Constants). Wire the physical migration floor (max applied migration
    # number) into the manifest from the migrations runner. Recorded as the logical schema for now.
    dbSchema: "metadata-v1"

  honua-console:
    version: "pre-release"             # no releases/tags; package.json declares 0.1.0 (un-released)
    sha: "0f942510cad4f044ef02379fdb812415370a0119"   # branch: trunk
    image: "ghcr.io/honua-io/honua-console:nightly"

  honua-sdk-dotnet:
