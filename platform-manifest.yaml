    sha: "e15644173c173e4a75e6b5b2557cd8bad4ec5906"   # branch: trunk HEAD; proto lint/contract fix — full CI GREEN
    contractVersions:
      grpc: v1                         # proto package geospatial.v1 (VERSIONING.md)

  geospatial-mcp:
