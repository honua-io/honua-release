  honua-iac:
    repository: "https://github.com/honua-io/honua-iac"
    lifecycleStatus: GA
    # v0.2.0 carries honua-iac#192 (licensing_mode default "Disabled" in the aws, aws-serverless and
    # aws-cert roots), which the aws-ecs cloud cell's licensing-disabled check needs; v0.1.0 predates
    # it (e2e-cloud-aws run 36532006583). A 0.x minor, not a patch: new optional inputs and
    # apply-affecting default changes (honua-iac docs/module-versioning.md).
    # 2026-10-09 ADVANCE v0.2.0 (28fee58) -> trunk 5b09d0dd (19 commits ahead, honua-iac#224), the
    # sha the nightly resolver selected (nightly-certification run 37971855781, job resolve:
    # "RESOLVED honua-iac 5b09d0dd227c8b3567efefe94e13c920066c9eb5"). The cloud cells need inputs that
    # v0.2.0's roots do not declare: examples/aws gains enable_bedrock_ai / bedrock_ai_region (the
    # ECS Redis-off Bedrock cell), and examples/aws-serverless gains enable_gp_batch,
    # use_batch_service_linked_role and image_repository_policy_mode (the guardrailed cell role
    # cannot SetRepositoryPolicy, so the serverless cells run in ECR reuse mode). Without them the
    # harness drops those variables (e2e-cloud-aws runs 37984313518, 37984366556). Push CI at this
    # sha is green (Static Terraform Validate, Terraform Policy Gates, Terraform 1.5 Floor Validate,
    # CodeQL, OKF bundle). The only red check run is a manual workflow_dispatch AWS Live Validation
    # (run 37943907525) that failed loading AWS credentials before any Terraform ran. No tag
    # carries this sha, so it is pinned by sha, and the archive is the sha's own tarball.
    # 2026-10-09 ADVANCE 5b09d0dd -> trunk 4b108f91 (1 commit ahead, the honua-iac#226 merge commit;
    # 20 commits ahead of v0.2.0). modules/aws-serverless and examples/aws-serverless now declare
    # operation_key_ring_certificate_secret_arn and operation_key_ring_certificate_secret_kms_key_arn
    # and inject the Secrets Manager reference into the Lambda. The aws-serverless/redis-on cell
    # needs it: the 3ecd214 server exits at startup on Redis without a key-ring certificate (e2e-cloud-aws
    # run 37997262348, "server not ready"). Push CI at this sha is green (Terraform CI push: Static
    # Terraform Validate, Terraform Policy Gates, Terraform 1.5 Floor Validate; CodeQL). Still untagged,
    # so it is pinned by sha and the archive is the sha's own tarball.
    # 2026-10-10 ADVANCE 4b108f91 -> trunk 57b9417e (honua-iac#228 merge commit; also carries honua-iac#227).
    # #228 gives the aws-serverless GP Batch job definitions the same ConnectionStrings__redis and
    # Operations__SecretChannel__KeyRingCertificatePkcs12 references as the Lambda, the job role the
    # matching secret/KMS grants, and the Batch/Redis security groups the Redis reach. Without it the
    # aws-serverless/redis-on GP worker logged "No Redis is configured" and every GP job stayed running
    # (e2e-cloud-aws run 38038435904, S5 FAIL). #227 wires audit_chain_key_secret_arn on both modules
    # (harness maps HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_ARN when set). Still untagged, so pinned by sha and
    # the archive is the sha's own tarball.
    # 2026-10-10 ADVANCE 57b9417e -> trunk e218d17b (honua-iac#230 merge commit; also carries honua-iac#229).
    # #230 keeps the serverless Lambda environment under Lambda's 4 KB cap (the Redis-on cell with the
    # key ring, GP Batch and the audit-key reference measured 4118 bytes and CreateFunction refused it,
    # e2e-cloud-aws run 38046060497): same-account secrets referenced by name, Batch queue/job-definition
    # names, default-valued entries dropped, plan-time precondition naming the size (release cell now
    # 2934 bytes). #229 makes ECS tasks behind a TLS-terminating ALB emit HSTS and honour X-Forwarded-*
    # (security-headers probe on run 38047168879). Still untagged, so pinned by sha and the archive is
    # the sha's own tarball.
    # 2026-10-10 ADVANCE e218d17b -> trunk b8fae26e (honua-iac#231 merge commit).
    # #231: the control-plane event Lambdas (reconcile/backstop/tick) read the same secret set as
    # the API role, including the connection-encryption master key (every event function crashed
    # at init on e2e-cloud-aws run 38066103745: 'Failed to resolve Security:ConnectionEncryption:
    # MasterKey from AWS Secrets Manager ... 400'); the GP Batch job definition takes MasterKey from
    # the master-key secret instead of the admin-password secret; new operations_policy_rules input
    # on both modules and both example roots (the harness passes the cell rules from release#517,
    # without which a Production cell denies every typed operation: journey stage 3 'Operations
    # require an explicit production policy rule.' on the same run); RDS security-group rules are
    # standalone resources; examples/aws exposes alb_enable_http_redirect (release#517 turns it on
    # for HTTPS cells). Still untagged, so pinned by sha and the archive is the sha's own tarball.
    # 2026-10-11 ADVANCE b8fae26e -> trunk e3534f75 (honua-iac#234 merge commit; also carries honua-iac#232).
    # #232: optional per-cell custom domain on the serverless root (domain_name + route53_zone_id ->
    # DNS-validated ACM certificate, regional API Gateway custom domain, Route53 alias; honua_url is the
    # https name; the harness passes the per-run <label>.cert.demo.honua.io name since release#524), so
    # the Lambda cells become HTTPS honua.io endpoints the pinned site CSP admits (S9, release#450).
    # #234: studio_end_user_authorization on both modules and roots (release#527 passes it: without
    # Studio:EndUserAuthorization:Enabled the non-admin journey proposer got HTTP 403 on
    # GET /api/v1/studio/package-families at stage 6, e2e-cloud-aws run 38091905679). Still untagged,
    # so pinned by sha and the archive is the sha's own tarball.
    # 2026-10-11 ADVANCE e3534f75 -> trunk e0dabe74 (honua-iac#237 merge commit; also carries #235 and #236).
    # #235: the server is the single CORS source on Lambda cells (API Gateway cors_configuration removed;
    # its narrower policy had overridden the server's and broke the authenticated demo lanes on run
    # 38099175519). #236: Public__BaseUrl derived from domain_name on every module/root (customer domains
    # got loopback links and a 503 admin login; public_base_url override; Azure roots admit customer
    # hosts). #237: per-process PostgreSQL pool caps on the serverless module (API 8, control-plane 2,
    # Batch 4) after run 38107383082 exhausted the cell RDS's connection slots. Still untagged, so pinned
    # by sha and the archive is the sha's own tarball.
    # 2026-10-11 ADVANCE e0dabe74 -> trunk 64a5da0f (honua-iac#238 merge commit).
    # #238: every serverless process also sets Limits__Connections__MaxConcurrentQueries to its pool cap;
    # with #237's caps alone every Lambda failed at startup on run 38116311885 ('Invalid limits
    # configuration: Connections.MaxConcurrentQueries must be less than or equal to
    # Connections.MaxConnectionPoolSize', the server's LimitsOptionsValidator). Still untagged, so pinned
    # by sha and the archive is the sha's own tarball.
    # 2026-10-11 ADVANCE 64a5da0f -> trunk 4368e3ea (honua-iac#239 merge commit).
    # #239: reserved concurrency on the control-plane event Lambdas (reconcile 2, backstop 1, tick 1) with
    # async-invoke retention and scheduler retry policies so throttled ticks queue instead of fanning out
    # cold starts; on run 38125145738 the per-kind scheduled ticks still exhausted the cell RDS because
    # frozen Lambda instances never release their pooled connections (the server half releases the pool
    # at invocation end, next image). Still untagged, so pinned by sha and the archive is the sha's own
    # tarball.
    # 2026-10-11 ADVANCE 4368e3ea -> trunk 5d577263 (honua-iac#240 merge commit).
    # #240: optional Amazon RDS Proxy in modules/aws-serverless (enable_rds_proxy, default false): the
    # db.t3.micro certification cell (~82 usable slots) cannot cover >=6 API Lambda environments x 9
    # pooled connections + control-plane functions + Batch workers (run 38133126673: 53300 on the API
    # host, PostGIS preflight crashes on cold start). The proxy caps the database side at ~78 and queues
    # the excess for up to 120 s; the server's per-connection SETs pin, so it caps rather than shares
    # until the session settings move to role defaults. The serverless cell enables it (SERVERLESS_SPEC).
    # Also: API Gateway access log carries integrationStatus/integrationErrorMessage/error.message.
    # 2026-10-11 ADVANCE 5d577263 -> trunk 0ab4c5b0 (honua-iac#242 merge commit; carries #241).
    # #241: behind the RDS Proxy the module sets Database__SessionSettings__Mode=role-defaults on the
    # API Lambda, control-plane functions and Batch jobs (server #5874 then issues no per-connection
    # SETs, so proxy sessions multiplex instead of pinning), applies the matching ALTER ROLE defaults
    # next to enable_postgis, and exposes the proxy percentages on the example root; the cell declares
    # rds_proxy_max_connections_percent=70 (run 38163689854: 90% left ~4 direct slots of ~82).
    # #242: import_background_job_threshold_bytes on the aws and aws-serverless roots, rendered as
    # Import__Limits__BackgroundJobThresholdBytes on every server process, for the S10 large-import
    # scenario (release#554, #548).
    # 2026-10-12 ADVANCE 0ab4c5b0 -> trunk 378b2de6 (honua-iac#244 merge commit; carries #243).
    # #243: shared S3 file storage on the serverless module/root (file_storage_provider/bucket/region/key_prefix)
    # rendered on the API Lambda, control-plane functions and Batch tiers with one S3 grant on their roles, so
    # background imports can run on the Batch worker (server #5916). #244: the control-plane event functions
    # drop the HTTP-only keys and the import threshold to stay under the 4096-byte Lambda environment cap
    # (3790/3787/3793 B; the API function sits at 4077 B on the full Redis-on cell). The serverless cell
    # passes the file-storage inputs once this root declares them (release#569).
    # 2026-10-22 rc re-pin #3 ADVANCE 378b2de6 -> trunk a71477e0 (honua-iac#281 merge commit): generated
    # database passwords exclude '=', so the ECS cells no longer hit the unparseable connection string at
    # random. Also carries #279 (rollback target eligibility docs), the opt-in one-shot migration task
