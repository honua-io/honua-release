# Customer-installable certification inputs. These are package bytes, not deployable platform
# components: BOM and upgrade tools intentionally continue to iterate only `components`.
#
# `sourceSha` here does NOT mean "current source revision"; it means "the commit the PUBLISHED BYTES
# were built from". Advancing it in step with `components.*.sha` would assert that already-published,
# immutable artifacts came from commits that postdate them — a false provenance claim about bytes
# customers can download today. No validator would catch it either: `sourceSha` is checked only for
# 40-hex shape (validate_platform._check_client_artifacts), so this discipline rests entirely on the
# manifest being honest. The file already models the split — components.honua-sdk-js.sha moves with
# trunk, while this block's sourceSha moves only when the published bytes themselves are re-pinned.
#
# Each pin was re-verified against actual publish provenance on 2026-10-02 (honua-release#408);
# Python SDK/admin advanced again on 2026-10-04 after declaration-bearing publications (R25), and
# the npm pair again after the 0.1.14 publications reached the registry on 2026-10-06:
