    # MERGE PRECONDITION (honua-release#41): this pin names a release that the release lead must cut
    # FIRST. Do not merge this manifest state until BOTH geospatial-grpc tags exist, because
    # gate-contract's proto-breaking check resolves its buf `--against` baseline as the highest `v*`
