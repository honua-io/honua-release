components:
  honua-server:
    repository: "https://github.com/honua-io/honua-server"
    lifecycleStatus: GA
    version: "pre-release"             # no GitHub releases or tags; pinned by sha
    # R22 (tools/platform_version.py stamp_platform_version): the bound server image takes the lock
    # label's platform version as artifactVersion and releaseVersion; finalize_release re-stamps both
    # at promotion. Never stamp plain `version` (finalize's GA re-stamp refuses it).
    artifactVersion: "2026.1.0-rc.2"
    releaseVersion: "2026.1.0-rc.2"
    # First-release model (#233, docs/SDK-SERVER-BASELINE-RULE.md): the committed receipt that
    # every SDK's release/sdk-capability-baseline.json cites, byte for byte, as the evidence for
    # its `first-release` floor. Refreshing the receipt changes the digest the published SDKs
    # cite, so the pin stays on these bytes; maxAgeDays bounds how long they are reusable, and
    # every strict check re-enumerates honua-server live before it qualifies a floor.
    publicationHistory:
      path: "certification/sources/server-publication-history.v1.json"
      uri: "https://github.com/honua-io/honua-release/blob/0dd9b7a37ab4ee0dd02c17632e3de9e9eeeeddbd/certification/sources/server-publication-history.v1.json"
      sha256: "sha256:3069fde14a32cc579e4ee92cbe7e86bd88a14c1405df94457e1393c63fe092d1"
      maxAgeDays: 90
    # Serving, Lambda and Compose artifacts share this source revision.
    sha: 1c7d0d1101809f2288566fb20d1ce1cb0a853869
    image: ghcr.io/honua-io/honua-server:nightly-1c7d0d1
    # The tag is an address; the digest binds the image bytes.
    # Rollback certification dereferences platformDigests.amd64.
    digest: sha256:1320e634c1f3b304043f4423780ab76202136c07c5d4bde26c178c457f3796b5
    # The image's source revision, from its child config labels and SLSA provenance; equals `sha`.
    artifactSourceRevision: 1c7d0d1101809f2288566fb20d1ce1cb0a853869
    architectures: [amd64, arm64]
    platformDigests:
      amd64: sha256:26a3242a37459fca76aa10c8f14185241613d0a79468927e47c4c091629939e3
      arm64: sha256:7930f56c8b2be459da62f8376c3ad4d878347b4a067ea2b4bd58fb255cf016c0
    # The Compose executor moves with the serving image source revision.
    # Its digest binds the separately published executor bytes.
    composeExecutor:
      image: ghcr.io/honua-io/honua-server:nightly-compose-executor-1c7d0d1
      digest: sha256:817b740e87333eb4cfe9919defd8a814d3ec433716327a3ed91f1cd8b718aacb
      architectures: [amd64, arm64]
      platformDigests:
        amd64: sha256:8677e1b94d89c3696e64e15ebafbb5f0366f206333ad187509a820951aff1bfd
        arm64: sha256:586ce85a0a479aab3d1c3bb802468e9500c522a3bad61e4ebea190feb86c4f33
      artifactSourceRevision: 1c7d0d1101809f2288566fb20d1ce1cb0a853869
    # ARM64-ON-FARGATE EXCLUSION — CARRIED FORWARD, NOT RE-VERIFIED (honua-release#98).
    # The exclusion was established against the OLD pin (5cad074, index
    # sha256:7b3cffafebf481ca77d9576f7ee2d6d1a6e8e29a1752761763c4887e655467cd), whose ARM64 child
    # exited 139 before readiness on native Fargate. That finding has NOT been re-established against
    # this index's ARM64 child (sha256:0d18c33537636d13c0c64c2a824295a19418e8f28344fb50207bf4dd61168dff):
    # re-testing needs a live Fargate task, i.e. the cloud-parity tier, which cannot run today
