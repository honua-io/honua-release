# Platform manifest — the pinned, certified set of component versions for a platform release.
# A "Honua YYYY.N" release IS this file at a given tag. The release train writes/validates it;
# customers consume it to deploy/upgrade a coherent set.
#
# rc.1 snapshot: this is the candidate set frozen after the customer-demo release rescue, RE-PINNED
# to trunk on 2026-08-17 (honua-release#83) because the 2026-08-01 freeze had drifted up to 825
# commits behind on honua-server. Every source component below is now pinned to its `origin/trunk`
# HEAD as measured at re-pin time — EXCEPT honua-server, which is deliberately pinned to the newest
# commit with a published, immutable multi-architecture AOT image so the SHA tested by the train is
# exactly the artifact customers can deploy (see the honua-server entry for that gap, measured).
#
# Conventions:
#   - version: the latest reachable release-tag semver if one exists; otherwise the literal
#     "pre-release" sentinel — the component is identified by its `sha`. Do not invent versions.
#   - sha: default-branch HEAD at snapshot time (branch noted where it isn't `trunk`).
#   - Source-declared (but un-released) versions from Chart.yaml/package.json are kept in comments
#     so signal isn't lost, but are NOT promoted to `version` until a release/tag exists.
#   - Experimental + disabled surfaces (ADR-0059) are held OUT of the certified `components` set and
#     listed under `experimental:` so rc.1's certified deploy set excludes them.

platformRelease: "2026.1-rc.1"         # calendar label; -rc.N until promoted
status: rc                             # draft | rc | released
snapshotDate: "2026-08-17"             # re-pin date (honua-release#83); original rc.1 freeze was 2026-08-01
snapshotKind: candidate-manifest-snapshot  # hand snapshot of trunk; replaced by train-generated manifest in Phase 2

# Certified component set (experimental+disabled surfaces are excluded — see `experimental:` below).
components:
  honua-server:
    version: "pre-release"             # no GitHub releases or tags; pinned by sha
    # PIN vs TRUNK HEAD — the one deliberate exception to "pins == origin/trunk" (honua-release#83).
    # trunk HEAD at re-pin time was b3e7df470db733507034eaf18847640c80e5b1e8 (2026-08-16T23:33Z).
    # f054e6f is 19 commits behind it and is the NEWEST commit with a published, immutable
    # multi-arch AOT image (the 2026-08-16 06:00Z nightly-container-build). A sha with no matching
    # published image is not a usable pin: gate-artifact-consume, gate-security and gate-upgrade all
    # resolve `image@digest`, and the cloud tier mirrors that exact index into ECR. The 19 skipped
    # commits are CI/shard-routing and test-infrastructure changes plus honua-server#3313
    # (publishing: reject chartSpec on non-chart panels) and #3314 (review-gate CI); none of them
    # touch a certified wire surface. Re-pinning forward is a one-line change once a nightly for a
    # newer trunk sha publishes — but chasing HEAD exactly is not achievable while the merge train
    # lands multiple times a day and an AOT multi-arch build takes ~90 minutes.
    sha: "f054e6fa5e2889af730e4a5722342330e7a1f64f"   # published nightly AOT source commit
    image: "ghcr.io/honua-io/honua-server:nightly-aot-f054e6f"
    # Digest of the immutable nightly-aot-f054e6f multi-arch index resolved from GHCR on 2026-08-17
    # (`docker pull` reported this index digest; GHCR package version name matches).
    digest: "sha256:322fea006bec504ad409c919d91ec245ca5490bf6895c646a7068692db0a3787"
    # ARM64-ON-FARGATE EXCLUSION — CARRIED FORWARD, NOT RE-VERIFIED (honua-release#98).
    # The exclusion was established against the OLD pin (5cad074, index
    # sha256:7b3cffafebf481ca77d9576f7ee2d6d1a6e8e29a1752761763c4887e655467cd), whose ARM64 child
    # exited 139 before readiness on native Fargate. That finding has NOT been re-established against
    # this index's ARM64 child (sha256:865bf2b1b580db25920d4d7f36a6ca0875962dd0287d537c626cc4970e5facdd):
    # re-testing needs a live Fargate task, i.e. the cloud-parity tier, which cannot run today
    # (honua-release#79 / missing IAM OIDC-provider actions on the CI role). x86_64 is therefore
    # retained as the SAFE default — it is the architecture that was proven healthy — and the ARM64
    # question stays open in honua-release#98 rather than being silently resolved either way.
    awsEcsArchitecture: "x86_64"
    # Lambda requires a single-architecture image in same-region ECR. The cloud gate mirrors this
    # exact source manifest into the release account and verifies ECR preserves its digest.
    awsLambdaImage: "ghcr.io/honua-io/honua-server:nightly-lambda-aot-f054e6f-arm64"
    awsLambdaDigest: "sha256:f45649b0d5787f4c248d8c48bb979b8df79b0992bfed1c5f389e7d116946d3fe"
    # ECR converts the OCI manifest to Docker schema 2 while preserving the exact config/rootfs, so
    # the post-mirror digest is NOT derivable from GHCR and NOT reproducible with a stock registry
    # (verified: pushing the same image through registry:2 preserves sha256:7182e8b7…, whereas ECR
    # turned it into sha256:f1970f2a… for the old pin). Producing the real value requires an actual
    # push to ECR, i.e. AWS credentials this repo does not have. Rather than carry the old pin's now
    # incorrect digest forward, invent a well-formed fake, or crash the resolve step, the field
    # carries an explicit sentinel: validate_platform.py accepts ONLY sha256:<64hex> or this exact
    # string, and e2e-cloud-aws.yml accepts it ONLY while HONUA_AWS_ROLE_ARN is unset — with a role
    # configured the sentinel is a hard failure, so it can never mask a real red. See
    # honua-release#99 for how to replace it.
    awsLambdaEcrDigest: "pending-ecr-mirror"   # honua-release#99 — unknown until a real ECR mirror runs
    awsLambdaArchitecture: "arm64"
    contractVersions:
      # admin/control-plane API is REAL and advertised at /api/v1/admin/capabilities
      # (src/Honua.Server/Features/Admin/AdminInfoEndpoints.cs: AdminApiMajor="v1", AdminApiMajorNumber=1).
      admin: v1
      # metadata surface advertised in the capabilities envelope as MetadataApiVersion
      # (MetadataV2Constants/MetadataV2Common.ApiVersion = "metadata.honua.io/v2alpha1";
      # MetadataSchemaVersion = "2.0.0-alpha.1").
      metadata: "metadata.honua.io/v2alpha1"   # schemaVersion 2.0.0-alpha.1
      # gRPC proto surface (proto package geospatial.v1; schema owned by geospatial-grpc). The
      # capability envelope lists the grpc/grpc-web/native-grpc transports without a contractVersion,
      # so this stays the proto-package major rather than a server-emitted rollup.
      grpc: v1
      # WIRED (honua-release#83, closes #32): the ADR-0058 registry now surfaces
      # GeoServicesContract/OgcContract/StacContract .Version in the capability envelope, so these are
      # no longer v0 placeholders. Values below were READ FROM A RUNNING SERVER — the pinned image
      # itself (ghcr.io/honua-io/honua-server:nightly-aot-f054e6f) run locally against postgres+redis
      # on 2026-08-17, NOT copied from source constants:
      #   curl -s http://localhost:8080/api/v1/capabilities/manifest \
      #     | jq -c '.transports.items[] | select(.contractVersion) | {id, contractVersion}'
      #   {"id":"geoservices-rest","contractVersion":"1.0.0"}
      #   {"id":"ogc-http","contractVersion":"1.0.0"}
      #   {"id":"stac","contractVersion":"1.0.0"}
      # The same envelope reported server.deploymentRevision = f054e6fa5e2889af730e4a5722342330e7a1f64f,
      # proving the read came from exactly this pin. STAC still advertises the spec level separately
      # (stac_version=1.0.0); the value here is the Honua contract rollup, not the spec level.
      geoservices: "1.0.0"   # transports[].id=geoservices-rest contractVersion
      ogc: "1.0.0"           # transports[].id=ogc-http contractVersion
      stac: "1.0.0"          # transports[].id=stac contractVersion
    # DB schema floor = highest applied migration on trunk (src/Honua.Server/Migrations/, NNN_ prefix).
    # 106_CreateManagedUsersAndScimGroups.sql is the max in the pinned server source.
    dbSchema: "106"

  honua-console:
    version: "pre-release"             # no releases/tags; package.json declares 0.1.0 (un-released)
    sha: "0d9807601761e241502bd99cbf23cd1526c538fd"   # branch: trunk HEAD at re-pin time
    # The GHCR package is published now (it was not at the 2026-07-31 freeze), but it publishes only
    # per-candidate tags — there is no `:nightly` tag on ghcr.io/honua-io/honua-console, so the old
    # value named a tag that does not resolve. This is the candidate image built from THIS sha.
    image: "ghcr.io/honua-io/honua-console:candidate-0d9807601761-31985443246-1"
    digest: "sha256:5eda87af072f15c2c792579472e7a51b3cfbb74af5b84adccd2dc2e915138365"

  honua-sdk-dotnet:
    version: "1.6.0"                   # release tag dotnet-sdk-v1.6.0 (reachable from the sha below)
    sha: "f6c98c5cbff115f21f66c82bd4f4aae244f11190"   # branch: trunk HEAD at re-pin time
    artifact: "nuget:Honua.Sdk"
    # Honua.Sdk is NOT on nuget.org (honua-release#57); gate-artifact-consume's consume-nuget
    # resolves it from the staging feed and otherwise `dotnet pack`s this exact sha, so the version
    # here is the reachable release tag rather than a registry-published one.

  honua-sdk-js:
    # npm `latest` is 0.1.7-beta.0 and js-sdk-v0.1.7-beta.0 (653fd86b) is reachable from the sha
    # below. honua-sdk-js#1321 (release-please, proposing 0.1.8-beta.0) is OPEN and CONFLICTING, and
    # 0.1.8-beta.0 is NOT on npm — pinning it would name a package version that cannot be installed,
    # so this re-pin takes the current PUBLISHED beta and #1321 moves it later.
    version: "0.1.7-beta.0"            # release tag js-sdk-v0.1.7-beta.0; published on npm
    sha: "9d20f0cb4f33aef46dd0198584e582759739c145"   # branch: trunk HEAD at re-pin time
    artifact: "npm:@honua/sdk-js"
    # companion package @honua/mcp-server is published at 0.1.4-beta.0 (the previously noted
    # @honua-io/mcp-server coordinate 404s on npm — that scope does not exist).

  honua-sdk-python:
    # PyPI carries 0.1.10 only. Tag python-sdk-v0.1.11 exists but is NOT published, so the pin stays
    # on the highest version that can actually be installed.
    version: "0.1.10"                  # release tag python-sdk-v0.1.10; published on PyPI
    sha: "23e9dd3d7da7ba460e150f0c08f2799e7918f88f"   # branch: trunk HEAD at re-pin time
    artifact: "pypi:honua-sdk"
    # companion package python-admin at v0.1.6 (tag python-admin-v0.1.6).

  geospatial-grpc:
    # MERGE PRECONDITION (honua-release#41): this pin names a release that the release lead must cut
    # FIRST. Do not merge this manifest state until BOTH geospatial-grpc tags exist, because
    # gate-contract's proto-breaking check resolves its buf `--against` baseline as the highest `v*`
    # tag in geospatial-grpc — pinning the post-break sha while v0.1.0-alpha.3 is still the highest
    # tag makes that gate fail. See docs/GRPC-0.2.0-ALPHA.1-CUT.md for the ordered procedure and the
    # one-line precondition check.
    #   v0.2.0-alpha.1                  -> advances the buf baseline; carries the conformance-fixtures release
    #   geospatial-grpc-v0.2.0-alpha.1  -> the ONLY trigger for publish-dotnet-protocol.yml (the NuGet package)
    # Both namespaces are load-bearing and were NOT both cut for 0.1.0-alpha.3, which is why that
    # release has fixtures but no `Geospatial.Grpc` package and no consumer ever moved onto it.
    version: "0.2.0-alpha.1"           # release tag v0.2.0-alpha.1 (pre-v1 sanctioned wire break, geospatial-grpc#48/#69)
    sha: "73fc882b1ae00d0a4a348aeadfba9f48b1a0317c"   # trunk HEAD; proto+conformance identical to the break commit 21be085
    contractVersions:
      grpc: v1                         # proto package geospatial.v1 — UNCHANGED (VERSIONING.md Pre-1.0 Exception)
    # NOTE: honua-server and honua-sdk-dotnet both still consume `Geospatial.Grpc 0.1.0-alpha.2` and
    # cannot move until the package for this release is published. Tracked in the runbook above.

  geospatial-mcp:
    version: "pre-release"             # spec/conformance repo; no releases/tags; pinned by sha
    sha: "5e052a76b6485edbe78c3482488c58f66700bd59"   # branch: trunk HEAD at re-pin time

  honua-iac:
    version: "pre-release"             # no releases/tags; CHANGELOG "Unreleased"; pinned by sha
    sha: "7abdb07c85c7a389a9c3cc97583e534f6c636a3b"   # branch: trunk HEAD at re-pin time
    artifact: "terraform-registry:honua"

  honua-helm:
    version: "pre-release"             # no releases/tags; Chart.yaml chart 0.4.0 / appVersion "0.0.0" (un-released)
    sha: "9dd42621b0da4a64a7c12cd1a655b5bef0de943c"   # branch: trunk HEAD at re-pin time (unchanged — 0 drift)
    artifact: "oci-chart:honua"

# Experimental + disabled for this release (ADR-0059): present in the binary but deliberately gated
# OFF and unadvertised in the capability manifest. Explicitly EXCLUDED from the rc.1 certified set —
# snapshotted here for provenance only, not part of the certified deploy set.
experimental:
  honua-mobile:
    status: experimental               # ADR-0059 experimental+disabled (Mobile / offline)
    version: "pre-release"             # no releases/tags (.NET MAUI app); pinned by sha
    sha: "4a356a86cd4d056aa13f6cf8bc6855ab7670c2e6"   # branch: trunk HEAD at re-pin time

  honua-collect:
    status: experimental               # ADR-0059 experimental+disabled (Forms + field collection)
    version: "pre-release"             # no releases/tags (.NET); pinned by sha
    # CORRECTION: the previous annotation said "branch: main (note: not trunk)". honua-collect's
    # default branch IS trunk (`gh api repos/honua-io/honua-collect --jq .default_branch` -> trunk);
    # `main` does not exist. Every honua-io repo defaults to trunk, and all 11 components in this
    # file were re-verified against `refs/heads/trunk` at re-pin time.
    sha: "7eb948b5e80680e3a4f33c69c671804eebc370fb"   # branch: trunk HEAD at re-pin time

# Filled at promote: aggregated SBOM digest, provenance attestation, release-notes ref.
artifacts:
  sbom: "TBD"                          # TODO(Phase 3): aggregated CycloneDX/SPDX digest
  provenance: "TBD"                    # TODO(Phase 3): SLSA attestation
  releaseNotes: "TBD"                  # TODO(Phase 2/3): generated release-notes ref
