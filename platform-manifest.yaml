  honua-sdk-js:        { version: "TBD", sha: "TBD", artifact: "npm:@honua-io/sdk-js" }
  honua-sdk-python:    { version: "TBD", sha: "TBD", artifact: "pypi:honua-sdk" }
  honua-mobile:        { version: "TBD", sha: "TBD" }
  honua-collect:       { version: "TBD", sha: "TBD" }
  geospatial-grpc:     { version: "TBD", sha: "TBD", contractVersions: { grpc: v1 } }
