    # Both namespaces are load-bearing and were NOT both cut for 0.1.0-alpha.3, which is why that
    # release has fixtures but no `Geospatial.Grpc` package and no consumer ever moved onto it.
    version: "0.2.0-alpha.1"           # release tag v0.2.0-alpha.1 (pre-v1 sanctioned wire break, geospatial-grpc#48/#69)
    sha: "73fc882b1ae00d0a4a348aeadfba9f48b1a0317c"   # trunk HEAD; proto+conformance identical to the break commit 21be085
