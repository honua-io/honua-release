# Platform manifest — the pinned, certified set of component versions for a platform release.
# A "Honua YYYY.N" release IS this file at a given tag. The release train writes/validates it;
# customers consume it to deploy/upgrade a coherent set.
#
# rc.1 snapshot: this is the candidate set frozen after the customer-demo release rescue, RE-PINNED
# to trunk on 2026-08-17 (honua-release#83) because the 2026-08-01 freeze had drifted up to 825
# commits behind on honua-server. Every source component below is pinned under the honua-release#102
# policy: the newest trunk commit whose own CI is green AND — for honua-server, whose artifact the
# train resolves as `image@digest` — which has a published, immutable multi-architecture AOT image,
# so the SHA the train certifies is exactly the artifact customers can deploy.
#
# WORKING-SNAPSHOT REFRESH 2026-08-27 (operator decision "refresh now"). THIS IS NOT THE RELEASE CUT.
# The 2026-08-21 freeze predated the truthful-identity / evidence-producer migrations (sdk-js#1521,
# sdk-python#213, sdk-dotnet#317, geospatial-grpc#91, geospatial-mcp#79+#80) and the honua-server
# harness-assignments file. Because evidence fragments are consumed only at PINNED revisions, a
# stale freeze mechanically reds the whole evidence-aggregation pipeline regardless of producer
# health. This refresh advances the working pins so aggregation can see the migrated producers.
#
# WHAT THIS REFRESH DELIBERATELY DOES NOT DO:
#   - That refresh did not rebind protocolCertification.ledger. #181 now explicitly marks the
#     stale binding pending. The atomic convergence-rebind workflow stages a catalog commit,
#     aggregates and verifies its ledger, then finalizes the binding in one reviewed merge PR.
#   - It does NOT advance any clientArtifacts.*.version or clientArtifacts.*.sourceSha. See the
#     clientArtifacts block for the per-artifact evidence.
#   - It does NOT re-read the honua-server derived values (contractVersions, dbSchema beyond the
#     migration-filename floor). Those were live-read against the 6b6d3b8 image; at this working
#     snapshot they are CARRIED FORWARD and explicitly marked un-re-verified. The release cut must
#     re-read them against the certified image rather than inherit this snapshot's values.
#
# PIN-POLICY DEVIATION DECLARED AT THIS REFRESH. The honua-release#102 policy is "newest trunk commit
# whose own CI is green". This refresh pins current trunk HEADs for the SDK/protocol components, so
# some of those are NOT green; every red lane is named at its component below rather than left
# implicit. honua-server does NOT deviate: it is pinned to the newest essentially-green imaged trunk
# sha (ac30266f) rather than the newest imaged one (4bd184a9), on the 2026-08-27 coordinator decision
# recorded in full at that component.
#
# honua-server re-pinned again on 2026-08-18, aa894e1 -> 6b6d3b8, to pick up honua-server
# #3347/#3349/#3352/#3353. At this re-pin the two policy conditions coincide with literal trunk HEAD,
# so there is NO pin-vs-HEAD gap to declare (the previous two pins had one). Every derived value on
# the honua-server entry — contract versions, admin major, dbSchema, both image digests — was
# RE-READ against this image rather than carried forward; see the evidence inline there.
#
# Conventions:
#   - version: the latest reachable release-tag semver if one exists; otherwise the literal
#     "pre-release" sentinel — the component is identified by its `sha`. Do not invent versions.
#   - sha: default-branch HEAD at snapshot time (branch noted where it isn't `trunk`).
#   - Source-declared (but un-released) versions from Chart.yaml/package.json are kept in comments
#     so signal isn't lost, but are NOT promoted to `version` until a release/tag exists.
#   - Experimental + disabled surfaces (ADR-0059) are held OUT of the certified `components` set and
#     listed under `experimental:` so rc.1's certified deploy set excludes them.

platformRelease: "2026.1-rc.2"         # calendar label; -rc.N until promoted
status: rc                             # draft | rc | released
# Previous snapshotDate "2026-10-27": rc re-pin #4: honua-server 8cb074f -> a4bde4b (124 trunk commits; #6590, #6593, #6595, #6599, #6643, #6650, #6655, #6656, #6670, #6695, #6703, #6721, #6734)
# Previous snapshotDate "2026-11-02": 2026-11-02 rc.2 cut: honua-server a4bde4b -> daf56db (87 trunk commits, #3213 and #6561-#6864; migrations 141-143)
snapshotDate: "2026-11-03"
snapshotKind: candidate-manifest-snapshot  # hand snapshot of trunk; replaced by train-generated manifest in Phase 2

# Producer-recorded dispatch identity. Release intake accepts candidates dispatched only from
# honua-server's protected default branch; tools/validate_platform.py --exact-candidate fails closed
# and names this ref when it is anything other than the literal `trunk`.
candidate:
  ref: 1c7d0d1101809f2288566fb20d1ce1cb0a853869
  refSource: "trunk"

# Pipeline-owned certification boundary. Dispatchers cannot replace the cut or ledger. `pending`
# deliberately blocks certification until honua-evidence publishes the exact-candidate ledger and
# this reviewed manifest pins its immutable commit and byte digest.
protocolCertification:
  # UTC timestamp of THIS working-snapshot refresh (2026-08-27 operator decision). The previous value
  # 2026-08-21T15:13:36Z was the completion time of honua-server release-bundle run 32496444220.
  # 2026-09-16 server re-pin (release#348, third): UTC time this working candidate was refreshed.
  # 2026-10-09 hand re-pin to certified trunk build 3ecd214: UTC time this working candidate was refreshed.
  # 2026-10-10 hand re-pin to certified trunk build 798d517: UTC time this working candidate was refreshed.
  # 2026-10-11 hand re-pin to certified trunk build 93cad86: UTC time this working candidate was refreshed.
  # 2026-10-12 hand re-pin to certified trunk build 0e03bdd: UTC time this working candidate was refreshed.
  # 2026-10-22 rc re-pin to certified trunk build 4709145: UTC time this working candidate was refreshed.
  # 2026-10-22 rc re-pin #3 to certified trunk build 8cb074f: UTC time this working candidate was refreshed.
  # 2026-10-22 rc re-pin #2 to certified trunk build 199bce7: UTC time this working candidate was refreshed.
  # 2026-10-27 rc re-pin #4 to certified trunk build a4bde4b: UTC time this working candidate was refreshed.
  # 2026-11-02 RC2 CUT to certified trunk build daf56db: UTC time the rc.2 candidate was cut (after the
  # candidate image was published by Nightly Container Build run 41374151792).
  # 2026-11-03 RC2 REDO to certified trunk build 8628668: UTC time the rc.2 redo candidate was cut (after
  # the candidate image was published by Nightly Container Build run 41608440714).
  candidateCutAt: "2026-11-03T10:24:29Z"
  # The source-test-host harness must certify the exact frozen honua-server candidate.
  # validate_platform.check_structure enforces byte-equality with components.honua-server.sha, so this
  # moves in lockstep with the server re-pin below and is not independently selectable.
  serverCertificationProducerSha: 1c7d0d1101809f2288566fb20d1ce1cb0a853869
  # #181: the historical ledger certifies e3ab87ce, not this working snapshot.
  # The published Python 0.1.11 artifact also predates its certification contract;
  # advancing the working component pin does not change that package's provenance.
  # Keep certification pending until the cut selects certifiable published SDKs,
  # regenerates the catalog, and atomically rebinds the ledger and trusted gates.
  # Evidence and the remaining candidate criterion: docs/2026.1-sdk-pin-convergence.md.
  ledger:
    status: pending
    repository: "honua-io/honua-evidence"
    commit: "pending"
    requirementsSourceRevision: "pending"
    path: "data/protocol-certification.v1.json"
    sha256: "pending"

