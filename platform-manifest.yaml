    artifactSha256: "sha256:8b26754f72487978759a0f5bc2703f5eff4cf43a77a301943cb6e2328df49b14"
    # REBOUND 2026-09-29 (operator ruling, geospatial-grpc#88): the shipped generated clients are the
    # published v1.0.3 packages -- Geospatial.Grpc on nuget.org (digest above is the downloaded,
    # repository-signed nupkg), geospatial-grpc on PyPI and @honua/geospatial-grpc on npm, all from tag
    # v1.0.3 (00fca4de). certification/sources/geospatial-grpc/operations.v1.json binds the gRPC
    # certification lanes to the same three packages; validate-protocol-requirements.py fails if they
    # diverge from this version. Geospatial.Grpc 1.0.0 (0f701ecc, sha256:69ab1ae0...) remains the
    # recorded first publication (certification/first-publication/grpc-1.0.0, honua-release#57).
    version: "1.0.3"
    sha: "00fca4de0334c6e2304354df7b367faeec5780d6"   # tag v1.0.3
    artifact: "nuget:Geospatial.Grpc"
    # The pinned server still consumes the prior 0.2.0-alpha.1 package:
    #   $ git grep -n Geospatial.Grpc 6b6d3b89... -- Directory.Packages.props
    #   Directory.Packages.props:42: <PackageVersion Include="Geospatial.Grpc" Version="0.2.0-alpha.1" />
    # honua-sdk-dotnet pins Geospatial.Grpc through its own conformance pin (honua-sdk-dotnet#398).
    # Neither consumer pin moves here; both consumer re-pins and their certification belong to the release cut.
    # Version maps: release/component-versions.json at v1.0.3 (00fca4de) is absent (added at b916e212, geospatial-grpc#143, after the tag); that file
    # declares grpc: v1 and conformance: <conformance/VERSION>. The pinned tag carries proto package
    # geospatial.v1 and conformance/VERSION 1.0.3, so the same keys are read from the pinned source.
    contractVersions:
      grpc: "v1"
    schemaVersions:
      conformance: "1.0.3"

