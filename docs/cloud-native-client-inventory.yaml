  classifications: [required-consumer, optional-consumer, producer-validator, supporting-tool, roadmap-consumer, not-applicable]
  release_required_classifications: [required-consumer, producer-validator]
  certification_rule: >-
    A supported format passes only when every release-required client has an
    executable observation against the supported Honua operation and exact
    candidate. Fixture-only readability is supporting evidence, not API proof.
execution:
  pr:
    purpose: deterministic contracts and matrix/schema completeness
    external_infrastructure: false
  nightly:
    purpose: canonical clients against live local services and object-store fixtures
    required_for_release_reuse: false
  release:
    purpose: complete required-client denominator against the exact candidate image
    skips_allowed: false
    immutable_evidence_required: true
