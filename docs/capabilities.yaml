# Advertised platform capabilities — the machine-checkable source for "advertised-vs-actual" (PLAN §7).
#
# The audit's recurring credibility risk was capabilities claimed in docs/READMEs with no backing
# (e.g. a fabricated AR example citing a non-existent SDK). This file makes every claim accountable:
#
#   status: shipped  -> MUST cite `evidence` that resolves to something real:
#       kind: canonical-check   ref: a check name in e2e/canonical_checks.py
#       kind: gate              ref: a wired release-train gate id (from release-train.yml)
#       kind: test              ref: a test file path that exists
#       kind: capability-key    ref: a key in honua-evidence's capability-matrix.v1.json that meets
#                                the GA criteria below (honua-release#59) — implemented > 0,
#                                provingTestCount >= defaults.minProvingTests, and 100% CITE pass rate
#                                on every joined suite. A stale/unfetchable matrix reports BLOCKED,
#                                never a fake pass (tools/check_capabilities.resolve_capability_key).
#   status: roadmap  -> explicitly labelled as not-yet-shipped; needs no evidence (but is honest).
#
# tools/check_capabilities.py fails the docs gate if a `shipped` claim has missing/unresolvable
# evidence, or an unknown status — so a capability cannot be advertised without an actual test/gate.
# tools/check_ga_surface.py applies the SAME `capability-key` criteria to EVERY advertised-GA key in
# the matrix (not just the claims below) — the advertised-GA ⊆ evidenced-GA check.

# GA criteria defaults shared by the `capability-key` evidence kind AND check_ga_surface.py, so the
# two checks can never silently disagree. Override here (not in code) to retune the bar.
defaults:
  minProvingTests: 5   # floor: a GA-advertised capability needs at least this many proving tests
                        # (server + SDK contract tests exercising it) behind the claim.

capabilities:
  - id: geoservices-error-surfacing
    claim: "GeoServices errors delivered in-band (HTTP 200 + {error}) are surfaced as errors, not swallowed as data."
    status: shipped
    evidence: { kind: canonical-check, ref: geoservices-error }

  - id: service-catalog
    claim: "The server exposes a GeoServices service catalog at /rest/services."
    status: shipped
    evidence: { kind: canonical-check, ref: service-catalog }

  - id: health-endpoint
    claim: "Every deploy target exposes a health endpoint for readiness checks."
    status: shipped
    evidence: { kind: canonical-check, ref: health }

  - id: cross-repo-conformance
    claim: "The platform's cross-repo conformance (incl. the MCP manifest) is certified before release."
    status: shipped
    evidence: { kind: gate, ref: conformance }

  - id: pinned-set-ci-green
    claim: "Every component in a release has green CI on its exact pinned commit."
    status: shipped
    evidence: { kind: gate, ref: build-test }

  - id: artifact-consumption
    claim: "Every published artifact (npm/nuget/pip/terraform/helm/docker) is proven to install before release."
    status: shipped
    evidence: { kind: gate, ref: artifact-consume }

  - id: supply-chain-bom
    claim: "Each release ships a signed CycloneDX platform bill of materials."
    status: shipped
    evidence: { kind: test, ref: tools/test_generate_bom.py }

  - id: cross-cloud-parity
    claim: "The platform behaves identically across deploy targets (cross-cloud parity)."
    status: shipped
    evidence: { kind: gate, ref: cloud-parity }

  # --- capability-key claims (honua-release#59): seeded from honua-evidence's REAL capability-matrix,
  # not hand-invented — each key below must independently satisfy the GA criteria (`defaults` above).
  - id: capability-serve-wfs
    claim: "WFS 1.0/1.1/2.0 is a GA, evidenced serving surface (capability key serve.wfs: implemented, CITE-backed)."
    status: shipped
    evidence: { kind: capability-key, ref: serve.wfs }

  - id: capability-serve-ogc-api-features
    claim: "OGC API Features is a GA, evidenced serving surface (capability key serve.ogc-api-features: implemented, CITE-backed)."
    status: shipped
    evidence: { kind: capability-key, ref: serve.ogc-api-features }

  - id: capability-serve-vector-tiles
    claim: "MVT vector tiles is a GA, evidenced serving surface (capability key serve.vector-tiles)."
    status: shipped
    evidence: { kind: capability-key, ref: serve.vector-tiles }

  - id: capability-geoservices-featureserver
    claim: "GeoServices FeatureServer is a GA, evidenced serving surface (capability key serve.geoservices-featureserver)."
    status: shipped
    evidence: { kind: capability-key, ref: serve.geoservices-featureserver }

  - id: advertised-ga-subset-evidenced-ga
    claim: "Every advertised-GA capability in the server's capability matrix has qualifying evidence (advertised-GA ⊆ evidenced-GA), not just the hand-picked keys above."
    status: shipped
    evidence: { kind: gate, ref: docs }

  - id: evidence-lineage-freshness
    claim: "The release train verifies the honua-evidence capability matrix backing GA claims is about the candidate's pinned honua-server SHA and isn't stale before a candidate is certified."
    status: shipped
    evidence: { kind: gate, ref: evidence }

  # --- roadmap (honestly labelled; not yet shipped) -------------------------------------------------
  - id: slo-observability
    claim: "Releases are gated on a live SLO/error-budget including the GeoServices in-band error metric."
    status: roadmap

  - id: upgrade-preflight
    claim: "A customer-runnable preflight validates current->target upgrades (DB migrations, config) before applying."
    status: roadmap
