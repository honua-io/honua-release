# Phase A — local-docker seam tier (docker-compose).
# Brings up the REAL honua-server + its DB so cross-component scenarios run with NO mocks at the seam.
# The server image/version is the PINNED set from ../../platform-manifest.yaml (the executable
# compatibility matrix): the runner injects HONUA_SERVER_IMAGE from the manifest so we test the exact
# certified pairing. While the manifest still carries placeholder (":TBD") pins, the runner reports the
# server-dependent scenarios as BLOCKED (TODO) rather than fabricating a green — see runner/harness.py.
#
# Usage is via the runner (make -C e2e e2e), not by hand, so the image pin always comes from the manifest.

name: honua-e2e-local

services:
  db:
    # PostGIS is honua-server's datastore. Pinned here for the seam tier; the cloud tiers use the
    # managed equivalent (RDS/Azure) via the real IaC. TODO(#7): confirm the exact engine+version
    # honua-server certifies against and source it from the manifest dbSchema requirement.
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: honua
      POSTGRES_PASSWORD: honua
      POSTGRES_DB: honua
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U honua -d honua"]
      interval: 3s
      timeout: 3s
      retries: 30
    # No host port published: only the server talks to it (closer to prod; avoids host port clashes).
    expose:
      - "5432"

  server:
    # Injected by the runner from platform-manifest.yaml. Default is the manifest placeholder so a
    # bare `docker compose config` still validates; a real run substitutes the pinned, digest-addressed
    # image. NEVER hardcode a floating tag here — the manifest is the source of truth.
    image: ${HONUA_SERVER_IMAGE:-ghcr.io/honua-io/honua-server:TBD}
    # Docker can report Postgres healthy a fraction before its container port accepts the server's
    # one-shot migration connection. A short deterministic delay prevents that cold-start race.
    entrypoint: ["/bin/sh", "-c", "sleep 5; exec /app/Honua.Server"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Match the proven Slice-1 candidate stack. The old HONUA_DB_* scaffold variables are not
      # consumed by the published image and prevented the server from reaching readiness.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=honua;Username=honua;Password=honua"
      HONUA_ADMIN_PASSWORD: "${HONUA_ADMIN_PASSWORD:-honua-console-dev-key}"
      Security__ConnectionEncryption__MasterKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Licensing__DevGrantEdition: "Enterprise"
      HostValidation__AllowedHosts: "*"
      AllowedHosts: "*"
      # The observability gate reads the authenticated /metrics endpoint on the server HTTP port.
    ports:
      - "${HONUA_SERVER_PORT:-8080}:8080"     # GeoServices/OGC/admin HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:8080/healthz/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
