# Full-platform DR drill topology — the 2026.1 local-docker install, not a seam fixture.
#
# `../local-docker/docker-compose.yml` is the e2e seam tier: PostGIS + server only, with no
# file-storage volume. The candidate's local-docker install topology also composes a local
# file-storage volume, and `disasterRecovery.substrates` in ../../platform-manifest.yaml declares
# both enabled. The rc.2 server keeps its job queue and workflow state in PostgreSQL, so this file
# reproduces that inventory with named volumes the drill can destroy and recreate:
#
#   postgres  -> postgresql (metadata/features), the feature-change transactional outbox,
#                the durable job queue, and durable workflow definitions/runs/cursors
#   storage   -> object-storage (FileStorage Provider=Local referenced-output bytes)
#
# The server image is injected from the manifest pin (HONUA_SERVER_IMAGE); never hardcode a tag.
name: ${HONUA_DR_PROJECT:-honua-dr-full}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: honua
      POSTGRES_PASSWORD: honua
      POSTGRES_DB: honua
      # Match the install guidance: checksums on, so a torn restore is detectable.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --data-checksums"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      # The PostGIS entrypoint answers pg_isready from its socket-only init server, then restarts.
      # Healthy means PID 1 is the final postmaster and it accepts TCP (the shape honua-server's own
      # docker-compose.yml uses), so the server's one-shot migration cannot race that restart.
      test: ["CMD-SHELL", "test \"$$(head -n 1 /var/lib/postgresql/data/postmaster.pid 2>/dev/null)\" = \"1\" && pg_isready -h 127.0.0.1 -U honua -d honua"]
      interval: 3s
      timeout: 3s
      retries: 30
    # Published on loopback exactly as the quickstart install does, so the drill can speak the
    # real substrate protocols (SQL, RESP) rather than only the application's view of them.
    ports:
      - "127.0.0.1:${HONUA_DR_DB_PORT:-55432}:5432"

  # Named volumes are created root-owned; the server image runs as a non-root UID. Initialize
  # the object-storage volume before the server starts so uploads work on a clean install and
  # again on every restore into a freshly created volume. The server image ships no shell or
  # chown from 532565bc on, so this runs on the drill's own pinned PostGIS image (same as `db`).
  storage-init:
    image: postgis/postgis:16-3.4
    entrypoint: ["sh", "-c"]
    command: ["mkdir -p /var/lib/honua/storage && chown -R 1001:1001 /var/lib/honua/storage"]
    user: "0:0"
    volumes:
      - honua_storage:/var/lib/honua/storage
    restart: "no"

  server:
    image: ${HONUA_SERVER_IMAGE:-ghcr.io/honua-io/honua-server:TBD}
    # No entrypoint override: the shell-less image starts through its own entrypoint. The db
    # healthcheck carries the cold-start gate the old `sleep 5` shell wrapper approximated.
    depends_on:
      db:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=honua;Username=honua;Password=honua"
      HONUA_ADMIN_PASSWORD: "${HONUA_ADMIN_PASSWORD:-honua-dr-drill-admin-key}"
      Security__ConnectionEncryption__MasterKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Licensing__Mode: "Disabled"
      HostValidation__AllowedHosts: "*"
      AllowedHosts: "*"
      FileStorage__Provider: "Local"
      FileStorage__LocalStorage__BasePath: "/var/lib/honua/storage"
    ports:
      - "${HONUA_SERVER_PORT:-8080}:8080"
    volumes:
      - honua_storage:/var/lib/honua/storage
    healthcheck:
      # The image has no shell, wget or curl; readiness is its own compiled probe, the HEALTHCHECK
      # its Dockerfile declares (GET /healthz/ready on 8080, non-zero unless 200).
      test: ["CMD", "/app/honua-healthcheck", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s

volumes:
  db_data:
  honua_storage:
