    issue: honua-devops#147/honua-iac#143
    receiptSchema: certification/release-evidence-receipt.schema.json
    sourceComponent: honua-devops
    sourceRepository: honua-io/honua-devops
    boundComponents: [ honua-devops, honua-iac ]
    claims:
      target: aws-ecs
      requiredChecks: [ terraform-plan, terraform-apply, readiness, admin-mcp-handoff, teardown ]
  - id: aws-ecs-ai-delivery-arc
    issue: honua-release#123/honua-devops#147
    receiptSchema: certification/release-evidence-receipt.schema.json
    sourceComponent: honua-devops
    sourceRepository: honua-io/honua-devops
    boundComponents:
      - honua-server
