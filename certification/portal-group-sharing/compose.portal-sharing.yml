# Overlay on e2e/harness/compose.candidate.yml for the portal group-sharing producer (honua-release#691).
#
# - Named principals: the candidate trusts a generic OIDC issuer whose HS256 signing key is minted per
#   run (PORTAL_SHARING_SIGNING_KEY), as the installed-client run does. produce.py mints one bearer per
#   named user and exchanges it through /sharing/rest/generateToken, the supported Esri client path.
# - The second instance ("replica") runs the same image and configuration against the same PostgreSQL
#   and Redis. It starts after the first instance is ready, so only one instance applies migrations.
# - The db healthcheck probes TCP for the reason documented in compose.sdk-regression.yml.
x-portal-sharing-env: &portal-sharing-env
  Oidc__Enabled: "true"
  Oidc__Generic__Enabled: "true"
  Oidc__Generic__Authority: "https://portal-sharing.invalid"
  Oidc__Generic__ClientId: "portal-sharing"
  Oidc__TokenValidation__SymmetricSigningKey: "${PORTAL_SHARING_SIGNING_KEY:?produce.py mints a per-run signing key}"
  Authentication__PortalToken__RequireHttps: "false"
  Authentication__PortalCredentialVerifier__UseOidc: "true"

services:
  db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U honua -d honua"]
  server:
    environment:
      <<: *portal-sharing-env
  replica:
    extends:
      file: ../../e2e/harness/compose.candidate.yml
      service: server
    depends_on:
      server: { condition: service_healthy }
    environment:
      <<: *portal-sharing-env
    ports: !override
      - "${PORTAL_SHARING_REPLICA_PORT:-8081}:8080"
