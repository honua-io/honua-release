# Install as .github/workflows/hosted-pilot-bootstrap.yml in honua-iac.
# IaC is PUBLIC. Never upload binary plans, Terraform state or private logs.
name: Hosted pilot foundation bootstrap
on:
  workflow_dispatch:
    inputs:
      release_root_sha:
        description: Full reviewed honua-release trunk commit with bootstrap IaC
        required: true
        type: string
      config_path:
        description: Checked-in certification/hosted-pilot/bootstrap/deployments/*.tfvars.json (references only)
        required: true
        type: string
      region:
        required: true
        type: string
        default: us-west-2
      mode:
        description: Plan metadata only, or custody-first exact local saved plans plus remote state migration
        required: true
        type: choice
        options: [plan, deploy]
      recovery_run_id:
        description: Optional failed initial custody run to recover from its metadata-only import journal
        type: string
      recovery_artifact_id:
        description: Exact metadata-only custody recovery artifact ID from that run
        type: string
      recovery_sha256:
        description: SHA256 of the reviewed custody-recovery.json metadata
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: hosted-pilot-foundation
  cancel-in-progress: false
jobs:
  bootstrap:
    if: github.repository == 'honua-io/honua-iac' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TF_IN_AUTOMATION: 'true'
      AWS_EC2_METADATA_DISABLED: 'true'
      PILOT_TERRAFORM_ROOT: certification/hosted-pilot/bootstrap
      PILOT_RELEASE_ROOT_SHA: ${{ inputs.release_root_sha }}
      PILOT_FOUNDATION_SOURCE_ROOT: ${{ github.workspace }}/foundation-source
      PILOT_RECOVERY_RUN_ID: ${{ inputs.recovery_run_id }}
      PILOT_RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: foundation-source
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-release
          ref: ${{ inputs.release_root_sha }}
          path: release-source
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse unreviewed or floating release root
        working-directory: release-source
        env:
          ROOT_SHA: ${{ inputs.release_root_sha }}
        run: |
          set -euo pipefail
          [[ "$ROOT_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$ROOT_SHA" origin/trunk
      - name: Verify recovery metadata producer when recovering initial custody
        if: inputs.recovery_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_RUN: ${{ inputs.recovery_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RECOVERY_RUN" > "$RUNNER_TEMP/recovery-producer.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hosted-pilot-bootstrap.yml" > "$RUNNER_TEMP/recovery-workflow.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          run = json.loads((root / 'recovery-producer.json').read_text())
          workflow = json.loads((root / 'recovery-workflow.json').read_text())
          assert run['workflow_id'] == workflow['id'] and run['event'] == 'workflow_dispatch' and run['head_branch'] == 'trunk' and run['status'] == 'completed'
          import subprocess
          subprocess.run(['git', '-C', os.environ['PILOT_FOUNDATION_SOURCE_ROOT'], 'merge-base', '--is-ancestor', run['head_sha'], os.environ['GITHUB_SHA']], check=True)
          PY
      - name: Download only custody import metadata; no binary plan/state/log input
        if: inputs.recovery_run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery_run_id }}
          artifact-ids: ${{ inputs.recovery_artifact_id }}
          path: ${{ runner.temp }}/hosted-pilot-bootstrap-private/recovery-input
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}
      - name: Custody-first source-reviewed bootstrap in one ephemeral job
        working-directory: release-source
        env:
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config_path }}
        run: python3 tools/hosted_pilot/bootstrap.py "$MODE" --config "$CONFIG"
      - name: Preserve initial-custody recovery identities after failure or cancellation
        if: failure() || cancelled()
        working-directory: release-source
        env:
          CONFIG: ${{ inputs.config_path }}
        run: python3 tools/hosted_pilot/bootstrap.py journal --config "$CONFIG"
      - name: Retain only value-free review metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-pilot-foundation-review-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-pilot-bootstrap-private/review.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain only custody resource-ID recovery journal
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-pilot-custody-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-pilot-bootstrap-private/custody-recovery.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain only allowlisted nonsecret deployment bindings
        if: inputs.mode == 'deploy' && success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-pilot-foundation-bindings-${{ github.run_id }}
          path: ${{ runner.temp }}/hosted-pilot-bootstrap-private/bindings.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove private executor material
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/hosted-pilot-bootstrap-private" release-source/certification/hosted-pilot/bootstrap/.terraform
          rm -f release-source/certification/hosted-pilot/bootstrap/backend.tf.json release-source/certification/hosted-pilot/bootstrap/terraform.tfstate* release-source/certification/hosted-pilot/bootstrap/recovery-imports.tf
