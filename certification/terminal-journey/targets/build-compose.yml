services:
  db:
    extends:
      file: ../../../e2e/local-docker/docker-compose.yml
      service: db
    healthcheck:
      # The image's temporary initialization server accepts Unix sockets before
      # the final TCP listener starts. Candidate migrations need that listener.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U honua -d honua"]
      interval: 3s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.2-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  source:
    image: python:3.12-alpine
    command: ["python", "/fixture/source_fixture.py"]
    volumes:
      - ../source_fixture.py:/fixture/source_fixture.py:ro
      - ../fixtures/build-source.json:/fixture/fixtures/build-source.json:ro
  server:
    extends:
      file: ../../../e2e/local-docker/docker-compose.yml
      service: server
    environment:
      ConnectionStrings__Redis: "redis:6379"
      Oidc__Enabled: "true"
      Studio__EndUserAuthorization__Enabled: "true"
      Oidc__Generic__Enabled: "true"
      Oidc__Generic__Authority: "https://terminal-journey.invalid"
      Oidc__Generic__ClientId: "terminal-journey"
      Oidc__TokenValidation__SymmetricSigningKey: "${HONUA_JOURNEY_SIGNING_KEY:?fixture must mint an ephemeral signing key}"
      # Genuine-model canary (fix unit J3). Off unless terminal-model-canary.yml sets
      # HONUA_CANARY_STUDIO_AI_ENABLED; the deterministic journey leaves every value at its default.
      # Names follow honua-server StudioAiProxyConfiguration (StudioAiProxy:*).
      StudioAiProxy__Enabled: "${HONUA_CANARY_STUDIO_AI_ENABLED:-false}"
      StudioAiProxy__DefaultProvider: bedrock
      StudioAiProxy__Providers__bedrock__Kind: bedrock
      StudioAiProxy__Providers__bedrock__Model: "${HONUA_CANARY_BEDROCK_MODEL:-us.anthropic.claude-sonnet-4-6}"
      StudioAiProxy__Providers__bedrock__Region: "${HONUA_CANARY_BEDROCK_REGION:-us-east-1}"
      # The server's fail-closed AI disclosure policy (honua-server AiDisclosurePolicy) refuses every
      # model transfer without an exact operator approval of provider, kind, destination, model, use
      # case and workload classification ("AI disclosure is not approved ...", trunk run 40715860986).
      # The canary sends only synthetic journey fixtures, so it approves exactly this provider and model.
      # honua-server #6597: model invocations need a durable AI execution admission for a named
      # deployment. The canary initializes and resumes this deployment's ledger before its first chat.
      AiExecutionAdmission__DeploymentId: terminal-journey-canary
      StudioAiProxy__Disclosure__WorkloadDataClassification: synthetic-fixture
      StudioAiProxy__Disclosure__Approvals__0__Provider: bedrock
      StudioAiProxy__Disclosure__Approvals__0__Kind: bedrock
      StudioAiProxy__Disclosure__Approvals__0__Destination: "aws-bedrock:${HONUA_CANARY_BEDROCK_REGION:-us-east-1}"
      StudioAiProxy__Disclosure__Approvals__0__Model: "${HONUA_CANARY_BEDROCK_MODEL:-us.anthropic.claude-sonnet-4-6}"
      StudioAiProxy__Disclosure__Approvals__0__UseCase: studio-chat
      StudioAiProxy__Disclosure__Approvals__0__DataClassification: synthetic-fixture
      # The signed transcript_provenance event carries the canonical request (every prompt message,
      # base64) and the provider events, so one journey turn exceeds the server's default
      # MaxEventBytes (262144) and the proxy refuses it with studio_ai/provider_output_too_large
      # (trunk run 39820677864). Admit one provenance event up to 4 MiB inside an 8 MiB response,
      # which is the canary client's own read bound. Both values are within the server's validated ranges.
      StudioAiProxy__MaxEventBytes: "4194304"
      StudioAiProxy__MaxResponseBytes: "8388608"
      # One journey observation carries the whole bounded tool view (~130k characters, near the default
      # MaxPromptCharacters of 128000). The canary keeps only the latest observation in the prompt; this
      # headroom covers that observation plus the stage's action history (server range allows 500000).
      StudioAiProxy__MaxPromptCharacters: "400000"
      StudioAiProxy__MaxRequestBytes: "4194304"
      # Transcript signing: a key id plus a secret reference to a base64 Ed25519 seed, never the seed
      # itself in configuration. The seed comes from the TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED secret.
      StudioAiProxy__TranscriptSigning__KeyId: "${HONUA_CANARY_TRANSCRIPT_KEY_ID:-}"
      StudioAiProxy__TranscriptSigning__PrivateKeyReference: "${HONUA_CANARY_TRANSCRIPT_KEY_REFERENCE:-}"
      HONUA_CANARY_TRANSCRIPT_SIGNING_SEED: "${HONUA_CANARY_TRANSCRIPT_SIGNING_SEED:-}"
      # Short-lived OIDC session credentials for the Bedrock-enabled role, passed under non-ambient
      # names by the canary job. Empty for the deterministic journey.
      AWS_REGION: "${HONUA_CANARY_BEDROCK_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${HONUA_CANARY_AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${HONUA_CANARY_AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${HONUA_CANARY_AWS_SESSION_TOKEN:-}"
    depends_on:
      redis:
        condition: service_healthy
      source:
        condition: service_started
  replica:
    image: ${HONUA_SERVER_IMAGE:-ghcr.io/honua-io/honua-server:TBD}
    entrypoint: ["/bin/sh", "-c", "sleep 5; exec /app/Honua.Server"]
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=honua;Username=honua;Password=honua"
      ConnectionStrings__Redis: "redis:6379"
      Oidc__Enabled: "true"
      Studio__EndUserAuthorization__Enabled: "true"
      Oidc__Generic__Enabled: "true"
      Oidc__Generic__Authority: "https://terminal-journey.invalid"
      Oidc__Generic__ClientId: "terminal-journey"
      Oidc__TokenValidation__SymmetricSigningKey: "${HONUA_JOURNEY_SIGNING_KEY:?fixture must mint an ephemeral signing key}"
      HONUA_ADMIN_PASSWORD: "${HONUA_ADMIN_PASSWORD:-honua-console-dev-key}"
      Security__ConnectionEncryption__MasterKey: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      Licensing__Mode: Disabled
      HostValidation__AllowedHosts: "*"
      AllowedHosts: "*"
    ports: ["${HONUA_JOURNEY_REPLICA_PORT:-8138}:8080"]
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://localhost:8080/healthz/ready || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
