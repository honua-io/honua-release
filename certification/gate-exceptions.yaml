# Documented exceptions for release-train gates that are currently RED.
#
# WHY THIS FILE EXISTS
# honua-release#83 requires that a release-train cut is either fully green OR that every red gate
# carries an issue link and an explicit exception — never a silent skip. Prose in a PR description
# rots and is invisible to anyone reading `gate-report.json`. This file is the machine-readable
# ledger the train's `report` job attaches to each gate row, so the artifact that downstream tooling
# consumes says *why* a gate is red and *where* the work to fix it lives.
#
# WHAT AN EXCEPTION DOES — AND DOES NOT — DO
# It attaches {issue, why} to the gate's row in gate-report.json and to the run summary. It does NOT
# change the gate's verdict, does not downgrade `fail` to `blocked`, does not remove a gate from the
# rollup, and does not affect `overallStatus`. A red gate with an exception is still red and still
# fails the train. This is deliberate: an exception mechanism that could flip a verdict is a
# green-washing mechanism, and per AGENTS.md a gate that can't fail is worse than no gate. If you
# want a gate to stop failing, fix the gate.
#
# HARD GUARDRAIL (enforced by tools/test_gate_exceptions.py):
#   * every entry names a gate id the train's report actually emits — a typo cannot silently do
#     nothing, and a gate that is deleted or renamed leaves a dangling entry that fails the test;
#   * every entry carries a resolvable honua-io issue URL and a non-empty `why`;
#   * nothing in this file is consulted when deciding pass/fail.
#
# HOUSEKEEPING
# Delete an entry the moment its gate goes green. A stale exception is a lie about the state of the
# release, which is the exact failure mode this file is meant to prevent.

gates:
  cloud-parity:
    issue: https://github.com/honua-io/honua-release/issues/103
    why: >-
      THE aws-eks CELLS ARE FIXED AND PASS. honua-release#79 wires the helm-install +
      LoadBalancer-resolve step the checked-in target used to stop at, and run 32235601866 shows
      aws-eks/redis-off and aws-eks/redis-on both `pass`: all six canonical checks plus the canary
      set, against a real EKS-deployed candidate reached through the chart's Service LoadBalancer,
      each cell torn down clean (reaper green, no VPC/cluster/ELB/ENI left behind). Two claims in
      the previous version of this entry are DISPROVEN and must not be carried forward: the CI role
      is not missing IAM OIDC-provider actions — the cluster applies with the role as it stands
      (runs 32219953698 and 32235601866) — and #79 is neither unmerged nor conflicting.
      What keeps this gate off green on a REAL (non-dry-run) cut is no longer EKS. The
      MCP/Studio/GP/top-demo extended scenarios are no longer hardcoded BLOCKED: the cloud driver
      harness runs the real seam drivers against every live cell, and `require_real` promotes any
      BLOCKED among them to FAIL. On the ECS Redis-off cell (run 37793903534) mcp-handshake and
      studio-authoring failed on topology, not on a defect: honua-server composes the proposal
      store and the 20 projected honua_admin_layer_*/services_* tools only with Redis, and Studio
      draft mutations answer the typed "requires a Redis-backed durable store" 409. The S2/S3
      drivers are now topology-aware (spec redis-off-topology-honest-control-plane, fix unit J1):
      a server-confirmed Redis-off cell passes on the 104-tool catalog and the typed refusal, and
      records `topology: redis-off`. top-demo stays BLOCKED on the honua-site CSP versus the cell
      origin (honua-release#450). Keep this entry until a real e2e-cloud-aws run is green. aws-ecs
      also reports `blocked` under a dry run because a canonical check blocks there, and its
      security-headers canary has never actually reached the endpoint (`endpoint unreachable` in
      every run inspected) — a separate, pre-existing ECS gap. Update 2026-10-11: on HTTPS cells
      top-demo passes on both ECS cells (run 38110106995, every job green including cloud-report)
      while the Lambda cells still fail S9 (run 38107383082); no real e2e-cloud-aws run on all
      cells is green yet, so the entry stays.
  upgrade:
    issue: https://github.com/honua-io/honua-release/issues/226
    why: >-
      Every kind-upgrade run before #226 was vacuous: the honua-2026.1 image and candidate both
      stopped at migration 106, PostGIS started empty because e2e/harness/seed/seed.sh was never
      invoked, and rollback compatibility was reported by a success string instead of querying the
      prior image against the migrated database. Keep this acknowledgement until CI is green on the
      replacement proof: schema_versions must advance to 107 or later, deterministic seed rows must
      survive, and the rolled-back honua-2026.1 image must serve those rows from the forward schema.
