# Advisory check-runs excluded from release gate "build-test".
#
# A check is advisory when it is filed on a SHA but does not judge that SHA's build, tests,
# security, or contracts. Two shapes are allowed:
#   * name: one job whose own steps are release automation or a read-only scheduled observer.
#   * workflow: every check-run of one Actions workflow. Use this only when the workflow is a
#     shadow observer that GitHub files on the default-branch SHA while the job checks out a
#     different revision. Never point this at ci.yml or any workflow whose jobs build or test
#     the pinned source.
#
# HARD GUARDRAIL (tools/test_check_build_test.py and certification/test_build_test.py):
#   * NEVER list a build, test, security, or contract job of the pinned source. A red protocol
#     certification, release-matrix browser test, or server test shard stays core.
#   * A workflow entry that is not enriched with its path stays core. Missing metadata cannot
#     hide a red.
#   * If excluding an entry leaves no core CI lane, the component is BLOCKED, never pass.
#   * Each entry has its own why. Do not add a name because a run was red.

honua-sdk-js:
  - name: "Three-engine smoke and source-packed parity"
    why: >-
      Sample smoke across three browser engines (`.github/workflows/first-map-release-smoke.yml`):
      it builds the maplibre-quickstart sample and drives Playwright through First Map in
      chromium, firefox and webkit. On 984425f9 run 37454546336 sealed
      "chromium=passed firefox=failed webkit=passed": the only red is the Firefox leg's First Map
      provenance text/click assertion ("No unobscured rendered First Map feature was available for
      the click regression"), tracked as honua-sdk-js#687 with fix branch fix/687-firefox-xvfb. A
      Firefox-only sample assertion does not describe the published SDK; its unit, browser, verify
      and build lanes stay core. Ruling 2026-10-09 (rc.3 fix unit R1); honua-release#471.
  - name: "Shadow parity"
    why: >-
      Scheduled read-only collector (`.github/workflows/sdk-shadow-parity.yml`, job `collect`).
      The workflow text says it is deliberately not a gate: it observes other Actions runs, runs
      no npm ci, builds nothing, and publishes no status beyond its own job. On 984425f9 the only
      attempt (run 37469718860, 2026-10-06T13:18Z) exited because `gh api` returned HTTP 502
      while listing jobs of an older run. That is a GitHub error in the collector, not a test of
      the published SDK. The SDK's unit, browser, verify, and build lanes stay core.
  - name: "release-please-refresh"
    why: >-
      Release Please base-refresh (`.github/workflows/release-please.yml`). It updates the
      release-please branch with `scripts/refresh-release-please-base.mjs` and runs no SDK build
      or test. On 984425f9 the push attempt succeeded. The later workflow_dispatch (run
      37453273643, the finish-stranded-draft recovery) published the release from the
      release-please job, then this job failed because RELEASE_PLEASE_PRS_CREATED was empty.
      That bookkeeping miss does not describe the published source. `release-please-ci`, which
      dispatches canonical CI, is not listed here.
  - name: "Publish artifacts PR + gate strict validation"
    why: >-
      Derived-artifact automation (`.github/workflows/regenerate-derived-artifacts.yml`, job
      `commit-and-validate`). It opens a regeneration pull request and merges it only when
      strict CI on that generated child commit is green. It does not build or test the pinned
      SHA. On 984425f9 run 37455141007 failed while watching strict CI of the generated branch,
      whose red jobs were "Validate sample runner boundaries and generated selection" and
      "Browser smoke suite not re-proven" on that child commit. Two earlier runs of this same
      job on 984425f9 succeeded. The pinned SHA's own browser, unit, and verify lanes stay
      core, as does "Three-engine smoke and source-packed parity". The sibling job
      "Regenerate + reseal on trunk", which does build the SDK, is not listed.

honua-sdk-dotnet:
  - name: "follow"
    why: >-
      Scheduled pin-PR opener (`.github/workflows/certification-pin-follow.yml`, job `follow`,
      cron 16:00). It checks out trunk, copies the honua-release manifest's Honua.Sdk coordinate
      into certification/candidate-pins.json, pushes chore/certification-pin-follow, opens or
      updates one pull request and dispatches sdk-certification.yml on it. It builds and tests
      nothing. On 66413fe3 run 37685097250 opened honua-sdk-dotnet#423 (Honua.Sdk 1.10.4) and then
      failed with "could not create workflow dispatch event: HTTP 422: No ref found for: f31fb9ae"
      when dispatching certification on the pin commit. That is a dispatch race in the opener,
      not a verdict on 66413fe3. Under honua-release#471.
  - name: "certify"
    why: >-
      Scheduled certification (`.github/workflows/sdk-certification.yml`, job `certify`) whose first
      gate, "Verify candidate pins against nuget.org and honua-release", requires
      certification/candidate-pins.json AT THE EVALUATED SHA to name the Honua.Sdk coordinate the
      honua-release manifest pins. The manifest pins the published package's own source commit, and
      the pin file at that commit can only name the PREVIOUS package (the follow opener advances it
      afterwards, on a later commit), so on the published source the gate is red by construction:
      on 66413fe3 run 37841698037 refused with "pin file has 1.10.3, honua-release manifest has
      1.10.4" before any SDK build or test ran. That is pin lag between two repositories, not a
      verdict on the package. The .NET SDK's unit lanes, build, API Compatibility and Contract
      Conformance stay core, and the release train's gate-installed-clients certifies the installed
      Honua.Sdk package against the candidate. Ruling 2026-10-09 (rc.3 fix unit R1, pin-lag rule);
      honua-release#471.

honua-helm:
  - name: "Publish chart by digest"
    why: >-
      Scheduled chart publication (`.github/workflows/chart-nightly.yml`, "Nightly Chart
      Publication", cron 13:45). It publishes the chart for the newest honua-release nightly
      candidate stamped at refs/nightly-candidates/*, checking out that candidate's pinned
      honua-helm revision rather than the trunk SHA GitHub files the check on. Until the first
      nightly lock is minted no candidate is stamped, so on 1bfac13 run 37832296711 refused with
      "no honua-release nightly candidate is stamped (refs/nightly-candidates/*); nothing to
      publish". Mint needs resolve, and resolve skipped 1bfac13 for exactly this red, so the check
      cannot go green before the lock it publishes exists. It is release automation downstream of
      mint, not a verdict on the helm SHA. Under honua-release#471. lint-chart,
      install-upgrade-rollback-smoke, the OKF documentation bundle and the security scans stay core.

honua-server:
  - name: "Validate normalization envelope"
    why: >-
      Governance consumer (`Derived Artifact Normalization Consumer`, event `workflow_run`) that
      verifies the producer's normalization envelope artifact belongs to exactly one open pull
      request for the producer head. It builds and tests nothing. It also fires for the
      workflow_run of a trunk merge commit, where no pull request is open any more, and then fails
      with "Expected one open PR for producer head; found 0." (094c76b4, run 37907385850). That is
      the consumer's own PR bookkeeping on a merged commit, not a verdict on the server SHA. The
      full-matrix CI workflow and Build & Format Check stay core.
  - workflow: ".github/workflows/server-test-prebuild-observe.yml"
    why: >-
      Server Test Prebuild Observation is a non-authoritative shadow measurement. Its own
      header says nothing gated depends on it. workflow_run files every check on the
      default-branch SHA, while the producer checks out `needs.plan.outputs.head_sha`, the
      pull-request head. On c19f29d the two red jobs (run 37432003056) compiled
      928507999, not c19f29d: the log shows the policy checkout at c19f29d and the source
      checkout at 928507999, then CS0103 for BaseUrlResolver. c19f29d's own CI workflow
      is not this file. Build & Format Check and the full-matrix lanes stay core, and a
      prebuild check with no recorded workflow path stays core too.
