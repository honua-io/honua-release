name: Kept gate promise receipt
description: Adapt only a validated gate pass for the exact candidate into the promise contract
inputs:
  gate:
    required: true
    description: Existing producer workflow name
  status:
    required: true
    description: Raw pass/fail/blocked verdict, never the bootstrap exit code
  lock_digest:
    required: true
    description: Signed candidate manifest digest supplied by the candidate orchestrator
  manifest:
    default: platform-manifest.yaml
    description: Exact manifest consumed by this gate; empty for protocol certification
  server_sha:
    default: ""
    description: Protocol evaluator's expected source SHA
  image_digest:
    default: ""
    description: Protocol evaluator's expected image digest
  proof:
    default: ""
    description: Validated DR receipt or candidate-bound Launch Stack upgrade proof
runs:
  using: composite
  steps:
    - name: Adapt validated verdict
      shell: bash
      env:
        GATE: ${{ inputs.gate }}
        STATUS: ${{ inputs.status }}
        LOCK_DIGEST: ${{ inputs.lock_digest }}
        MANIFEST: ${{ inputs.manifest }}
        SERVER_SHA: ${{ inputs.server_sha }}
        IMAGE_DIGEST: ${{ inputs.image_digest }}
        PROOF: ${{ inputs.proof }}
      run: |
        set -euo pipefail
        args=()
        if [ -n "$MANIFEST" ]; then args+=(--manifest "$MANIFEST"); fi
        if [ -n "$PROOF" ]; then args+=(--proof "$PROOF"); fi
        python tools/kept_gate_receipt.py --gate "$GATE" --status "$STATUS" \
          --lock-digest "$LOCK_DIGEST" --server-sha "$SERVER_SHA" --image-digest "$IMAGE_DIGEST" \
          --out "$RUNNER_TEMP/release-promise-receipts" "${args[@]}"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-promise-receipts
        path: ${{ runner.temp }}/release-promise-receipts/
        if-no-files-found: error
        retention-days: 14
