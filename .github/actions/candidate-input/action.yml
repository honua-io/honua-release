name: Immutable candidate inputs
description: Overlay only manifest and matrix data from a generated snapshot of reviewed trunk
inputs:
  candidate_ref:
    description: Full snapshot commit SHA published at refs/nightly-candidates/<sha>
    required: true
  checkout_directory:
    description: Canonical honua-release checkout to adopt candidate data into
    required: false
    default: .
  reviewed_release_sha:
    description: Immutable reviewed release checkout SHA for a cross-repository consumer
    required: false
    default: ""
outputs:
  manifest_path:
    description: Adopted platform manifest path
    value: ${{ steps.adopt.outputs.manifest_path }}
  matrix_path:
    description: Adopted compatibility matrix path
    value: ${{ steps.adopt.outputs.matrix_path }}
  manifest_sha256:
    description: SHA256 of the adopted manifest bytes
    value: ${{ steps.adopt.outputs.manifest_sha256 }}
  matrix_sha256:
    description: SHA256 of the adopted matrix bytes
    value: ${{ steps.adopt.outputs.matrix_sha256 }}
runs:
  using: composite
  steps:
    # The snapshot's parent is the commit the nightly ran. Inside the train that is this run's
    # commit. A producer dispatched on trunk (the DR drill) starts from trunk head, which may
    # have moved since the nightly started: then the parent must be an ancestor of that head.
    - name: Verify snapshot lineage and adopt candidate data
      id: adopt
      shell: bash
      env:
        CANDIDATE_REF: ${{ inputs.candidate_ref }}
        RUN_SHA: ${{ github.sha }}
        RUN_REF: ${{ github.ref }}
        CHECKOUT_DIRECTORY: ${{ inputs.checkout_directory }}
        REVIEWED_RELEASE_SHA: ${{ inputs.reviewed_release_sha }}
        RUN_REPOSITORY: ${{ github.repository }}
      run: |
        bash "$GITHUB_ACTION_PATH/adopt.sh"
