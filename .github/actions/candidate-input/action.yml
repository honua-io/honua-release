name: Immutable candidate inputs
description: Overlay only manifest and matrix data from a generated snapshot of this reviewed commit
inputs:
  candidate_ref:
    description: Full snapshot commit SHA published at refs/nightly-candidates/<sha>
    required: true
runs:
  using: composite
  steps:
    - name: Verify snapshot lineage and adopt candidate data
      shell: bash
      env:
        CANDIDATE_REF: ${{ inputs.candidate_ref }}
        REVIEWED_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        [[ "$CANDIDATE_REF" =~ ^[0-9a-f]{40}$ ]]
        git fetch --depth=2 origin "refs/nightly-candidates/${CANDIDATE_REF}:refs/nightly-candidates/${CANDIDATE_REF}"
        git worktree add --detach nightly-input "$CANDIDATE_REF"
        test "$(git -C nightly-input rev-parse HEAD)" = "$CANDIDATE_REF"
        test "$(git -C nightly-input rev-parse HEAD^)" = "$REVIEWED_SHA"
        git -C nightly-input diff --name-only HEAD^ HEAD > "$RUNNER_TEMP/candidate-changes.txt"
        while IFS= read -r path; do
          case "$path" in platform-manifest.yaml|compatibility-matrix.yaml) ;; *) echo "unexpected candidate change: $path"; exit 1;; esac
        done < "$RUNNER_TEMP/candidate-changes.txt"
        cp nightly-input/platform-manifest.yaml platform-manifest.yaml
        cp nightly-input/compatibility-matrix.yaml compatibility-matrix.yaml
