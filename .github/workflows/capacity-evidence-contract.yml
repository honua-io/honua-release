name: Capacity evidence contract
on:
  pull_request:
    paths:
      - 'tools/*capacity*'
      - 'tools/test_workflow_contracts.py'
      - 'certification/capacity-envelope.v1.json'
      - '.github/workflows/capacity-*.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Supersede stale pull-request heads only: a newer push to the same PR cancels the
  # in-flight run for the old head. push/schedule/dispatch runs get a unique group
  # (run_id), so trunk and manual runs are never cancelled or coalesced.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sourced-observations:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install pytest pyyaml
      - name: Reject unsourced observations and recompute all GA signals
        run: python -m pytest tools/test_check_capacity_soak.py tools/test_extract_capacity_evidence.py tools/test_workflow_contracts.py -q --junitxml=test-results/capacity.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: capacity-checker-tests
          path: test-results/capacity.xml
          if-no-files-found: error
