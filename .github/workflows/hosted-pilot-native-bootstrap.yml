name: Hosted pilot private native bootstrap
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Preparation and paid cases share original candidate state and liabilities.
  group: agent-e2e-campaign
  cancel-in-progress: false
jobs:
  provision:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require the actual reviewed private native bootstrap binding
        run: |
          set -euo pipefail
          git ls-files --error-unmatch -- certification/agent-e2e/native-bootstrap-handoff.json
          test -s certification/agent-e2e/native-bootstrap-handoff.json
          test ! -L certification/agent-e2e/native-bootstrap-handoff.json
      - name: Install dispatch SDK; application and SQL credentials remain in ECS
        run: python -m pip install 'boto3>=1.40,<2'
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AGENT_E2E_DISPATCH_ROLE_ARN }}
          aws-region: ${{ vars.HOSTED_PILOT_REGION }}
          allowed-account-ids: ${{ vars.HOSTED_PILOT_ACCOUNT_ID }}
          role-session-name: pilot-native-bootstrap-${{ github.run_id }}
      - name: Dispatch one exact private native task under retained original allowance
        run: python tools/hosted_pilot/native_bootstrap_dispatch.py --output "$RUNNER_TEMP/native-bootstrap-outcome.json"
      - name: Retain actual nonsecret issued identities and immutable custody reference
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-pilot-native-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-bootstrap-outcome.json
          if-no-files-found: warn
          retention-days: 90
