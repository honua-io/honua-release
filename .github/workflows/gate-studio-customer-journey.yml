name: gate-studio-customer-journey
run-name: Studio customer gate ${{ inputs.platform_lock_digest }}
on:
  workflow_dispatch:
    inputs:
      platform_lock_digest:
        description: 'sha256 of the candidate platform-lock.json under qualification'
        required: true
        type: string
      candidate_ref:
        description: 'Optional immutable candidate snapshot'
        required: false
        type: string
      lock_run_id:
        description: 'Workflow run containing the frozen platform lock artifact'
        required: true
        type: string
      lock_artifact:
        description: 'Artifact containing platform-lock.json'
        required: false
        default: platform-lock
        type: string
  workflow_call:
    inputs:
      platform_lock_digest: { required: true, type: string }
      candidate_ref: { required: false, type: string, default: '' }
      lock_run_id: { required: true, type: string }
      lock_artifact: { required: false, type: string, default: 'platform-lock' }
    secrets:
      RELEASE_GH_TOKEN: { required: true }
    outputs:
      overall_status:
        value: ${{ jobs.customer.outputs.overall_status }}
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: studio-customer-gate-${{ github.ref }}-${{ inputs.platform_lock_digest }}
  cancel-in-progress: false
jobs:
  customer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      overall_status: ${{ steps.verdict.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Adopt immutable candidate pins
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.lock_artifact }}
          path: candidate-lock
          run-id: ${{ inputs.lock_run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install 'pyyaml>=6.0'
      - name: Verify candidate lock schema and attestation
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          python tools/validate_platform_lock.py candidate-lock/platform-lock.json
          gh attestation verify candidate-lock/platform-lock.json --repo "${{ github.repository }}"
      - name: Dispatch pinned Console and server images and validate evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          PLATFORM_LOCK_DIGEST: ${{ inputs.platform_lock_digest }}
        run: python tools/studio_customer_gate.py --platform-lock "$PLATFORM_LOCK_DIGEST" --lock-file candidate-lock/platform-lock.json
      - name: Read fail-closed verdict
        id: verdict
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = Path('out/studio-customer/studio-customer-gate-report.json')
          value = json.loads(report.read_text()) if report.exists() else {}
          print('status=' + ('pass' if value.get('status') == 'pass' and value.get('certifying') is True else 'fail'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: studio-customer-gate-report
          path: out/studio-customer/
          if-no-files-found: error
