name: gate-studio-customer-journey
run-name: Studio customer gate ${{ inputs.platform_lock_digest }}
on:
  workflow_dispatch:
    inputs:
      platform_lock_digest:
        description: 'sha256 of the candidate platform-lock.json under qualification'
        required: true
        type: string
      candidate_ref:
        description: 'Optional immutable candidate snapshot'
        required: false
        type: string
      lock_run_id:
        description: 'Workflow run containing the frozen platform lock artifact'
        required: true
        type: string
      lock_artifact:
        description: 'release-train artifact holding platform-lock.json and the attested manifest and matrix'
        required: false
        default: candidate-manifest
        type: string
  workflow_call:
    inputs:
      platform_lock_digest: { required: true, type: string }
      candidate_ref: { required: false, type: string, default: '' }
      lock_run_id: { required: true, type: string }
      lock_artifact: { required: false, type: string, default: 'candidate-manifest' }
    secrets:
      RELEASE_GH_TOKEN: { required: true }
    outputs:
      overall_status:
        value: ${{ jobs.customer.outputs.overall_status }}
permissions:
  contents: read
  actions: read
  attestations: read
concurrency:
  group: studio-customer-gate-${{ github.ref }}-${{ inputs.platform_lock_digest }}
  cancel-in-progress: false
jobs:
  customer:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    outputs:
      overall_status: ${{ steps.verdict.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Adopt immutable candidate pins
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.lock_artifact }}
          path: candidate-lock
          run-id: ${{ inputs.lock_run_id }}
          github-token: ${{ github.token }}
      - run: python -m pip install 'pyyaml>=6.0' 'jsonschema>=4.23' 'cryptography>=45.0'
      # The qualification lock (release-train freeze_only) is unsigned by design; its manifest and
      # matrix are attested. Verify those exact input bytes, re-derive the lock from them and require
      # the artifact's lock to be byte-identical and to carry the dispatched digest. No fallback.
      - name: Verify attested candidate inputs and re-derive the qualification lock
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          LOCK_DIGEST: ${{ inputs.platform_lock_digest }}
        run: |
          set -euo pipefail
          [[ "$LOCK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::platform_lock_digest must be sha256:<64 hex>"; exit 1; }
          for input in platform-manifest.yaml compatibility-matrix.yaml; do
            test -f "candidate-lock/$input"
            gh attestation verify "candidate-lock/$input" --repo "${{ github.repository }}" \
              --signer-workflow "${{ github.repository }}/.github/workflows/release-train.yml"
          done
          label="$(python -c 'import sys, yaml; print(yaml.safe_load(open(sys.argv[1]))["platformRelease"])' candidate-lock/platform-manifest.yaml)"
          python tools/platform_lock_bundle.py candidate-lock/platform-lock.json \
            --manifest candidate-lock/platform-manifest.yaml --matrix candidate-lock/compatibility-matrix.yaml \
            --label "$label" --out-dir "$RUNNER_TEMP/rederived-lock" --qualification
          cmp candidate-lock/platform-lock.json "$RUNNER_TEMP/rederived-lock/platform-lock.json"
          actual="sha256:$(sha256sum candidate-lock/platform-lock.json | cut -d' ' -f1)"
          [ "$actual" = "$LOCK_DIGEST" ] || { echo "::error::platform lock digest $actual is not the dispatched $LOCK_DIGEST"; exit 1; }
      - name: Dispatch pinned Console and server images and validate evidence
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          PLATFORM_LOCK_DIGEST: ${{ inputs.platform_lock_digest }}
        run: python tools/studio_customer_gate.py --manifest candidate-lock/platform-manifest.yaml --platform-lock "$PLATFORM_LOCK_DIGEST" --lock-file candidate-lock/platform-lock.json
      - name: Read fail-closed verdict
        id: verdict
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          report = Path('out/studio-customer/studio-customer-gate-report.json')
          value = json.loads(report.read_text()) if report.exists() else {}
          print('status=' + ('pass' if value.get('status') == 'pass' and value.get('certifying') is True else 'fail'))
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: studio-customer-gate-report
          path: out/studio-customer/
          if-no-files-found: error
