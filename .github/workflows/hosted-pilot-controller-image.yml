name: Hosted pilot trusted controller image
on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Reviewed deployments config bound by this build's original owner reservation
        required: true
        type: string
      budget_version_id:
        description: Actual immutable owner budget version reserved for this workflow run
        required: true
        type: string
      budget_sha256:
        description: Actual SHA256 of the retained nonzero owner budget
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hosted-pilot-controller-image
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: hosted-pilot-apply
    permissions:
      contents: read
      id-token: write
    env:
      PILOT_ACCOUNT_ID: ${{ vars.HOSTED_PILOT_ACCOUNT_ID }}
      PILOT_REGION: ${{ vars.HOSTED_PILOT_REGION }}
      PILOT_CONTROLLER_REPOSITORY: ${{ vars.HOSTED_PILOT_CONTROLLER_ECR_REPOSITORY }}
      PILOT_PLAN_BUCKET: ${{ vars.HOSTED_PILOT_PLAN_BUCKET }}
      PILOT_PLAN_KMS_ARN: ${{ vars.HOSTED_PILOT_PLAN_KMS_ARN }}
      PILOT_CONFIG_PATH: ${{ inputs.config_path }}
      PILOT_BUDGET_VERSION_ID: ${{ inputs.budget_version_id }}
      PILOT_BUDGET_SHA256: ${{ inputs.budget_sha256 }}
      PILOT_OPERATION: apply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HOSTED_PILOT_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.HOSTED_PILOT_REGION }}
          allowed-account-ids: ${{ vars.HOSTED_PILOT_ACCOUNT_ID }}
          role-session-name: pilot-controller-image-${{ github.run_id }}
      - name: Build and verify exact archived controller source, then publish immutable image
        run: python3 tools/hosted_pilot/controller_image.py
      - name: Retain immutable image/source receipt only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: hosted-pilot-controller-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-pilot-controller-image.json
          if-no-files-found: error
          retention-days: 30
