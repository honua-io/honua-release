# Promote a passed release candidate to a platform label. This is the human/AI approval boundary:
# the `production` environment carries required reviewers + optional wait timer, enforced by GHA —
# the AI (or a human) cannot skip it. SKELETON.

name: promote
run-name: "promote ${{ inputs.platform_label }}"

on:
