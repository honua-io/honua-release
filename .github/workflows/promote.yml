# Promote a certified release candidate to a platform label — and CREATE THE RELEASE.
#
# This is the human/AI approval boundary: the `production` environment must carry the expected human
# reviewer and allow only protected branches. The declared configuration is settings-as-code in
# certification/production-approval.yaml, and the first job step compares the LIVE environment against
# it through the GitHub API (tools/check_production_approval.py, honua-release#44) — a missing,
# unreadable, weakened, drifted, stale, or automation-only reviewer configuration, a promotion from a
# branch other than the protected default, or a promotion started by the required reviewer all REFUSE
# here, before any release work. Machine-readable evidence is uploaded for the release. Within the
# gate it FAILS CLOSED: tools/finalize_release.py refuses to finalize unless the candidate's release-train
# gate-report is all-green — every gate `pass`, OR `skipped` while on the EXPLICIT allowed-skip list
# (tools/finalize_release.ALLOWED_SKIP: the creds-gated cloud cert tier that self-skips when
# HONUA_AWS_ROLE_ARN is unset). A red/blocked candidate, or a skip of any non-allow-listed gate, can
# never be tagged (AGENTS.md). Tagging, signing, and release creation are done by THIS workflow's OIDC
# identity — the AI never holds keys.
#
# What it does on success:
#   1. verify the selected run is a completed live release-train run from the protected default branch
#   2. pull its immutable certified-candidate bundle (report + exact manifest + exact matrix)
#   3. verify both artifact digests and source/run identity before parsing or finalizing anything
#   4. verify all gates green for this label, finalize the manifest, generate notes + platform BOM
#   5. OIDC keyless-sign the certified inputs, bound report, finalized manifest, and BOM
#   6. create the `honua-<label>` git tag + GitHub Release at the certified source SHA

name: promote
run-name: "promote ${{ inputs.platform_label }} (from run ${{ inputs.train_run_id }})"

on:
  workflow_dispatch:
    inputs:
      platform_label:
        description: "Platform label to release, e.g. 2026.1"
        required: true
        type: string
      train_run_id:
        description: "release-train run id that produced the certified-candidate bundle"
        required: true
        type: string

permissions:
  contents: write     # create the tag + GitHub Release
  id-token: write     # OIDC keyless signing of the manifest (no static keys)
  actions: read       # inspect the train run and download its certified-candidate artifact

concurrency:
  group: promote-${{ inputs.platform_label }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production    # verified below; absent/unprotected configuration fails closed
    steps:
      # Load the validators from the repository's DEFAULT BRANCH, not from the ref this run was
      # dispatched on: the approval policy and the checkers must not be supplied by whoever started
      # the promotion. `github.event.repository.default_branch` comes from the event payload, so it
      # cannot be chosen by the dispatcher. (The workflow FILE itself is still the dispatch ref's —
      # the environment's protected-branch deployment policy is the backstop there, and the gate below
      # independently refuses a promotion whose ref is not the protected default branch.) The checkout
      # is replaced with the certifying commit once the run metadata passes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" pytest

      # honua-release#44: the approval gate is settings-as-code. certification/production-approval.yaml
      # declares the environment GitHub must be enforcing; this step reads the LIVE configuration and
      # refuses when it is missing, unreadable, weakened, drifted, stale, or names only an automation
      # principal. It also proves this promotion is running from the protected default branch and was
      # NOT started by the required reviewer, so the approval is independent of the request.
      - name: Self-test the production approval decision core
        run: python -m pytest tools/test_check_production_approval.py -q

      - name: Verify the production approval gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EXPECTED_ENVIRONMENT: production
          PROMOTION_REF: ${{ github.ref_name }}
          PROMOTION_ACTOR: ${{ github.triggering_actor || github.actor }}
          PROMOTION_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -uo pipefail
          ARGS=(--policy certification/production-approval.yaml
                --mode promote
                --evidence-out production-approval-evidence.json
                --promotion-ref "$PROMOTION_REF"
                --promotion-actor "$PROMOTION_ACTOR")
          [ -n "${PROMOTION_ACTOR_ID:-}" ] && ARGS+=(--promotion-actor-id "$PROMOTION_ACTOR_ID")

          # Only HTTP statuses are ever echoed from these calls — never a response body, which can
          # carry configuration detail, and never a token.
          if gh api "repos/$REPOSITORY/environments/$EXPECTED_ENVIRONMENT" > environment.json 2>/tmp/env.err; then
            ARGS+=(--environment-metadata environment.json)
          else
            REASON="$(sed -n 's/.*\(HTTP [0-9][0-9]*\).*/\1/p' /tmp/env.err | head -n1)"
            ARGS+=(--unreadable-reason "${REASON:-environment read failed}")
          fi
          if gh api "repos/$REPOSITORY" > repository.json 2>/dev/null; then
            ARGS+=(--repository-metadata repository.json)
            DEFAULT_BRANCH="$(python -c 'import json; print(json.load(open("repository.json"))["default_branch"])')"
            ENCODED_BRANCH="$(python -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' "$DEFAULT_BRANCH")"
            gh api "repos/$REPOSITORY/branches/$ENCODED_BRANCH" > branch.json 2>/dev/null \
              && ARGS+=(--branch-metadata branch.json)
          fi

          set +e
          python tools/check_production_approval.py "${ARGS[@]}" | tee /tmp/approval.log
          RC=${PIPESTATUS[0]}
          set -e
          { echo "## Production approval gate"; echo ""; echo '```'; cat /tmp/approval.log; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" -ne 0 ]; then
            echo "::error::production approval gate REFUSED — promotion is blocked (honua-release#44)"
            exit 1
          fi

      - name: Upload production approval evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-approval-evidence
          path: production-approval-evidence.json
          if-no-files-found: warn

      - name: Resolve and validate the certifying train run
        id: train
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TRAIN_RUN_ID: ${{ inputs.train_run_id }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/release-train.yml
        run: |
          set -euo pipefail
          if [[ ! "$TRAIN_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::train_run_id must be a positive Actions run id"
            exit 1
          fi
          gh api "repos/$REPOSITORY" > repository.json
          DEFAULT_BRANCH="$(python -c 'import json; print(json.load(open("repository.json"))["default_branch"])')"
          ENCODED_BRANCH="$(python -c 'import sys; from urllib.parse import quote; print(quote(sys.argv[1], safe=""))' "$DEFAULT_BRANCH")"
          gh api "repos/$REPOSITORY/branches/$ENCODED_BRANCH" > branch.json
          gh api "repos/$REPOSITORY/actions/runs/$TRAIN_RUN_ID" > train-run.json
          python tools/candidate_binding.py validate-run \
            --run-metadata train-run.json \
            --repository-metadata repository.json \
            --branch-metadata branch.json \
            --expected-repository "$REPOSITORY" \
            --expected-workflow-path "$EXPECTED_WORKFLOW_PATH" \
            --expected-run-id "$TRAIN_RUN_ID" \
            --github-output "$GITHUB_OUTPUT"

      # Candidate parsing, finalization, and release generation use the tools that existed at
      # certification time. The promotion checkout is never a source for candidate bytes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.train.outputs.source_sha }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0"

      - name: Fetch the exact certified candidate bundle from the train run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p candidate
          gh run download "${{ inputs.train_run_id }}" --repo "${{ github.repository }}" \
            --name certified-candidate --dir candidate
          echo "bound gate-report:"
          cat candidate/gate-report.json

      - name: Finalize (fail closed unless all-green) + generate notes
        id: finalize
        run: |
          set -euo pipefail
          LABEL="${{ inputs.platform_label }}"
          BASE="${LABEL%%-rc*}"
          TAG="honua-${BASE}"
          echo "tag=$TAG"   >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          # finalize_release.py exits non-zero (REFUSED) if the candidate is not all-green for this
          # label — that aborts the job BEFORE any tag/release is created.
          STAMP="$(date -u +%FT%TZ)"
          python tools/finalize_release.py \
            --label "$LABEL" \
            --gate-report candidate/gate-report.json \
            --manifest candidate/platform-manifest.yaml \
            --matrix candidate/compatibility-matrix.yaml \
            --source-repository "${{ steps.train.outputs.source_repository }}" \
            --source-sha "${{ steps.train.outputs.source_sha }}" \
            --source-branch "${{ steps.train.outputs.source_branch }}" \
            --workflow-path "${{ steps.train.outputs.workflow_path }}" \
            --train-run-id "${{ steps.train.outputs.run_id }}" \
            --train-run-attempt "${{ steps.train.outputs.run_attempt }}" \
            --train-run-url "${{ steps.train.outputs.run_url }}" \
            --certification-mode live \
            --released-at "$STAMP" \
            --out-manifest finalized-manifest.yaml \
            --out-notes release-notes.md
          # The platform BOM (CycloneDX) — the customer-facing bill of materials for this label.
          python tools/generate_bom.py \
            --label "$LABEL" \
            --timestamp "$STAMP" \
            --manifest candidate/platform-manifest.yaml \
            --out bom.cdx.json

      - name: Install cosign (Sigstore)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the certified inputs + release outputs (keyless / OIDC)
        run: |
          set -euo pipefail
          # Provenance: each release artifact is keyless-signed by THIS workflow's OIDC identity
          # (Fulcio cert + Rekor transparency log) — no static keys, and the AI never holds them.
          for f in \
            candidate/gate-report.json \
            candidate/platform-manifest.yaml \
            candidate/compatibility-matrix.yaml \
            finalized-manifest.yaml \
            bom.cdx.json; do
            cosign sign-blob --yes "$f" \
              --output-signature "$f.sig" \
              --output-certificate "$f.pem"
          done
          echo "Signed certified inputs + release outputs. Verify e.g.:"
          echo "  cosign verify-blob bom.cdx.json \\"
          echo "    --signature bom.cdx.json.sig --certificate bom.cdx.json.pem \\"
          echo "    --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/promote.yml@.*' \\"
          echo "    --certificate-oidc-issuer https://token.actions.githubusercontent.com"

      - name: Create the platform release (tag + GitHub Release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.finalize.outputs.tag }}"
          BASE="${{ steps.finalize.outputs.base }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — refusing to overwrite a published platform release"
            exit 1
          fi
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --target "${{ steps.train.outputs.source_sha }}" \
            --title "Honua ${BASE}" \
            --notes-file release-notes.md \
            candidate/gate-report.json \
            candidate/gate-report.json.sig \
            candidate/gate-report.json.pem \
            candidate/platform-manifest.yaml \
            candidate/platform-manifest.yaml.sig \
            candidate/platform-manifest.yaml.pem \
            candidate/compatibility-matrix.yaml \
            candidate/compatibility-matrix.yaml.sig \
            candidate/compatibility-matrix.yaml.pem \
            finalized-manifest.yaml \
            bom.cdx.json \
            finalized-manifest.yaml.sig \
            finalized-manifest.yaml.pem \
            bom.cdx.json.sig \
            bom.cdx.json.pem
          echo "Released Honua ${BASE} as tag ${TAG}."
