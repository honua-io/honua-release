# AI workflow corpus gate — enforce that every operation the AI may run is reversible + tested.
#
# The enforceable core of safe AI-driven ops (corpus/README.md): a workflow may not enter the corpus
# unless it is well-formed, ROLLBACK-SAFE (a non-empty, verifiable rollback), and integration-tested.
# tools/check_corpus.py fails closed on any violation. Runs per-PR — a PR adding an un-rollback-able
# or untested AI workflow fails its own CI — plus workflow_call (so the train / MCP layer can gate on
# corpus integrity before granting any AI-ops autonomy).

name: gate-corpus

on:
  pull_request:
    paths:
      - "corpus/**"
      - "tools/check_corpus.py"
      - "tools/test_check_corpus.py"
      - "e2e/operational/**"
      - ".github/workflows/gate-corpus.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: gate-corpus-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" pytest

      # Prove the gate can FAIL (an un-rollback-able workflow is rejected) before trusting it.
      - name: Self-test the corpus gate + rollback assertion
        run: python -m pytest tools/test_check_corpus.py e2e/operational/test_operational.py -q

      # Every AI-runnable workflow must be reversible + tested, or this is red.
      - name: Validate the AI workflow corpus
        run: python tools/check_corpus.py
