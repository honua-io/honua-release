name: dr-drill-local-docker

on:
  pull_request:
    paths:
      - "e2e/dr-drill/**"
      - "platform-manifest.yaml"
      - ".github/workflows/dr-drill-local-docker.yml"
  push:
    branches: [trunk]
    paths: [platform-manifest.yaml]
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

# The drill jobs execute pull-request-controlled code (`e2e/dr-drill/**`), so they never hold OIDC
# or attestation write. Minting a producer attestation and publishing the receipt are separate jobs
# that only run off a pull request; gate-dr additionally pins this workflow identity and the trunk
# source ref at intake, so an attestation produced from any other ref is refused there.
permissions:
  contents: read
  packages: read

concurrency:
  group: dr-drill-local-docker
  cancel-in-progress: false

jobs:
  gp-outputs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      registry:
        image: registry:3
        ports:
          - 5000:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out the reviewed GP qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-server
          ref: 73f99d5ef59aa086720456bc56df372f86bcff46
          path: gp-qualification
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Bind to this run's immutable candidate manifest
        id: candidate
        run: |
          mkdir -p artifacts/gp-candidate
          cp platform-manifest.yaml artifacts/gp-candidate/platform-manifest.yaml
          python gp-qualification/scripts/qualification/gp-candidate-binding.py \
            --manifest platform-manifest.yaml --output artifacts/gp-candidate/pin.json
          jq -r '"source_sha=\(.source_sha)", "server_image=\(.server_image)"' \
            artifacts/gp-candidate/pin.json >> "$GITHUB_OUTPUT"
      - name: Verify the pinned server image provenance
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_IMAGE: ${{ steps.candidate.outputs.server_image }}
        run: |
          gh attestation verify "oci://$SERVER_IMAGE" --repo honua-io/honua-server \
            --signer-workflow honua-io/honua-server/.github/workflows/nightly-container-build.yml \
            --source-ref refs/heads/trunk --format json > artifacts/gp-candidate/image-attestation.json
      - name: Check out the matching production worker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-server
          ref: ${{ steps.candidate.outputs.source_sha }}
          path: candidate-worker
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
        with:
          driver-opts: network=host
      - name: Build the unmodified production worker at the candidate source
        id: worker
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: candidate-worker
          file: candidate-worker/docker/worker-gdal/Dockerfile
          push: true
          tags: localhost:5000/gp-candidate-worker:qualification
          build-args: |
            HONUA_GIT_SHA=${{ steps.candidate.outputs.source_sha }}
          secrets: |
            github_actor=${{ github.actor }}
            github_token=${{ secrets.RELEASE_GH_TOKEN || github.token }}
          cache-from: type=registry,ref=ghcr.io/honua-io/honua-server/buildcache:honua-worker-gdal-amd64
      - name: Execute store attestation, cold restore and crash boundaries
        env:
          HONUA_SERVER_IMAGE: ${{ steps.candidate.outputs.server_image }}
          HONUA_GP_SOURCE_SHA: ${{ steps.candidate.outputs.source_sha }}
          HONUA_WORKER_IMAGE: localhost:5000/gp-candidate-worker@${{ steps.worker.outputs.digest }}
          HONUA_GP_SCENARIO_TIMEOUT_SECONDS: '900'
        run: |
          set -euo pipefail
          # Resolve through the runner-local registry so even Docker daemons
          # using the classic image store retain a real RepoDigest after pull.
          docker pull "$HONUA_WORKER_IMAGE"
          docker pull "$HONUA_SERVER_IMAGE"
          docker pull pgrouting/pgrouting:17-3.5-3.7.3@sha256:e15a541283d5086981f3e19648a15f969e8d09aa9e72a5a5acf6777673da1784
          docker pull redis:7.2-alpine@sha256:ccd6aa8d45ff3f033d6fa15b8cc1a50579f65c89f38cf9bb607a954c4f2128ed
          export HONUA_GP_SKIP_PULL=true
          failed=0
          for lane in output-store-dr crash-boundaries; do
            HONUA_GP_LANE="$lane" HONUA_GP_RECEIPT_DIR="$PWD/artifacts/gp-candidate/$lane" \
              gp-qualification/scripts/qualification/gp-lifecycle-harness.sh || failed=1
          done
          test "$failed" = 0
          python gp-qualification/scripts/qualification/gp-candidate-binding.py \
            --manifest artifacts/gp-candidate/platform-manifest.yaml \
            --summary artifacts/gp-candidate/output-store-dr/summary.json \
            --crash-summary artifacts/gp-candidate/crash-boundaries/summary.json \
            --output artifacts/gp-candidate/receipt.json
      - name: Retain executed receipts and findings
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gp-candidate-store
          path: |
            artifacts/gp-candidate/*.json
            artifacts/gp-candidate/*.yaml
            artifacts/gp-candidate/*.txt
            artifacts/gp-candidate/output-store-dr/*.json
            artifacts/gp-candidate/output-store-dr/*.log
            artifacts/gp-candidate/crash-boundaries/*.json
            artifacts/gp-candidate/crash-boundaries/*.log
          if-no-files-found: error
          retention-days: 90

  full-platform:
    needs: gp-outputs
    # The deliverable: one run over the candidate's whole declared durable-substrate inventory,
    # producing the honua.dr-drill-receipt/v2 receipt gate-dr validates.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Download the candidate GP restore and crash proof
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gp-candidate-store
          path: artifacts/gp-candidate
      - name: Execute the full-platform recovery drill
        env:
          HONUA_GP_DR_RECEIPT: artifacts/gp-candidate/receipt.json
        run: python e2e/dr-drill/full_platform.py
      - name: Re-validate the receipt against the candidate configuration
        run: |
          python tools/validate_dr_receipt.py \
            --candidate platform-manifest.yaml \
            --receipt artifacts/dr-drill-full-platform/receipt.json
      - name: Upload immutable drill envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr-drill-full-platform-${{ github.sha }}
          path: |
            artifacts/dr-drill-full-platform/receipt.json
            artifacts/dr-drill-full-platform/receipt.json.sig
            artifacts/dr-drill-full-platform/receipt.pub.pem
            artifacts/dr-drill-full-platform/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  restore:
    # The PostgreSQL restore seam is retained as a second, explicitly scoped artifact. It is not the
    # full-platform deliverable and its receipt is still rejected by the gate, by design.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install PyYAML
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Execute scoped PostgreSQL backup and restore drill
        run: bash e2e/dr-drill/run.sh
      - name: Upload immutable drill envelope
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dr-drill-local-docker-${{ github.sha }}
          path: |
            artifacts/dr-drill-local-docker/receipt.json
            artifacts/dr-drill-local-docker/receipt.json.sig
            artifacts/dr-drill-local-docker/receipt.pub.pem
            artifacts/dr-drill-local-docker/SHA256SUMS
          if-no-files-found: error
          retention-days: 90

  attest:
    # Trusted-ref production only. A pull request run stops after the drills and their envelopes,
    # so unmerged code cannot obtain the producer identity gate-dr accepts.
    needs: [full-platform, restore]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dr-drill-full-platform-${{ github.sha }}
          path: artifacts/dr-drill-full-platform
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dr-drill-local-docker-${{ github.sha }}
          path: artifacts/dr-drill-local-docker
      - name: Attest signed receipts
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v3.0.0
        with:
          subject-path: |
            artifacts/dr-drill-full-platform/receipt.json
            artifacts/dr-drill-local-docker/receipt.json

  publish:
    # Anonymous, immutable HTTPS home for the attested receipt, so gate-dr can fetch it with no
    # credential. Commit-pinned raw content, never a branch ref: a branch URL would let the bytes
    # behind an already-verified receipt change later.
    needs: attest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dr-drill-full-platform-${{ github.sha }}
          path: artifacts/dr-drill-full-platform
      - name: Check out the evidence landing zone
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-evidence
          ref: trunk
          token: ${{ secrets.RELEASE_GH_TOKEN }}
          path: evidence-repo
          fetch-depth: 0
      - name: Publish the receipt to the evidence repository
        id: publish
        run: |
          set -euo pipefail
          # data/producers/dr-drills/*.json is the aggregator's envelope glob and it is not
          # recursive, so receipts land one level down and cannot be mistaken for an envelope.
          path="data/producers/dr-drills/receipts/$(date -u +%Y-%m-%dT%H-%M-%SZ)-${GITHUB_RUN_ID}.json"
          mkdir -p "evidence-repo/$(dirname "$path")"
          cp artifacts/dr-drill-full-platform/receipt.json "evidence-repo/$path"
          cd evidence-repo
          git config user.name "Mike McDougall"
          git config user.email "mike@honua.io"
          git add "$path"
          git commit -m "chore: ingest full-platform DR receipt from honua-release run ${GITHUB_RUN_ID}"
          for attempt in 1 2 3; do
            if git pull --rebase origin trunk && git push origin HEAD:trunk; then
              commit="$(git rev-parse HEAD)"
              break
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 2))"
          done
          [ -n "${commit:-}" ] || { echo "::error::could not publish the receipt after 3 attempts"; exit 1; }
          cd ..
          url="https://raw.githubusercontent.com/honua-io/honua-evidence/$commit/$path"
          candidate="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["candidateLockDigest"])' artifacts/dr-drill-full-platform/receipt.json)"
          echo "receipt_url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Full-platform DR receipt"
            echo
            echo "\`dr=$url candidate=$candidate\`"
            echo
            echo "Supply that URL to \`gate-dr\` (\`receipt_url\`) or to the release train (\`dr_receipt_url\`)."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm the published receipt is anonymously fetchable and byte-identical
        env:
          RECEIPT_URL: ${{ steps.publish.outputs.receipt_url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if python - "$RECEIPT_URL" <<'PY'
          import hashlib, sys, urllib.request
          published = urllib.request.urlopen(sys.argv[1], timeout=60).read()
          local = open("artifacts/dr-drill-full-platform/receipt.json", "rb").read()
          if hashlib.sha256(published).hexdigest() != hashlib.sha256(local).hexdigest():
              raise SystemExit("published receipt bytes differ from the attested receipt")
          print("published receipt matches the attested bytes")
          PY
            then
              exit 0
            fi
            # raw.githubusercontent.com serves a new commit's bytes a moment after the push.
            sleep "$((attempt * 5))"
          done
          echo "::error::the published receipt never became anonymously fetchable"
          exit 1
