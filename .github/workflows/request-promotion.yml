# Request the environment-gated promotion workflow, as the dedicated GitHub App, for each
# committed promotion candidate whose per-lock burn is ready (honua-release#386, R19-R21).
#
# A lock's burn reaches hour 48 long after its minting train completes, so readiness is
# checked on a schedule rather than when a train finishes. Every hour this workflow lists the
# committed records in certification/promotions/ that are at or past hour 48, not yet
# published and not recently requested, fetches the evidence each names and runs the same
# readiness check promote.yml runs. Only a passing record is dispatched; promote.yml checks it
# again behind the protected environment.
#
# There is deliberately no manual trigger: the required human reviewer must not be able to
# initiate promotion and then approve it through an App redispatch.
name: request-promotion
run-name: "request promotion for burning candidates"

on:
  schedule:
    - cron: "41 * * * *"   # hourly; a burn becomes promotable from hour 48

permissions:
  actions: read
  contents: read

concurrency:
  group: request-promotion
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: List burning candidates at or past hour 48
        id: candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/fetch_promotion_evidence.py candidates \
            --promotions-dir certification/promotions --repository "$GITHUB_REPOSITORY" --out candidates.json

      - name: Check per-lock readiness for each candidate
        id: ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo '[]' > ready.json
          while IFS=$'\t' read -r label record rc_run_id; do
            [ -n "$label" ] || continue
            dir="evidence-$label"
            # A record whose evidence cannot be fetched or does not pass is reported and skipped;
            # it is checked again next hour.
            if python tools/fetch_promotion_evidence.py fetch \
                 --record "$record" --repository "$GITHUB_REPOSITORY" --out-dir "$dir" \
               && python tools/check_promotion_readiness.py --record "$record" \
                 --lock "$dir/trains/$rc_run_id/platform-lock.json" --evidence-dir "$dir" \
                 --out "readiness-$label.json"; then
              jq --arg label "$label" --arg record "$record" --arg rc "$rc_run_id" \
                '. + [{label: $label, record: $record, rcTrainRunId: $rc}]' ready.json > ready.next
              mv ready.next ready.json
            else
              echo "::notice::$label is not ready for promotion; see the readiness output above"
            fi
          done < <(jq -r '.[] | [.label, .record, .rcTrainRunId] | @tsv' candidates.json)
          echo "count=$(jq length ready.json)" >> "$GITHUB_OUTPUT"

      - name: Mint claude App installation token
        id: app-token
        if: steps.ready.outputs.count != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v2.1.1
        with:
          app-id: ${{ vars.CLAUDE_APP_ID }}
          private-key: ${{ secrets.CLAUDE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: honua-release

      - name: Dispatch protected promotion workflow
        if: steps.ready.outputs.count != '0'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r label record rc_run_id; do
            gh workflow run promote.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$DEFAULT_BRANCH" \
              -f platform_label="$label" \
              -f train_run_id="$rc_run_id" \
              -f promotion_record="$record"
          done < <(jq -r '.[] | [.label, .record, .rcTrainRunId] | @tsv' ready.json)
