# Nightly strict train on trunk head (honua-release#386, ruling R18).
# No hand-supplied pin or receipt. A red, skipped, blocked or cancelled gate mints nothing.
# Only refs/heads/trunk resolves or mints: a dispatch from any other branch could stub its own
# gates green, so `resolve` and `mint` refuse it and mint_nightly_lock.py refuses its report.

name: nightly-certification

on:
  schedule:
    # 11:15 UTC, after the weekday DR drill window. The schedule supplies no inputs.
    - cron: "15 11 * * *"
  workflow_dispatch:

# Each job declares the scopes it needs.
permissions:
  contents: read

concurrency:
  group: nightly-certification
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      platform_label: ${{ steps.stamp.outputs.platform_label }}
      server_sha: ${{ steps.server.outputs.server_sha }}
      server_image: ${{ steps.server.outputs.server_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=43"
      # The resolver reads other repositories' commits, check-runs, workflow runs and GHCR
      # packages. GITHUB_TOKEN cannot read another private repository or its packages, and its
      # 1,000 requests an hour does not cover 500 commits of check-runs, so this uses the release
      # token. An unset token stops the night here.
      # Every exact-candidate check refuses here except the protocol ledger, which protocol_ledger
      # produces for the server selected here; it re-runs the full check on the bound candidate.
      - name: Resolve the newest qualifying trunk candidate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASE_GH_TOKEN is required to read component repositories"; exit 1
          fi
          python tools/resolve_trunk_candidate.py --dry-run --max-commits 500 --protocol-ledger produce \
            --out-dir resolved-candidate
      - name: Stamp the next 2026.1-rc label
        id: stamp
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          # A failed or partial lock-history fetch refuses here; it never reads as "no locks yet".
          label="$(python tools/mint_nightly_lock.py --sync-from origin --history nightly-history \
            --stamp resolved-candidate/platform-manifest.yaml)"
          [ -n "$label" ]
          echo "platform_label=${label}" >> "$GITHUB_OUTPUT"
      # The server the night certifies is fixed here; protocol_ledger binds the ledger for exactly
      # this server and capacity soaks it in parallel.
      - name: Read the resolved server
        id: server
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import yaml
          manifest = yaml.safe_load(open("resolved-candidate/platform-manifest.yaml", encoding="utf-8"))
          server = manifest["components"]["honua-server"]
          image = str(server["image"])
          if "@sha256:" not in image or ":" in image.split("@", 1)[0].split("/", 1)[-1]:
              raise SystemExit(f"server image is not an immutable digest reference: {image}")
          print(f"server_sha={server['sha']}")
          print(f"server_image={image}")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolved-candidate
          path: |
            resolved-candidate/platform-manifest.yaml
            resolved-candidate/compatibility-matrix.yaml
          if-no-files-found: error

  # honua-release#386: the night produces the protocol-certification ledger for the candidate it
  # resolved. Catalog staging, every producer run, the honua-evidence aggregation and the binding
  # are this job's own outputs; nothing is hand-dispatched and no repository variable is read or
  # written. A producer that fails, is skipped, or reports another source sha leaves the ledger
  # unbound, and an unbound ledger never becomes a candidate ref, so neither DR nor the train runs.
  # Every producer receives NIGHTLY_DISPATCH_ID and echoes it with its own run identity in each
  # receipt; the bind refuses any cell whose run this job did not dispatch (R20/R21).
  protocol_ledger:
    needs: resolve
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write          # pushes refs/nightly-requirements/<sha> and refs/nightly-candidates/<sha>
    env:
      NIGHTLY_DISPATCH_ID: nightly-certification-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      candidate_ref: ${{ steps.bind.outputs.candidate_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: resolved-candidate
          path: ${{ runner.temp }}/resolved-candidate
      # The catalog's source_revisions become the candidate's own pins (server, SDKs at their
      # published sources, gRPC, MCP), its vendored contracts are read at those pins, and the
      # result is committed over this run's trunk commit: that commit is the ledger's
      # requirementsSourceRevision, and the trusted gate reads the denominator from it.
      - name: Stage the requirements catalog at the resolved candidate's pins
        id: stage
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          LABEL: ${{ needs.resolve.outputs.platform_label }}
        run: |
          set -euo pipefail
          cp "${RUNNER_TEMP}/resolved-candidate/platform-manifest.yaml" platform-manifest.yaml
          cp "${RUNNER_TEMP}/resolved-candidate/compatibility-matrix.yaml" compatibility-matrix.yaml
          python tools/convergence_rebind.py --nightly-stage --plan-output "${RUNNER_TEMP}/nightly-stage-plan.json"
          git add platform-manifest.yaml compatibility-matrix.yaml certification/sources \
            certification/protocol-certification-requirements.v1.json
          git -c user.name='Mike McDougall' -c user.email='mike@honua.io' \
            commit --allow-empty -m "chore: nightly certification requirements ${LABEL}"
          sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/nightly-requirements/${sha}"
          echo "requirements_revision=${sha}" >> "$GITHUB_OUTPUT"
      - name: Dispatch the protocol certification producers at the candidate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          python tools/nightly_receipts.py dispatch-protocol \
            --catalog certification/protocol-certification-requirements.v1.json \
            --manifest platform-manifest.yaml --dispatch-id "$NIGHTLY_DISPATCH_ID" \
            --out "${RUNNER_TEMP}/protocol-runs.json"
      - name: Wait for every producer; one that did not succeed refuses the night
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: python tools/nightly_receipts.py wait-protocol --runs "${RUNNER_TEMP}/protocol-runs.json" --timeout 14400
      # aggregate.yml harvests producer runs at the staged catalog's pins for exactly this
      # candidate and commits the ledger to honua-evidence trunk. Its Pages deploy job can park on
      # an environment, so the night waits for the aggregate job alone.
      - name: Aggregate tonight's producer runs into honua-evidence
        id: aggregate
        env:
          GH_TOKEN: ${{ secrets.HONUA_RELEASE_AUTOMATION_TOKEN }}
          REQUIREMENTS_REVISION: ${{ steps.stage.outputs.requirements_revision }}
        run: |
          set -euo pipefail
          since="$(date -u -d '-10 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          run_id="$(python tools/nightly_receipts.py dispatch-aggregate --repository honua-io/honua-evidence \
            --requirements-revision "$REQUIREMENTS_REVISION" --manifest platform-manifest.yaml)"
          echo "aggregation: https://github.com/honua-io/honua-evidence/actions/runs/${run_id}"
          python tools/nightly_receipts.py wait-job --repository honua-io/honua-evidence --run-id "$run_id" \
            --job aggregate --timeout 3600
          echo "since=${since}" >> "$GITHUB_OUTPUT"
      - name: Bind the verified ledger and re-check the exact candidate
        id: bind
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          REQUIREMENTS_REVISION: ${{ steps.stage.outputs.requirements_revision }}
          SINCE: ${{ steps.aggregate.outputs.since }}
          LABEL: ${{ needs.resolve.outputs.platform_label }}
          RESOLVED_SERVER_SHA: ${{ needs.resolve.outputs.server_sha }}
          RESOLVED_SERVER_IMAGE: ${{ needs.resolve.outputs.server_image }}
        run: |
          set -euo pipefail
          python tools/convergence_rebind.py --nightly-bind --requirements-revision "$REQUIREMENTS_REVISION" \
            --runs "${RUNNER_TEMP}/protocol-runs.json" --since "$SINCE" --dispatch-id "$NIGHTLY_DISPATCH_ID" \
            | tee "${RUNNER_TEMP}/protocol-ledger-binding.json"
          python tools/validate_platform.py --exact-candidate
          # The candidate is one data commit over this run's commit (candidate-input requires that
          # parent): the staged catalog and sources of the requirements commit plus the bound manifest.
          git add platform-manifest.yaml
          tree="$(git write-tree)"
          sha="$(GIT_AUTHOR_NAME='Mike McDougall' GIT_AUTHOR_EMAIL='mike@honua.io' \
            GIT_COMMITTER_NAME='Mike McDougall' GIT_COMMITTER_EMAIL='mike@honua.io' \
            git commit-tree "$tree" -p "$GITHUB_SHA" -m "chore: nightly candidate snapshot ${LABEL}")"
          # capacity soaked the resolved server in parallel: the bound candidate must be that server.
          python - <<'PY'
          import os, yaml
          server = yaml.safe_load(open("platform-manifest.yaml", encoding="utf-8"))["components"]["honua-server"]
          resolved = (os.environ["RESOLVED_SERVER_SHA"], os.environ["RESOLVED_SERVER_IMAGE"])
          if (server["sha"], str(server["image"])) != resolved:
              raise SystemExit(f"bound server {server['sha']} {server['image']} is not the resolved {resolved}")
          PY
          git push origin "${sha}:refs/nightly-candidates/${sha}"
          echo "candidate_ref=${sha}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: protocol-ledger
          path: |
            ${{ runner.temp }}/nightly-stage-plan.json
            ${{ runner.temp }}/protocol-runs.json
            ${{ runner.temp }}/protocol-ledger-binding.json
          if-no-files-found: warn

  # capacity soaks the resolved server image in parallel with protocol_ledger: it reads only the
  # server sha and image (fixed by resolve) and certification/capacity-envelope.v1.json at
  # lock_ref, which a candidate snapshot never changes (candidate-input admits manifest, matrix and
  # catalog data only), so this run's commit is the same envelope bytes.
  capacity:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      receipt_url: ${{ steps.receipt.outputs.receipt_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # honua-server's producer requires its workflow source, its checkout and candidate_sha to be
      # one commit, so it runs on refs/tags/nightly-candidate/<sha>. RELEASE_GH_TOKEN creates that
      # tag, dispatches the producer and reads its run and receipt in honua-server.
      - name: Dispatch the candidate capacity soak and keep its immutable receipt
        id: receipt
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          SERVER_SHA: ${{ needs.resolve.outputs.server_sha }}
          SERVER_IMAGE: ${{ needs.resolve.outputs.server_image }}
          LOCK_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          repo=honua-io/honua-server
          run_id="$(python tools/nightly_receipts.py dispatch-capacity --repository "$repo" \
            --candidate-sha "$SERVER_SHA" --candidate-image "$SERVER_IMAGE" --lock-ref "$LOCK_REF")"
          echo "capacity producer: https://github.com/${repo}/actions/runs/${run_id}"
          set +e
          python tools/nightly_receipts.py wait --repository "$repo" --run-id "$run_id" --timeout 20400
          wait_code=$?
          set -e
          [ "$wait_code" -eq 0 ] || [ "$wait_code" -eq 3 ]
          url="$(python tools/nightly_receipts.py capacity-url --repository "$repo" \
            --candidate-sha "$SERVER_SHA" --run-id "$run_id")"
          echo "receipt_url=${url}" >> "$GITHUB_OUTPUT"
          if [ "$wait_code" -ne 0 ]; then
            echo "::error::capacity producer ${run_id} did not succeed; the strict train records that receipt"
            exit 1
          fi

  # DR has a real data dependency on the bound ledger: the drill's receipt binds candidateLockDigest
  # to the candidate snapshot's platform-manifest.yaml bytes, which gate-dr re-hashes from the
  # train's frozen manifest, and those bytes include protocolCertification.ledger as bound. A drill
  # over the pre-bind manifest would carry a digest the train refuses.
  dr:
    needs: protocol_ledger
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write           # dispatches the drill here and downloads its receipt location
    outputs:
      receipt_url: ${{ steps.receipt.outputs.receipt_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # gate-dr accepts only receipts attested from refs/heads/trunk, so the drill runs on trunk.
      # candidate-input requires the snapshot to descend from reviewed trunk if trunk has moved.
      - name: Dispatch the candidate DR drill and keep its immutable receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_REF: ${{ needs.protocol_ledger.outputs.candidate_ref }}
          REVIEWED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          retry() { local delay; for delay in 0 10 30 60 120 60; do sleep "$delay"; "$@" && return 0; done; return 1; }
          repo="${GITHUB_REPOSITORY}"
          run_id="$(python tools/nightly_receipts.py dispatch-dr --repository "$repo" \
            --candidate-ref "$CANDIDATE_REF" --reviewed-sha "$REVIEWED_SHA")"
          echo "DR producer: https://github.com/${repo}/actions/runs/${run_id}"
          set +e
          python tools/nightly_receipts.py wait --repository "$repo" --run-id "$run_id" --timeout 10200
          wait_code=$?
          set -e
          [ "$wait_code" -eq 0 ] || [ "$wait_code" -eq 3 ]
          attempt="$(retry gh run view "$run_id" --repo "$repo" --json attempt --jq .attempt)"
          retry gh run download "$run_id" --repo "$repo" --name "dr-receipt-location-${run_id}-${attempt}" --dir dr-location
          url="$(python tools/nightly_receipts.py dr-url --location dr-location/receipt-location.json)"
          echo "receipt_url=${url}" >> "$GITHUB_OUTPUT"
          if [ "$wait_code" -ne 0 ]; then
            echo "::error::DR producer ${run_id} did not succeed; the strict train records that receipt"
            exit 1
          fi

  train:
    needs: [resolve, protocol_ledger, capacity, dr]
    # The train alone joins the ledger, capacity and DR; a failed producer that still published a
    # receipt is judged by the train. Cancelled nights stop.
    if: ${{ !cancelled() && needs.protocol_ledger.result == 'success' && needs.capacity.outputs.receipt_url != '' && needs.dr.outputs.receipt_url != '' }}
    # release-train's own top-level scopes; a called workflow cannot exceed its caller job.
    permissions:
      contents: read
      id-token: write
      packages: read
      checks: read
      actions: write
      attestations: write
    uses: ./.github/workflows/release-train.yml
    with:
      platform_label: ${{ needs.resolve.outputs.platform_label }}
      dry_run: false
      nightly: true
      candidate_ref: ${{ needs.protocol_ledger.outputs.candidate_ref }}
      capacity_receipt_url: ${{ needs.capacity.outputs.receipt_url }}
      dr_receipt_url: ${{ needs.dr.outputs.receipt_url }}
    secrets: inherit

  mint:
    needs: [resolve, train]
    if: ${{ !cancelled() && github.ref == 'refs/heads/trunk' && needs.train.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write          # pushes refs/tags/nightly-lock/<label>
      id-token: write          # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=43"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qualified-candidate
          path: certified
      # Every fixture gate of this run uploads the revisions it checked out (#231 WI-8). The mint
      # declares the lock's $.fixtures from them and refuses a missing record or a disagreement.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fixture-revisions-*
          path: fixture-revisions
      - name: Install cosign (Sigstore)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # A deleted lock tag would let the next night reuse its rc number. mint_nightly_lock.py signs
      # nothing unless an active tag ruleset forbids deleting and moving refs/tags/nightly-lock/*.
      - name: Read the rulesets that protect lock tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids="$(gh api "repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100" --jq '.[].id')"
          for id in $ids; do gh api "repos/${GITHUB_REPOSITORY}/rulesets/${id}"; done | jq -s . > rulesets.json
      - name: Mint and sign the next nightly lock, or mint nothing
        id: mint
        env:
          CERTIFICATE_IDENTITY: https://github.com/${{ github.workflow_ref }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_RUN: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # Every refusal (history, trunk/workflow identity, label, ruleset, channel tag) precedes cosign.
          python tools/mint_nightly_lock.py --sync-from origin --history nightly-history \
            --report certified/gate-report.json \
            --manifest certified/platform-manifest.yaml \
            --matrix certified/compatibility-matrix.yaml \
            --rulesets rulesets.json \
            --expected-source-sha "$EXPECTED_SHA" \
            --expected-run-id "$EXPECTED_RUN" \
            --fixture-revisions fixture-revisions \
            --lock certified/qualification-lock.json \
            --post-gate-references certified/post-gate-references.json \
            --notes-bundle certified/release-notes.bundle \
            --out-dir nightly-lock \
            --certificate-identity "$CERTIFICATE_IDENTITY" | tee mint.txt
          label="$(awk '/^MINTED: /{print $2}' mint.txt)"
          [ -n "$label" ]
          echo "label=${label}" >> "$GITHUB_OUTPUT"
          # Commit exactly the lock bundle, nothing else from this workspace.
          export GIT_INDEX_FILE="${RUNNER_TEMP}/nightly-lock.index"
          git --work-tree=nightly-lock add -A --force
          tree="$(git write-tree)"
          # Keep the notes and fetched package bundles reachable at their repo@rev paths.
          git fetch certified/release-notes.bundle HEAD
          notes_revision="$(cat certified/release-notes-revision.txt)"
          test "$(git rev-parse FETCH_HEAD)" = "$notes_revision"
          commit="$(GIT_AUTHOR_NAME='Mike McDougall' GIT_AUTHOR_EMAIL='mike@honua.io' \
            GIT_COMMITTER_NAME='Mike McDougall' GIT_COMMITTER_EMAIL='mike@honua.io' \
            git commit-tree "$tree" -p "$notes_revision" -m "chore: nightly lock ${label}")"
          git push origin "${commit}:refs/tags/nightly-lock/${label}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-lock-${{ steps.mint.outputs.label }}
          path: nightly-lock/
          if-no-files-found: error
      - name: Assemble the final certified candidate with the minted lock
        run: |
          set -euo pipefail
          mkdir final-certified
          cp -a certified/. final-certified/
          cp -a nightly-lock/. final-certified/
      - name: Upload the minted certified candidate consumed by promotion
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certified-candidate
          path: final-certified/
          if-no-files-found: error
      - name: Retain the build-test promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-build-test
          path: nightly-lock/promotion-receipts/build-test/receipt.json
          if-no-files-found: error
      - name: Retain the contract promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-contract
          path: nightly-lock/promotion-receipts/contract/receipt.json
          if-no-files-found: error
      - name: Retain the sbom promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-sbom
          path: nightly-lock/promotion-receipts/sbom/receipt.json
          if-no-files-found: error
      - name: Retain the security promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-security
          path: nightly-lock/promotion-receipts/security/receipt.json
          if-no-files-found: error
      - name: Retain the upgrade promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-upgrade
          path: nightly-lock/promotion-receipts/upgrade/receipt.json
          if-no-files-found: error
      - name: Retain the capacity-soak promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-capacity-soak
          path: nightly-lock/promotion-receipts/capacity-soak/receipt.json
          if-no-files-found: error
      - name: Retain the dr promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-dr
          path: nightly-lock/promotion-receipts/dr/receipt.json
          if-no-files-found: error
      - name: Retain the lambda-certification promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-lambda-certification
          path: nightly-lock/promotion-receipts/lambda-certification/receipt.json
          if-no-files-found: error
      - name: Retain the protocol-ledger promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-protocol-ledger
          path: nightly-lock/promotion-receipts/protocol-ledger/receipt.json
          if-no-files-found: error
      - name: Retain the deterministic-journey promotion receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: promotion-receipt-deterministic-journey
          path: nightly-lock/promotion-receipts/deterministic-journey/receipt.json
          if-no-files-found: error
      - name: Retain the nightly-model-journey promotion receipt
