name: Installed client certification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - platform-manifest.yaml
      - certification/installed-clients/**
      - .github/workflows/installed-client-certification.yml

permissions:
  contents: read

jobs:
  exact-published-clients:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r e2e/requirements.txt
      - name: Validate release inputs and install every published client
        env:
          EVIDENCE_URI: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python certification/installed-clients/run.py \
            --live \
            --evidence-uri "$EVIDENCE_URI" \
            --output artifacts/installed-client-certification.json || code=$?
          test "${code:-0}" = 1
          jq -e '.results | length == 3' artifacts/installed-client-certification.json
          jq -e '[.results[] | select(.target == "npm" or .target == "pypi") | .status] == ["pass", "pass"]' artifacts/installed-client-certification.json
          jq -e '.results[] | select(.target == "nuget") | .status == "fail"' artifacts/installed-client-certification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: installed-client-certification
          path: artifacts/installed-client-certification.json
