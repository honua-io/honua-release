# Phase A â€” local-docker cross-component seam tier. Cheap, per-PR, highest bug-catch-per-dollar.
# Runs the canonical scenarios against a REAL composed honua-server + DB (no mocks at the seam) and
# uploads the machine-readable gate-report.json that the release train's gate_e2e consumes.
#
# Honesty (AGENTS.md): the static gates (compose validity + scenario compile + the verdict-logic
# fixtures) ALWAYS run and can FAIL on a broken edit even before real images exist. Server-dependent
# scenarios report BLOCKED (not PASS) until platform-manifest.yaml carries real pins. A manual
# `require_real=true` run (or the release train) promotes BLOCKED/SKIPPED to FAIL so the gate can
# genuinely fail. AI proposes; the pipeline disposes.
#
# One thing require_real does NOT govern (honua-release#303): if the candidate stack never boots -
# unpullable image, or a container that exits before binding a port - Slice-1 FAILS on every
# trigger, PR included. A green check on a stack that never served a request is not an honest
# BLOCKED, it is a lie: there is no evidence to be green about.

name: e2e-local-docker

on:
  pull_request:
    paths:
      - "e2e/**"
      # bumping the pinned honua-site revision changes what S9 certifies, so re-run the gate for it
      - "certification/conformance-evidence.yaml"
      - "platform-manifest.yaml"
      - "compatibility-matrix.yaml"
      - ".github/workflows/e2e-local-docker.yml"
  workflow_dispatch:
    inputs:
      require_real:
        description: "Promote BLOCKED/SKIPPED to FAIL (run only when images+metrics are real)"
        type: boolean
        default: false
  # Nightly: run with require_real so BLOCKED/SKIPPED become hard failures (the honest gate).
  schedule:
    - cron: "0 7 * * *"
  # Callable by the release train (gate_e2e) as a reusable gate.
  workflow_call:
    inputs:
      candidate_ref: { required: false, type: string, default: "" }
      require_real:
        type: boolean
        default: false
    secrets:
      RELEASE_GH_TOKEN:
        required: false

permissions:
  contents: read
  packages: read          # pull the pinned honua-server image from ghcr for the Slice-1 harness

concurrency:
  group: e2e-local-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Toolchains for the SDK probes. They are present so that, once the SDK pins are real, the
      # probes actually install + run; while pins are placeholders the probes self-report SKIP.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Install runner deps
        run: python -m pip install -r e2e/requirements.txt pytest

      # The checkout refs come from components.*.sha in this commit's manifest, so they cannot drift
      # from it. Only a full 40-hex sha and a plain version are accepted: no branch or tag injection.
      - name: Read the SDK seam pins from the manifest
        id: pins
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import yaml
          components = yaml.safe_load(open("platform-manifest.yaml"))["components"]
          for key, name in (("js", "honua-sdk-js"), ("python", "honua-sdk-python"), ("dotnet", "honua-sdk-dotnet")):
              sha, version = str(components[name].get("sha") or ""), str(components[name].get("version") or "")
              if not re.fullmatch(r"[0-9a-f]{40}", sha) or not re.fullmatch(r"[0-9A-Za-z.+-]+", version):
                  raise SystemExit(f"{name}: manifest pin {sha!r} / {version!r} is not an immutable sha and version")
              print(f"{key}_sha={sha}")
              print(f"{key}_version={version}")
          PY

      - name: Check out the pinned Python SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-sdk-python
          ref: ${{ steps.pins.outputs.python_sha }}
          path: _e2e-sdk-python
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

      - name: Check out the pinned .NET SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-sdk-dotnet
          ref: ${{ steps.pins.outputs.dotnet_sha }}
          path: _e2e-sdk-dotnet
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

      # release#231 WI-8: record the fixture revision git reports for each checkout, for the lock's
      # $.fixtures. Recording never changes this gate's verdict; a missing record refuses the mint.
      - name: Record the fixture revisions this job checked out
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python "$GITHUB_WORKSPACE/tools/fixture_revisions.py" emit --gate e2e-local-docker --job seam
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --out "$RUNNER_TEMP/fixture-revisions/fixture-revisions.json"
          "honua-io/honua-sdk-python=_e2e-sdk-python" "honua-io/honua-sdk-dotnet=_e2e-sdk-dotnet"
      - name: Upload the fixture revision record
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-revisions-e2e-local-docker-seam
          path: ${{ runner.temp }}/fixture-revisions/fixture-revisions.json
          if-no-files-found: error
          overwrite: true

      - name: Install the frozen SDK artifacts for the seam probes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          JS_VERSION: ${{ steps.pins.outputs.js_version }}
          DOTNET_VERSION: ${{ steps.pins.outputs.dotnet_version }}
        run: |
          set -euo pipefail
          npm install --prefix e2e --no-save --registry https://registry.npmjs.org "@honua/sdk-js@$JS_VERSION"
          python -m pip install ./_e2e-sdk-python/packages/honua-sdk
          WORK="$RUNNER_TEMP/e2e-dotnet-sdk"
          mkdir -p "$WORK/feed"
          dotnet nuget update source github-honua -u honua -p "$GH_TOKEN" \
            --store-password-in-clear-text --configfile _e2e-sdk-dotnet/NuGet.config
          dotnet pack _e2e-sdk-dotnet -c Release -o "$WORK/feed"
          dotnet add e2e/scenarios/geoservices_error_surfacing/probes/dotnet/Probe.csproj \
            package Honua.Sdk.GeoServices --version "$DOTNET_VERSION" --source "$WORK/feed"

      # Static gates â€” always run, can FAIL with no images (broken compose / scenario syntax).
      - name: Static checks (compose + scenario compile)
        working-directory: e2e
        run: make check

      # Unit-test the runner's verdict logic + parsers â€” an untested gate can stop gating silently.
      - name: Unit-test the runner
        working-directory: e2e
        run: make test

      # Run the seam scenarios. Docker is preinstalled on ubuntu-latest runners.
      - name: Run seam scenarios
        working-directory: e2e
        env:
          # require_real comes from the trigger; defaults to false for honest per-PR runs.
          E2E_REQUIRE_REAL: ${{ (inputs.require_real || github.event.inputs.require_real) && '1' || '' }}
        run: python run.py

      - name: Upload gate-report.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-docker-gate-report
          path: e2e/gate-report.json
          if-no-files-found: warn

  # â”€â”€ Slice 1 â€” zero-cloud-spend local-docker job: boot a REAL honua-server + PostGIS + Redis and
  #    drive MCP, AI Studio, GP, three-protocol parity, and per-format coverage against it. Cheap,
  #    PR-runnable. Nightly / release-train runs set require_real so BLOCKED becomes a hard FAIL.
  slice1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Static gates first â€” these ALWAYS run and can FAIL on a broken edit even with no image
      # (compose validity, shell syntax, python compile, manifest-snapshot validity).
      - name: Static checks
        run: bash e2e/harness/run_all.sh check

      # S4 boots its own stack (compose.console-s4.yml: Keycloak + a server whose public base URL is
      # the Console origin) inside the S4 stage, so its compose and the realm renderer are checked
      # here too. The values are placeholders: the driver mints the real ones per run.
      - name: Static checks (S4 Console topology)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          S4_IDP_HOSTNAME=host.docker.internal S4_CONSOLE_ORIGIN=http://127.0.0.1:5176 \
            S4_CLIENT_SECRET=static-check S4_OPERATOR_USER=alice S4_OPERATOR_PASSWORD=static-check \
            bash e2e/harness/keycloak/render.sh "$tmp"
          jq -e '.clients[0].redirectUris == ["http://127.0.0.1:5176/admin/auth/callback"]
                 and .clients[0].attributes["pkce.code.challenge.method"] == "S256"
                 and .accessTokenLifespan >= 7200' "$tmp/import/honua-realm.json" >/dev/null
          openssl x509 -in "$tmp/certs/kc.crt" -noout -ext subjectAltName \
            | grep -q 'DNS:host.docker.internal, DNS:localhost, IP Address:127.0.0.1'
          HONUA_SERVER_IMAGE=static-check S4_RUN_DIR="$tmp" S4_IDP_ADMIN_PASSWORD=x S4_ADMIN_KEY=x \
            S4_MASTER_KEY=x S4_CLIENT_SECRET=x S4_OPERATOR_BEARER_KEY=x \
            docker compose -f e2e/harness/compose.console-s4.yml config >/dev/null
          rm -rf "$tmp"
          echo "S4 topology: OK"

      # Pull the pinned server image from ghcr (packages:read). If this can't authenticate the image
      # never boots, and per honua-release#303 that FAILS the job rather than reporting a green
      # check over 13 identical BLOCKED rows.
      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # Tool setup runs BEFORE any external checkout, deliberately: a cache-writing step should not
      # follow another repository's code onto the disk. The driver shells out to `dotnet` and
      # `npx playwright` and reports BLOCKED when either is absent, so both toolchains must exist.
      #
      # The Console checkout is executed host-side by S4, so a dynamically selected ref would let
      # that code inherit the default-branch runner's cache capability. Keep the executable ref a
      # review-visible literal. The resolver below compares it with platform-manifest.yaml and fails
      # closed on drift, preserving the manifest as the release source of truth while preventing an
      # unreviewed revision from reaching npm or MSBuild.
      - name: Set up .NET (console live suite)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Set up Node (console live suite)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # S4-console-studio drives a real honua-console checkout and reported
      # `BLOCKED: E2E_CONSOLE_DIR not set / not a honua-console checkout` on every run, because
      # nothing ever checked honua-console out. On a real cut require_real promotes that BLOCKED to
      # FAIL, so the scenario could never pass. Check it out at the sha the candidate manifest pins
      # - not its default branch - so the console driven here is the one this release ships.
      - name: Resolve the pinned honua-console revision
        run: |
          set -euo pipefail
          TRUSTED_SHA="c652ef22612d83277f8d39384be61411915dda1d"
          # awk, not PyYAML: this job installs no python packages, and boot.sh already reads the
          # manifest exactly this way for the server image. Keeping one idiom avoids adding a
          # dependency to a job whose whole purpose is to boot a container.
          SHA="$(awk '
            $0 ~ /^  honua-console:/ {inblk=1; next}
            inblk && $0 ~ /^  [a-zA-Z]/ {inblk=0}
            inblk && $1=="sha:" {gsub(/"/,"",$2); print $2; exit}
          ' platform-manifest.yaml)"
          if [ "$SHA" != "$TRUSTED_SHA" ]; then
            echo "::error::platform-manifest honua-console sha $SHA does not match reviewed workflow pin $TRUSTED_SHA"
            exit 1
          fi
          echo "pinned honua-console: ${SHA:-<unpinned>}"

      - name: Check out the pinned honua-console
        id: console
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-console
          # Static by design: host-executed code must be review-visible; resolver above enforces manifest equality.
          ref: c652ef22612d83277f8d39384be61411915dda1d
          path: _console

      # S9-demos drives the five honua-site demos against the seeded candidate. The demos ARE the
      # thing under test, so they are checked out at a PINNED sha, never a floating branch: evidence
      # taken from a moving ref attests demos that may already have changed, and makes the scenario
      # non-reproducible across re-runs of the same train. The pin lives beside the esri evidence
      # producer in certification/conformance-evidence.yaml (see the rationale there and
      # honua-release#136).
      - name: Resolve the pinned honua-site revision
        run: |
          set -euo pipefail
          TRUSTED_SHA="0db19d7e6e5826fd885fb8f9c21c1798077c9b71"
          # awk, not PyYAML: this job installs no python packages, and the console/server pins are
          # already read exactly this way. One idiom, no new dependency.
          SHA="$(awk '
            $0 ~ /^demos:/ {inblk=1; next}
            inblk && $0 ~ /^[a-zA-Z]/ {inblk=0}
            inblk && $1=="sourceRef:" {print $2; exit}
          ' certification/conformance-evidence.yaml)"
          if [ "$SHA" != "$TRUSTED_SHA" ]; then
            echo "::error::conformance-evidence demos sourceRef $SHA does not match reviewed workflow pin $TRUSTED_SHA"
            exit 1
          fi
          echo "pinned honua-site: ${SHA:-<unpinned>}"

      # When the checkout fails, or the pinned revision predates the backend-override shim, the
      # driver reports its own honest BLOCKED naming the missing piece â€” and require_real promotes
      # that to FAIL. An unpinned ref is left EMPTY on purpose so the checkout fails loudly rather
      # than silently falling back to a branch.
      - name: Check out the pinned honua-site (S9 demos)
        id: site
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-site
          ref: 0db19d7e6e5826fd885fb8f9c21c1798077c9b71
          path: _site

      # release#231 WI-8: record the fixture revision git reports for each checkout, for the lock's
      # $.fixtures. Recording never changes this gate's verdict; a missing record refuses the mint.
      - name: Record the fixture revisions this job checked out
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python "$GITHUB_WORKSPACE/tools/fixture_revisions.py" emit --gate e2e-local-docker --job slice1
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --out "$RUNNER_TEMP/fixture-revisions/fixture-revisions.json"
          "honua-io/honua-console=_console" "honua-io/honua-site=_site"
      - name: Upload the fixture revision record
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-revisions-e2e-local-docker-slice1
          path: ${{ runner.temp }}/fixture-revisions/fixture-revisions.json
          if-no-files-found: error
          overwrite: true

      - name: Authenticate and restore the pinned honua-console
        if: steps.console.outcome == 'success'
        env:
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # Authenticate the GitHub Packages feed only when the pinned Console declares it. From
          # c652ef22 the Console restores Honua.Sdk from nuget.org alone, and `update source` on an
          # undeclared source crashes ("Object reference not set to an instance of an object").
          # The restore below still runs either way and fails on any unresolvable package.
          if grep -q 'key="github-honua"' _console/NuGet.config; then
            dotnet nuget update source github-honua \
              --username "${GITHUB_ACTOR}" \
              --password "${RELEASE_GH_TOKEN}" \
              --store-password-in-clear-text \
              --valid-authentication-types basic \
              --configfile _console/NuGet.config
          fi
          dotnet restore _console/src/Honua.Console.Web/Honua.Console.Web.csproj \
            --configfile _console/NuGet.config \
            --nologo
      # S4 is the one driver that boots a stack of its own: e2e/drivers/console/run.sh brings up
      # compose.console-s4.yml (IdP on host.docker.internal:8443, server on 127.0.0.1:8088, Console
      # on 127.0.0.1:5176) for its stage and tears it down before the next driver runs.
      - name: Run Slice-1 harness (boot -> seed -> drivers -> gate-report.json)
        env:
          # nightly (schedule) hardens the gate by promoting SCENARIO-level BLOCKED to FAIL; PRs run
          # honest (a scenario blocked on a missing dep is tolerated). A stack that never boots
          # fails on every trigger regardless of this input - see lib/report.sh.
          E2E_REQUIRE_REAL: ${{ (inputs.require_real || github.event.inputs.require_real || github.event_name == 'schedule') && '1' || '' }}
          # Left EMPTY when the checkout failed, so the driver reports its own honest BLOCKED
          # instead of pointing at a directory that is not a console checkout.
          E2E_CONSOLE_DIR: ${{ steps.console.outcome == 'success' && format('{0}/_console', github.workspace) || '' }}
          # Pin the driver's console-sha note to what we actually checked out, so a failure message
          # never cites a different revision than the one under test.
          E2E_CONSOLE_SHA: c652ef22612d83277f8d39384be61411915dda1d
          # Left EMPTY when the checkout failed, so the demos driver reports its own honest BLOCKED.
          E2E_SITE_DIR: ${{ steps.site.outcome == 'success' && format('{0}/_site', github.workspace) || '' }}
          # Quoted back in the driver's BLOCKED message so a failure never cites a different
          # revision than the one under test.
          E2E_SITE_SHA: 0db19d7e6e5826fd885fb8f9c21c1798077c9b71
        run: bash e2e/harness/run_all.sh run

      - name: Format + protocol coverage summary
        if: always()
        run: |
          set -e
          f=e2e/gate-report.json
          [ -f "$f" ] || { echo "no gate-report"; exit 0; }
          {
            echo "## e2e Slice-1 â€” $(jq -r .status "$f")";
            if [ "$(jq -r '.boot.failed' "$f")" = "true" ]; then
              echo "";
              echo "**the candidate stack did not boot** â€” reason \`$(jq -r '.boot.reason' "$f")\`, container exit code \`$(jq -r '.boot.exitCode // "unknown"' "$f")\`. This fails the gate on every trigger; \`require_real\` only governs scenario-level BLOCKED.";
            fi
            echo ""; echo "### scenarios"; echo "| scenario | status |"; echo "|---|---|";
            jq -r '.scenarios[] | "| \(.scenario) | \(.status) |"' "$f";
            echo ""; echo "### formatCoverage[]"; echo "| format | read | write | roundtrip | notes |"; echo "|---|---|---|---|---|";
            jq -r '.formatCoverage[] | "| \(.format) | \(.read) | \(.write) | \(.roundtrip) | \(.notes) |"' "$f";
            echo ""; echo "### protocolCoverage[]"; echo "| protocol | operation | status |"; echo "|---|---|---|";
            jq -r '.protocolCoverage[] | "| \(.protocol) | \(.operation) | \(.status) |"' "$f";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Slice-1 gate-report.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-slice1-gate-report
          path: e2e/gate-report.json
          if-no-files-found: warn

      # S4's failure message is `see .../e2e/out/console-live.log`, but that file was never uploaded,
      # so a red S4 was undebuggable from CI. Upload the Playwright log plus the traces/screenshots
      # the driver now writes under e2e/out/console-playwright. Kept as its OWN artifact, deliberately
      # scoped to those two paths: the release train consumes `e2e-slice1-gate-report` and must not
      # have to download a Playwright trace bundle to read one JSON file.
      - name: Upload S4 console live-suite log + Playwright traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-slice1-console-live
          path: |
            e2e/out/console-live.log
            e2e/out/console-playwright-results.json
            e2e/out/console-s4-stack.log
            e2e/out/console-playwright/**
          if-no-files-found: ignore
          retention-days: 14

  # Slice 1, Redis-off topology. The same candidate image and drivers as slice1, booted with
  # e2e/harness/compose.no-redis.yml (the harness copy of honua-server's docker-compose.no-redis.yml):
  # no redis service and no ConnectionStrings__Redis. Under the 2026.1 topology ruling a Redis-off
  # server serves, configures and styles/renders, and refuses durable jobs, Studio drafts, proposals
  # and approvals with typed `unavailable` errors. Drivers assert those refusals when E2E_REDIS=off;
  # any other failure, and a stack that never boots, fails this job on every trigger exactly as in
  # slice1. require_real has the same meaning here. This is the local cell for the Redis-off GA cells
  # of the cloud journey, so a topology regression is caught before an AWS run.
  slice1-redis-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Static checks
        run: bash e2e/harness/run_all.sh check

      - name: Log in to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Slice-1 harness on the Redis-off topology
        env:
          E2E_REDIS: "off"
          E2E_REQUIRE_REAL: ${{ (inputs.require_real || github.event.inputs.require_real || github.event_name == 'schedule') && '1' || '' }}
        run: bash e2e/harness/run_all.sh run

      - name: Redis-off scenario summary
        if: always()
        run: |
          set -e
          f=e2e/gate-report.json
          [ -f "$f" ] || { echo "no gate-report"; exit 0; }
          {
            echo "## e2e Slice-1 Redis-off ($(jq -r '.topology // "unknown"' "$f")) - $(jq -r .status "$f")";
            echo ""; echo "| scenario | status | why |"; echo "|---|---|---|";
            jq -r '.scenarios[] | "| \(.scenario) | \(.status) | \((.why // "") | gsub("\\|"; "/") | .[0:200]) |"' "$f";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Slice-1 Redis-off gate-report.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-slice1-redis-off-gate-report
          path: e2e/gate-report.json
          if-no-files-found: warn
