# Phase A — local-docker cross-component seam tier. Cheap, per-PR, highest bug-catch-per-dollar.
# Runs the canonical scenarios against a REAL composed honua-server + DB (no mocks at the seam) and
# uploads the machine-readable gate-report.json that the release train's gate_e2e consumes.
#
# Honesty (AGENTS.md): the static gates (compose validity + scenario compile) ALWAYS run and can FAIL
# on a broken edit even before real images exist. Server-dependent scenarios report BLOCKED (not PASS)
# until platform-manifest.yaml carries real pins. A manual `require_real=true` run (or the release
# train) promotes BLOCKED/SKIPPED to FAIL so the gate can genuinely fail. AI proposes; the pipeline
# disposes.

name: e2e-local-docker

on:
  pull_request:
    paths:
      - "e2e/**"
      - "platform-manifest.yaml"
      - "compatibility-matrix.yaml"
      - ".github/workflows/e2e-local-docker.yml"
  workflow_dispatch:
    inputs:
      require_real:
        description: "Promote BLOCKED/SKIPPED to FAIL (run only when images+metrics are real)"
        type: boolean
        default: false
  # Nightly: run with require_real so BLOCKED/SKIPPED become hard failures (the honest gate).
  schedule:
    - cron: "0 7 * * *"
  # Callable by the release train (gate_e2e) as a reusable gate.
  workflow_call:
    inputs:
      require_real:
        type: boolean
        default: false

permissions:
  contents: read
  packages: read          # pull the pinned honua-server image from ghcr for the Slice-1 harness

concurrency:
  group: e2e-local-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Toolchains for the SDK probes. They are present so that, once the SDK pins are real, the
      # probes actually install + run; while pins are placeholders the probes self-report SKIP.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Install runner deps
        run: python -m pip install -r e2e/requirements.txt pytest

      # Static gates — always run, can FAIL with no images (broken compose / scenario syntax).
      - name: Static checks (compose + scenario compile)
        working-directory: e2e
        run: make check

      # Unit-test the runner's verdict logic + parsers — an untested gate can stop gating silently.
      - name: Unit-test the runner
        working-directory: e2e
        run: make test

      # Run the seam scenarios. Docker is preinstalled on ubuntu-latest runners.
      - name: Run seam scenarios
        working-directory: e2e
        env:
          # require_real comes from the trigger; defaults to false for honest per-PR runs.
          E2E_REQUIRE_REAL: ${{ (inputs.require_real || github.event.inputs.require_real) && '1' || '' }}
        run: python run.py

      - name: Upload gate-report.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-local-docker-gate-report
          path: e2e/gate-report.json
          if-no-files-found: warn

  # ── Slice 1 — zero-cloud-spend local-docker job: boot a REAL honua-server + PostGIS + Redis and
  #    drive MCP, AI Studio, GP, three-protocol parity, and per-format coverage against it. Cheap,
  #    PR-runnable. Nightly / release-train runs set require_real so BLOCKED becomes a hard FAIL.
  slice1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # Static gates first — these ALWAYS run and can FAIL on a broken edit even with no image
      # (compose validity, shell syntax, python compile, manifest-snapshot validity).
      - name: Static checks
        run: bash e2e/harness/run_all.sh check

      # Pull the pinned server image from ghcr (packages:read). If this can't authenticate, boot.sh
      # degrades to BLOCKED (honest) rather than failing the cheap PR tier.
      - name: Log in to ghcr
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Slice-1 harness (boot -> seed -> drivers -> gate-report.json)
        env:
          # nightly (schedule) hardens the gate; PRs run honest (blocked tolerated).
          E2E_REQUIRE_REAL: ${{ (inputs.require_real || github.event.inputs.require_real || github.event_name == 'schedule') && '1' || '' }}
        run: bash e2e/harness/run_all.sh run

      - name: Format + protocol coverage summary
        if: always()
        run: |
          set -e
          f=e2e/gate-report.json
          [ -f "$f" ] || { echo "no gate-report"; exit 0; }
          {
            echo "## e2e Slice-1 — $(jq -r .status "$f")";
            echo ""; echo "### scenarios"; echo "| scenario | status |"; echo "|---|---|";
            jq -r '.scenarios[] | "| \(.scenario) | \(.status) |"' "$f";
            echo ""; echo "### formatCoverage[]"; echo "| format | read | write | roundtrip | notes |"; echo "|---|---|---|---|---|";
            jq -r '.formatCoverage[] | "| \(.format) | \(.read) | \(.write) | \(.roundtrip) | \(.notes) |"' "$f";
            echo ""; echo "### protocolCoverage[]"; echo "| protocol | operation | status |"; echo "|---|---|---|";
            jq -r '.protocolCoverage[] | "| \(.protocol) | \(.operation) | \(.status) |"' "$f";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Slice-1 gate-report.json
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-slice1-gate-report
          path: e2e/gate-report.json
          if-no-files-found: warn
