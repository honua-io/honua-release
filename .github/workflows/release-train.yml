# Release train — the single trigger surface for cutting a platform release candidate.
# Both humans and AI use this one workflow_dispatch (AI via the GitHub App / MCP).
#
# State: EVERY gate (a-i), plus `gate_evidence` (honua-release#60, evidence lineage/freshness — proves
# the honua-evidence capability matrix backing #59's capability-key docs claims is about this
# candidate's pinned honua-server sha and isn't stale), is wired as a reusable (workflow_call) job with
# a real, fail-able body — the same code as their per-PR CI, so there is no drift between "what CI
# checks" and "what the train checks." Gates whose deeper cert needs infra/creds not present in a local
# cut (cloud cert, upgrade kind-smoke, sbom image scan, security image scan) report `blocked`/`skipped`
# HONESTLY (never a fake green) and are promoted to a hard FAIL on a real cut / once their secrets are
# wired.
#
# Honesty (AGENTS.md): a gate that can't fail is worse than no gate. Every gate here can fail. On a real
# cut (dry_run=false) the consume/sbom/security/upgrade gates run `strict` and e2e/cloud run
# `require_real`, so a BLOCKED/unpublished artifact is a real red instead of a tolerated bootstrap state.
# The cloud cert tier SELF-SKIPS (status: skipped, why: cloud-creds-unset) when OIDC creds are unset so a
# no-cloud cut is not reddened; promote's allowed-skip list governs which skips may still be released.
# AI proposes; this pipeline disposes.

name: release-train
run-name: "release-train ${{ inputs.platform_label }} (dry_run=${{ inputs.dry_run }})"

on:
  workflow_dispatch:
    inputs:
      platform_label: { description: "e.g. 2026.1-rc.1", required: true, type: string }
      dry_run:        { description: "validate only, do not tag/publish", required: false, type: boolean, default: true }

concurrency:
  group: release-train          # never two cuts at once
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write               # OIDC for keyless signing / cloud auth (no static creds)
  packages: read                # pull staging images / OCI charts in the artifact-consume gate
  checks: read                  # gate-build-test reads each pinned component's check-runs (subset guard)
  actions: write                # e2e-cloud-aws dispatches the honua-iac cloud harness (iac-live wrapper)

jobs:
  freeze:                       # snapshot -> candidate manifest (the pinned set the gates certify)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0"
      # A train cut freezes a candidate manifest. Phase 2 will regenerate it by snapshotting each
      # component's current green main SHA; today (Phase 0/1) the committed platform-manifest.yaml IS
      # the candidate snapshot, so freeze VALIDATES it (structure + coherence via validate_platform.py)
      # and publishes it as the run's `candidate-manifest` artifact the downstream gates certify. This
      # is a real, fail-able step (a malformed/incoherent manifest stops the train here), not an echo.
      - name: Validate + publish the candidate manifest
        run: |
          set -euo pipefail
          python tools/validate_platform.py
          echo "candidate platform_label (input): ${{ inputs.platform_label }}"
          echo "manifest platformRelease: $(python -c "import yaml;print(yaml.safe_load(open('platform-manifest.yaml')).get('platformRelease'))")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-manifest
          path: |
            platform-manifest.yaml
            compatibility-matrix.yaml

  # ── REAL gates (wired to the reusable workflows that also run in per-PR CI) ──────────────────

  gate_manifest:               # Phase 0 source-of-truth: validate manifest + matrix, enforce drift
    needs: freeze
    uses: ./.github/workflows/manifest-validate.yml
    # A train cut is a fresh full snapshot, not a diff, so no drift baseline is passed here
    # (structure + coherence still run, and fail on an incoherent pinned set).

  gate_build_test:             # a) per-repo full suites — confirm each pinned SHA's CI is green (consume continuous-green)
    needs: freeze
    uses: ./.github/workflows/gate-build-test.yml
    with:
      # dry-run tolerates a not-yet-built (blocked) pin; a real cut demands every component green.
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit

  gate_artifact_consume:       # d) install/consume published artifacts (closes sdk-js#310, iac#81, grpc#45)
    needs: freeze
    uses: ./.github/workflows/gate-artifact-consume.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      # dry-run cut tolerates not-yet-published artifacts (bootstrap); a real cut demands them (strict).
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit            # passes RELEASE_GH_TOKEN for the LOCAL-build fallback / staging auth

  gate_e2e:                    # cross-component seam scenarios on local-docker (Phase A; #7)
    needs: [gate_manifest, gate_artifact_consume]
    uses: ./.github/workflows/e2e-local-docker.yml
    with:
      # a real cut promotes BLOCKED/SKIPPED to FAIL so the seam tier can genuinely fail the train.
      require_real: ${{ !inputs.dry_run }}
    secrets: inherit           # RELEASE_GH_TOKEN for the private frozen-SDK source checkouts

  # Produce the local half of D9.3 independently from AWS. This job never asks
  # for cloud receipts, and it is deliberately not the final verdict: the strict
  # aggregate below joins its current-run artifact to the current-run AWS artifact.
  gate_ai_delivery_arc_local_producer:
    needs: [gate_manifest, gate_artifact_consume]
    uses: ./.github/workflows/e2e-ai-delivery-arc-local.yml
    with:
      require_real: ${{ !inputs.dry_run }}
    secrets: inherit

  gate_cloud_parity:           # e) Slice-2 cloud CERT — wraps honua-iac terraform-manual-validation (run_live)
    needs: gate_e2e            #    + asserts MCP/Studio/GP/demo scenarios. Self-skips (cloud-creds-unset).
    uses: ./.github/workflows/e2e-cloud-aws.yml
    with:
      # a real cut promotes BLOCKED (infra half-wired) / parity divergence / not-certified scenarios to
      # FAIL. When cloud/OIDC creds are unset the whole tier SELF-SKIPS (status: skipped) so a local cut
      # is not reddened — but it is ready to enforce per-RC once HONUA_AWS_ROLE_ARN is wired.
      require_real: ${{ !inputs.dry_run }}
    secrets: inherit            # RELEASE_GH_TOKEN for the honua-iac dispatch wrapper + cross-repo checkout

  # D9.3 final verdict. Reusable-workflow artifacts belong to this caller run,
  # so the exact named downloads below cannot consume a prior/nightly execution.
  # `always()` makes missing/failed producer output a parsed red instead of
  # skipping the aggregate after a prerequisite failure.
  gate_ai_delivery_arc:
    needs: [gate_ai_delivery_arc_local_producer, gate_cloud_parity]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.status.outputs.overall_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install aggregate checker dependencies
        run: python -m pip install pyyaml

      - name: Resolve the reviewed sdk-js checker pin
        run: |
          set -euo pipefail
          TRUSTED_SHA="5950d762010cee8f1d0dfe4340c3abe85b16db1a"
          SHA="$(python - <<'PY'
          import yaml
          print(yaml.safe_load(open("platform-manifest.yaml", encoding="utf-8"))["components"]["honua-sdk-js"]["sha"])
          PY
          )"
          if [ "$SHA" != "$TRUSTED_SHA" ]; then
            echo "::error::platform-manifest sdk-js sha $SHA does not match reviewed aggregate pin $TRUSTED_SHA"
            exit 1
          fi

      - name: Check out the manifest-pinned SDK contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-sdk-js
          ref: 5950d762010cee8f1d0dfe4340c3abe85b16db1a
          path: _sdk-js
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

      - name: Download this run's local producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ai-delivery-arc-local-producer
          path: producer-inputs/local
        continue-on-error: true

      - name: Download this run's certifying AWS ECS producer artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Redis-off is the canonical D9.3 receipt. cloud-parity separately
          # requires both ECS cache modes plus the other four target cells.
          name: aws-ecs-ai-delivery-arc-redis-off
          path: producer-inputs/aws
        continue-on-error: true

      - name: Validate the contract on a dry run
        if: inputs.dry_run
        run: |
          python tools/check_ai_delivery_arc.py \
            --manifest platform-manifest.yaml \
            --contract certification/ai-delivery-arc.yaml \
            --sdk-root _sdk-js \
            --mode contract \
            --sdk-receipt producer-inputs/local/sdk-zero-to-map-receipt.json \
            --json-out e2e/out/ai-delivery-arc-gate-report.json

      - name: Join local + AWS receipts and enforce the live arc
        if: ${{ !inputs.dry_run }}
        run: |
          python tools/check_ai_delivery_arc.py \
            --manifest platform-manifest.yaml \
            --contract certification/ai-delivery-arc.yaml \
            --sdk-root _sdk-js \
            --mode live \
            --sdk-receipt producer-inputs/local/ai-delivery-arc-local/sdk-journey.json \
            --target-sdk-receipt aws-ecs=producer-inputs/aws/sdk-journey.json \
            --external-receipt aws-ecs-provision=producer-inputs/aws/aws-ecs-provision-receipt.json \
            --external-evidence aws-ecs-provision=producer-inputs/aws/final-evidence.json \
            --external-receipt aws-ecs-ai-delivery-arc=producer-inputs/aws/aws-ecs-ai-delivery-arc-receipt.json \
            --external-evidence aws-ecs-ai-delivery-arc=producer-inputs/aws/final-evidence.json \
            --external-receipt aws-ecs-real-model-ai-arc=producer-inputs/aws/real-model-receipt.json \
            --external-evidence aws-ecs-real-model-ai-arc=producer-inputs/aws/real-model-evidence.json \
            --external-receipt local-docker-real-model-ai-arc=producer-inputs/local/ai-delivery-arc-local/real-model-receipt.json \
            --external-evidence local-docker-real-model-ai-arc=producer-inputs/local/ai-delivery-arc-local/real-model-evidence.json \
            --json-out e2e/out/ai-delivery-arc-gate-report.json \
            --require-real

      - name: Record the aggregate status
        id: status
        if: always()
        run: |
          set -euo pipefail
          STATUS=fail
          if [ -f e2e/out/ai-delivery-arc-gate-report.json ]; then
            STATUS="$(jq -r '.status // "fail"' e2e/out/ai-delivery-arc-gate-report.json)"
          fi
          case "$STATUS" in pass|fail|blocked) ;; *) STATUS=fail ;; esac
          echo "overall_status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Upload the aggregate delivery-arc report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-delivery-arc-gate-report
          path: e2e/out/ai-delivery-arc-gate-report.json
          if-no-files-found: warn

  gate_conformance:            # c) cross-repo conformance (real, not false-pass; closes mcp#25, esri-compat#25)
    needs: [gate_build_test, gate_contract]
    uses: ./.github/workflows/certification.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      # dry-run tolerates no-candidate-server BLOCKED; a real cut demands a pass (strict).
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit

  gate_security:               # e) Trivy image + repo scan (vuln/secret/license/IaC). Phase 3.
    needs: freeze
    uses: ./.github/workflows/gate-security.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit

  gate_contract:               # b) proto breaking-change via buf (REST/SDK-API diff blocked). Phase 2.
    needs: freeze
    uses: ./.github/workflows/gate-contract.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit

  gate_sbom:                   # f) SBOM per candidate artifact + aggregated platform BOM (CycloneDX/SPDX). PLAN §6.
    needs: freeze
    uses: ./.github/workflows/gate-sbom.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit

  # ── later-phase gates (real bodies; blocked/skip honestly until their infra/creds land) ──────────

  gate_observability:          # g) SLO incl. GeoServices in-band error metric (server#2243/devops#113). Issue #5.
    needs: gate_e2e
    uses: ./.github/workflows/gate-observability.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit            # RELEASE_GH_TOKEN for the cross-repo metric-contract checkout

  gate_docs:                   # h) advertised-vs-actual + advertised-GA ⊆ evidenced-GA (#59). Phase 3.
    needs: gate_conformance
    uses: ./.github/workflows/gate-docs.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}

  gate_upgrade:                # i) prior-release -> candidate: compat-matrix + forward-schema + kind install/upgrade/rollback smoke
    needs: gate_e2e
    uses: ./.github/workflows/gate-upgrade.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}
    secrets: inherit

  gate_evidence:                # evidence lineage/freshness (#60): the honua-evidence capability
                                 # matrix backing #59's capability-key claims must be about this
                                 # candidate's pinned honua-server sha and not stale. Wired at freeze.
    needs: freeze
    uses: ./.github/workflows/gate-evidence.yml
    with:
      platform_label: ${{ inputs.platform_label }}
      enforcement: ${{ inputs.dry_run && 'bootstrap' || 'strict' }}

  # ── report: assemble the machine-readable gate-report.json the AI/MCP layer parses ───────────

  report:                      # never scrape logs — parse this (plan §15)
    needs:
      - gate_manifest
      - gate_artifact_consume
      - gate_e2e
      - gate_cloud_parity
      - gate_ai_delivery_arc
      - gate_build_test
      - gate_contract
      - gate_conformance
      - gate_security
      - gate_sbom
      - gate_observability
      - gate_docs
      - gate_upgrade
      - gate_evidence
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" pytest

      # Prove the exception ledger is well-formed (every entry names a real gate id and carries an
      # issue link) BEFORE the report consumes it, so a typo cannot quietly annotate nothing.
      - name: Self-test the gate-exception ledger
        run: python -m pytest tools/test_gate_exceptions.py -q

      - name: Download the frozen candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: candidate-manifest
          path: candidate-input

      - name: Collect sub-gate reports (best-effort)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # the wired gates upload their own machine-readable reports; pull whatever exists.
          pattern: "*gate-report*"
          path: subreports
          merge-multiple: true
        continue-on-error: true

      - name: Assemble platform gate-report.json
        id: assemble
        env:
          PLATFORM_LABEL: ${{ inputs.platform_label }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Each gate contributes: its reusable-workflow `overall_status` output (already pass|fail|
          # blocked|skipped) where the gate exposes one, else its raw job `result` (normalised below).
          # Preferring the machine-readable output is what lets a self-SKIP (e.g. cloud-creds-unset) show
          # as `skipped` instead of being green-washed to `pass` just because the job exited 0.
          S_MANIFEST: ${{ needs.gate_manifest.result }}
          S_ARTIFACT: ${{ needs.gate_artifact_consume.outputs.overall_status || needs.gate_artifact_consume.result }}
          S_E2E: ${{ needs.gate_e2e.result }}
          S_CLOUD: ${{ needs.gate_cloud_parity.outputs.overall_status || needs.gate_cloud_parity.result }}
          S_AI_ARC: ${{ needs.gate_ai_delivery_arc.outputs.overall_status || needs.gate_ai_delivery_arc.result }}
          S_BUILD: ${{ needs.gate_build_test.result }}
          S_CONTRACT: ${{ needs.gate_contract.result }}
          S_CONFORMANCE: ${{ needs.gate_conformance.result }}
          S_SECURITY: ${{ needs.gate_security.outputs.overall_status || needs.gate_security.result }}
          S_SBOM: ${{ needs.gate_sbom.outputs.overall_status || needs.gate_sbom.result }}
          S_OBS: ${{ needs.gate_observability.outputs.overall_status || needs.gate_observability.result }}
          S_DOCS: ${{ needs.gate_docs.outputs.overall_status || needs.gate_docs.result }}
          S_UPGRADE: ${{ needs.gate_upgrade.outputs.overall_status || needs.gate_upgrade.result }}
          S_EVIDENCE: ${{ needs.gate_evidence.outputs.overall_status || needs.gate_evidence.result }}
        run: |
          set -euo pipefail
          mkdir -p out
          # rows: gate-id | status-signal. The signal is either a gate verdict (pass|fail|blocked|
          # skipped) from the reusable workflow's output, or a raw job result normalised as:
          #   success->pass  failure->fail  cancelled->blocked  skipped->skipped (job-level skip).
          rows=$(cat <<EOF
          manifest|$S_MANIFEST
          artifact-consume|$S_ARTIFACT
          e2e|$S_E2E
          cloud-parity|$S_CLOUD
          ai-delivery-arc|$S_AI_ARC
          build-test|$S_BUILD
          contract|$S_CONTRACT
          conformance|$S_CONFORMANCE
          security|$S_SECURITY
          sbom|$S_SBOM
          observability|$S_OBS
          docs|$S_DOCS
          upgrade|$S_UPGRADE
          evidence|$S_EVIDENCE
          EOF
          )
          echo "$rows" | jq -R 'split("|") | {gate:.[0], signal:.[1]}
            | .status = (
                if   (.signal|IN("pass","fail","blocked","skipped")) then .signal
                elif .signal=="success"   then "pass"
                elif .signal=="cancelled" then "blocked"
                elif .signal=="skipped"   then "skipped"
                else "fail" end)
            | {gate, status, why:("job/gate signal: " + .signal), evidence_url:env.RUN_URL}' \
            | jq -s \
              --arg label "$PLATFORM_LABEL" \
              --arg dry "$DRY_RUN" \
              --arg ts "$(date -u +%FT%TZ)" \
              --arg run "$RUN_URL" '
              {
                platform_label: $label,
                dry_run: ($dry=="true"),
                generatedAt: $ts,
                evidence_url: $run,
                gates: .,
                summary: {
                  pass:    ([.[]|select(.status=="pass")]|length),
                  fail:    ([.[]|select(.status=="fail")]|length),
                  blocked: ([.[]|select(.status=="blocked")]|length),
                  skipped: ([.[]|select(.status=="skipped")]|length)
                },
                overallStatus: (
                  if   any(.[]; .status=="fail")    then "fail"
                  elif any(.[]; .status=="blocked") then "blocked"
                  else "pass" end)     # a `skipped` gate does not reduce overall below pass
              }' > out/gate-report.json

          # Attach the documented, issue-linked exception (if any) to each gate row. This is purely
          # annotation: statuses, the summary counts and overallStatus above are already computed and
          # are NOT touched here, so an exception can never turn a red gate green — it only records
          # WHY it is red and where the fix is tracked. See certification/gate-exceptions.yaml.
          python - <<'PY'
          import json
          import pathlib

          import yaml

          report_path = pathlib.Path("out/gate-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          exceptions = (yaml.safe_load(
              pathlib.Path("certification/gate-exceptions.yaml").read_text(encoding="utf-8")
          ) or {}).get("gates") or {}
          before = json.dumps(
              [{"gate": g["gate"], "status": g["status"]} for g in report["gates"]], sort_keys=True
          )
          for row in report["gates"]:
              entry = exceptions.get(row["gate"])
              if entry:
                  row["exception"] = {"issue": entry.get("issue", ""),
                                      "why": " ".join(str(entry.get("why", "")).split())}
          after = json.dumps(
              [{"gate": g["gate"], "status": g["status"]} for g in report["gates"]], sort_keys=True
          )
          assert before == after, "gate-exceptions must not alter any gate verdict"
          report_path.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY

          cat out/gate-report.json
          echo "overall=$(jq -r .overallStatus out/gate-report.json)" >> "$GITHUB_OUTPUT"
          {
            echo "## release-train $PLATFORM_LABEL — $(jq -r .overallStatus out/gate-report.json)";
            echo "";
            echo "| gate | status | documented exception |";
            echo "|---|---|---|";
            jq -r '.gates[] | "| \(.gate) | \(.status) | \(if .exception then .exception.issue else "" end) |"' out/gate-report.json;
            echo "";
            echo "An exception records WHY a gate is red and where the fix is tracked. It never changes a verdict.";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Bind the report to the exact candidate and train identity
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          SOURCE_WORKFLOW_REF: ${{ github.workflow_ref }}
          TRAIN_RUN_ID: ${{ github.run_id }}
          TRAIN_RUN_ATTEMPT: ${{ github.run_attempt }}
          TRAIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CERTIFICATION_MODE: ${{ inputs.dry_run && 'dry-run' || 'live' }}
        run: |
          set -euo pipefail
          WORKFLOW_PATH="${SOURCE_WORKFLOW_REF#${SOURCE_REPOSITORY}/}"
          WORKFLOW_PATH="${WORKFLOW_PATH%@*}"
          python tools/candidate_binding.py bind \
            --report out/gate-report.json \
            --manifest candidate-input/platform-manifest.yaml \
            --matrix candidate-input/compatibility-matrix.yaml \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --workflow-path "$WORKFLOW_PATH" \
            --train-run-id "$TRAIN_RUN_ID" \
            --train-run-attempt "$TRAIN_RUN_ATTEMPT" \
            --train-run-url "$TRAIN_RUN_URL" \
            --certification-mode "$CERTIFICATION_MODE" \
            --out-dir out/certified-candidate
          python tools/candidate_binding.py verify \
            --report out/certified-candidate/gate-report.json \
            --manifest out/certified-candidate/platform-manifest.yaml \
            --matrix out/certified-candidate/compatibility-matrix.yaml \
            --source-repository "$SOURCE_REPOSITORY" \
            --source-sha "$SOURCE_SHA" \
            --source-branch "$SOURCE_BRANCH" \
            --workflow-path "$WORKFLOW_PATH" \
            --train-run-id "$TRAIN_RUN_ID" \
            --train-run-attempt "$TRAIN_RUN_ATTEMPT" \
            --train-run-url "$TRAIN_RUN_URL" \
            --certification-mode "$CERTIFICATION_MODE"

      - name: Upload bound platform gate-report.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-gate-report
          path: out/certified-candidate/gate-report.json

      - name: Upload the certified candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: certified-candidate
          path: out/certified-candidate/

      - name: Enforce + (TODO) tag RC
        run: |
          set -e
          OVERALL='${{ steps.assemble.outputs.overall }}'
          echo "overall train status: $OVERALL (dry_run=${{ inputs.dry_run }})"
          if [ "$OVERALL" = "fail" ]; then
            echo "::error::release-train: a wired gate failed — candidate is NOT certifiable"; exit 1
          fi
          if [ "$OVERALL" = "blocked" ]; then
            echo "::warning::release-train: a wired gate is blocked (unpublished artifacts / placeholder pins). Not certifiable for a real cut."
          fi
          echo "TODO: when all gates are wired + green and not dry_run, tag the RC here."
          echo "Promotion to the platform label is a separate, environment-gated workflow (promote.yml)."
