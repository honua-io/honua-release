name: resolver-dry-run

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolver-dry-run-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install resolver dependencies
        run: python -m pip install -r tools/requirements-nightly.txt
      - name: Capture resolver dry run
        id: resolver
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          set +e
          python3 tools/resolve_trunk_candidate.py --dry-run > resolver-dry-run.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Summarize resolver verdict
        id: summary
        continue-on-error: true
        run: python3 tools/resolver_dry_run_summary.py resolver-dry-run.log "${{ steps.resolver.outputs.status }}" --json-out resolver-dry-run.json
      - name: Upload resolver verdict
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: resolver-dry-run
          path: |
            resolver-dry-run.json
            resolver-dry-run.log
          if-no-files-found: warn
      - name: Enforce resolver verdict
        if: always()
        env:
          SUMMARY_OUTCOME: ${{ steps.summary.outcome }}
        run: |
          if [ "$SUMMARY_OUTCOME" != success ]; then
            echo "Resolver summary could not parse the captured run"
            exit 1
          fi
          python3 -c 'import json, sys; sys.exit(0 if json.load(open("resolver-dry-run.json"))["resolves"] else 1)'
