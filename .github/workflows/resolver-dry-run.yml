# Scheduled read-only candidate resolution. RELEASE_GH_TOKEN reads the other component
# repositories. Only refs/heads/trunk receives it: workflow_dispatch --ref runs this
# workflow file and the checkout from that ref, so any other branch would hand the
# cross-repository token to unmerged code. The schedule fires on the default branch.

name: resolver-dry-run

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resolver-dry-run-${{ github.event_name == 'schedule' && 'scheduled' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'schedule' }}

jobs:
  capture:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      resolves: ${{ steps.summary.outputs.resolves }}
      no_candidate_yet: ${{ steps.summary.outputs.no_candidate_yet }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install resolver dependencies
        run: python -m pip install -r tools/requirements-nightly.txt
      - name: Capture resolver dry run
        id: resolver
        env:
          GH_TOKEN: ${{ github.ref == 'refs/heads/trunk' && secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set +e
          python3 tools/resolve_trunk_candidate.py --dry-run --max-commits 500 --protocol-ledger produce --prepare-deployments \
            --out-dir resolved-candidate > resolver-dry-run.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Summarize resolver verdict
        id: summary
        run: python3 tools/resolver_dry_run_summary.py resolver-dry-run.log "${{ steps.resolver.outputs.status }}" --json-out resolver-dry-run.json
      - name: Upload resolver verdict
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: resolver-dry-run
          path: |
            resolver-dry-run.json
            resolver-dry-run.log
          if-no-files-found: warn
  resolve:
    needs: capture
    if: needs.capture.outputs.no_candidate_yet != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce resolver verdict
        env:
          RESOLVES: ${{ needs.capture.outputs.resolves }}
        run: test "$RESOLVES" = true
