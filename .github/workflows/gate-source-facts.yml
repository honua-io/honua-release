name: gate-source-facts
run-name: Source facts ${{ inputs.server_sha }}
on:
  workflow_dispatch:
    inputs:
      server_sha: { required: true, type: string }
      server_digest: { required: true, type: string }
      platform_lock_digest: { required: true, type: string }
permissions:
  contents: read
jobs:
  facts:
    if: github.repository == 'honua-io/honua-release' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the candidate server source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-server
          ref: ${{ inputs.server_sha }}
          path: server
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Count retired-cache packages and source references
        env:
          SERVER_SHA: ${{ inputs.server_sha }}
          SERVER_DIGEST: ${{ inputs.server_digest }}
          LOCK_DIGEST: ${{ inputs.platform_lock_digest }}
          SERVER_CHECKOUT: server
        run: python tools/source_facts.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-promise-receipts
          path: cloud-no-redis-source.json
          if-no-files-found: error
          retention-days: 7
