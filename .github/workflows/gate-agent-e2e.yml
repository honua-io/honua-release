name: gate-agent-e2e
# Consumer of the authenticated 252-case agent campaign (honua-release#619). The release train and
# nightly do not call it yet (#628). workflow_dispatch runs it standalone on trunk: it takes the
# producer identity from its inputs or, when empty, from the frozen repository variables
# AGENT_E2E_RUN_ID / AGENT_E2E_RUN_ATTEMPT / AGENT_E2E_SOURCE_SHA / AGENT_E2E_CAMPAIGN_DIGEST, and the
# candidate-manifest artifact from candidate_run_id (a release-train or nightly run). The producer,
# .github/workflows/agent-e2e-campaign.yml (#627), does not exist yet, so a standalone run fails closed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: agent-e2e-campaign.yml producer run id (empty uses vars.AGENT_E2E_RUN_ID)
        required: false
        type: string
      run_attempt:
        description: Producer run attempt (empty uses vars.AGENT_E2E_RUN_ATTEMPT)
        required: false
        type: string
      source_sha:
        description: Producer trunk source sha (empty uses vars.AGENT_E2E_SOURCE_SHA)
        required: false
        type: string
      campaign_digest:
        description: Pre-execution frozen campaign digest sha256:<hex> (empty uses vars.AGENT_E2E_CAMPAIGN_DIGEST)
        required: false
        type: string
      candidate_run_id:
        description: Run whose candidate-manifest artifact names the candidate under qualification
        required: true
        type: string
  workflow_call:
    inputs:
      run_id: {required: true, type: string}
      run_attempt: {required: true, type: string}
      source_sha: {required: true, type: string}
      campaign_digest: {required: true, type: string}
    outputs:
      overall_status:
        value: ${{ jobs.verify.outputs.status }}
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      status: ${{ steps.verify.outputs.status || 'fail' }}
    steps:
      # A standalone dispatch runs only the trunk verifier: a branch could otherwise stub its own.
      - name: Refuse a standalone dispatch off trunk
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/trunk'
        run: |
          echo "::error::gate-agent-e2e dispatches only from refs/heads/trunk (got $GITHUB_REF)"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require configured real campaign identity
        id: identity
        env:
          RUN_ID: ${{ inputs.run_id || vars.AGENT_E2E_RUN_ID }}
          RUN_ATTEMPT: ${{ inputs.run_attempt || vars.AGENT_E2E_RUN_ATTEMPT }}
          SOURCE_SHA: ${{ inputs.source_sha || vars.AGENT_E2E_SOURCE_SHA }}
          CAMPAIGN_DIGEST: ${{ inputs.campaign_digest || vars.AGENT_E2E_CAMPAIGN_DIGEST }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          missing=()
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]] || missing+=("run_id / AGENT_E2E_RUN_ID")
          [[ "$RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || missing+=("run_attempt / AGENT_E2E_RUN_ATTEMPT")
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || missing+=("source_sha / AGENT_E2E_SOURCE_SHA")
          [[ "$CAMPAIGN_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || missing+=("campaign_digest / AGENT_E2E_CAMPAIGN_DIGEST")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] || missing+=("candidate_run_id")
            # Fail closed with the reason rather than at an artifact download: the gate admits only
            # the attested trunk producer, which honua-release#627 has not landed.
            gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/agent-e2e-campaign.yml?ref=trunk" \
              --silent 2>/dev/null || missing+=("producer .github/workflows/agent-e2e-campaign.yml on trunk (honua-release#627)")
          fi
          if [ "${#missing[@]}" -gt 0 ]; then
            for item in "${missing[@]}"; do echo "::error::agent E2E campaign identity missing: $item"; done
            exit 1
          fi
          {
            echo "run_id=$RUN_ID"
            echo "run_attempt=$RUN_ATTEMPT"
            echo "source_sha=$SOURCE_SHA"
            echo "campaign_digest=$CAMPAIGN_DIGEST"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name != 'workflow_dispatch'
        with:
          name: candidate-manifest
          path: candidate-input
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event_name == 'workflow_dispatch'
        with:
          github-token: ${{ github.token }}
          repository: honua-io/honua-release
          run-id: ${{ inputs.candidate_run_id }}
          name: candidate-manifest
          path: candidate-input
      # Trust the candidate bytes only from a completed trunk release-train/nightly run (schedule or
      # dispatch) whose platform-manifest.yaml is exactly the one at that run's head commit.
      - name: Authenticate the candidate artifact's producer run
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          read -r branch path event status head < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN_ID" \
            --jq '[.head_branch, .path, .event, .status, .head_sha] | @tsv')
          problems=()
          [ "$branch" = trunk ] || problems+=("branch $branch is not trunk")
          case "$path" in .github/workflows/release-train.yml|.github/workflows/nightly-certification.yml) ;;
            *) problems+=("workflow $path is not release-train.yml or nightly-certification.yml") ;; esac
          case "$event" in schedule|workflow_dispatch) ;; *) problems+=("event $event is not schedule/workflow_dispatch") ;; esac
          [ "$status" = completed ] || problems+=("run status $status is not completed")
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] || problems+=("head sha $head is not a commit")
          if [ "${#problems[@]}" -eq 0 ]; then
            git cat-file -e "$head^{commit}" 2>/dev/null || git fetch -q origin "$head"
            cmp -s <(git show "$head:platform-manifest.yaml") candidate-input/platform-manifest.yaml \
              || problems+=("candidate-manifest platform-manifest.yaml differs from $head")
          fi
          if [ "${#problems[@]}" -gt 0 ]; then
            for item in "${problems[@]}"; do echo "::error::candidate producer run $CANDIDATE_RUN_ID: $item"; done
            exit 1
          fi
          echo "candidate producer: $path $event on trunk at $head"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          repository: honua-io/honua-release
          run-id: ${{ steps.identity.outputs.run_id }}
          name: agent-e2e-campaign-${{ steps.identity.outputs.run_attempt }}
          path: campaign-input
      - name: Authenticate controller and evaluate all 252 cases
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.identity.outputs.run_id }}
          RUN_ATTEMPT: ${{ steps.identity.outputs.run_attempt }}
          SOURCE_SHA: ${{ steps.identity.outputs.source_sha }}
          CAMPAIGN_DIGEST: ${{ steps.identity.outputs.campaign_digest }}
        run: |
          set -euo pipefail
          python tools/verify_agent_e2e_campaign.py --bundle campaign-input \
            --pack certification/agent-e2e/pack.v2.json \
            --current-lock candidate-input/frozen-lock/platform-lock.json \
            --campaign-digest "$CAMPAIGN_DIGEST" --source-sha "$SOURCE_SHA" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --output out/agent-e2e-summary.json
          echo 'status=pass' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: agent-e2e-gate-report
          path: out/agent-e2e-summary.json
          if-no-files-found: warn
      - name: Retain the authenticated campaign evidence
        if: steps.verify.outputs.status == 'pass'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-e2e-campaign-evidence
          path: campaign-input/
          if-no-files-found: error
