name: gate-security-private-summary
run-name: Security summary ${{ inputs.platform_lock_digest }}
on:
  workflow_dispatch:
    inputs:
      server_sha: { required: true, type: string }
      server_digest: { required: true, type: string }
      platform_lock_digest: { required: true, type: string }
permissions:
  contents: read
jobs:
  summary:
    if: github.repository == 'honua-io/honua-release' && github.ref == 'refs/heads/trunk'
    environment: security-tracker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Produce private aggregate
        env:
          SECURITY_TRACKER_REPOSITORY: ${{ secrets.SECURITY_TRACKER_REPOSITORY }}
          SECURITY_TRACKER_TOKEN: ${{ secrets.SECURITY_TRACKER_TOKEN }}
          SERVER_SHA: ${{ inputs.server_sha }}
          SERVER_DIGEST: ${{ inputs.server_digest }}
          LOCK_DIGEST: ${{ inputs.platform_lock_digest }}
        run: python tools/security_private_summary.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-promise-receipts
          path: security-open-high.json
          if-no-files-found: error
          retention-days: 7
