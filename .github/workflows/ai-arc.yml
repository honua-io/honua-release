name: AI arc

# One matrix run per arm. Each trial is one agent arm working on ONE deployment through the four
# arc stages (setup, ops, services, maps with Studio); see certification/ai-arc/README.md.
# The aggregate job writes one candidate-bound receipt per target x arm for tools/rc_gate_window.py.
# Every trial is a first attempt; nothing is rerun or replaced except through an adjudicated void.
# This workflow creates no AWS resources: AWS slots come from the release cell machinery and are
# handed in as slot receipts; local-docker targets run on ephemeral VMs from the runner's host
# provisioner. Agent CLIs need subscription sign-in, so trials run on the controller's runner.

on:
  workflow_dispatch:
    inputs:
      arm:
        description: Arc arm per the prereg (A1 Claude Code + Opus 5.5, A2 Codex + GPT-6.1 Sol; C1-C3 comparison)
        required: true
        type: choice
        default: A1
        options:
          - A1
          - A2
          - C1
          - C2
          - C3
      targets:
        description: Comma-separated targets (local-docker, aws-ecs, aws-eks, aws-lambda)
        required: true
        default: local-docker
        type: string
      trials:
        description: Trials per target; empty uses the prereg bar's run count
        required: false
        type: string
      lock_digest:
        description: sha256 digest of the candidate platform-lock.json
        required: true
        type: string
      lock_run_id:
        description: Workflow run containing the platform lock artifact
        required: true
        type: string
      lock_artifact:
        description: Name of the artifact containing platform-lock.json
        required: false
        default: platform-lock
        type: string
      quickstart_revision:
        description: honua-server commit whose published quickstart the local setup stage follows
        required: true
        type: string
      goal_set:
        description: development (A/B, never certifying) or held-out (sealed, decrypted in this job only)
        required: true
        type: choice
        default: development
        options:
          - development
          - held-out
      runner:
        description: JSON runs-on value for trial jobs (the controller runner with signed-in agent CLIs)
        required: false
        default: '["self-hosted","linux","honua-arc"]'
        type: string
      max_parallel:
        description: Concurrent trials
        required: false
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: ai-arc-${{ inputs.arm }}-${{ inputs.lock_digest }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.inventory.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - id: inventory
        env:
          ARM: ${{ inputs.arm }}
          TARGETS: ${{ inputs.targets }}
          TRIALS: ${{ inputs.trials }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
          REVISION: ${{ inputs.quickstart_revision }}
        run: |
          set -euo pipefail
          [[ "$LOCK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "lock_digest must be sha256:<64 hex>"; exit 1; }
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo "quickstart_revision must be a 40-hex commit"; exit 1; }
          python tools/ai_arc_runner.py check
          mkdir -p schedule
          rows='[]'
          IFS=',' read -ra names <<< "$TARGETS"
          for target in "${names[@]}"; do
            args=(inventory --target "$target" --arm "$ARM")
            [ -z "$TRIALS" ] || args+=(--trials "$TRIALS")
            python tools/ai_arc_runner.py "${args[@]}" > "schedule/$target.json"
            rows="$(python -c 'import json,sys; a=json.loads(sys.argv[1]); t=sys.argv[2]; a+=[dict(r, target=t) for r in json.load(open(sys.argv[3]))]; print(json.dumps(a))' "$rows" "$target" "schedule/$target.json")"
          done
          echo "matrix=$rows" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-arc-schedule
          path: schedule/
          if-no-files-found: error

  trial:
    needs: inventory
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        include: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.lock_artifact }}
          path: candidate-lock
          run-id: ${{ inputs.lock_run_id }}
          github-token: ${{ github.token }}
      - name: Fetch the published quickstart at the pinned revision
        env:
          REVISION: ${{ inputs.quickstart_revision }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/arc-inputs"
          curl -fsS "https://raw.githubusercontent.com/honua-io/honua-server/${REVISION}/docs/get-started/quickstart.md" \
            -o "$RUNNER_TEMP/arc-inputs/quickstart.md"
      - name: Open the sealed held-out goal set
        if: ${{ inputs.goal_set == 'held-out' }}
        env:
          AI_ARC_HELDOUT_KEY: ${{ secrets.AI_ARC_HELDOUT_KEY }}
        run: |
          set -euo pipefail
          python3 tools/ai_arc_runner.py decrypt-goals --sealed certification/ai-arc/heldout.v1.sealed \
            --output "$RUNNER_TEMP/arc-inputs/goals.json"
      - name: Acquire the trial's slot
        id: slot
        env:
          TARGET: ${{ matrix.target }}
          TRIAL: ${{ matrix.runId }}
        run: |
          set -euo pipefail
          # The runner machine's provisioner (outside this repository) prints an ephemeral host for
          # local-docker or an empty release-cell slot receipt path for AWS. Without one the trial
          # still runs and records its setup stage as stage-unavailable.
          if [ -n "${HONUA_ARC_SLOT_PROVISIONER:-}" ]; then
            "$HONUA_ARC_SLOT_PROVISIONER" acquire "$TARGET" "$TRIAL" > "$RUNNER_TEMP/arc-inputs/slot.json"
          else
            echo '{}' > "$RUNNER_TEMP/arc-inputs/slot.json"
          fi
      - name: Run one arc trial
        env:
          TARGET: ${{ matrix.target }}
          TRIAL: ${{ matrix.runId }}
          VARIANT: ${{ matrix.variant }}
          ARM: ${{ inputs.arm }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
          GOAL_SET: ${{ inputs.goal_set }}
        run: |
          set -euo pipefail
          slot="$RUNNER_TEMP/arc-inputs/slot.json"
          out="artifacts/${TRIAL//:/-}"
          args=(trial --target "$TARGET" --arm "$ARM" --trial-id "$TRIAL" --variant "$VARIANT" --output "$out"
                --lock-digest "$LOCK_DIGEST" --lock-path candidate-lock/platform-lock.json
                --quickstart "$RUNNER_TEMP/arc-inputs/quickstart.md")
          host="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("dockerHost",""))' "$slot")"
          cell="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("slotReceipt",""))' "$slot")"
          creds="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("slotCredentials",""))' "$slot")"
          [ -z "$host" ] || args+=(--docker-host "$host")
          [ -z "$cell" ] || args+=(--slot-receipt "$cell")
          [ -z "$creds" ] || args+=(--slot-credentials "$creds")
          [ "$GOAL_SET" != held-out ] || args+=(--goal-set "$RUNNER_TEMP/arc-inputs/goals.json")
          python3 tools/ai_arc_runner.py "${args[@]}"
      - name: Release the trial's slot
        if: always()
        env:
          TARGET: ${{ matrix.target }}
          TRIAL: ${{ matrix.runId }}
        run: |
          if [ -n "${HONUA_ARC_SLOT_PROVISIONER:-}" ]; then
            "$HONUA_ARC_SLOT_PROVISIONER" release "$TARGET" "$TRIAL"
          fi
          rm -rf "$RUNNER_TEMP/arc-inputs"
      - name: Retain trial evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-arc-trial-${{ strategy.job-index }}
          path: artifacts/
          if-no-files-found: error

  aggregate:
    if: always() && needs.inventory.result == 'success'
    needs: [inventory, trial]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install 'pyyaml>=6.0' 'jsonschema>=4.23' 'cryptography>=45.0'
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ai-arc-schedule
          path: schedule
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          pattern: ai-arc-trial-*
          path: trials
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: ${{ inputs.lock_artifact }}
          path: candidate-lock
          run-id: ${{ inputs.lock_run_id }}
          github-token: ${{ github.token }}
      - name: One receipt per target x arm
        env:
          ARM: ${{ inputs.arm }}
          TARGETS: ${{ inputs.targets }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
          GOAL_SET: ${{ inputs.goal_set }}
        run: |
          set -euo pipefail
          read -r sha digest < <(python -c '
          import json, sys
          c = json.load(open("candidate-lock/platform-lock.json"))["components"]["honua-server"]
          d = [a["digest"] for a in c["artifacts"] if a.get("kind") == "image"]
          print(c["source"]["revision"], d[0] if len(d) == 1 else "")')
          mkdir -p receipts
          IFS=',' read -ra names <<< "$TARGETS"
          for target in "${names[@]}"; do
            args=(aggregate --target "$target" --arm "$ARM" --schedule "schedule/$target.json" --trials-dir trials
                  --candidate-sha "$sha" --candidate-digest "$digest" --lock-digest "$LOCK_DIGEST"
                  --goal-set-name "$GOAL_SET"
                  --output "receipts/ai-arc-aggregate-$target-$ARM.json"
                  --report "receipts/ai-arc-report-$target-$ARM.json")
            [ ! -f "certification/ai-arc/voids/$target-$ARM.json" ] || args+=(--voids "certification/ai-arc/voids/$target-$ARM.json")
            python tools/ai_arc_runner.py "${args[@]}"
          done
      - name: Retain the aggregate receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ai-arc-receipt
          path: receipts/
          if-no-files-found: error
