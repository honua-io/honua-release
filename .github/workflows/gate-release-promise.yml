name: gate-release-promise
run-name: Release promise ${{ inputs.platform_lock_digest }}
on:
  workflow_dispatch:
    inputs:
      server_sha:
        required: true
        type: string
      server_digest:
        required: true
        type: string
      platform_lock_digest:
        required: true
        type: string
      profile:
        type: choice
        options: [rc, ga]
        default: rc
  workflow_call:
    inputs:
      server_sha:
        required: true
        type: string
      server_digest:
        required: true
        type: string
      platform_lock_digest:
        required: true
        type: string
      profile:
        type: string
        default: rc
    secrets:
      RELEASE_GH_TOKEN:
        required: true
permissions:
  contents: read
  actions: read
jobs:
  promises:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      - name: Evaluate authenticated live producer receipts
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          SERVER_SHA: ${{ inputs.server_sha }}
          SERVER_DIGEST: ${{ inputs.server_digest }}
          LOCK_DIGEST: ${{ inputs.platform_lock_digest }}
          PROFILE: ${{ inputs.profile }}
        run: >-
          python tools/release_promise.py --server-sha "$SERVER_SHA"
          --server-digest "$SERVER_DIGEST" --platform-lock "$LOCK_DIGEST"
          --profile "$PROFILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-promise-report
          path: release-promise-report.json
          if-no-files-found: error
