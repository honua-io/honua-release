name: Terminal journey contract

on:
  pull_request:
    paths:
      - certification/terminal-journey/**
      - .github/workflows/terminal-journey-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terminal-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0"
      - name: Test fail-closed roster and stage attribution
        run: python certification/terminal-journey/test_run.py -v
      - name: Build blocked receipt without claiming live success
        env:
          EVIDENCE_URI: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python certification/terminal-journey/run.py --output artifacts/terminal-journey.json --evidence-uri "$EVIDENCE_URI"
          python - <<'PY'
          import json
          r=json.load(open('artifacts/terminal-journey.json'))
          assert r['status']=='blocked' and r['roster']['status']=='blocked'
          assert len(r['stages'])==8 and all(s['status']=='blocked' and s['blockedBy'] for s in r['stages'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: terminal-journey-build-receipt
          path: artifacts/terminal-journey.json
