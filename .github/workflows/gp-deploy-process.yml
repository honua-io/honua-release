# GP process deployment (honua-release#616): activate the release an environment pin names, or
# roll back to the pin's previous release, through ONE serialized path per environment.
#
# Triggers
#   push to trunk touching release/gp-environments/**/*.pin.json  -> deploy every changed pin
#   workflow_dispatch / workflow_call                              -> one environment + process,
#                                                                     operation deploy|rollback
#
# Every attempt, including a refused one, ends in a signed deployment receipt
# (schemas/gp-deployment-receipt.v1.schema.json). The decisions are taken by
# tools/gp_process_release.py from committed JSON: lock digest == pin digest, every artifact and
# image digest resolvable, server execution contract within the lock's range, every target
# executable here, binding version unchanged since the pin was written (otherwise a stale
# concurrent attempt), and for a rollback that the target IS the pin's previous release.
#
# Contract boundary (honua-io/honua-server#6221): the environment binding is changed through the
# server's binding API and admission pins the release for queued, running and retried jobs. Until
# that ships, this workflow performs preflight, deployment tooling and smoke, and records the
# binding as `pending-server-6221`; it never claims a binding it did not change. A reference
# environment (deploymentTooling.kind == reference) exercises the whole path without a cluster.
name: gp-deploy-process
run-name: "gp ${{ inputs.operation || 'deploy' }} ${{ inputs.process || 'changed pins' }} -> ${{ inputs.environment || 'trunk' }}"

on:
  push:
    branches: [trunk]
    paths:
      - "release/gp-environments/**/*.pin.json"
  workflow_dispatch:
    inputs:
      environment: { description: "Environment directory under release/gp-environments/", required: true, type: string }
      process: { description: "Logical process name", required: true, type: string }
      operation:
        description: "deploy the pinned release, or rollback to the pin's previous release"
        required: false
        type: choice
        options: [deploy, rollback]
        default: deploy
      rollback_lock_path:
        description: "rollback only: lock path to roll back to (default: the pin's previous.lockPath)"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      process: { required: true, type: string }
      operation: { required: false, type: string, default: deploy }
      rollback_lock_path: { required: false, type: string, default: "" }
    outputs:
      outcome:
        description: "activated | refused | failed | reference-only"
        value: ${{ jobs.deploy.outputs.outcome }}

permissions:
  contents: read
  id-token: write
  attestations: write
  actions: read

# One deployment at a time per environment; a queued attempt waits, it is never cancelled, so a
# receipt is written for every attempt that started.
concurrency:
  group: gp-deploy-${{ inputs.environment || 'trunk-pins' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve which environment pins to act on
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_ENVIRONMENT: ${{ inputs.environment }}
          IN_PROCESS: ${{ inputs.process }}
          IN_OPERATION: ${{ inputs.operation || 'deploy' }}
          IN_ROLLBACK_LOCK_PATH: ${{ inputs.rollback_lock_path }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          items = []
          if os.environ["EVENT"] == "push":
              before, after = os.environ["BEFORE"], os.environ["GITHUB_SHA"]
              base = before if before and not set(before) <= {"0"} else f"{after}~1"
              changed = subprocess.run(["git", "diff", "--name-only", base, after, "--", "release/gp-environments"],
                                       capture_output=True, text=True, check=True).stdout.split()
              for path in changed:
                  m = re.fullmatch(r"release/gp-environments/([a-z][a-z0-9-]*)/([a-z][a-z0-9-]*)\.pin\.json", path)
                  if m and os.path.isfile(path):
                      items.append({"environment": m.group(1), "process": m.group(2), "operation": "deploy", "rollback_lock_path": ""})
          else:
              items.append({"environment": os.environ["IN_ENVIRONMENT"], "process": os.environ["IN_PROCESS"],
                            "operation": os.environ["IN_OPERATION"], "rollback_lock_path": os.environ["IN_ROLLBACK_LOCK_PATH"]})
          print("plan:", json.dumps(items))
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("matrix=" + json.dumps({"include": items}) + "\n")
          PY

  deploy:
    needs: resolve
    if: fromJSON(needs.resolve.outputs.matrix).include[0] != null
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    concurrency:
      group: gp-deploy-env-${{ matrix.environment }}
      cancel-in-progress: false
    outputs:
      outcome: ${{ steps.receipt.outputs.outcome }}
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      PROCESS: ${{ matrix.process }}
      OPERATION: ${{ matrix.operation }}
      ROLLBACK_LOCK_PATH: ${{ matrix.rollback_lock_path }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "jsonschema>=4.23" "pyyaml>=6.0" pytest

      - name: Self-test the release gate
        run: python -m pytest tools/test_gp_process_release.py -q

      - name: Record the attempt start
        id: start
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Resolve the pin, the environment and the lock to activate
        id: resolve
        run: |
          set -euo pipefail
          pin="release/gp-environments/$ENVIRONMENT/$PROCESS.pin.json"
          state="release/gp-environments/$ENVIRONMENT/environment.json"
          test -f "$pin" || { echo "::error::$pin does not exist"; exit 1; }
          test -f "$state" || { echo "::error::$state does not exist"; exit 1; }
          python3 tools/gp_process_release.py validate-pin "$pin" --locks-root .
          if [ "$OPERATION" = "rollback" ]; then
            lock="${ROLLBACK_LOCK_PATH:-$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1]))["previous"]; print(p["lockPath"] if p else "")' "$pin")}"
            [ -n "$lock" ] || { echo "::error::$pin has no previous release to roll back to"; exit 1; }
            echo "rollback_to=$lock" >> "$GITHUB_OUTPUT"
          else
            lock="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["release"]["lockPath"])' "$pin")"
            echo "rollback_to=" >> "$GITHUB_OUTPUT"
          fi
          tooling="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["deploymentTooling"]["kind"])' "$state")"
          { echo "pin=$pin"; echo "state=$state"; echo "lock=$lock"; echo "tooling=$tooling"; } >> "$GITHUB_OUTPUT"

      # What this environment can actually serve. A reference environment is answered from the
      # committed locks themselves (and says so); a real one asks the registry for every image
      # digest and the release run's artifact store for every artifact digest.
      - name: Build the artifact availability index
        id: index
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLING: ${{ steps.resolve.outputs.tooling }}
          LOCK: ${{ steps.resolve.outputs.lock }}
          PIN: ${{ steps.resolve.outputs.pin }}
        run: |
          set -euo pipefail
          mkdir -p out/deploy
          if [ "$TOOLING" = "reference" ]; then
            python3 - <<'PY'
          import json, os
          lock = json.load(open(os.environ["LOCK"]))
          index = {"schema": "honua.gp-artifact-index/v1", "source": "reference environment: digests taken from the committed lock, nothing was resolved",
                   "artifacts": [a["sha256"] for a in lock["artifacts"]],
                   "images": sorted({lock["runtimeImage"]["digest"]} | {t["workerImageDigest"] for t in lock["targets"]})}
            json.dump(index, open("out/deploy/artifact-index.json", "w"), indent=2, sort_keys=True)
          PY
            echo "::notice::reference environment: artifact availability is not resolved against a registry"
          else
            python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          lock = json.load(open(os.environ["LOCK"]))
          pin = json.load(open(os.environ["PIN"]))
          images = []
          for digest in sorted({lock["runtimeImage"]["digest"]} | {t["workerImageDigest"] for t in lock["targets"]}):
              reference = lock["runtimeImage"]["reference"].split("@")[0] + "@" + digest
              ok = subprocess.run(["docker", "manifest", "inspect", reference], capture_output=True).returncode == 0
              print(("resolved " if ok else "MISSING  ") + reference)
              if ok:
                  images.append(digest)
          run_id = re.search(r"/actions/runs/(\d+)$", pin["promotedBy"]["sourceRun"]).group(1)
          short = pin["release"]["lockDigest"][len("sha256:"):][:12]
          artifacts = []
          if subprocess.run(["gh", "run", "download", run_id, "--repo", os.environ["GITHUB_REPOSITORY"], "--name", f"gp-process-release-{short}", "--dir", "_release"]).returncode == 0:
              for artifact in lock["artifacts"]:
                  path = os.path.join("_release", "artifacts", artifact["name"])
                  if os.path.isfile(path) and "sha256:" + hashlib.sha256(open(path, "rb").read()).hexdigest() == artifact["sha256"]:
                      artifacts.append(artifact["sha256"])
          index = {"schema": "honua.gp-artifact-index/v1", "source": "registry manifests and the release run's artifact store", "artifacts": artifacts, "images": images}
          json.dump(index, open("out/deploy/artifact-index.json", "w"), indent=2, sort_keys=True)
          PY
          fi

      - name: Preflight the activation
        id: preflight
        env:
          PIN: ${{ steps.resolve.outputs.pin }}
          STATE: ${{ steps.resolve.outputs.state }}
          LOCK: ${{ steps.resolve.outputs.lock }}
          ROLLBACK_TO: ${{ steps.resolve.outputs.rollback_to }}
        run: |
          set -euo pipefail
          args=(--lock "$LOCK" --pin "$PIN" --environment "$STATE" --artifact-index out/deploy/artifact-index.json --out out/deploy/decision.json)
          if [ -n "$ROLLBACK_TO" ]; then args+=(--rollback-to "$ROLLBACK_TO"); fi
          python3 tools/gp_process_release.py preflight "${args[@]}"

      # Deployment tooling. Only the kinds the environment declares run; each pins by digest from the
      # lock, never by tag. A reference environment runs none of them.
      - name: Deploy the pinned worker with Helm (kubernetes-job target)
        if: steps.resolve.outputs.tooling == 'helm'
        env:
          LOCK: ${{ steps.resolve.outputs.lock }}
          STATE: ${{ steps.resolve.outputs.state }}
        run: |
          set -euo pipefail
          release="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["deploymentTooling"]["helmRelease"])' "$STATE")"
          namespace="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["deploymentTooling"]["namespace"])' "$STATE")"
          worker="$(python3 -c 'import json,sys; l=json.load(open(sys.argv[1])); t=[t for t in l["targets"] if t["kind"]=="kubernetes-job"][0]; print(t["workerImageDigest"])' "$LOCK")"
          repository="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["runtimeImage"]["reference"].split("@")[0])' "$LOCK")"
          chart="$(python3 -c 'import json,sys; l=json.load(open(sys.argv[1])); t=[t for t in l["targets"] if t["kind"]=="kubernetes-job"][0]; print(t["chartVersion"])' "$LOCK")"
          # honua-helm: geoprocessing.kubernetesJobs.image pins the worker by digest; the chart refuses a
          # native runtime profile without an explicit worker image (honua-helm#100).
          helm upgrade --install "$release" oci://ghcr.io/honua-io/charts/honua --version "$chart" \
            --namespace "$namespace" --reuse-values --wait --timeout 10m \
            --set geoprocessing.kubernetesJobs.image.repository="$repository" \
            --set-string geoprocessing.kubernetesJobs.image.tag="" \
            --set geoprocessing.kubernetesJobs.image.digest="$worker"

      - name: Register the pinned job definition revision (aws-batch target)
        if: steps.resolve.outputs.tooling == 'aws-batch'
        env:
          LOCK: ${{ steps.resolve.outputs.lock }}
        run: |
          set -euo pipefail
          name="$(python3 -c 'import json,sys; l=json.load(open(sys.argv[1])); t=[t for t in l["targets"] if t["kind"]=="aws-batch"][0]; print(t["jobDefinitionName"])' "$LOCK")"
          image="$(python3 -c 'import json,sys; l=json.load(open(sys.argv[1])); t=[t for t in l["targets"] if t["kind"]=="aws-batch"][0]; print(l["runtimeImage"]["reference"].split("@")[0] + "@" + t["workerImageDigest"])' "$LOCK")"
          # honua-iac owns the job definition's compute, role and retry settings; this step only
          # registers a new immutable revision with the pinned image and records its ARN.
          aws batch register-job-definition --job-definition-name "$name" --type container \
            --container-properties "{\"image\":\"$image\"}" --tags "honuaLockDigest=$(python3 tools/gp_process_release.py lock-digest "$LOCK")" \
            --query jobDefinitionArn --output text | tee out/deploy/job-definition-arn.txt

      # A meaningful smoke: the process itself, against this environment, through the devkit. The
      # reference environment has no server to run against and records `skipped` honestly.
      - name: Run the process smoke
        id: smoke
        env:
          TOOLING: ${{ steps.resolve.outputs.tooling }}
          LOCK: ${{ steps.resolve.outputs.lock }}
          # the environment's server URL is a repository/environment variable, never a secret value in the lock
          HONUA_SERVER_URL: ${{ vars.HONUA_GP_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ "$TOOLING" = "reference" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"; echo "evidence=reference environment: no server to execute against" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "${HONUA_SERVER_URL:-}" ]; then
            echo "status=fail" >> "$GITHUB_OUTPUT"; echo "evidence=HONUA_GP_SERVER_URL variable is not set for this environment" >> "$GITHUB_OUTPUT"
            echo "::error::set the HONUA_GP_SERVER_URL repository or environment variable"; exit 1
          fi
          if ! command -v honua-gp-devkit >/dev/null 2>&1; then
            echo "status=fail" >> "$GITHUB_OUTPUT"; echo "evidence=honua-gp-devkit is not installed on this runner" >> "$GITHUB_OUTPUT"
            echo "::error::the smoke needs honua-gp-devkit (honua-io/honua-server#6090)"; exit 1
          fi
          process="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["process"]["name"])' "$LOCK")"
          if honua-gp-devkit test "$process" --server "$HONUA_SERVER_URL" --json > out/deploy/smoke.json; then
            echo "status=pass" >> "$GITHUB_OUTPUT"; echo "evidence=out/deploy/smoke.json" >> "$GITHUB_OUTPUT"
          else
            echo "status=fail" >> "$GITHUB_OUTPUT"; echo "evidence=out/deploy/smoke.json" >> "$GITHUB_OUTPUT"; exit 1
          fi

      # The binding API arrives with honua-server#6221. This step is the seam: it records that the
      # binding was NOT changed by this run instead of pretending. When the API exists, replace the
      # notice with the activation call and set binding=activated only on its success.
      - name: Activate the environment binding
        id: binding
        run: |
          echo "::notice::binding activation is pending honua-io/honua-server#6221; this run changed deployment tooling only"
          echo "status=pending-server-6221" >> "$GITHUB_OUTPUT"
          echo "detail=binding API not available; running jobs keep their admitted release; schedules not reconciled" >> "$GITHUB_OUTPUT"

      - name: Record the deployment receipt
        id: receipt
        if: always()
        env:
          STARTED_AT: ${{ steps.start.outputs.started_at }}
          SMOKE_STATUS: ${{ steps.smoke.outputs.status || 'skipped' }}
          SMOKE_EVIDENCE: ${{ steps.smoke.outputs.evidence || 'not reached' }}
          BINDING_STATUS: ${{ steps.binding.outputs.status || 'unchanged' }}
          BINDING_DETAIL: ${{ steps.binding.outputs.detail || 'not reached' }}
          ACTOR: ${{ github.triggering_actor || github.actor }}
        run: |
          set -uo pipefail
          if [ ! -f out/deploy/decision.json ]; then
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
            echo "::error::no preflight decision was written; the attempt failed before it could be judged"
            exit 1
          fi
          python3 tools/gp_process_release.py receipt \
            --decision out/deploy/decision.json --operation "$OPERATION" \
            --smoke "$SMOKE_STATUS" --smoke-evidence "$SMOKE_EVIDENCE" \
            --binding pending-server-6221 --binding-detail "$BINDING_DETAIL" \
            --actor "$ACTOR" --run-repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --started-at "$STARTED_AT" --out out/deploy/deployment-receipt.json
          rc=$?
          outcome="$(python3 -c 'import json; print(json.load(open("out/deploy/deployment-receipt.json"))["outcome"])')"
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          { echo "## GP $OPERATION $PROCESS -> $ENVIRONMENT: **$outcome**"; echo; echo '```'; cat out/deploy/deployment-receipt.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$BINDING_STATUS" != "pending-server-6221" ]; then
            echo "::warning::binding step reported '$BINDING_STATUS'; the receipt records pending-server-6221 until the binding API exists"
          fi
          exit $rc

      - name: Upload the deployment receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gp-deployment-receipt-${{ matrix.environment }}-${{ matrix.process }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/deploy
          retention-days: 90
          if-no-files-found: error

      - name: Attest the deployment receipt
        if: always() && hashFiles('out/deploy/deployment-receipt.json') != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/deploy/deployment-receipt.json
