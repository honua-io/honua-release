# Release gate (g) — observability / SLO. Two independent checks (PLAN §4g; retires
# server#2243/devops#113 at the gate level):
#
#  1. metric-contract — REAL and deployment-independent. Parses the platform's actual alert rules
#     (honua-helm's PrometheusRule, honua-devops' recording/alert rules) and this gate's own metric
#     names, and requires every Honua series they reference to be declared in honua-server's
#     observability/slo-metric-contract.json — a contract the server integration-tests against its
#     real /metrics exposition. This is the check that was missing when #5 was filed: three
#     repositories divided by three different metrics that no Honua component has ever emitted, and
#     nothing failed, because a PromQL ratio over an absent series is an EMPTY vector — no alert,
#     no error, no signal. Silence, not noise.
#
#  2. slo — the error-budget evaluation itself. Mechanical (tools/check_slo.py, unit-tested) so it
#     CANNOT green-light a failing release the way the audited SLO gate did. It needs a deployed
#     candidate: set HONUA_METRICS_URL (repo var) to the candidate's /metrics endpoint. While that
#     variable is unset there is genuinely nothing to scrape, and the gate reports BLOCKED (an
#     honest skip in bootstrap, a hard FAIL under strict) — never a fake green.
#
#     ...AND the scraped instance must PROVE it is the candidate. Honua is not a SaaS: the one
#     long-lived deployed environment (demo.honua.io, owned by honua-io/honua-demo-infra) doubles as
#     demo and certification target, and it routinely runs a build older than the manifest pin —
#     6ad71ac7 (2026-08-03) at the time this binding was written, against a much newer pinned
#     honua-server. Aiming HONUA_METRICS_URL at it without a binding would compute a real,
#     correct-looking error budget over the WRONG population and report it as the candidate's: the
#     same class of defect as the fail-open denominator #5 already fixed once. So the gate reads the
#     instance's advertised build identity from the PUBLIC capability manifest
#     (GET /api/v1/capabilities/manifest -> $.server.deploymentRevision, with
#     deploymentRevisionSource: commit-sha) and requires it to equal components.honua-server.sha in
#     platform-manifest.yaml. Mismatched, unreadable or absent => BLOCKED (hard FAIL under strict).
#     `pass` is unreachable for an instance whose identity was not confirmed.
#
# ERROR_METRIC / REQUEST_METRIC must be names the server actually EXPORTS, which is not the same as
# the .NET instrument name — the OpenTelemetry Prometheus exporter rewrites names from the
# instrument's declared unit. Check #1 is what keeps these two honest.

name: gate-observability
run-name: "gate-observability ${{ inputs.platform_label }} (${{ inputs.enforcement }})"

on:
  schedule:
    - cron: "7 6 * * *"
  workflow_dispatch:
    inputs:
      platform_label: { required: false, type: string, default: "dev-local" }
      enforcement:    { required: false, type: choice, options: [bootstrap, strict], default: bootstrap }
  workflow_call:
    inputs:
      platform_label: { required: false, type: string, default: "dev-local" }
      enforcement:    { required: false, type: string, default: bootstrap }
    secrets:
      RELEASE_GH_TOKEN: { required: false }
      # Admin API key for the candidate's /metrics endpoint, which honua-server maps with
      # .RequireAuthorization("Admin"). Without it the scrape is a 401 that reads as "metric absent".
      HONUA_METRICS_API_KEY: { required: false }
      # Fallback credential, wired but inert. The repo already holds HONUA_DEMO_API_KEY (demo-canary
      # uses it); HONUA_METRICS_API_KEY does not exist yet. Accepting the existing secret means
      # pointing this gate at a candidate needs no new secret — only HONUA_METRICS_URL. Inert today
      # because that variable is deliberately left unset here: aiming the gate at demo is an act for
      # AFTER demo is redeployed onto the pinned candidate, not a side effect of wiring a credential.
      HONUA_DEMO_API_KEY: { required: false }
    outputs:
      overall_status:
        description: "pass | fail | blocked | skipped"
        value: ${{ jobs.slo.outputs.status }}

permissions:
  contents: read

concurrency:
  group: gate-observability-${{ github.ref }}-${{ inputs.platform_label }}
  cancel-in-progress: true

jobs:
  slo:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.eval.outputs.status }}
    env:
      HONUA_METRICS_URL: ${{ vars.HONUA_METRICS_URL }}
      ERROR_METRIC: "honua_geoservices_error_total"
      # The denominator: the _count child of honua-server's serving-plane latency histogram, one
      # sample per served request that classifies to a Honua protocol. The previous default
      # (honua_geoservices_requests_total) was an invented name; check_slo.py returns "blocked" when
      # request_total is None, so this gate was STRUCTURALLY incapable of returning `pass`.
      REQUEST_METRIC: ${{ vars.HONUA_REQUEST_METRIC || 'honua_serving_request_duration_ms_count' }}
      # SCOPE IS NOT OPTIONAL. ERROR_METRIC counts GeoServices errors only, so the denominator must
      # count GeoServices requests only. Summed across every label set it also carries OGC/OData/
      # Admin traffic and — until honua-server stopped recording them — health probes and metric
      # scrapes, which on a day-old candidate outnumber a smoke suite ~100:1. That turns a 10% real
      # error rate into 0.09% and passes a 1% budget: fail-OPEN, worse than the no-signal state this
      # gate replaced. The selector is read from honua-server's slo-metric-contract.json (generated
      # from HonuaTelemetry.Protocols.GeoServicesFamily) so it cannot drift from the server. If it
      # cannot be resolved the gate blocks rather than falling back to an unscoped denominator.
      REQUEST_SELECTOR_KEY: "geoservices_protocols"
      MAX_ERROR_RATE: ${{ vars.HONUA_MAX_ERROR_RATE || '0.01' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # pyyaml is needed because the shared self-test module (test_slo_upgrade.py) imports
      # check_upgrade, which imports yaml at module load — without it the self-test crashes with
      # ModuleNotFoundError before the SLO logic is ever exercised (false red, not a real gate signal).
      - run: python -m pip install "pyyaml>=6.0" pytest

      - name: Self-test the SLO logic
        run: python -m pytest tools/test_slo_upgrade.py -q -k slo

      # The metric-name guard must be able to fail, so its own extraction rules are unit-tested
      # (tools/test_metric_contract.py), including the exact regression it exists to catch: an
      # alert rule dividing by a metric honua-server does not emit.
      - name: Self-test the metric-contract guard
        run: python -m pytest tools/test_metric_contract.py e2e/runner/test_runner.py -q

      - name: Clone the alert-rule consumers
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -uo pipefail
          ROOT="$RUNNER_TEMP/components"; mkdir -p "$ROOT"; echo "REPOS_ROOT=$ROOT" >> "$GITHUB_ENV"
          # honua-server (owns the contract) and honua-helm (ships the PrometheusRule) are
          # manifest-pinned components: check the CANDIDATE's alerting against the CANDIDATE's
          # server, not against whatever is on trunk today.
          for comp in honua-server honua-helm; do
            sha="$(python -c "import yaml;print(((yaml.safe_load(open('platform-manifest.yaml')).get('components',{}).get('$comp',{})) or {}).get('sha','') or '')")"
            echo "::group::checkout exact $comp @ ${sha:-<none>}"
            if [ -n "$sha" ] && bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" "$comp" "$sha" "$ROOT/$comp" 2>/tmp/clone.log; then
              echo "$comp exact checkout: $(git -C "$ROOT/$comp" rev-parse HEAD)"
            else
              echo "note: exact $comp checkout unavailable"; tail -n 3 /tmp/clone.log || true
            fi
            echo "::endgroup::"
          done
          # honua-devops is operator tooling, not a shipped platform component, so it has no
          # manifest pin — take its default branch. If the token cannot reach it (private repo),
          # its rules stay UNVERIFIED and the checker reports blocked rather than a partial pass.
          echo "::group::checkout honua-devops (default branch)"
          if git clone --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/honua-io/honua-devops.git" "$ROOT/honua-devops" 2>/tmp/devops.log; then
            git -C "$ROOT/honua-devops" remote set-url origin "https://github.com/honua-io/honua-devops.git"
            echo "honua-devops checkout: $(git -C "$ROOT/honua-devops" rev-parse HEAD)"
          else
            echo "note: honua-devops checkout unavailable"; tail -n 3 /tmp/devops.log || true
          fi
          echo "::endgroup::"

      - name: Cross-repo metric-name contract
        id: contract
        run: |
          set -uo pipefail
          if OUT="$(python tools/check_metric_contract.py --repos-root "$REPOS_ROOT" --self . 2>&1)"; then
            RC=0
          else
            RC=$?
          fi
          echo "$OUT"
          case "$RC" in
            0) STATUS=pass ;;
            1) STATUS=fail ;;
            *) STATUS=blocked ;;
          esac
          WHY="$(printf '%s\n' "$OUT" | sed -n 's/^metric-contract: //p' | head -n1)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "why=${WHY:-see log}" >> "$GITHUB_OUTPUT"
          { echo "## Observability / metric contract — ${STATUS}"; echo ""; echo "${WHY:-see log}"; } >> "$GITHUB_STEP_SUMMARY"

      # Bind the scrape to the pinned candidate BEFORE measuring anything. The identity comes from
      # the same origin as HONUA_METRICS_URL by construction (check_slo.capability_manifest_url
      # rewrites only the path), so there is no second variable that could drift to a different host.
      # The capability manifest is PUBLIC — unlike /metrics, which is Admin-authorized — so identity
      # is establishable even when the scrape credential is missing. The key is still sent when
      # present, in case a candidate locks the endpoint down.
      - name: Identify the scraped instance
        env:
          HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_METRICS_API_KEY || secrets.HONUA_DEMO_API_KEY }}
        run: |
          set -uo pipefail
          python - >> "$GITHUB_ENV" <<'PY'
          import json, os, sys, urllib.error, urllib.request
          sys.path.insert(0, "tools")
          import yaml
          from check_slo import capability_manifest_url, read_instance_revision

          # The pin. An unreadable manifest yields "" and blocks — it is never defaulted.
          try:
              with open("platform-manifest.yaml", encoding="utf-8") as handle:
                  pinned = ((yaml.safe_load(handle).get("components", {})
                             .get("honua-server", {})) or {}).get("sha", "") or ""
          except (OSError, AttributeError, ValueError, yaml.YAMLError) as exc:
              pinned, note = "", f"platform-manifest.yaml unreadable ({exc.__class__.__name__})"
          else:
              note = ""

          url = capability_manifest_url(os.environ.get("HONUA_METRICS_URL", ""))
          revision = source = ""
          if url is None:
              note = note or "HONUA_METRICS_URL unset or not an http(s) URL - no instance to identify"
          else:
              request = urllib.request.Request(url)
              request.add_header("Accept", "application/json")
              key = os.environ.get("HONUA_ADMIN_PASSWORD", "")
              if key:
                  request.add_header("X-API-Key", key)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      document = json.loads(response.read().decode("utf-8", "replace"))
              except (urllib.error.URLError, OSError, ValueError) as exc:
                  note = f"{url} unreadable ({exc.__class__.__name__})"
              else:
                  found, found_source = read_instance_revision(document)
                  revision, source = found or "", found_source or ""
                  if not revision:
                      note = f"{url} advertised no deploymentRevision"

          # Single-line, whitespace-free values only: these are shas, and GITHUB_ENV is line-oriented.
          def clean(value):
              return "".join(value.split())

          print(f"PINNED_SHA={clean(pinned)}")
          print(f"INSTANCE_REVISION={clean(revision)}")
          print(f"INSTANCE_REVISION_SOURCE={clean(source)}")
          print(f"IDENTITY_URL={clean(url or '')}")
          print(f"IDENTITY_NOTE={' '.join(note.split())}")
          PY

      # Scrape once and write each total to GITHUB_ENV as its own key. The previous
      # `read -r ERR REQ < <(...)` split one whitespace-separated line, so it only empty-guarded the
      # SECOND value: with the error metric absent and the request metric present, python printed
      # " 1000.0", `read` stripped the leading IFS whitespace, and the REQUEST total landed in ERR
      # while REQ went empty — inverting the ratio's inputs. Latent before, and activated the moment
      # the request metric started resolving.
      - name: Scrape the candidate metrics
        env:
          # honua-server maps /metrics with .RequireAuthorization("Admin"), so an unauthenticated
          # GET is a 401 that the scraper would report as "metric absent". harness.scrape_metrics_body
          # sends X-API-Key; this supplies it.
          HONUA_ADMIN_PASSWORD: ${{ secrets.HONUA_METRICS_API_KEY || secrets.HONUA_DEMO_API_KEY }}
        run: |
          set -uo pipefail
          python - >> "$GITHUB_ENV" <<'PY'
          import json, os, sys
          sys.path.insert(0, "e2e")
          from runner.harness import scrape_metrics_body, parse_metric_total, parse_label_selector

          url = os.environ.get("HONUA_METRICS_URL", "").strip()
          body = scrape_metrics_body(url) if url else None

          # The denominator's scope selector comes from the candidate server's own contract file.
          # If it cannot be resolved we emit NO request total, so the gate blocks. Falling back to an
          # unscoped denominator would be fail-open, which is the one outcome worse than no signal.
          selector, selector_why = "", ""
          contract = os.path.join(
              os.environ.get("REPOS_ROOT", ""), "honua-server",
              "observability", "slo-metric-contract.json")
          try:
              with open(contract, encoding="utf-8") as handle:
                  selector = json.load(handle)["selectors"][os.environ["REQUEST_SELECTOR_KEY"]]
          except (OSError, KeyError, ValueError) as exc:
              selector_why = f"scope selector unavailable ({exc.__class__.__name__}) - {contract}"

          def total(name, sel=None):
              if body is None:
                  return ""
              value = parse_metric_total(body, name, parse_label_selector(sel) if sel else None)
              return "" if value is None else repr(value)

          # The numerator is GeoServices-scoped by construction (honua_geoservices_error_total is
          # only incremented on GeoServices surfaces), so it takes no selector. The denominator must
          # be narrowed to match it, and yields nothing at all when the selector is unresolved.
          print(f"SCRAPED_ERR={total(os.environ['ERROR_METRIC'])}")
          print(f"SCRAPED_REQ={total(os.environ['REQUEST_METRIC'], selector) if selector else ''}")
          print(f"SCRAPED_SELECTOR={selector or selector_why}")
          PY

      - name: Evaluate the error budget
        id: eval
        env:
          CONTRACT_STATUS: ${{ steps.contract.outputs.status }}
          CONTRACT_WHY: ${{ steps.contract.outputs.why }}
        run: |
          set -uo pipefail
          ENF='${{ inputs.enforcement }}'
          ERR="${SCRAPED_ERR:-}"; REQ="${SCRAPED_REQ:-}"
          echo "scope selector: ${SCRAPED_SELECTOR:-<unresolved>}"
          echo "scraped error_total=${ERR:-<absent>} request_total=${REQ:-<absent>} (url=${HONUA_METRICS_URL:-<unset>})"
          echo "candidate identity: instance=${INSTANCE_REVISION:-<absent>} (source=${INSTANCE_REVISION_SOURCE:-<absent>}) pinned=${PINNED_SHA:-<unreadable>} via ${IDENTITY_URL:-<none>} ${IDENTITY_NOTE:+- $IDENTITY_NOTE}"
          # Raw verdict from the pure, unit-tested decision core (pass|fail|blocked). We evaluate WITHOUT
          # --require-real here and apply the enforcement policy below, so the honest dry-run skip is
          # explicit (mirrors gate-artifact-consume's dry-run-skip pattern: a publish/deploy-dependent
          # gate reports `skipped` — never a fake green — when its backing source genuinely doesn't exist).
          # Identity is a PRECONDITION inside check_slo.evaluate_gate: an unconfirmed instance
          # short-circuits to blocked and the error budget is never consulted, so no combination of
          # scraped numbers can green this gate off an instance that is not the pinned candidate.
          OUT="$(python tools/check_slo.py --error-total "$ERR" --request-total "$REQ" \
                   --max-error-rate "$MAX_ERROR_RATE" \
                   --pinned-sha "${PINNED_SHA:-}" \
                   --instance-revision "${INSTANCE_REVISION:-}" \
                   --revision-source "${INSTANCE_REVISION_SOURCE:-}")"
          RAW="$(printf '%s\n' "$OUT" | sed -n 's/^status=//p')"
          RAW_WHY="$(printf '%s\n' "$OUT" | sed -n 's/^why=//p')"
          case "$RAW" in
            pass)
              # Within budget on a real, scrapeable candidate — green.
              STATUS=pass;  WHY="$RAW_WHY"; RC=0 ;;
            fail)
              # A genuine error-budget breach is RED in both modes (this is the gate's whole point).
              STATUS=fail;  WHY="$RAW_WHY"; RC=1 ;;
            *)
              # blocked == no TRUSTWORTHY SLO source. Two ways to get here, and RAW_WHY says which:
              #   * no source at all — HONUA_METRICS_URL unset / nothing scrapeable / in-band error
              #     metric not wired (server#2243);
              #   * a source that is not the candidate — the scraped instance's deploymentRevision
              #     does not match the pinned honua-server.sha, or could not be read. RAW_WHY names
              #     both shas. This is NOT a lesser outcome than "nothing deployed": a wrong-build
              #     error budget is worse than no error budget, because it looks like an answer.
              # In a dry-run bootstrap cut there is genuinely no candidate deploy, so this is an honest
              # SKIP (does not fake green, does not redden the train). A real cut (strict) MUST have a
              # live SLO source that proved it is the candidate, so there it stays a hard FAIL.
              if [ "$ENF" = "strict" ]; then
                STATUS=fail;    WHY="no confirmed SLO source on a real cut — $RAW_WHY"; RC=1
              else
                STATUS=skipped; WHY="no confirmed staging SLO source — dry run: $RAW_WHY"; RC=0
              fi ;;
          esac
          # Fold in the metric-name contract. It is deployment-independent and deterministic, so a
          # DRIFT is a real, present defect — alerting that cannot fire — and overrides a green or
          # skipped SLO verdict in BOTH modes. A BLOCKED contract (a consumer checkout was
          # unavailable, or the manifest-pinned honua-server predates the contract file) is treated
          # like every other missing source: honest skip in bootstrap, hard fail under strict.
          case "${CONTRACT_STATUS:-blocked}" in
            pass) ;;
            fail)
              STATUS=fail; WHY="metric-name contract drift — ${CONTRACT_WHY:-see log}"; RC=1 ;;
            *)
              if [ "$ENF" = "strict" ]; then
                STATUS=fail; WHY="metric contract unverified on a real cut — ${CONTRACT_WHY:-see log}"; RC=1
              else
                [ "$STATUS" = "pass" ] && { STATUS=skipped; RC=0; }
                WHY="$WHY (metric contract unverified: ${CONTRACT_WHY:-see log})"
              fi ;;
          esac
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          { echo "## Observability / SLO — ${STATUS:-unknown}"; echo ""; echo "$WHY"; } >> "$GITHUB_STEP_SUMMARY"
          echo "SLO: $STATUS — $WHY"
          exit "$RC"
