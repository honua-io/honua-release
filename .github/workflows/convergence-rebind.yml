name: convergence-rebind

# Read-only PLAN of a protocol-certification convergence for the committed manifest.
# The nightly (nightly-certification.yml, honua-release#386) stages the catalog at the candidate it
# resolved, dispatches the producers, aggregates the ledger in honua-evidence and binds it into the
# candidate before freeze. Ruling R18 forbids a hand rebind, so nothing here stages a catalog,
# dispatches aggregation, opens a pull request or writes a repository variable; the
# PROTOCOL_CERTIFICATION_* variables are read-only history.

on:
  workflow_dispatch:
    inputs:
      receipt_min:
        description: "Minimum receipt schema"
        required: true
        type: choice
        default: keep
        options: [keep, v1, v2]

permissions:
  contents: read

concurrency:
  group: convergence-rebind
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validator dependencies
        run: python -m pip install "jsonschema>=4.23" "pyyaml>=6.0"
      - name: Plan convergence rebind
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_MIN: ${{ inputs.receipt_min }}
        run: python tools/convergence_rebind.py --receipt-min "$RECEIPT_MIN"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: convergence-rebind-plan
          path: rebind-plan.json
          if-no-files-found: error
