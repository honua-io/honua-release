name: convergence-rebind-activate

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  activate:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'convergence-rebind/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
      - name: Read and verify the merged binding
        id: binding
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          import yaml
          manifest = yaml.safe_load(open("platform-manifest.yaml"))
          ledger = manifest["protocolCertification"]["ledger"]
          values = {"matrix_commit": ledger["commit"], "matrix_sha256": ledger["sha256"], "requirements_revision": ledger["requirementsSourceRevision"]}
          assert re.fullmatch(r"[0-9a-f]{40}", values["matrix_commit"])
          assert re.fullmatch(r"sha256:[0-9a-f]{64}", values["matrix_sha256"])
          assert re.fullmatch(r"[0-9a-f]{40}", values["requirements_revision"])
          callers = [".github/workflows/pr-protocol-certification.yml", ".github/workflows/nightly-protocol-certification.yml", ".github/workflows/release-train.yml"]
          needle = "gate-protocol-certification.yml@" + values["requirements_revision"]
          assert all(needle in open(path).read() for path in callers)
          for key, value in values.items(): print(f"{key}={value}")
          PY
      - name: Prove the staged requirements commit landed on trunk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/${{ steps.binding.outputs.requirements_revision }}...${{ github.event.pull_request.merge_commit_sha }}" --jq .status)"
          [ "$status" = "ahead" ] || [ "$status" = "identical" ] || { echo "::error::The rebind PR was not rebase-merged; refusing variable activation."; exit 1; }
      - name: Activate the reviewed variables together
        env:
          GH_TOKEN: ${{ secrets.HONUA_RELEASE_AUTOMATION_TOKEN }}
        run: |
          set -euo pipefail
          gh variable set PROTOCOL_CERTIFICATION_MATRIX_COMMIT --repo "$GITHUB_REPOSITORY" --body '${{ steps.binding.outputs.matrix_commit }}'
          gh variable set PROTOCOL_CERTIFICATION_MATRIX_SHA256 --repo "$GITHUB_REPOSITORY" --body '${{ steps.binding.outputs.matrix_sha256 }}'
          gh variable set PROTOCOL_CERTIFICATION_REQUIREMENTS_SOURCE_REVISION --repo "$GITHUB_REPOSITORY" --body '${{ steps.binding.outputs.requirements_revision }}'
