# Genuine-model terminal canary (honua-release#161, fix unit J3 of the 2026.1 rc.3 plan).
#
# Claude on Bedrock drives the imported #123 journey only through the candidate server's signed
# StudioAi proxy. Every receipt is one attempt on one cell, bound to the platform-lock digest it ran
# against, and attributes a failure to the model or to infrastructure.
#
#   schedule / dispatch target=local-docker  -> the deterministic #123 journey, then the canary, in one
#                                               job on the candidate compose stack (Bedrock via OIDC)
#   dispatch / call target=aws-ecs/redis-off -> e2e-cloud-aws on the ECS Redis-off cell with Bedrock
#                                               enabled; the cell's journey job runs the canary after
#                                               the cell journey (e2e/run_cloud.py --phase model-canary)
#   dispatch target=endpoint                 -> the original harness against an operator-named endpoint
#
# The nightly train runs the ECS Redis-off canary inside its own cloud cell (release-train.yml
# gate_cloud_parity with genuine_model_bedrock), because the cell's ingress admits only that run's journey
# runner and its artifact names are per run; its row becomes promotion-receipts/nightly-model-journey.
name: Terminal model canary harness

on:
  schedule:
    # 08:45 UTC: after the nightly deterministic local-docker (07:00) and cloud (07:17) journeys.
    # The schedule supplies no inputs and runs the local-docker canary bound to the server image it runs.
    - cron: "45 8 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: Cell to run, or endpoint for an operator-named candidate endpoint
        required: true
        type: choice
        default: local-docker
        options:
          - local-docker
          - aws-ecs/redis-off
          - endpoint
      lock_digest:
        description: sha256:<hex> of the platform lock under certification; empty binds the manifest-pinned server image the job runs
        required: false
        type: string
      runner:
        description: (endpoint) Hosted runner for a reachable hosted endpoint, or self-hosted for a local endpoint
        required: false
        type: choice
        default: ubuntu-latest
        options:
          - ubuntu-latest
          - self-hosted
      base_url:
        description: (endpoint) Candidate Honua API base URL; direct provider URLs and empty values fail certification
        required: false
        type: string
      model:
        description: Endpoint model identifier; empty uses the repository variable or the Sonnet 4.5 profile
        required: false
        type: string
      authentication:
        description: (endpoint) Use none for local endpoints or bearer for the hosted key secret
        required: false
        type: choice
        default: none
        options:
          - none
          - bearer
      runtime:
        description: Runtime identifier recorded in the receipt
        required: false
        type: string
      quantization:
        description: Quantization identifier recorded in the receipt
        required: false
        type: string
      deterministic_receipt:
        description: (endpoint) Repository-local path to the green #123 receipt for this exact candidate
        required: false
        type: string
      inject_stage:
        description: Optional #123 journey stage ID; defaults to the fourth imported stage
        required: false
        type: string
  workflow_call:
    inputs:
      target:
        description: local-docker | aws-ecs/redis-off
        required: true
        type: string
      lock_digest:
        description: sha256:<hex> of the exact platform-lock.json under certification
        required: true
        type: string
      candidate_ref:
        description: Nightly candidate snapshot to certify instead of the checkout's manifest
        required: false
        type: string
        default: ""
    secrets:
      RELEASE_GH_TOKEN:
        required: false
      TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED:
        required: false

permissions:
  contents: read

env:
  # Claude Sonnet 4.5 cross-region inference profile: the honua-iac bedrock_ai_model default.
  TERMINAL_MODEL_DEFAULT: us.anthropic.claude-sonnet-4-5-20250929-v1:0
  TERMINAL_MODEL_BEDROCK_REGION: us-east-1

jobs:
  harness:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'endpoint'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      TERMINAL_MODEL_BASE_URL: ${{ inputs.base_url || vars.TERMINAL_MODEL_BASE_URL }}
      TERMINAL_MODEL_NAME: ${{ inputs.model || vars.TERMINAL_MODEL_NAME }}
      TERMINAL_MODEL_RUNTIME: ${{ inputs.runtime || vars.TERMINAL_MODEL_RUNTIME }}
      TERMINAL_MODEL_QUANTIZATION: ${{ inputs.quantization || vars.TERMINAL_MODEL_QUANTIZATION }}
      # Trust anchor is platform-controlled, never discovered from the candidate endpoint itself.
      TERMINAL_MODEL_SIGNING_MANIFEST_SHA256: ${{ vars.TERMINAL_MODEL_SIGNING_MANIFEST_SHA256 }}
      TERMINAL_MODEL_API_KEY: ${{ secrets.TERMINAL_MODEL_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=45.0"
      - name: Run harness against the imported #123 journey contract
        shell: bash
        env:
          DETERMINISTIC_RECEIPT: ${{ inputs.deterministic_receipt }}
          INJECT_STAGE: ${{ inputs.inject_stage }}
          MODEL_AUTHENTICATION: ${{ inputs.authentication }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
        run: |
          args=(
            --manifest platform-manifest.yaml
            --journey certification/terminal-journey/journey.v1.json
            --driver-protocol certification/terminal-model-canary/driver-protocol.v1.json
            --receipt-schema certification/terminal-model-canary/receipt.schema.json
            --output artifacts/terminal-model-canary-receipt.json
          )
          [ -n "$DETERMINISTIC_RECEIPT" ] && args+=(--deterministic-receipt "$DETERMINISTIC_RECEIPT")
          [ -n "$INJECT_STAGE" ] && args+=(--inject-stage "$INJECT_STAGE")
          [ -n "$LOCK_DIGEST" ] && args+=(--lock-digest "$LOCK_DIGEST")
          if [ "$MODEL_AUTHENTICATION" = "bearer" ]; then
            args+=(--require-api-key)
          else
            args+=(--no-api-key)
          fi
          python tools/terminal_model_canary.py "${args[@]}"
      - name: Upload harness receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-model-canary-harness-receipt
          path: artifacts/terminal-model-canary-receipt.json
          if-no-files-found: error

  # ── local-docker: deterministic #123 journey, then the genuine-model canary, in this one job ───────
  local-docker:
    if: github.event_name == 'schedule' || inputs.target == 'local-docker'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write                 # OIDC -> the Bedrock-enabled role; no static AWS keys
    env:
      TERMINAL_MODEL_NAME: ${{ inputs.model || vars.TERMINAL_MODEL_NAME || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
      TERMINAL_MODEL_RUNTIME: ${{ inputs.runtime || 'aws-bedrock' }}
      TERMINAL_MODEL_QUANTIZATION: ${{ inputs.quantization || 'provider-managed' }}
      # Trust anchor: SHA-256 of the canonical transcript-signing manifest the candidate publishes
      # for the key below. Platform-controlled, never discovered from the candidate.
      TERMINAL_MODEL_SIGNING_MANIFEST_SHA256: ${{ vars.TERMINAL_MODEL_SIGNING_MANIFEST_SHA256 }}
      # targets/build-compose.yml routes the candidate's StudioAiProxy to Bedrock from these.
      HONUA_CANARY_STUDIO_AI_ENABLED: "true"
      HONUA_CANARY_BEDROCK_MODEL: ${{ inputs.model || vars.TERMINAL_MODEL_NAME || 'us.anthropic.claude-sonnet-4-5-20250929-v1:0' }}
      HONUA_CANARY_BEDROCK_REGION: us-east-1
      HONUA_CANARY_TRANSCRIPT_KEY_ID: terminal-model-canary
      HONUA_CANARY_TRANSCRIPT_KEY_REFERENCE: env://HONUA_CANARY_TRANSCRIPT_SIGNING_SEED
      HONUA_CANARY_TRANSCRIPT_SIGNING_SEED: ${{ secrets.TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED }}
      GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Install harness dependencies
        run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=45.0"

      # A caller certifying a lock passes it, and the receipt counts only for that lock. A scheduled
      # or unbound dispatch binds the server image it actually runs (operator ruling 2026-10-22: rc
      # gates need one green trunk run against any build, not a minted nightly lock). The deterministic
      # journey and the driver both compose exactly this image@digest from platform-manifest.yaml, the
      # deterministic receipt is checked against it, and the canary records it as serverImage.
      - name: Select the binding under certification
        id: lock
        env:
          LOCK_DIGEST: ${{ inputs.lock_digest }}
        run: |
          set -euo pipefail
          if [ -n "$LOCK_DIGEST" ]; then
            [[ "$LOCK_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::lock_digest must be sha256:<hex>"; exit 1; }
            echo "digest=$LOCK_DIGEST" >> "$GITHUB_OUTPUT"
            echo "binding platform lock ${LOCK_DIGEST}"
            exit 0
          fi
          image="$(python - <<'PY'
          import re, yaml
          server = yaml.safe_load(open("platform-manifest.yaml"))["components"]["honua-server"]
          digest = str(server.get("digest") or "")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest) or not server.get("image"):
              raise SystemExit("platform-manifest.yaml pins no honua-server image digest to bind")
          print(f"{str(server['image']).split('@', 1)[0]}@{digest}")
          PY
          )"
          echo "digest=" >> "$GITHUB_OUTPUT"
          echo "binding server image ${image}"
          echo "### Canary binding: server image \`${image}\`" >> "$GITHUB_STEP_SUMMARY"

      # Protocol: the canary requires a green deterministic receipt for this exact candidate from
      # within 24 hours. It is produced here, in the same job, before any AWS credential exists.
      - name: "Run the deterministic #123 journey on the candidate stack"
        id: deterministic
        run: |
          set -uo pipefail
          # A red journey must not skip the canary step: the canary validates this receipt and
          # writes its own refused (blocked/fail, attributed) receipt, which fails the job.
          rc=0
          python certification/terminal-journey/run.py --mode live \
            --target certification/terminal-journey/targets/local-docker.json \
            --workdir "$RUNNER_TEMP/terminal-journey" \
            --output artifacts/terminal-journey-receipt.json \
            --evidence-uri "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" || rc=$?
          echo "exit=$rc" >> "$GITHUB_OUTPUT"
          [ "$rc" -eq 0 ] || echo "::warning::deterministic #123 journey exited $rc; the canary will refuse it"

      # Credentials go to the candidate server container only, under non-ambient names that
      # targets/build-compose.yml maps to AWS_*; no AWS_* variable enters this job's environment.
      - name: Assume the Bedrock-enabled role (OIDC)
        id: aws
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1
          output-credentials: true
          output-env-credentials: false

      - name: Run the genuine-model canary (Claude on Bedrock via the candidate proxy)
        id: canary
        env:
          HONUA_CANARY_AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          HONUA_CANARY_AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          HONUA_CANARY_AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          LOCK_DIGEST: ${{ steps.lock.outputs.digest }}
          INJECT_STAGE: ${{ inputs.inject_stage }}
        run: |
          set -uo pipefail
          args=(
            --manifest platform-manifest.yaml
            --journey certification/terminal-journey/journey.v1.json
            --driver-protocol certification/terminal-model-canary/driver-protocol.v1.json
            --receipt-schema certification/terminal-model-canary/receipt.schema.json
            --base-url "http://127.0.0.1:8137/api"
            --no-api-key
            --cell local-docker
            --attempt 1
            --output artifacts/terminal-model-canary-receipt.json
          )
          # Without a caller's lock the receipt binds the composed server image (serverImage).
          [ -n "$LOCK_DIGEST" ] && args+=(--lock-digest "$LOCK_DIGEST")
          [ -n "${INJECT_STAGE:-}" ] && args+=(--inject-stage "$INJECT_STAGE")
          # A red deterministic run leaves no green receipt: the canary is then refused (blocked).
          [ -f artifacts/terminal-journey-receipt.json ] && \
            args+=(--deterministic-receipt artifacts/terminal-journey-receipt.json)
          python tools/terminal_model_canary.py "${args[@]}"
      - name: Upload the deterministic and canary receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-model-canary-local-docker-${{ github.run_attempt }}
          path: |
            artifacts/terminal-journey-receipt.json
            artifacts/terminal-model-canary-receipt.json
          if-no-files-found: warn

  # ── aws-ecs/redis-off: the ECS Redis-off cell with Bedrock, canary after the cell journey ──────────
  # A cloud cell certifies the candidate it deploys, so it binds only a lock named by its caller.
  cloud-lock-required:
    if: github.event_name != 'schedule' && inputs.target == 'aws-ecs/redis-off' && inputs.lock_digest == ''
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error::the aws-ecs/redis-off canary needs lock_digest (sha256:<hex> of the lock its candidate pins)"
          exit 1

  aws-ecs:
    if: github.event_name != 'schedule' && inputs.target == 'aws-ecs/redis-off' && inputs.lock_digest != ''
    permissions:
      contents: read
      actions: write                  # e2e-cloud-aws's top-level scope (iac-live dispatch)
      id-token: write                 # OIDC -> AWS for provision / admit / teardown only
    uses: ./.github/workflows/e2e-cloud-aws.yml
    with:
      candidate_ref: ${{ inputs.candidate_ref || '' }}
      require_real: true
      target: aws-ecs
      redis_mode: "off"
      run_iac_live: false
      genuine_model_bedrock: true
      lock_digest: ${{ inputs.lock_digest }}
    secrets: inherit
