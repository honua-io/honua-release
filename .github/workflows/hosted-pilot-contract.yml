name: Hosted pilot preparation contract

on:
  pull_request:
    paths:
      - certification/hosted-pilot/**
      - .github/workflows/hosted-pilot-contract.yml
  push:
    branches: [trunk]
    paths:
      - certification/hosted-pilot/**
      - .github/workflows/hosted-pilot-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
          terraform_wrapper: false
      - name: Validate private infrastructure preparation without cloud credentials
        working-directory: certification/hosted-pilot
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false -lockfile=readonly -no-color
          terraform validate -no-color
          terraform test -no-color
