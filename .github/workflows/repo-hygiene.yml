name: Repository hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repo-hygiene:
    uses: honua-io/.github/.github/workflows/repo-hygiene.yml@3818ed9f9287df73993caac150ea1bcf5259ad95 # v1 - repository hygiene policy interface (three-ticket bundle rule)
