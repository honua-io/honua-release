name: Agent E2E contract tests

on:
  pull_request:
    paths:
      - '.github/workflows/agent-e2e-contracts.yml'
      - '.github/workflows/agent-e2e-campaign.yml'
      - '.gitattributes'
      - 'certification/agent-e2e/**'
      - 'schemas/agent-e2e*'
      - 'tools/agent_e2e*.py'
      - 'tools/test_agent_e2e*.py'
      - 'tools/conftest.py'
      - 'tools/*agent_e2e*.py'
      - 'tools/*promotion*.py'
      - 'tools/*mint_nightly_lock.py'
      - 'tools/*candidate_binding.py'
      - 'tools/test_workflow_contracts.py'
      - 'certification/promotion-evidence.v1.schema.json'
      - '.github/workflows/gate-agent-e2e.yml'
      - '.github/workflows/release-train.yml'
      - '.github/workflows/nightly-certification.yml'
      - 'e2e/fixtures/large_import.py'
  push:
    branches: [trunk]
    paths:
      - '.github/workflows/agent-e2e-contracts.yml'
      - '.github/workflows/agent-e2e-campaign.yml'
      - '.gitattributes'
      - 'certification/agent-e2e/**'
      - 'schemas/agent-e2e*'
      - 'tools/agent_e2e*.py'
      - 'tools/test_agent_e2e*.py'
      - 'tools/conftest.py'
      - 'tools/*agent_e2e*.py'
      - 'tools/*promotion*.py'
      - 'tools/*mint_nightly_lock.py'
      - 'tools/*candidate_binding.py'
      - 'tools/test_workflow_contracts.py'
      - 'certification/promotion-evidence.v1.schema.json'
      - '.github/workflows/gate-agent-e2e.yml'
      - '.github/workflows/release-train.yml'
      - '.github/workflows/nightly-certification.yml'
      - 'e2e/fixtures/large_import.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-e2e-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-fixture-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
      HONUA_AGENT_POSTGRES_TESTS: '1'
      HONUA_AGENT_POSTGRES_TEST_IMAGE: postgis/postgis@sha256:b4466ea2ba7e3af54fcbba996d45325720f4b3ecb4f43f99b2f41367dc196f23
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install PostgreSQL contract dependencies
        run: python -m pip install 'pytest>=8,<10' 'psycopg[binary]>=3.2,<4'
      - name: Fetch immutable local PostgreSQL fixture
        run: docker pull "$HONUA_AGENT_POSTGRES_TEST_IMAGE"
      - name: Prove actual transactions, rollback and independent SQL absence
        # Local contract fixtures only; no model calls or cloud infrastructure.
        run: |
          set -euo pipefail
          python -m pytest --import-mode=importlib tools/test_agent_e2e_fixture_database.py \
            tools/test_agent_e2e_studio_tenant_database.py \
            -q --junitxml=agent-e2e-postgres-contracts.xml
          python - <<'PY'
          import xml.etree.ElementTree as ET
          suites = list(ET.parse('agent-e2e-postgres-contracts.xml').getroot().iter('testsuite'))
          assert sum(int(suite.get('tests', 0)) for suite in suites) >= 12
          assert sum(int(suite.get('skipped', 0)) for suite in suites) == 0
          PY
      - name: Retain actual PostgreSQL contract results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-e2e-postgres-contracts-${{ github.run_attempt }}
          path: agent-e2e-postgres-contracts.xml
          if-no-files-found: error
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: tools
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install unit-test dependency
        run: |
          python -m pip install --require-hashes -r certification/hosted-pilot/controller/requirements.txt
          python -m pip install 'pytest>=8,<10'
      - name: Check controller contracts and corpus oracles
        # These are offline tests with fixture model responses, never live E2E evidence.
        # Explicit files avoid collecting unrelated conformance/cloud suites.
        run: >-
          python -m pytest --import-mode=importlib
          tools/test_agent_e2e*.py tools/test_verify_agent_e2e_campaign.py
          tools/test_candidate_binding.py tools/test_check_promotion_readiness.py
          tools/test_mint_nightly_lock.py tools/test_fetch_promotion_evidence.py
          tools/test_workflow_contracts.py certification/agent-e2e/test_corpus.py
          -q --junitxml=agent-e2e-contracts.xml
      - name: Retain actual unit-test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-e2e-contracts-${{ github.run_attempt }}
          path: agent-e2e-contracts.xml
          if-no-files-found: error
      - name: Build isolated container runtime from allowlisted files
        run: |
          python tools/bundle_agent_e2e_container.py --output "$RUNNER_TEMP/agent-worker-context"
          docker build --platform linux/amd64 -t honua-agent-worker:contract "$RUNNER_TEMP/agent-worker-context"
      - name: Exercise actual non-root container boundaries
        # Fixed smoke commands only; these are not scenario/model qualification.
        run: |
          docker run --rm -i --read-only --cap-drop ALL --security-opt no-new-privileges \
            --network none --memory 512m --cpus 0.25 --pids-limit 64 \
            -e HONUA_AGENT_TRANSPORT=private-canary -e AWS_SECRET_ACCESS_KEY=private-canary \
            honua-agent-worker:contract python -I - < tools/smoke_agent_e2e_container.py
