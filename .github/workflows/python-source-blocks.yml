name: Python controlled source blocks

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: python-controlled-source-blocks
  cancel-in-progress: false

jobs:
  execute:
    # No privileged credential or arbitrary code/ref is accepted from a PR.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/trunk' && github.repository == 'honua-io/honua-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare fixed public implementation and subject without credentials
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'certification/executable-docs')
          from python_source_inputs import selected_inputs
          selection, _ = selected_inputs()
          for name, revision in [('implementation', selection['producer']['sourceSha']), ('subject', selection['subject']['sourceSha'])]:
              target = Path(os.environ['RUNNER_TEMP']) / ('python-block-' + name)
              subprocess.run(['git', 'clone', '--no-checkout', 'https://github.com/honua-io/honua-sdk-python.git', str(target)], check=True)
              subprocess.run(['git', '-C', str(target), 'checkout', '--detach', revision], check=True)
          subprocess.run(['docker', 'pull', '--platform', 'linux/amd64', 'python:3.12-bookworm@' + selection['image']['indexDigest']], check=True)
          PY
      - name: Check real immutable runtime and original action layout before fetching large inputs
        run: >-
          python certification/executable-docs/exercise_python_source_runtime.py
          --implementation "$RUNNER_TEMP/python-block-implementation"
          --subject "$RUNNER_TEMP/python-block-subject"
          --output "$RUNNER_TEMP/python-block-native-control"
      - name: Fetch only the selected protected producer witness
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: >-
          python certification/executable-docs/fetch_python_source_inputs.py
          --output "$RUNNER_TEMP/python-block-fetch"
      - name: Execute original source blocks using the declared immutable recipe
        # No credential enters the private controller or any document container.
        run: >-
          python certification/executable-docs/python_source_session.py
          --fetch "$RUNNER_TEMP/python-block-fetch"
          --implementation "$RUNNER_TEMP/python-block-implementation"
          --subject "$RUNNER_TEMP/python-block-subject"
          --output "$RUNNER_TEMP/python-block-execution"
      - name: Retain original source-block proof and refusal records
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-controlled-source-blocks
          path: |
            ${{ runner.temp }}/python-block-native-control/**/*.json
            ${{ runner.temp }}/python-block-native-control/**/stdout
            ${{ runner.temp }}/python-block-native-control/**/stderr
            ${{ runner.temp }}/python-block-fetch/*.json
            ${{ runner.temp }}/python-block-execution/*.json
            ${{ runner.temp }}/python-block-execution/node-prerequisite/*.json
            ${{ runner.temp }}/python-block-execution/node-prerequisite/command-*.stdout
            ${{ runner.temp }}/python-block-execution/node-prerequisite/command-*.stderr
            ${{ runner.temp }}/python-block-execution/request/*
            ${{ runner.temp }}/python-block-execution/controller/*
            ${{ runner.temp }}/python-block-execution/evidence/*
            ${{ runner.temp }}/python-block-execution/wire/*
            ${{ runner.temp }}/python-block-execution/reader-*/stdout
            ${{ runner.temp }}/python-block-execution/reader-*/stderr
            ${{ runner.temp }}/python-block-execution/reader-*/*.json
            ${{ runner.temp }}/python-block-execution/reader-*/bridge/context.json
            ${{ runner.temp }}/python-block-execution/reader-*/bridge/original-block.sh
            ${{ runner.temp }}/python-block-execution/reader-*/bridge/node-prerequisite.json
            ${{ runner.temp }}/python-block-execution/reader-*/state/*
            ${{ runner.temp }}/python-block-execution/clone-staging/*/command-*
          if-no-files-found: error
          retention-days: 14
