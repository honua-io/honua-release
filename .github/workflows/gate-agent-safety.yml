# Release gate - security-agent-default-deny (certification/RELEASE-PROMISE.md).
#
# Boots the exact candidate image@digest with the e2e compose harness (as gate-contract-live does),
# mints an agent-kind API key and walks every state-changing operation in the candidate's catalog
# and every mutating admin route as that agent (tools/agent_safety_gate.py). The receipt passes only
# when every operation came back as a proposal, no direct route call succeeded, the proposals and
# refusals name the agent in the audit, and the administrator state is unchanged.
name: gate-agent-safety
run-name: Agent safety ${{ inputs.server_sha }}
on:
  workflow_dispatch:
    inputs:
      server_sha: { required: true, type: string }
      server_digest: { required: true, type: string }
      platform_lock_digest: { required: true, type: string }
permissions:
  contents: read
  packages: read
concurrency:
  group: gate-agent-safety-${{ github.ref }}
  cancel-in-progress: false
jobs:
  walk:
    if: github.repository == 'honua-io/honua-release' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML
      # The candidate's committed agent route rule list says which governed routes apply their own
      # agent rule. Only a commit already on honua-server trunk is accepted.
      - name: Fetch the candidate's agent route rules
        env:
          SERVER_SHA: ${{ inputs.server_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SERVER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "server_sha must be a full commit SHA" >&2; exit 1; }
          status=$(gh api "repos/honua-io/honua-server/compare/${SERVER_SHA}...trunk" --jq .status)
          [[ "$status" == ahead || "$status" == identical ]] || { echo "server_sha is not on honua-server trunk ($status)" >&2; exit 1; }
          mkdir -p server/tests/dotnet/Honua.Server.Tests/Features/Security
          gh api -H 'Accept: application/vnd.github.raw' \
            "repos/honua-io/honua-server/contents/tests/dotnet/Honua.Server.Tests/Features/Security/agent-route-rules.txt?ref=${SERVER_SHA}" \
            > server/tests/dotnet/Honua.Server.Tests/Features/Security/agent-route-rules.txt
      - name: Resolve the candidate image@digest
        id: image
        env:
          SERVER_DIGEST: ${{ inputs.server_digest }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re, yaml
          server = yaml.safe_load(open('platform-manifest.yaml', encoding='utf-8'))['components']['honua-server']
          image, digest = str(server.get('image') or ''), str(server.get('digest') or '')
          wanted = os.environ['SERVER_DIGEST']
          if not re.fullmatch(r'sha256:[0-9a-f]{64}', wanted) or digest != wanted:
              raise SystemExit('server_digest is not the platform-manifest.yaml honua-server digest')
          repo = image.split('@', 1)[0]
          repo = repo.rsplit(':', 1)[0] if ':' in repo.rsplit('/', 1)[-1] else repo
          print(f'ref={repo}@{digest}')
          PY
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Boot the exact candidate
        env:
          HONUA_SERVER_IMAGE: ${{ steps.image.outputs.ref }}
          E2E_OUT: ${{ runner.temp }}/agent-safety
          E2E_COMPOSE_EXTRA: e2e/harness/compose.agent-safety.yml
        run: |
          bash e2e/harness/boot.sh up
          cid="$(docker compose -f e2e/harness/compose.candidate.yml ps -q server | head -1)"
          repo="${HONUA_SERVER_IMAGE%%@*}"
          docker image inspect --format '{{join .RepoDigests "\n"}}' "$(docker inspect --format '{{.Image}}' "$cid")" \
            | grep -qxF "${repo}@${HONUA_SERVER_IMAGE##*@}" || { echo "the running server is not ${HONUA_SERVER_IMAGE}" >&2; exit 1; }
      # The walk seeds the state its fixtures name (tools/agent_safety_seed.py) before it starts.
      - name: Walk every mutating route as an agent
        env:
          SERVER_SHA: ${{ inputs.server_sha }}
          SERVER_DIGEST: ${{ inputs.server_digest }}
          LOCK_DIGEST: ${{ inputs.platform_lock_digest }}
          SERVER_CHECKOUT: server
        run: python tools/agent_safety_gate.py
      - name: Stop the candidate
        if: always()
        run: bash e2e/harness/boot.sh down || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-promise-receipts
          path: security-agent-default-deny.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-safety-report
          path: agent-safety-report.json
          if-no-files-found: ignore
          retention-days: 7
