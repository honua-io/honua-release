name: rollback-certification

on:
  workflow_dispatch:
    inputs:
      candidate_lock_artifact:
        description: >-
          Name of an uploaded artifact holding frozen-lock/platform-lock.json to certify. Empty
          (the default for a manual run) means use the checked-out platform-manifest.yaml /
          compatibility-matrix.yaml / platform-lock.json on this ref instead.
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      candidate_lock_artifact:
        description: >-
          Name of the uploaded artifact holding frozen-lock/platform-lock.json to certify. Empty
          means use the checked-out candidate inputs instead of downloading an artifact.
        required: false
        type: string
        default: "candidate-manifest"
    outputs:
      overall_status:
        description: "pass | fail"
        value: ${{ jobs.certify.outputs.overall_status }}

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  certify:
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.verdict.outputs.overall_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest

      - name: Download the frozen candidate inputs
        if: inputs.candidate_lock_artifact != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.candidate_lock_artifact }}
          path: _candidate

      # The train's freeze job lands the certifiable lock (real or labelled dry-run) under
      # frozen-lock/ inside the artifact; flatten it here so every later step reads one path
      # regardless of which branch above populated _candidate.
      - name: Flatten the train-frozen lock
        if: inputs.candidate_lock_artifact != ''
        run: cp _candidate/frozen-lock/platform-lock.json _candidate/platform-lock.json

      - name: Use checked-out candidate inputs for a manual certification
        if: inputs.candidate_lock_artifact == ''
        run: |
          set -euo pipefail
          mkdir -p _candidate
          cp platform-manifest.yaml compatibility-matrix.yaml platform-lock.json _candidate/

      - name: Resolve and verify retained lock A and frozen lock B
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p out/rollback-certification
          echo '{"schema":"honua.rollback-gate/v1","overall_status":"fail","finding":"ROLLBACK_CANDIDATE_ATTESTATION_FAILED"}' > out/rollback-certification/gate-report.json
          gh attestation verify _candidate/platform-lock.json --repo "$GITHUB_REPOSITORY" > out/rollback-certification/candidate-lock-verification.log
          python tools/release_rollback_target.py \
            --candidate _candidate/platform-lock.json \
            --target _rollback-target/platform-lock.json \
            --repository "$GITHUB_REPOSITORY" \
            --report out/rollback-certification/gate-report.json

      # Retain exact verified bytes before exercising the consumer path. A dry run only
      # publishes a run artifact; promotion already publishes the real lock as a release asset.
      - name: Retain the candidate rollback target
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: retained-rollback-target
          path: _rollback-target/platform-lock.json
          retention-days: 90
          if-no-files-found: error

      - name: Retrieve the retained rollback target
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: retained-rollback-target
          path: _retained

      - name: Verify the retained target after retrieval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify _retained/platform-lock.json --repo "$GITHUB_REPOSITORY" > out/rollback-certification/retained-lock-verification.log
          cmp _rollback-target/platform-lock.json _retained/platform-lock.json

      - name: Prove durable one-operation semantics
        run: python -m pytest tools/test_release_rollback.py -q

      - name: Execute lock B to retained lock A with restart and mixed-state injection
        run: |
          python tools/certify_release_rollback.py \
            --output out/rollback-certification \
            --from-lock _retained/platform-lock.json \
            --to-lock _candidate/platform-lock.json \
            --candidate-manifest _candidate/platform-manifest.yaml \
            --compatibility-matrix _candidate/compatibility-matrix.yaml \
            --gate-report out/rollback-certification/gate-report.json

      - name: Assert terminal receipts and candidate bindings
        id: verdict
        run: |
          set -euo pipefail
          jq -e '.status == "Succeeded" and (.functionalSmoke | all)' \
            out/rollback-certification/success-receipt.json >/dev/null
          jq -e '.status == "ManualInterventionRequired" and ([.children[] | select(.state == "Failed")] | length) > 0' \
            out/rollback-certification/mixed-state-receipt.json >/dev/null
          jq -e '.restartCount == 1' out/rollback-certification/success-receipt.json >/dev/null
          jq -e '.sourceInputs.platformManifest and .sourceInputs.compatibilityMatrix' \
            out/rollback-certification/success-receipt.json >/dev/null
          jq -e '.overall_status == "pass" and
            (if .first_lock_bearing_release then
              .no_earlier_lock_exists and .candidate_lock_digest == .rollback_target_digest and .post_rollback_state_equals_lock
            else .candidate_lock_digest != .rollback_target_digest end)' out/rollback-certification/gate-report.json >/dev/null
          echo "overall_status=pass" >> "$GITHUB_OUTPUT"

      - name: Sign successful rollback receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: out/rollback-certification/success-receipt.json

      - name: Sign injected mixed-state negative receipt
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v3.0.0
        with:
          subject-path: out/rollback-certification/mixed-state-receipt.json

      - name: Record rollback finding and summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          python - <<'PYREPORT'
          import json, os
          from pathlib import Path
          path = Path("out/rollback-certification/gate-report.json")
          report = json.loads(path.read_text()) if path.exists() else {"schema": "honua.rollback-gate/v1"}
          if os.environ["JOB_STATUS"] != "success":
              report["overall_status"] = "fail"
              report.setdefault("finding", "ROLLBACK_WORKFLOW_STEP_FAILED: inspect the failed certification step")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(report, indent=2) + "\n")
          if report.get("first_lock_bearing_release"):
              sentence = f"First lock-bearing release: no earlier attested platform lock exists; self-rollback to retained candidate {report['candidate_lock_digest']}: {report['overall_status']}."
          else:
              sentence = f"Retained-lock rollback certification: {report.get('overall_status', 'fail')}."
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(sentence + "\n")
          print(json.dumps(report, sort_keys=True))
          PYREPORT

      - name: Upload immutable rollback packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: one-operation-rollback-receipts
          path: out/rollback-certification
          if-no-files-found: error
