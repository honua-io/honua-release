# rc release — admission by a candidate-bound gate window.
#
# rc.N is tagged only when every required gate's most recent completed trunk run for THIS candidate
# certifies it: the run's report or receipt names the honua-server digest, source SHA, and platform
# lock. A newer failure or non-certifying run for that candidate wins over an older green one. A gate
# with no candidate-bound report is a limitation and does not pass. This workflow does not run the
# gates; it reads their trunk history (tools/rc_gate_window.py) and fails closed. Dry run by default.
name: rc-release

on:
  workflow_dispatch:
    inputs:
      rc_label:
        description: Tag to create, e.g. 2026.1-rc.1
        required: true
        default: 2026.1-rc.1
      server_image_tag:
        description: honua-server image tag the candidate ships (e.g. nightly-6302c5e)
        required: true
      window_days:
        description: Rolling window (days) a gate's candidate-bound run must fall inside
        required: false
        default: "7"
      server_sha:
        description: Full honua-server source SHA for this candidate. Empty uses platform-manifest.yaml.
        required: false
        default: ""
      platform_lock:
        description: "sha256:<64 hex> of platform-lock.json for the candidate being released"
        required: true
      dry_run:
        description: "true: compute and upload the notes only; false: create the pre-release tag"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: rc-release
  cancel-in-progress: false

jobs:
  gate-window:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      admissible: ${{ steps.window.outputs.admissible }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" pytest
      - name: Self-test the window logic (it must be able to fail)
        run: python -m pytest tools/test_rc_gate_window.py -q
      - name: Resolve the server image digest
        env:
          IMAGE: ghcr.io/honua-io/honua-server:${{ inputs.server_image_tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE" --format '{{json .Manifest}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])' > server-digest.txt
          echo "server digest: $(cat server-digest.txt)"
      - name: Evaluate every train gate against the window
        id: window
        env:
          GH_TOKEN: ${{ github.token }}
          WINDOW_DAYS: ${{ inputs.window_days }}
          SERVER_SHA: ${{ inputs.server_sha }}
          PLATFORM_LOCK: ${{ inputs.platform_lock }}
        run: |
          set -euo pipefail
          if [ -n "$SERVER_SHA" ]; then
            sha="$SERVER_SHA"
          else
            sha="$(python3 -c 'import yaml; print(yaml.safe_load(open("platform-manifest.yaml"))["components"]["honua-server"]["sha"].strip())')"
          fi
          digest="$(tr -d '[:space:]' < server-digest.txt)"
          rc=0
          python tools/rc_gate_window.py --window-days "$WINDOW_DAYS" \
            --server-sha "$sha" --server-digest "$digest" --platform-lock "$PLATFORM_LOCK" \
            --out gate-window.json --markdown gate-window.md --enforce || rc=$?
          echo "admissible=$([ "$rc" = 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat gate-window.md >> "$GITHUB_STEP_SUMMARY"
          exit $rc
      - name: Collect known gaps (open must-fix issues across the org)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --paginate emits one object per line with this --jq; collect them into one array.
          gh api -X GET search/issues --paginate \
            -f q='org:honua-io is:issue is:open label:bucket/must-fix-before-cut' -f per_page=100 \
            --jq '.items[] | {repo: (.repository_url|split("/")|last), number: .number, title: .title, url: .html_url}' \
            | python3 -c 'import json,sys; print(json.dumps([json.loads(l) for l in sys.stdin if l.strip()], indent=1))' > known-gaps.json
          echo "known gaps: $(python3 -c 'import json; print(len(json.load(open("known-gaps.json"))))')"
      - name: Render the rc notes
        if: always()
        env:
          LABEL: ${{ inputs.rc_label }}
          IMAGE: ghcr.io/honua-io/honua-server:${{ inputs.server_image_tag }}
        run: |
          set -euo pipefail
          # The hand-written narrative for the base label (release-notes/2026.1.md for 2026.1-rc.N)
          # leads the notes when it exists; the generated record follows it.
          intro=()
          narrative="release-notes/${LABEL%%-rc*}.md"
          if [ -f "$narrative" ]; then intro=(--intro-file "$narrative"); fi
          python tools/rc_release_notes.py --manifest platform-manifest.yaml --gate-markdown gate-window.md \
            --label "$LABEL" --server-image "$IMAGE" --server-digest "$(cat server-digest.txt)" \
            --gaps-json known-gaps.json "${intro[@]}" --out rc-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: rc-release-${{ inputs.rc_label }}
          path: |
            gate-window.json
            gate-window.md
            known-gaps.json
            rc-notes.md
            server-digest.txt
            platform-manifest.yaml
          if-no-files-found: error

  publish:
    needs: gate-window
    if: ${{ inputs.dry_run == 'false' && needs.gate-window.outputs.admissible == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rc-release-${{ inputs.rc_label }}
          path: out
      - name: Refuse to tag anything but trunk
        run: |
          set -euo pipefail
          [ "$GITHUB_REF" = "refs/heads/trunk" ] || { echo "::error::rc tags are cut from trunk only (got $GITHUB_REF)"; exit 1; }
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          LABEL: ${{ inputs.rc_label }}
        run: |
          set -euo pipefail
          gh release create "$LABEL" --prerelease --target "$GITHUB_SHA" \
            --title "Honua ${LABEL/-/ }" --notes-file out/rc-notes.md \
            out/gate-window.json out/gate-window.md out/known-gaps.json out/platform-manifest.yaml
