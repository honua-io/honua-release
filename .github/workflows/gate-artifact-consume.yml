# ─────────────────────────────────────────────────────────────────────────────
# gate-artifact-consume — Release gate (d): ACTUALLY consume every published artifact.
#
# Closes the audit's "artifact integrity" findings at the gate level:
#   - honua-io/honua-sdk-js#310   (CDN/npm bundle was never actually built)
#   - honua-io/honua-iac#81       (`terraform init` on the customer tarball was broken)
#   - honua-io/geospatial-grpc#45 (proto codegen was broken)
#
# Principle (AGENTS.md): "AI proposes, the pipeline disposes." A gate that can't fail is
# worse than no gate. So every job below runs a REAL consume command (npm import, dotnet
# build, pip import, terraform init, helm template, docker /healthz, buf generate) whose
# genuine failure fails the job. Nothing here is a trivially-green echo.
#
# Source resolution per artifact (the central design constraint while we bootstrap):
#   1. STAGING  — install/pull the published artifact from the staging registry. This is the
#                 production behaviour and the only mode that exercises the real publish path.
#   2. LOCAL    — if staging has no such artifact for the pinned candidate yet,
#                 fall back to building the component from source and consuming THAT. This is
#                 still a real consume (a broken bundle/tarball/chart fails here too) — it just
#                 sources the artifact locally instead of from the registry. Each step that
#                 takes this path is clearly marked `# STUB (pending real published artifact)`.
#   3. BLOCKED  — if neither a published artifact nor a buildable source is reachable, the gate
#                 reports `blocked` (NOT pass). Under enforcement=strict, blocked fails the gate.
#
# enforcement:
#   bootstrap (default, Phase 1 / dry-run) — a genuine build/consume FAILURE still fails the gate,
#                 but the mere ABSENCE of a not-yet-published artifact is tolerated. Two flavours:
#                   • BLOCKED — a source repo/artifact could not even be reached (reported `blocked`).
#                   • SKIPPED — the artifact's SOURCE is well-formed (builds/packs/packages) but it is
#                     genuinely UNCONSUMABLE without a real publish + staging registry: the honua-server
#                     image needs Redis+snapshot to answer /healthz; Honua.Sdk pulls Geospatial.Grpc from
#                     an authed feed that isn't published; the helm chart needs external (Bitnami) subchart
#                     deps unreachable in a no-registry cut. These record `skipped` with an explicit
#                     `why` ("artifact not published — dry run …") and do NOT reduce the gate below pass.
#                 CRITICAL: a `skipped` is only ever recorded when the ROOT CAUSE is genuinely
#                 not-published / unresolvable-external-dep. A malformed artifact (build fails, import
#                 throws, tarball won't init, chart renders nothing) still FAILS even in bootstrap.
#   strict (Phase 2 / real cut) — any non-pass (blocked OR skipped) and any LOCAL source fallback
#                 fails the gate. Only exact published bytes can satisfy a real release cell.
#
# Emits gate-report.json (schema: {platform_label, generatedAt, enforcement, overallStatus,
# gates:[{gate,status,why,source,evidence_url}]}) as an artifact for the release train / AI to
# parse. The train consumes this report; it never scrapes logs.
# ─────────────────────────────────────────────────────────────────────────────

name: gate-artifact-consume
run-name: "gate-artifact-consume ${{ inputs.platform_label }} (${{ inputs.enforcement }})"

on:
  workflow_dispatch:
    inputs:
      platform_label:
        description: "Platform label / RC being certified, e.g. 2026.1-rc.1"
        required: false
        type: string
        default: "dev-local"
      enforcement:
        description: "bootstrap = tolerate unpublished artifacts (real failures still fail); strict = any non-pass fails"
        required: false
        type: choice
        options: [bootstrap, strict]
        default: bootstrap
  workflow_call:
    inputs:
      platform_label:
        required: false
        type: string
        default: "dev-local"
      enforcement:
        required: false
        type: string
        default: bootstrap
    # Optional: a token that can read the sibling component repos for the LOCAL fallback path.
    # When absent we fall back to ${{ github.token }} (works only for this repo / public repos),
    # and an unreachable private source repo is reported `blocked` rather than silently passing.
    secrets:
      RELEASE_GH_TOKEN:
        required: false
    outputs:
      overall_status:
        description: "pass | fail | blocked — aggregate of all consume jobs"
        value: ${{ jobs.report.outputs.overall_status }}

concurrency:
  group: gate-artifact-consume-${{ inputs.platform_label }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read          # pull container images / OCI charts from ghcr staging

# Registry coordinates. The JS SDK is published to public npm through trusted publishing; remaining
# components may still take their explicitly reported LOCAL fallback until their registry artifact lands.
env:
  STAGING_NPM_REGISTRY: "https://registry.npmjs.org"        # public trusted-publishing target
  STAGING_NUGET_SOURCE: "https://nuget.pkg.github.com/honua-io/index.json"
  STAGING_PYPI_INDEX:   "https://pypi.org/simple/"           # public trusted-publishing target
  STAGING_OCI_REGISTRY: "ghcr.io/honua-io"                   # server image + OCI helm chart
  SERVER_HEALTH_PATH:   "/healthz/ready"
  SERVER_PORT:          "8080"

jobs:
  resolve_pins:
    runs-on: ubuntu-latest
    outputs:
      sdk_js_version: ${{ steps.pins.outputs.sdk_js_version }}
      sdk_js_sha: ${{ steps.pins.outputs.sdk_js_sha }}
      sdk_js_package: ${{ steps.pins.outputs.sdk_js_package }}
      sdk_js_integrity: ${{ steps.pins.outputs.sdk_js_integrity }}
      mcp_version: ${{ steps.pins.outputs.mcp_version }}
      mcp_sha: ${{ steps.pins.outputs.mcp_sha }}
      mcp_package: ${{ steps.pins.outputs.mcp_package }}
      mcp_integrity: ${{ steps.pins.outputs.mcp_integrity }}
      sdk_dotnet_version: ${{ steps.pins.outputs.sdk_dotnet_version }}
      sdk_dotnet_sha: ${{ steps.pins.outputs.sdk_dotnet_sha }}
      sdk_dotnet_package: ${{ steps.pins.outputs.sdk_dotnet_package }}
      sdk_dotnet_digest: ${{ steps.pins.outputs.sdk_dotnet_digest }}
      sdk_python_version: ${{ steps.pins.outputs.sdk_python_version }}
      sdk_python_sha: ${{ steps.pins.outputs.sdk_python_sha }}
      sdk_python_package: ${{ steps.pins.outputs.sdk_python_package }}
      sdk_python_filename: ${{ steps.pins.outputs.sdk_python_filename }}
      sdk_python_digest: ${{ steps.pins.outputs.sdk_python_digest }}
      iac_version: ${{ steps.pins.outputs.iac_version }}
      iac_sha: ${{ steps.pins.outputs.iac_sha }}
      helm_version: ${{ steps.pins.outputs.helm_version }}
      helm_sha: ${{ steps.pins.outputs.helm_sha }}
      server_image: ${{ steps.pins.outputs.server_image }}
      server_digest: ${{ steps.pins.outputs.server_digest }}
      server_sha: ${{ steps.pins.outputs.server_sha }}
      grpc_version: ${{ steps.pins.outputs.grpc_version }}
      grpc_sha: ${{ steps.pins.outputs.grpc_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0,<7"
      - name: Resolve and validate the frozen artifact pins
        id: pins
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          import yaml

          manifest = yaml.safe_load(Path("platform-manifest.yaml").read_text(encoding="utf-8"))
          components = manifest.get("components") or {}
          component_specs = {
              "iac": "honua-iac",
              "helm": "honua-helm",
              "grpc": "geospatial-grpc",
          }
          values = {}
          for prefix, component_name in component_specs.items():
              component = components.get(component_name) or {}
              sha = str(component.get("sha", ""))
              version = str(component.get("version", ""))
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(f"{component_name} does not have a full lowercase SHA pin")
              if not version:
                  raise SystemExit(f"{component_name} does not have a version pin")
              values[f"{prefix}_sha"] = sha
              values[f"{prefix}_version"] = version

          clients = manifest.get("clientArtifacts") or {}
          client_specs = {
              "sdk_js": ("honua-sdk-js", "npm"),
              "mcp": ("honua-mcp-server", "npm"),
              "sdk_dotnet": ("honua-sdk-dotnet", "nuget"),
              "sdk_python": ("honua-sdk-python-wheel", "pypi"),
          }
          for prefix, (artifact_name, ecosystem) in client_specs.items():
              artifact = clients.get(artifact_name) or {}
              if artifact.get("ecosystem") != ecosystem:
                  raise SystemExit(f"{artifact_name} is not a {ecosystem} client artifact")
              sha = str(artifact.get("sourceSha", ""))
              version = str(artifact.get("version", ""))
              package = str(artifact.get("package", ""))
              if not re.fullmatch(r"[0-9a-f]{40}", sha):
                  raise SystemExit(f"{artifact_name} does not have a full lowercase source SHA pin")
              if not version or not package:
                  raise SystemExit(f"{artifact_name} does not have exact package/version coordinates")
              values.update({
                  f"{prefix}_sha": sha,
                  f"{prefix}_version": version,
                  f"{prefix}_package": package,
              })
              if ecosystem == "npm":
                  integrity = str(artifact.get("integrity", ""))
                  if not re.fullmatch(r"sha512-[A-Za-z0-9+/]+={0,2}", integrity):
                      raise SystemExit(f"{artifact_name} does not have an npm SRI pin")
                  values[f"{prefix}_integrity"] = integrity
              else:
                  digest = str(artifact.get("digest", ""))
                  if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
                      raise SystemExit(f"{artifact_name} does not have a sha256 digest pin")
                  values[f"{prefix}_digest"] = digest
              if ecosystem == "pypi":
                  filename = str(artifact.get("filename", ""))
                  if not filename:
                      raise SystemExit(f"{artifact_name} does not have an exact wheel filename")
                  values[f"{prefix}_filename"] = filename

          server = components.get("honua-server") or {}
          server_sha = str(server.get("sha", ""))
          server_digest = str(server.get("digest", ""))
          server_image = str(server.get("image", ""))
          if not re.fullmatch(r"[0-9a-f]{40}", server_sha):
              raise SystemExit("honua-server does not have a full lowercase SHA pin")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", server_digest):
              raise SystemExit("honua-server does not have an immutable sha256 digest")
          if not server_image.startswith("ghcr.io/honua-io/honua-server:"):
              raise SystemExit("honua-server image is not an explicit GHCR tag")
          values.update(server_sha=server_sha, server_digest=server_digest, server_image=server_image)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for key, value in values.items():
                  print(f"{key}={value}", file=output)
          PY

  # ───────────────────────────────────────────────────────────────────────────
  # npm — install the manifest-pinned @honua/sdk-js artifact and actually import it. Retires sdk-js#310.
  # ───────────────────────────────────────────────────────────────────────────
  consume-npm:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1 - for the local ./.github/actions/gate-fragment composite action
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Consume @honua/sdk-js
        id: consume
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          SDK_JS_VERSION: ${{ needs.resolve_pins.outputs.sdk_js_version }}
          SDK_JS_SHA: ${{ needs.resolve_pins.outputs.sdk_js_sha }}
          SDK_JS_PACKAGE: ${{ needs.resolve_pins.outputs.sdk_js_package }}
          SDK_JS_INTEGRITY: ${{ needs.resolve_pins.outputs.sdk_js_integrity }}
        run: |
          set -uo pipefail
          GATE=npm; SOURCE=blocked; STATUS=blocked; WHY=""
          # The import specifier comes from the frozen manifest. The local fallback still reads the
          # built package.json below so it proves that the source package uses the same coordinate.
          PKGNAME="$SDK_JS_PACKAGE"
          WORK="$RUNNER_TEMP/npm-consume"; mkdir -p "$WORK"; cd "$WORK"
          npm init -y >/dev/null 2>&1

          echo "::group::Try STAGING (npm registry: $STAGING_NPM_REGISTRY)"
          REGISTRY_INTEGRITY="$(npm view "${SDK_JS_PACKAGE}@${SDK_JS_VERSION}" dist.integrity \
            --registry "$STAGING_NPM_REGISTRY" 2>/tmp/npm-staging.log || true)"
          if [ -z "$REGISTRY_INTEGRITY" ]; then
            echo "published package is absent:"; tail -n 5 /tmp/npm-staging.log || true
          elif [ "$REGISTRY_INTEGRITY" != "$SDK_JS_INTEGRITY" ]; then
            STATUS=fail; WHY="published ${SDK_JS_PACKAGE}@${SDK_JS_VERSION} integrity does not match clientArtifacts"
          elif npm install "${SDK_JS_PACKAGE}@${SDK_JS_VERSION}" \
              --registry "$STAGING_NPM_REGISTRY" >>/tmp/npm-staging.log 2>&1; then
            SOURCE=published; STATUS=consuming
          else
            STATUS=fail; WHY="published ${SDK_JS_PACKAGE}@${SDK_JS_VERSION} matched the pin but could not be installed"
            tail -n 20 /tmp/npm-staging.log || true
          fi
          echo "::endgroup::"

          if [ "$STATUS" = "blocked" ]; then
            # STUB (pending real published artifact): build the package locally and consume the
            # `npm pack` tarball — the same artifact `npm publish` would upload. A bundle that was
            # "never built" (sdk-js#310) fails right here.
            echo "::group::LOCAL fallback — build honua-sdk-js and consume npm pack tarball"
            if bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" honua-sdk-js "$SDK_JS_SHA" src >/tmp/npm-clone.log 2>&1; then
              ( cd src && npm ci >/tmp/npm-build.log 2>&1 && npm run build --if-present >>/tmp/npm-build.log 2>&1 && npm pack --pack-destination "$WORK" >>/tmp/npm-build.log 2>&1 ) \
                && TARBALL="$(ls -1 "$WORK"/*.tgz 2>/dev/null | head -n1)" || TARBALL=""
              # Consume + import the package by its REAL name (not an assumed scope) so a successful
              # pack is not mis-reported as a failure just because the tarball/scope differs.
              [ -f src/package.json ] && PKGNAME="$(node -p "require('./src/package.json').name" 2>/dev/null || echo "$PKGNAME")"
              if [ -n "$TARBALL" ] && npm install "$TARBALL" >>/tmp/npm-build.log 2>&1; then
                SOURCE=local; STATUS=consuming
              else
                STATUS=fail; WHY="local build/pack of honua-sdk-js failed (sdk-js#310: bundle never built?)"; tail -n 20 /tmp/npm-build.log || true
              fi
            else
              STATUS=blocked; WHY="staging empty and honua-sdk-js source not reachable (no RELEASE_GH_TOKEN?)"; tail -n 5 /tmp/npm-clone.log || true
            fi
            echo "::endgroup::"
          fi

          if [ "$STATUS" = "consuming" ]; then
            echo "::group::Import smoke test ($PKGNAME)"
            # ESM dynamic import loads both ESM- and CJS-published packages, so this is a faithful
            # "can a consumer import it" smoke without forcing a module system the package doesn't ship.
            if PKGNAME="$PKGNAME" node --input-type=module \
                 -e "import(process.env.PKGNAME).then(m=>{const k=Object.keys(m);if(!k.length)throw new Error('empty export');console.log('import ok:',k.slice(0,8));}).catch(e=>{console.error(e);process.exit(1);})"; then
              STATUS=pass; WHY="installed from ${SOURCE} and imported ${PKGNAME}"
            else
              STATUS=fail; WHY="package ${PKGNAME} installed from ${SOURCE} but import failed"
            fi
            echo "::endgroup::"
          fi

          echo "gate=$GATE"     >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_ENV"
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'npm' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  # ───────────────────────────────────────────────────────────────────────────
  # nuget — add Honua.Sdk to a project and build against it. Retires the .NET arm of gate (d).
  # ───────────────────────────────────────────────────────────────────────────
  # Install the terminal companion package and verify every declared executable exists in the
  # exact manifest-pinned npm package. There is deliberately no source-build fallback for this lane.
  consume-mcp-npm:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Consume the MCP/CLI npm package
        env:
          MCP_VERSION: ${{ needs.resolve_pins.outputs.mcp_version }}
          MCP_PACKAGE: ${{ needs.resolve_pins.outputs.mcp_package }}
          MCP_INTEGRITY: ${{ needs.resolve_pins.outputs.mcp_integrity }}
        run: |
          set -uo pipefail
          GATE=npm-mcp; SOURCE=blocked; STATUS=blocked; WHY=""
          WORK="$RUNNER_TEMP/npm-mcp-consume"; mkdir -p "$WORK"; cd "$WORK"
          npm init -y >/dev/null 2>&1
          REGISTRY_INTEGRITY="$(npm view "${MCP_PACKAGE}@${MCP_VERSION}" dist.integrity \
            --registry "$STAGING_NPM_REGISTRY" 2>/tmp/npm-mcp.log || true)"
          if [ -z "$REGISTRY_INTEGRITY" ]; then
            WHY="required published ${MCP_PACKAGE}@${MCP_VERSION} is unavailable"
          elif [ "$REGISTRY_INTEGRITY" != "$MCP_INTEGRITY" ]; then
            STATUS=fail; WHY="published ${MCP_PACKAGE}@${MCP_VERSION} integrity does not match clientArtifacts"
          elif ! npm install "${MCP_PACKAGE}@${MCP_VERSION}" --registry "$STAGING_NPM_REGISTRY" >>/tmp/npm-mcp.log 2>&1; then
            STATUS=fail; WHY="published ${MCP_PACKAGE}@${MCP_VERSION} matched the pin but could not be installed"
          elif MCP_PACKAGE="$MCP_PACKAGE" MCP_VERSION="$MCP_VERSION" node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const root = path.join(process.cwd(), 'node_modules', ...process.env.MCP_PACKAGE.split('/'));
          const pkg = JSON.parse(fs.readFileSync(path.join(root, 'package.json'), 'utf8'));
          if (pkg.name !== process.env.MCP_PACKAGE || pkg.version !== process.env.MCP_VERSION) process.exit(2);
          const bins = typeof pkg.bin === 'string' ? {[pkg.name.split('/').pop()]: pkg.bin} : (pkg.bin || {});
          if (!Object.keys(bins).length) process.exit(3);
          for (const target of Object.values(bins)) {
            if (!fs.existsSync(path.join(root, target))) process.exit(4);
          }
          console.log('verified package identity and bins:', Object.keys(bins).join(', '));
          JS
          then
            SOURCE=published; STATUS=pass; WHY="installed exact pinned bytes and verified every declared executable"
          else
            STATUS=fail; WHY="installed ${MCP_PACKAGE}@${MCP_VERSION} has invalid identity or missing executable bytes"
          fi
          tail -n 20 /tmp/npm-mcp.log 2>/dev/null || true
          {
            echo "gate=$GATE"
            echo "source=$SOURCE"
            echo "status=$STATUS"
            echo "why=$WHY"
          } >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'npm-mcp' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  consume-nuget:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1 - for the local ./.github/actions/gate-fragment composite action
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Consume Honua.Sdk (NuGet)
        id: consume
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          SDK_DOTNET_VERSION: ${{ needs.resolve_pins.outputs.sdk_dotnet_version }}
          SDK_DOTNET_SHA: ${{ needs.resolve_pins.outputs.sdk_dotnet_sha }}
          SDK_DOTNET_PACKAGE: ${{ needs.resolve_pins.outputs.sdk_dotnet_package }}
          SDK_DOTNET_DIGEST: ${{ needs.resolve_pins.outputs.sdk_dotnet_digest }}
        run: |
          set -uo pipefail
          GATE=nuget; SOURCE=blocked; STATUS=blocked; WHY=""
          ENF="${{ inputs.enforcement }}"; TOLERANT=false; [ "$ENF" != "strict" ] && TOLERANT=true
          WORK="$RUNNER_TEMP/nuget-consume"; mkdir -p "$WORK"; cd "$WORK"
          dotnet new console -n Consumer -o Consumer >/tmp/nuget-new.log 2>&1
          cat > Consumer/Program.cs <<'EOF'
          // Force the dependency to actually load at runtime, not just restore.
          var asm = System.Reflection.Assembly.Load("Honua.Sdk");
          System.Console.WriteLine($"loaded {asm.GetName().FullName}");
          EOF

          echo "::group::Try STAGING (nuget source: $STAGING_NUGET_SOURCE)"
          dotnet nuget add source "$STAGING_NUGET_SOURCE" -n honua-staging \
            -u honua -p "$GH_TOKEN" --store-password-in-clear-text >/tmp/nuget-src.log 2>&1 || true
          NUPKG="$WORK/${SDK_DOTNET_PACKAGE}.${SDK_DOTNET_VERSION}.nupkg"
          NUGET_URL="https://nuget.pkg.github.com/honua-io/download/${SDK_DOTNET_PACKAGE}/${SDK_DOTNET_VERSION}/${SDK_DOTNET_PACKAGE}.${SDK_DOTNET_VERSION}.nupkg"
          if ! curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "$NUGET_URL" -o "$NUPKG" 2>/tmp/nuget-download.log; then
            echo "published package is absent:"; tail -n 5 /tmp/nuget-download.log || true
          elif [ "sha256:$(sha256sum "$NUPKG" | cut -d' ' -f1)" != "$SDK_DOTNET_DIGEST" ]; then
            STATUS=fail; WHY="published ${SDK_DOTNET_PACKAGE}@${SDK_DOTNET_VERSION} digest does not match clientArtifacts"
          else
            PUBLISHED_FEED="$WORK/publishedfeed"
            NUGET_PACKAGES="$WORK/packages"
            export NUGET_PACKAGES
            mkdir -p "$PUBLISHED_FEED" "$NUGET_PACKAGES"
            cp "$NUPKG" "$PUBLISHED_FEED/"
            cat > "$WORK/NuGet.published.config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="verified-published" value="$PUBLISHED_FEED" />
              <add key="honua-staging" value="$STAGING_NUGET_SOURCE" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <honua-staging>
                <add key="Username" value="honua" />
                <add key="ClearTextPassword" value="$GH_TOKEN" />
              </honua-staging>
            </packageSourceCredentials>
          </configuration>
          EOF
            if dotnet add Consumer package "$SDK_DOTNET_PACKAGE" --version "$SDK_DOTNET_VERSION" --no-restore >/tmp/nuget-staging.log 2>&1 \
              && dotnet restore Consumer --configfile "$WORK/NuGet.published.config" >>/tmp/nuget-staging.log 2>&1; then
              RESTORED_NUPKG="$(find "$NUGET_PACKAGES" -type f -iname "${SDK_DOTNET_PACKAGE}.${SDK_DOTNET_VERSION}.nupkg" -print -quit)"
              if [ -z "$RESTORED_NUPKG" ] || [ "sha256:$(sha256sum "$RESTORED_NUPKG" | cut -d' ' -f1)" != "$SDK_DOTNET_DIGEST" ]; then
                STATUS=fail; WHY="restored ${SDK_DOTNET_PACKAGE}@${SDK_DOTNET_VERSION} bytes do not match clientArtifacts"
              else
                SOURCE=published; STATUS=consuming
              fi
            else
              STATUS=fail; WHY="verified published ${SDK_DOTNET_PACKAGE}@${SDK_DOTNET_VERSION} could not be restored from the local feed"
              tail -n 20 /tmp/nuget-staging.log || true
            fi
          fi
          echo "::endgroup::"

          if [ "$STATUS" = "blocked" ]; then
            # STUB (pending real published artifact): build the .nupkg from source (`dotnet pack`),
            # serve it from a local folder feed, and add the package from there — the exact artifact
            # `dotnet nuget push` would publish.
            echo "::group::LOCAL fallback — dotnet pack honua-sdk-dotnet and add from local feed"
            if bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" honua-sdk-dotnet "$SDK_DOTNET_SHA" src >/tmp/nuget-clone.log 2>&1; then
              mkdir -p "$WORK/localfeed"
              # The repo's NuGet.config maps Geospatial.Grpc to the authed github-honua source with no
              # credentials; restore-during-pack 401s without them. Wire the token into that source.
              dotnet nuget update source github-honua -u honua -p "$GH_TOKEN" \
                --store-password-in-clear-text --configfile src/NuGet.config >/tmp/nuget-pack.log 2>&1 || true
              if ( cd src && dotnet pack -c Release -o "$WORK/localfeed" >>/tmp/nuget-pack.log 2>&1 ); then
                if dotnet add Consumer package "$SDK_DOTNET_PACKAGE" --version "$SDK_DOTNET_VERSION" --source "$WORK/localfeed" >>/tmp/nuget-pack.log 2>&1; then
                  SOURCE=local; STATUS=consuming
                else
                  STATUS=fail; WHY="packed Honua.Sdk but consuming project could not add it"; tail -n 20 /tmp/nuget-pack.log || true
                fi
              elif [ "$TOLERANT" = true ] && grep -qiE 'NU1101|NU1102|NU1103|NU1301|401 \(Unauthorized\)|403 \(Forbidden\)|Unable to load the service index|Response status code does not indicate success' /tmp/nuget-pack.log; then
                # ROOT CAUSE = not published: honua-sdk-dotnet depends on Geospatial.Grpc, which lives on
                # an AUTHED staging NuGet feed that isn't published yet, so restore-during-pack cannot
                # resolve it (NU1101 / service-index auth). That is a publish/registry gap, NOT a broken
                # package (a genuine compile break has no NU-resolution signature) → skip in dry-run.
                STATUS=skipped; SOURCE=blocked; WHY="artifact not published — dry run: honua-sdk-dotnet depends on Geospatial.Grpc from an authed staging feed that isn't published; the NuGet dependency is unresolvable in a no-registry cut"
                tail -n 20 /tmp/nuget-pack.log || true
              else
                STATUS=fail; WHY="dotnet pack of honua-sdk-dotnet failed"; tail -n 20 /tmp/nuget-pack.log || true
              fi
            else
              STATUS=blocked; WHY="staging empty and honua-sdk-dotnet source not reachable (no RELEASE_GH_TOKEN?)"; tail -n 5 /tmp/nuget-clone.log || true
            fi
            echo "::endgroup::"
          fi

          if [ "$STATUS" = "consuming" ]; then
            echo "::group::Build + run consumer against Honua.Sdk"
            if dotnet run --project Consumer -c Release >/tmp/nuget-run.log 2>&1; then
              STATUS=pass; WHY="added from ${SOURCE}, built and loaded Honua.Sdk at runtime"
            else
              STATUS=fail; WHY="added from ${SOURCE} but build/run against Honua.Sdk failed"; tail -n 30 /tmp/nuget-run.log || true
            fi
            echo "::endgroup::"
          fi

          echo "gate=$GATE"     >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_ENV"
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'nuget' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  # ───────────────────────────────────────────────────────────────────────────
  # pip — install honua-sdk and import it.
  # ───────────────────────────────────────────────────────────────────────────
  consume-pip:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1 - for the local ./.github/actions/gate-fragment composite action
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Consume honua-sdk (pip)
        id: consume
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          SDK_PYTHON_VERSION: ${{ needs.resolve_pins.outputs.sdk_python_version }}
          SDK_PYTHON_SHA: ${{ needs.resolve_pins.outputs.sdk_python_sha }}
          SDK_PYTHON_PACKAGE: ${{ needs.resolve_pins.outputs.sdk_python_package }}
          SDK_PYTHON_FILENAME: ${{ needs.resolve_pins.outputs.sdk_python_filename }}
          SDK_PYTHON_DIGEST: ${{ needs.resolve_pins.outputs.sdk_python_digest }}
        run: |
          set -uo pipefail
          GATE=pip; SOURCE=blocked; STATUS=blocked; WHY=""
          WORK="$RUNNER_TEMP/pip-consume"; mkdir -p "$WORK"; cd "$WORK"
          python -m venv .venv && . .venv/bin/activate && python -m pip install -U pip wheel build >/dev/null 2>&1

          echo "::group::Try STAGING (pip index: $STAGING_PYPI_INDEX)"
          mkdir -p "$WORK/published"
          if ! python -m pip download --no-deps --only-binary=:all: --index-url "$STAGING_PYPI_INDEX" \
              --dest "$WORK/published" "${SDK_PYTHON_PACKAGE}==${SDK_PYTHON_VERSION}" >/tmp/pip-staging.log 2>&1; then
            echo "published wheel is absent:"; tail -n 5 /tmp/pip-staging.log || true
          elif [ ! -f "$WORK/published/$SDK_PYTHON_FILENAME" ]; then
            STATUS=fail; WHY="registry did not return exact wheel ${SDK_PYTHON_FILENAME}"
          elif [ "sha256:$(sha256sum "$WORK/published/$SDK_PYTHON_FILENAME" | cut -d' ' -f1)" != "$SDK_PYTHON_DIGEST" ]; then
            STATUS=fail; WHY="published ${SDK_PYTHON_FILENAME} digest does not match clientArtifacts"
          elif python -m pip install "$WORK/published/$SDK_PYTHON_FILENAME" >>/tmp/pip-staging.log 2>&1; then
            SOURCE=published; STATUS=consuming
          else
            STATUS=fail; WHY="published ${SDK_PYTHON_FILENAME} matched the pin but could not be installed"
            tail -n 20 /tmp/pip-staging.log || true
          fi
          echo "::endgroup::"

          if [ "$STATUS" = "blocked" ]; then
            # STUB (pending real published artifact): build the wheel from source (`python -m build`)
            # and pip-install THAT wheel — the same artifact `twine upload` would publish.
            echo "::group::LOCAL fallback — build honua-sdk-python wheel and pip install it"
            if bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" honua-sdk-python "$SDK_PYTHON_SHA" src >/tmp/pip-clone.log 2>&1; then
              # honua-sdk-python is a WORKSPACE root (its root pyproject is not a buildable dist —
              # setuptools flat-layout finds packages/, conformance/, compatibility/ and errors). The
              # shipped SDK is packages/honua-sdk; build THAT (else fall back to the repo root).
              SDKDIR="src"
              [ -f src/packages/honua-sdk/pyproject.toml ] && SDKDIR="src/packages/honua-sdk"
              if ( cd "$SDKDIR" && python -m build --wheel --outdir "$WORK/dist" >/tmp/pip-build.log 2>&1 ); then
                WHEEL="$(ls -1 "$WORK"/dist/*.whl 2>/dev/null | head -n1)"
                if [ -n "$WHEEL" ] && python -m pip install "$WHEEL" >>/tmp/pip-build.log 2>&1; then
                  SOURCE=local; STATUS=consuming
                else
                  STATUS=fail; WHY="built wheel but pip install failed"; tail -n 20 /tmp/pip-build.log || true
                fi
              else
                STATUS=fail; WHY="python -m build of honua-sdk-python failed"; tail -n 20 /tmp/pip-build.log || true
              fi
            else
              STATUS=blocked; WHY="staging empty and honua-sdk-python source not reachable (no RELEASE_GH_TOKEN?)"; tail -n 5 /tmp/pip-clone.log || true
            fi
            echo "::endgroup::"
          fi

          if [ "$STATUS" = "consuming" ]; then
            echo "::group::Import smoke test"
            # Try the conventional import name, then fall back to the distribution's top-level package.
            if python -c "import honua_sdk; print('import honua_sdk ok', getattr(honua_sdk,'__version__','?'))" >/tmp/pip-import.log 2>&1; then
              STATUS=pass; WHY="installed from ${SOURCE} and imported honua_sdk"
            else
              PKG="$(python - <<'PY'
          import importlib.metadata as m
          tops=set()
          for f in (m.files('honua-sdk') or []):
              p=str(f)
              if p.endswith('__init__.py'):
                  tops.add(p.split('/')[0])
          print(next(iter(tops),''))
          PY
          )"
              if [ -n "$PKG" ] && python -c "import importlib,sys; importlib.import_module('$PKG'); print('import $PKG ok')" >>/tmp/pip-import.log 2>&1; then
                STATUS=pass; WHY="installed from ${SOURCE} and imported top-level package '$PKG'"
              else
                STATUS=fail; WHY="installed from ${SOURCE} but no importable package found"; tail -n 20 /tmp/pip-import.log || true
              fi
            fi
            echo "::endgroup::"
          fi

          echo "gate=$GATE"     >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_ENV"
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'pip' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  # ───────────────────────────────────────────────────────────────────────────
  # terraform — `terraform init` the honua-iac customer distribution tarball. Retires iac#81.
  # ───────────────────────────────────────────────────────────────────────────
  consume-terraform:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1 - for the local ./.github/actions/gate-fragment composite action
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Consume honua-iac customer tarball
        id: consume
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          IAC_VERSION: ${{ needs.resolve_pins.outputs.iac_version }}
          IAC_SHA: ${{ needs.resolve_pins.outputs.iac_sha }}
        run: |
          set -uo pipefail
          GATE=terraform; SOURCE=blocked; STATUS=blocked; WHY=""
          WORK="$RUNNER_TEMP/tf-consume"; mkdir -p "$WORK"; cd "$WORK"

          echo "::group::Try STAGING (release asset: honua-iac customer tarball)"
          # The customer distribution tarball is published as a GitHub release asset on honua-iac.
          if [ "$IAC_VERSION" != "pre-release" ] && gh release download "$IAC_VERSION" --repo honua-io/honua-iac --pattern 'honua-iac-*.tar.gz' --dir "$WORK" >/tmp/tf-staging.log 2>&1; then
            SOURCE=staging; STATUS=have-tarball
          else
            echo "staging asset miss (expected until publish lands):"; tail -n 5 /tmp/tf-staging.log || true
          fi
          echo "::endgroup::"

          if [ "$STATUS" != "have-tarball" ]; then
            # STUB (pending real published artifact): build the customer tarball from source the same
            # way the release would (prefer a `make dist`/packaging target; else tar the module root),
            # then init THAT. A tarball that "doesn't init" (iac#81) fails at `terraform init` below.
            echo "::group::LOCAL fallback — build honua-iac customer tarball from source"
            if bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" honua-iac "$IAC_SHA" src >/tmp/tf-clone.log 2>&1; then
              ( cd src && make dist >/tmp/tf-dist.log 2>&1 ) || true
              DIST_TGZ="$(find src -name 'honua-iac-*.tar.gz' | head -n1)"
              if [ -n "$DIST_TGZ" ]; then
                cp "$DIST_TGZ" "$WORK/" && SOURCE=local && STATUS=have-tarball
              else
                # No packaging target — emulate the customer artifact by tarring the terraform root.
                TFROOT="$(dirname "$(find src -name '*.tf' -not -path '*/.*' | head -n1)")"
                if [ -n "$TFROOT" ]; then
                  ( cd "$TFROOT" && tar czf "$WORK/honua-iac-local.tar.gz" . ) && SOURCE=local && STATUS=have-tarball
                else
                  STATUS=fail; WHY="no .tf found in honua-iac to package"
                fi
              fi
            else
              STATUS=blocked; WHY="staging empty and honua-iac source not reachable (no RELEASE_GH_TOKEN?)"; tail -n 5 /tmp/tf-clone.log || true
            fi
            echo "::endgroup::"
          fi

          if [ "$STATUS" = "have-tarball" ]; then
            echo "::group::Extract + terraform init -backend=false"
            TARBALL="$(ls -1 "$WORK"/honua-iac-*.tar.gz "$WORK"/honua-iac-local.tar.gz 2>/dev/null | head -n1)"
            mkdir -p "$WORK/extract" && tar xzf "$TARBALL" -C "$WORK/extract"
            # The customer's first command is `terraform init`. backend=false avoids needing real
            # cloud creds; it still resolves every module + provider, which is what iac#81 broke.
            INITDIR="$(dirname "$(find "$WORK/extract" -maxdepth 3 -name '*.tf' | head -n1)")"
            if [ -z "$INITDIR" ]; then
              STATUS=fail; WHY="tarball from ${SOURCE} contains no .tf files"
            elif ( cd "$INITDIR" && terraform init -backend=false -input=false >/tmp/tf-init.log 2>&1 && terraform validate -no-color >>/tmp/tf-init.log 2>&1 ); then
              STATUS=pass; WHY="customer tarball from ${SOURCE}: terraform init + validate succeeded"
            else
              STATUS=fail; WHY="terraform init/validate of the customer tarball failed (iac#81)"; tail -n 30 /tmp/tf-init.log || true
            fi
            echo "::endgroup::"
          fi

          echo "gate=$GATE"     >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_ENV"
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'terraform' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  # ───────────────────────────────────────────────────────────────────────────
  # helm — lint + template the published chart.
  # ───────────────────────────────────────────────────────────────────────────
  consume-helm:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1 - for the local ./.github/actions/gate-fragment composite action
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.14.4"

      - name: Consume honua helm chart
        id: consume
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          HELM_VERSION: ${{ needs.resolve_pins.outputs.helm_version }}
          HELM_SHA: ${{ needs.resolve_pins.outputs.helm_sha }}
        run: |
          set -uo pipefail
          GATE=helm; SOURCE=blocked; STATUS=blocked; WHY=""
          ENF="${{ inputs.enforcement }}"; TOLERANT=false; [ "$ENF" != "strict" ] && TOLERANT=true
          WORK="$RUNNER_TEMP/helm-consume"; mkdir -p "$WORK"; cd "$WORK"

          echo "::group::Try STAGING (OCI chart: oci://$STAGING_OCI_REGISTRY/honua)"
          echo "$GH_TOKEN" | helm registry login "$STAGING_OCI_REGISTRY" -u honua --password-stdin >/tmp/helm-login.log 2>&1 || true
          if [ "$HELM_VERSION" != "pre-release" ] && helm pull "oci://$STAGING_OCI_REGISTRY/charts/honua" --version "$HELM_VERSION" --destination "$WORK" --untar >/tmp/helm-staging.log 2>&1; then
            SOURCE=staging; STATUS=have-chart; CHART="$WORK/honua"
          else
            echo "staging chart miss (expected until publish lands):"; tail -n 5 /tmp/helm-staging.log || true
          fi
          echo "::endgroup::"

          if [ "$STATUS" != "have-chart" ]; then
            # STUB (pending real published artifact): package the chart from source (`helm package`)
            # and consume THAT .tgz — exactly what `helm push` would publish.
            echo "::group::LOCAL fallback — helm package honua-helm from source"
            if bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" honua-helm "$HELM_SHA" src >/tmp/helm-clone.log 2>&1; then
              CHARTDIR="$(dirname "$(find src -name Chart.yaml | head -n1)")"
              # `helm dependency build` resolves HTTP(S) subchart repos (e.g. Bitnami) only if they
              # are registered with `helm repo add` first — register every repo the chart declares.
              if [ -n "$CHARTDIR" ]; then
                i=0
                for REPO in $(sed -nE 's/^\s+repository:\s*"?(https?:\/\/[^" ]+)"?.*/\1/p' "$CHARTDIR/Chart.yaml" | sort -u); do
                  i=$((i+1)); helm repo add "chartdep$i" "$REPO" >>/tmp/helm-pkg.log 2>&1 || true
                done
                [ "$i" -gt 0 ] && helm repo update >>/tmp/helm-pkg.log 2>&1 || true
              fi
              if [ -n "$CHARTDIR" ] && ( helm dependency build "$CHARTDIR" >>/tmp/helm-pkg.log 2>&1 || true; helm package "$CHARTDIR" -d "$WORK" >>/tmp/helm-pkg.log 2>&1 ); then
                TGZ="$(ls -1 "$WORK"/*.tgz | head -n1)"; mkdir -p "$WORK/unpacked"; tar xzf "$TGZ" -C "$WORK/unpacked"
                # Select the package's top-level chart, never a nested dependency/library chart.
                # Read the full archive stream: an early awk exit makes tar receive SIGPIPE, which
                # is a hard error under pipefail even when the root chart was found correctly.
                CHART_ROOT="$(tar tzf "$TGZ" | awk -F/ 'NF==2 && $2=="Chart.yaml" && !root {root=$1} END {print root}')"
                CHART="$WORK/unpacked/$CHART_ROOT"
                if [ -n "$CHART_ROOT" ] && [ -f "$CHART/Chart.yaml" ]; then
                  SOURCE=local; STATUS=have-chart
                else
                  STATUS=fail; WHY="packaged helm artifact has no top-level Chart.yaml"
                fi
              elif [ "$TOLERANT" = true ] && [ -n "$CHARTDIR" ] && grep -qiE 'no repository definition|could not find|failed to (download|fetch)|missing in charts/ directory|dependenc.*(not found|missing|unreachable)|no cached repository' /tmp/helm-pkg.log; then
                # ROOT CAUSE = not published: the chart declares external subchart deps (e.g. Bitnami)
                # that need a configured chart registry to `helm dependency build`; in a no-registry cut
                # they're unreachable, so packaging fails. Chart.yaml IS present (well-formed) — this is
                # a registry gap, not a broken chart → skip in dry-run, hard-fail on a real cut.
                STATUS=skipped; SOURCE=blocked; WHY="artifact not published — dry run: honua chart's external subchart dependencies (e.g. Bitnami) are unreachable without a configured chart registry in a no-publish cut"
                tail -n 20 /tmp/helm-pkg.log || true
              else
                STATUS=fail; WHY="no Chart.yaml found / helm package failed in honua-helm"; tail -n 20 /tmp/helm-pkg.log || true
              fi
            else
              STATUS=blocked; WHY="staging empty and honua-helm source not reachable (no RELEASE_GH_TOKEN?)"; tail -n 5 /tmp/helm-clone.log || true
            fi
            echo "::endgroup::"
          fi

          if [ "$STATUS" = "have-chart" ]; then
            echo "::group::helm lint + helm template (render manifests)"
            # The production chart intentionally has no insecure default secrets. Supply
            # deterministic, non-production values so this consumer exercises a complete
            # render instead of failing on the chart's required-value guardrails.
            HELM_RUNTIME_ARGS=(
              --set-string 'secret.env.ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=honua;Username=honua;Password=gate'
              --set-string 'secret.env.ConnectionStrings__redis=redis:6379'
              --set-string 'secret.env.HONUA_ADMIN_PASSWORD=Gate-Aa1!ArtifactConsume'
              --set-string 'secret.env.Security__ConnectionEncryption__MasterKey=0123456789abcdef0123456789abcdef'
            )
            if helm lint "$CHART" "${HELM_RUNTIME_ARGS[@]}" >/tmp/helm-lint.log 2>&1 && helm template honua "$CHART" "${HELM_RUNTIME_ARGS[@]}" >/tmp/helm-tmpl.log 2>&1; then
              # A chart that renders to zero documents is broken even if lint passes.
              if grep -q 'kind:' /tmp/helm-tmpl.log; then
                STATUS=pass; WHY="chart from ${SOURCE}: lint clean and templated to real manifests"
              else
                STATUS=fail; WHY="chart from ${SOURCE} linted but rendered no manifests"
              fi
            elif [ "$TOLERANT" = true ] && grep -qiE 'missing in charts/ directory|no repository definition|found in Chart.yaml.*missing|dependenc' /tmp/helm-lint.log /tmp/helm-tmpl.log; then
              # ROOT CAUSE = not published: render fails only because unreachable external subchart deps
              # (no chart registry in a no-publish cut) were never vendored → skip in dry-run.
              STATUS=skipped; SOURCE=blocked; WHY="artifact not published — dry run: chart cannot render without its external subchart dependencies (unreachable in a no-registry cut)"
              tail -n 30 /tmp/helm-lint.log /tmp/helm-tmpl.log || true
            else
              STATUS=fail; WHY="helm lint/template of the chart failed"; tail -n 30 /tmp/helm-lint.log /tmp/helm-tmpl.log || true
            fi
            echo "::endgroup::"
          fi

          echo "gate=$GATE"     >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_ENV"
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'helm' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  # ───────────────────────────────────────────────────────────────────────────
  # docker — pull the manifest-pinned image digest, run it, curl /healthz/ready.
  # ───────────────────────────────────────────────────────────────────────────
  consume-docker:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1 - for the local ./.github/actions/gate-fragment composite action
      - name: Consume honua-server image
        id: consume
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          PINNED_SERVER_IMAGE: ${{ needs.resolve_pins.outputs.server_image }}
          PINNED_SERVER_DIGEST: ${{ needs.resolve_pins.outputs.server_digest }}
          SERVER_SHA: ${{ needs.resolve_pins.outputs.server_sha }}
        run: |
          set -uo pipefail
          GATE=docker; SOURCE=blocked; STATUS=blocked; WHY=""
          # bootstrap (dry-run) tolerates a publish-dependent consume that can't run without staging;
          # strict (real cut) never does — every tolerant skip below is guarded on this flag.
          ENF="${{ inputs.enforcement }}"; TOLERANT=false; [ "$ENF" != "strict" ] && TOLERANT=true
          WORK="$RUNNER_TEMP/docker-consume"; mkdir -p "$WORK"; cd "$WORK"
          IMG=""

          echo "::group::Try STAGING (docker pull ${PINNED_SERVER_IMAGE}@${PINNED_SERVER_DIGEST})"
          echo "$GH_TOKEN" | docker login ghcr.io -u honua --password-stdin >/tmp/docker-login.log 2>&1 || true
          # Both tag and digest come from the candidate manifest; never substitute a floating tag.
          if docker pull "${PINNED_SERVER_IMAGE}@${PINNED_SERVER_DIGEST}" >/tmp/docker-pull.log 2>&1; then
            IMG="${PINNED_SERVER_IMAGE}@${PINNED_SERVER_DIGEST}"; SOURCE=staging; STATUS=have-image
          fi
          [ "$STATUS" = "have-image" ] || { echo "staging pull miss (expected until publish lands):"; tail -n 5 /tmp/docker-pull.log || true; }
          echo "::endgroup::"

          if [ "$STATUS" != "have-image" ]; then
            # STUB (pending real published artifact): build the image from honua-server's Dockerfile
            # and run THAT — the same artifact `docker push` would publish. Readiness failing here is
            # a real release blocker.
            echo "::group::LOCAL fallback — docker build honua-server from source"
            if bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" honua-server "$SERVER_SHA" src >/tmp/docker-clone.log 2>&1; then
              DOCKERFILE="$(find src -maxdepth 2 -iname 'Dockerfile' | head -n1)"
              if [ -n "$DOCKERFILE" ] && docker build -t honua-server:gate -f "$DOCKERFILE" "$(dirname "$DOCKERFILE")" >/tmp/docker-build.log 2>&1; then
                IMG="honua-server:gate"; SOURCE=local; STATUS=have-image
              else
                STATUS=fail; WHY="no Dockerfile / docker build of honua-server failed"; tail -n 30 /tmp/docker-build.log || true
              fi
            else
              STATUS=blocked; WHY="staging empty and honua-server source not reachable (no RELEASE_GH_TOKEN?)"; tail -n 5 /tmp/docker-clone.log || true
            fi
            echo "::endgroup::"
          fi

          if [ "$STATUS" = "have-image" ]; then
            echo "::group::docker run (postgres sidecar + required config) + poll $SERVER_HEALTH_PATH"
            # The server's Production config validation refuses to start without a database connection
            # string, HONUA_ADMIN_PASSWORD and a connection-encryption master key — the documented
            # customer minimum. Run it exactly as a customer quickstart would: DB sidecar + that env.
            docker network create honua-gate-net >/dev/null 2>&1 || true
            docker run -d --name honua-gate-db --network honua-gate-net \
              -e POSTGRES_USER=honua -e POSTGRES_PASSWORD=honua -e POSTGRES_DB=honua \
              postgis/postgis:16-3.4 >/tmp/docker-db.log 2>&1 || { STATUS=fail; WHY="postgres sidecar failed to start"; }
            if [ "$STATUS" != "fail" ]; then
              for _ in $(seq 1 40); do
                docker exec honua-gate-db pg_isready -U honua -d honua >/dev/null 2>&1 && break; sleep 3
              done
              # Avoid the cold-start edge where pg_isready turns green a fraction before the
              # server's one-shot migration connection is accepted.
              sleep 5
              docker run -d --name honua-gate --network honua-gate-net -p "${SERVER_PORT}:${SERVER_PORT}" \
                -e ConnectionStrings__DefaultConnection="Host=honua-gate-db;Port=5432;Database=honua;Username=honua;Password=honua" \
                -e HONUA_ADMIN_PASSWORD="Gate-Aa1!$(openssl rand -hex 12)" \
                -e Security__ConnectionEncryption__MasterKey="$(openssl rand -hex 32)" \
                -e HostValidation__AllowedHosts="*" -e AllowedHosts="*" \
                "$IMG" >/tmp/docker-run.log 2>&1 || { STATUS=fail; WHY="container failed to start"; }
            fi
            if [ "$STATUS" != "fail" ]; then
              OK=""
              for _ in $(seq 1 60); do
                if curl -fsS "http://localhost:${SERVER_PORT}${SERVER_HEALTH_PATH}" >/tmp/docker-health.log 2>&1; then OK=1; break; fi
                sleep 2
              done
              if [ -n "$OK" ]; then
                STATUS=pass; WHY="image from ${SOURCE}: container healthy at ${SERVER_HEALTH_PATH} against a real PostGIS"
              elif [ "$TOLERANT" = true ]; then
                # The container started with the full documented minimum config; not reaching healthy
                # within the window in a dry-run cut is tolerated (slow migrations on cold runners),
                # but a real cut (strict) hard-FAILs — a customer following the quickstart hits this.
                STATUS=skipped; WHY="dry run: honua-server image (${SOURCE}) started with DB + required config but did not reach ${SERVER_HEALTH_PATH} within 120s"
                echo "--- container logs (informational) ---"; docker logs honua-gate 2>&1 | tail -n 40 || true
              else
                STATUS=fail; WHY="container from ${SOURCE} never became healthy at ${SERVER_HEALTH_PATH} (real PostGIS + required config provided)"
                echo "--- container logs ---"; docker logs honua-gate 2>&1 | tail -n 40 || true
              fi
            fi
            docker rm -f honua-gate honua-gate-db >/dev/null 2>&1 || true
            docker network rm honua-gate-net >/dev/null 2>&1 || true
            echo "::endgroup::"
          fi

          echo "gate=$GATE"     >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_ENV"
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'docker' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  # ───────────────────────────────────────────────────────────────────────────
  # grpc codegen — run `buf generate` against the proto module. Retires grpc#45.
  # ───────────────────────────────────────────────────────────────────────────
  consume-grpc-codegen:
    needs: resolve_pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1      # v7.0.1 - for the local ./.github/actions/gate-fragment composite action
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          github_token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

      - name: Run gRPC codegen
        id: consume
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          GRPC_VERSION: ${{ needs.resolve_pins.outputs.grpc_version }}
          GRPC_SHA: ${{ needs.resolve_pins.outputs.grpc_sha }}
        run: |
          set -uo pipefail
          GATE=grpc-codegen; SOURCE=blocked; STATUS=blocked; WHY=""
          WORK="$RUNNER_TEMP/grpc-consume"; mkdir -p "$WORK"; cd "$WORK"

          # Codegen is run against the proto SOURCE module (there is no "published" form to pull —
          # the artifact IS the generated code). Closes grpc#45: if `buf generate` is broken,
          # this fails. We try a published buf module first, then the source repo.
          echo "::group::Try STAGING (buf module: buf.build/honua-io/geospatial)"
          if [ "$GRPC_VERSION" != "pre-release" ] && buf export "buf.build/honua-io/geospatial:v${GRPC_VERSION}" --output "$WORK/proto" >/tmp/grpc-staging.log 2>&1; then
            SOURCE=staging; STATUS=have-proto; PROTODIR="$WORK/proto"
          else
            echo "buf module miss (expected until publish lands):"; tail -n 5 /tmp/grpc-staging.log || true
          fi
          echo "::endgroup::"

          if [ "$STATUS" != "have-proto" ]; then
            # STUB (pending published buf module): clone the proto repo and generate from source.
            echo "::group::LOCAL fallback — clone geospatial-grpc and generate from source"
            if bash "$GITHUB_WORKSPACE/tools/checkout_component.sh" geospatial-grpc "$GRPC_SHA" src >/tmp/grpc-clone.log 2>&1; then
              # The repo also contains example buf.gen.yaml files. Always prefer the root module
              # containing the frozen proto sources, then fall back to discovery for older layouts.
              if [ -f src/buf.yaml ]; then
                PROTODIR=src
              else
                PROTODIR="$(dirname "$(find src \( -name 'buf.yaml' -o -name 'buf.gen.yaml' \) | head -n1)")"
              fi
              [ -n "$PROTODIR" ] && { SOURCE=local; STATUS=have-proto; } || { STATUS=fail; WHY="no buf config (buf.yaml/buf.gen.yaml) found in geospatial-grpc"; }
            else
              STATUS=blocked; WHY="staging empty and geospatial-grpc source not reachable (no RELEASE_GH_TOKEN?)"; tail -n 5 /tmp/grpc-clone.log || true
            fi
            echo "::endgroup::"
          fi

          if [ "$STATUS" = "have-proto" ]; then
            echo "::group::buf lint + buf generate"
            cd "$PROTODIR"
            buf lint >/tmp/grpc-lint.log 2>&1 || echo "buf lint reported issues (non-fatal for codegen):"
            OUT="$WORK/gen"; mkdir -p "$OUT"
            # If a buf.gen.yaml exists use it; else synthesize a minimal one so codegen is exercised.
            if [ ! -f buf.gen.yaml ]; then
              cat > buf.gen.yaml <<'EOF'
          version: v1
          plugins:
            - plugin: buf.build/protocolbuffers/go
              out: gen
          EOF
            fi
            if buf generate --output "$OUT" >/tmp/grpc-gen.log 2>&1 || buf generate >/tmp/grpc-gen.log 2>&1; then
              # Codegen "working" means it actually emitted files (grpc#45 = it emitted nothing).
              if [ -n "$(find "$OUT" gen -type f 2>/dev/null | head -n1)" ]; then
                STATUS=pass; WHY="buf generate from ${SOURCE} produced code"
              else
                STATUS=fail; WHY="buf generate ran but produced no files (grpc#45)"; tail -n 20 /tmp/grpc-gen.log || true
              fi
            else
              STATUS=fail; WHY="buf generate failed (grpc#45)"; tail -n 30 /tmp/grpc-gen.log || true
            fi
            echo "::endgroup::"
          fi

          echo "gate=$GATE"     >> "$GITHUB_ENV"
          echo "source=$SOURCE" >> "$GITHUB_ENV"
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: ${{ env.gate || 'grpc-codegen' }}
          status: ${{ env.status || 'fail' }}
          source: ${{ env.source || 'blocked' }}
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}

  # ───────────────────────────────────────────────────────────────────────────
  # report — assemble gate-report.json from every fragment; fail the gate per enforcement.
  # ───────────────────────────────────────────────────────────────────────────
  report:
    needs: [consume-npm, consume-mcp-npm, consume-nuget, consume-pip, consume-terraform, consume-helm, consume-docker, consume-grpc-codegen]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.assemble.outputs.overall_status }}
    steps:
      - name: Download fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: gate-fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble gate-report.json
        id: assemble
        env:
          PLATFORM_LABEL: ${{ inputs.platform_label }}
          ENFORCEMENT: ${{ inputs.enforcement }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          # Merge every per-gate fragment into the gate array. A missing fragment (a job that died
          # before emitting) becomes an explicit `fail` so a crash can never masquerade as green.
          GATES=$(ls fragments/*.json 2>/dev/null | wc -l | tr -d ' ')
          echo "collected $GATES fragment(s)"
          jq -s \
            --arg label "$PLATFORM_LABEL" \
            --arg enf "$ENFORCEMENT" \
            --arg ts "$(date -u +%FT%TZ)" \
            --arg run "$RUN_URL" '
            def decided(enf):
              if .status=="pass" and enf=="strict" and .source=="local" then "fail"
              elif .status=="pass" then "pass"
              # skipped = a publish-dependent consume that honestly cannot run in a no-publish dry-run
              # cut. Tolerated under bootstrap (does not reduce the gate); a real cut strict forbids it.
              elif .status=="skipped" then (if enf=="strict" then "fail" else "skipped" end)
              elif .status=="blocked" then (if enf=="strict" then "fail" else "blocked" end)
              else "fail" end;
            ( [ .[] | . + {decided: decided($enf)} ] ) as $g
            | {
                platform_label: $label,
                enforcement: $enf,
                generatedAt: $ts,
                evidence_url: $run,
                gates: $g,
                summary: {
                  pass:    ([$g[]|select(.decided=="pass")]|length),
                  skipped: ([$g[]|select(.decided=="skipped")]|length),
                  blocked: ([$g[]|select(.decided=="blocked")]|length),
                  fail:    ([$g[]|select(.decided=="fail")]|length)
                },
                overallStatus: (
                  if   any($g[]; .decided=="fail")    then "fail"
                  elif any($g[]; .decided=="blocked") then "blocked"
                  else "pass" end)      # a `skipped` gate does not reduce overall below pass
              }' fragments/*.json > out/gate-report.json

          cat out/gate-report.json
          OVERALL=$(jq -r .overallStatus out/gate-report.json)
          echo "overall_status=$OVERALL" >> "$GITHUB_OUTPUT"

          {
            echo "## Artifact-consumption gate — $OVERALL";
            echo "";
            echo "| gate | status | source | why |";
            echo "|---|---|---|---|";
            jq -r '.gates[] | "| \(.gate) | \(.decided) | \(.source) | \(.why) |"' out/gate-report.json;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate-report.json
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-report
          path: out/gate-report.json

      - name: Enforce gate result
        run: |
          set -e
          OVERALL='${{ steps.assemble.outputs.overall_status }}'
          echo "overall gate status: $OVERALL"
          # The gate MUST be able to fail. Any real consume failure => fail, always.
          # Under enforcement=strict a `blocked` or local source-build fallback also fails.
          if [ "$OVERALL" = "fail" ]; then
            echo "::error::artifact-consumption gate FAILED"; exit 1
          fi
          echo "gate not red (overall=$OVERALL under enforcement='${{ inputs.enforcement }}')"
