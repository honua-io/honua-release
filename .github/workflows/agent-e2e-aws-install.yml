# One AWS setup trial. The agent would drive honua-devops; this workflow only owns
# the release-cell slot. Preflight refuses every non-release-cell target and every
# current goal before the provision role can be assumed. The operator stdio bridge
# stays disarmed, so a green preflight is not reachable from this revision.
name: agent-e2e-aws-install

on:
  workflow_dispatch:
    inputs:
      goal_id:
        description: Topology goal id
        required: true
        type: choice
        options:
          - city-gis-ecs
          - county-eks
          - town-lambda
      agent:
        description: MCP client
        required: true
        type: choice
        options:
          - claude-cli
          - codex-cli
      model:
        description: Model id for that client (claude-opus-5-5, claude-sonnet-5-5, gpt-6.1-sol, gpt-6.1-terra)
        required: true
        type: string
      lock_digest:
        description: sha256 digest of the later ops candidate. Setup itself installs 2026.1-rc.1.
        required: true
        type: string
      lock_run_id:
        description: Optional workflow run id that produced lock_digest. Format is checked; the digest is not downloaded.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: e2e-cloud-aws
  cancel-in-progress: false

jobs:
  install:
    name: AWS install eval
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: aws-cell-provision
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
      ROLE_ARN: ${{ vars.HONUA_AWS_CELL_PROVISION_ROLE_ARN }}
    steps:
      - name: Checkout honua-release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preflight the release cell and the product gaps
        env:
          GOAL_ID: ${{ inputs.goal_id }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
          LOCK_RUN_ID: ${{ inputs.lock_run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$ROLE_ARN" = "arn:aws:iam::585192672263:role/honua-release-cell-provision"
          test "$GITHUB_REPOSITORY" = "honua-io/honua-release"
          python3 tools/agent_e2e_aws_install.py preflight \
            --goal-id "$GOAL_ID" \
            --agent "$AGENT" \
            --model "$MODEL" \
            --lock-digest "$LOCK_DIGEST" \
            --lock-run-id "$LOCK_RUN_ID" \
            --output "agent-e2e-aws-install-${RUN_ID}.json" \
            --run-id "$RUN_ID" \
            --role-arn "$ROLE_ARN" \
            --repository "$GITHUB_REPOSITORY" \
            --lifecycle ephemeral \
            --dns-parent demo.honua.io

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Resolve pinned sources
        id: pins
        run: python3 tools/agent_e2e_aws_install.py print-pins

      - name: Checkout honua-iac
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-iac
          ref: ${{ steps.pins.outputs.iac_sha }}
          path: _honua-iac
          persist-credentials: false
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

      - name: Checkout honua-devops
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-devops
          ref: ${{ steps.pins.outputs.devops_sha }}
          path: _honua-devops
          persist-credentials: false
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}

      - name: Assume the release-cell provision role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_CELL_PROVISION_ROLE_ARN }}
          aws-region: us-east-1
          role-duration-seconds: 3600

      - name: Run one AWS install case
        env:
          GOAL_ID: ${{ inputs.goal_id }}
          AGENT: ${{ inputs.agent }}
          MODEL: ${{ inputs.model }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
          LOCK_RUN_ID: ${{ inputs.lock_run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 tools/agent_e2e_aws_install.py case \
            --goal-id "$GOAL_ID" \
            --agent "$AGENT" \
            --model "$MODEL" \
            --lock-digest "$LOCK_DIGEST" \
            --lock-run-id "$LOCK_RUN_ID" \
            --output "agent-e2e-aws-install-${RUN_ID}.json" \
            --run-id "$RUN_ID" \
            --role-arn "$ROLE_ARN" \
            --repository "$GITHUB_REPOSITORY" \
            --lifecycle ephemeral \
            --dns-parent demo.honua.io

      - name: Upload the receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-e2e-aws-install-${{ github.run_id }}
          path: agent-e2e-aws-install-${{ github.run_id }}.json
          retention-days: 14
          if-no-files-found: warn

      - name: Teardown the release-cell slot
        if: always()
        run: |
          set -euo pipefail
          if [ -f slot.json ]; then
            python3 tools/agent_e2e_aws_install.py teardown --slot-file slot.json
          else
            echo "no slot"
            exit 0
          fi
