# Slice-2 cross-cloud CERTIFICATION tier — AWS-first (docs/TEST-STRATEGY.md Phase B).
#
# Two complementary layers, both AWS-first, both creds-gated so a no-cloud local cut is never reddened:
#
#   parity     Deploys honua-server on each AWS target (serverless / ecs / eks) x Redis on/off via the
#              honua-iac example roots, runs the canonical (slim) HTTP parity set + the EXTENDED seam
#              scenarios (MCP / Studio / GP-execute / top-demo), asserts parity, tears down. The
#              extended scenarios are BLOCKED until the cloud harness image (honua-release#35) drives
#              the real drivers against the cloud endpoint — require_real promotes that to FAIL so cloud
#              MCP/Studio/GP/demo cert is genuinely gated, not assumed.
#   iac-live   The WRAPPER that triggers honua-iac's real cloud harness (`terraform-manual-validation.yml`)
#              with run_live=true (AWS), polls it to completion, and folds its verdict in. This is the
#              production plan/apply/smoke/destroy harness — we do not re-implement it here, we drive it.
#
# SELF-SKIP (task requirement): when the OIDC/cloud secrets are unset (no HONUA_AWS_ROLE_ARN and, for the
# wrapper, no dispatch token) every layer emits `status: skipped, why: cloud-creds-unset` + a clear
# `::notice::` and exits 0 — so the local tiers of a dry-run cut still run and the train is not failed.
# It is READY to enforce per-RC: set HONUA_AWS_ROLE_ARN (OIDC role) + HONUA_LAMBDA_IMAGE_URI/HONUA_ECS_IMAGE
# (+ RELEASE_GH_TOKEN for the wrapper) on the candidate and every layer runs for real. OIDC into AWS — no
# static creds. The aggregate `cloud-report` job assembles one machine-readable gate-report the train parses.

name: e2e-cloud-aws

on:
  schedule:
    - cron: "17 7 * * *"          # nightly; the train consumes the latest green (Phase 2)
  workflow_dispatch:
    inputs:
      require_real:
        description: "Promote BLOCKED/parity-divergence/not-certified scenarios to FAIL (per-RC, with creds wired)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      require_real:
        type: boolean
        default: false
    secrets:
      RELEASE_GH_TOKEN:
        required: false
    outputs:
      overall_status:
        description: "pass | fail | blocked | skipped — aggregate of the parity cells + the iac-live wrapper"
        value: ${{ jobs.cloud-report.outputs.overall_status }}

permissions:
  contents: read
  actions: write                  # dispatch the honua-iac cloud harness (iac-live wrapper)
  id-token: write                 # OIDC -> AWS (no static creds)

concurrency:
  group: e2e-cloud-aws            # one ephemeral env at a time
  cancel-in-progress: false

jobs:
  parity:
    # The deploy-target x Redis matrix: all 3 AWS targets, each with Redis on and off, so the platform
    # is proven to behave identically everywhere and with/without its cache. Each cell is independent
    # (fail-fast off) so one skipped/blocked/red cell doesn't hide the others.
    strategy:
      fail-fast: false
      matrix:
        target: [aws-serverless, aws-ecs, aws-eks]
        redis: ["off", "on"]
    name: "${{ matrix.target }} / redis-${{ matrix.redis }}"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "us-east-1"
      # Set as repo/org variables to enable a real deploy; empty => the cell self-skips honestly.
      HONUA_LAMBDA_IMAGE_URI: ${{ vars.HONUA_LAMBDA_IMAGE_URI }}
      HONUA_ECS_IMAGE: ${{ vars.HONUA_ECS_IMAGE }}
      HONUA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Checkout honua-iac (terraform tree)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: honua-io/honua-iac
          path: _honua-iac
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true   # private/absent => HONUA_IAC_DIR stays unset => self-skip, not a crash

      - name: Checkout honua-helm (chart for the EKS cell)
        if: matrix.target == 'aws-eks'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: honua-io/honua-helm
          path: _honua-helm
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false
      - run: python -m pip install pytest

      # The gate's own verdict + parity logic must be trustworthy before we trust a run.
      - name: Self-test the cloud parity logic
        run: python -m pytest e2e/test_cloud.py -q

      # OIDC into AWS — only when a role is configured; otherwise the cell self-skips.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: "Run ${{ matrix.target }} / redis-${{ matrix.redis }} parity"
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          HONUA_HELM_DIR: ${{ github.workspace }}/_honua-helm
        run: |
          set -euo pipefail
          [ -d "$HONUA_IAC_DIR/infrastructure/terraform" ] || unset HONUA_IAC_DIR
          [ -d "$HONUA_HELM_DIR" ] || unset HONUA_HELM_DIR
          if [ "${{ inputs.require_real || false }}" = "true" ]; then
            python e2e/run_cloud.py --target "${{ matrix.target }}" --redis "${{ matrix.redis }}" --require-real
          else
            python e2e/run_cloud.py --target "${{ matrix.target }}" --redis "${{ matrix.redis }}"
          fi

      - name: Teardown reaper (backstop)
        if: always()
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
        run: |
          # run_cloud already tears down; belt-and-suspenders so nothing lingers on credits even if the
          # cell was cancelled mid-apply. Sweep every AWS example root.
          if [ -n "${{ vars.HONUA_AWS_ROLE_ARN }}" ]; then
            for ROOT in "$HONUA_IAC_DIR"/infrastructure/terraform/examples/aws \
                        "$HONUA_IAC_DIR"/infrastructure/terraform/examples/aws-serverless \
                        "$HONUA_IAC_DIR"/infrastructure/terraform/examples/aws-eks; do
              [ -d "$ROOT/.terraform" ] && terraform -chdir="$ROOT" destroy -auto-approve -no-color -input=false || true
            done
          else
            echo "::notice title=cloud-cert self-skipped::no HONUA_AWS_ROLE_ARN — nothing was deployed to reap"
          fi

      - name: Upload cloud gate-report (per cell)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-cloud-aws-gate-report-${{ matrix.target }}-redis-${{ matrix.redis }}
          path: e2e/gate-report-cloud.json
          if-no-files-found: warn

  # ── iac-live: WRAP honua-iac's real cloud harness (terraform-manual-validation.yml, run_live) ────────
  iac-live:
    name: "iac-live (terraform-manual-validation, run_live=aws)"
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch + poll honua-iac terraform-manual-validation (run_live, AWS)
        id: iac
        env:
          # The wrapper needs BOTH a dispatch token (to trigger honua-iac Actions) and the OIDC role
          # (so honua-iac's live job can auth to AWS). Missing either => self-skip.
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || '' }}
          AWS_ROLE: ${{ vars.HONUA_AWS_ROLE_ARN }}
          REQUIRE_REAL: ${{ inputs.require_real || false }}
        run: |
          set -uo pipefail
          STATUS=skipped; WHY="cloud-creds-unset"
          if [ -z "$GH_TOKEN" ] || [ -z "$AWS_ROLE" ]; then
            echo "::notice title=cloud-cert self-skipped::iac-live: cloud-creds-unset (set RELEASE_GH_TOKEN + HONUA_AWS_ROLE_ARN to enforce per-RC)"
          else
            REPO=honua-io/honua-iac
            WF=terraform-manual-validation.yml
            REF=trunk
            echo "dispatching $WF on $REPO ($REF) with run_live=true cloud=aws"
            # Record the dispatch time so we can find the run we just triggered.
            SINCE="$(date -u +%FT%TZ)"
            gh workflow run "$WF" --repo "$REPO" --ref "$REF" \
              -f cloud=aws -f deployment_profile=ephemeral -f run_live=true \
              -f run_k8s=false -f run_aks=false -f run_eks=false -f run_drift=false \
              >/tmp/iac-dispatch.log 2>&1 || { STATUS=fail; WHY="failed to dispatch $WF (token scope? branch $REF?)"; cat /tmp/iac-dispatch.log; }
            if [ "$STATUS" != "fail" ]; then
              RUN_ID=""
              for _ in $(seq 1 12); do
                sleep 10
                RUN_ID="$(gh run list --repo "$REPO" --workflow "$WF" --created ">=$SINCE" \
                          --json databaseId,createdAt --jq 'sort_by(.createdAt)|reverse|.[0].databaseId' 2>/dev/null || true)"
                [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] && break
              done
              if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
                STATUS=blocked; WHY="dispatched but could not resolve the honua-iac run id"
              else
                echo "watching honua-iac run $RUN_ID"
                gh run watch "$RUN_ID" --repo "$REPO" --exit-status >/tmp/iac-watch.log 2>&1 && CONC=success || CONC=failure
                URL="$(gh run view "$RUN_ID" --repo "$REPO" --json url --jq .url 2>/dev/null || echo '')"
                if [ "$CONC" = "success" ]; then STATUS=pass; WHY="honua-iac live AWS validation passed ($URL)";
                else STATUS=fail; WHY="honua-iac live AWS validation failed ($URL)"; fi
              fi
            fi
          fi
          echo "iac-live -> $STATUS ($WHY)"
          mkdir -p out
          jq -n --arg s "$STATUS" --arg w "$WHY" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{gate:"cloud-iac-live", status:$s, why:$w, evidence_url:$run}' > out/gate-report-cloud.json
          cat out/gate-report-cloud.json

      - name: Upload iac-live report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-iac-live-report
          path: out/gate-report-cloud.json
          if-no-files-found: warn

  # ── cloud-report: assemble ONE machine-readable gate-report the train parses (never scrape logs) ─────
  cloud-report:
    needs: [parity, iac-live]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.assemble.outputs.overall_status }}
    steps:
      - name: Download all cloud reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*cloud*report*"
          path: reports
        continue-on-error: true

      - name: Assemble cloud gate-report.json
        id: assemble
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REQUIRE_REAL: ${{ inputs.require_real || false }}
        run: |
          set -euo pipefail
          mkdir -p out
          FILES=$(find reports -name 'gate-report-cloud.json' 2>/dev/null || true)
          if [ -z "$FILES" ]; then
            echo '{"gate":"cloud-parity","status":"skipped","why":"no cloud cell reports produced (self-skipped)","cells":[]}' > merged.json
          else
            # Each cell/wrapper report contributes a {status,why,...}. Overall verdict:
            #   fail    if any cell failed
            #   blocked if any cell blocked (half-wired infra)
            #   skipped if every cell self-skipped (no creds)
            #   pass    otherwise (>=1 real pass, remainder skipped)
            # shellcheck disable=SC2086
            jq -s '
              { gate:"cloud-parity",
                cells: [ .[] | {gate:(.gate//"cloud-cell"), cell:(.cell//.gate//"?"), target:.target,
                                redis:.redis, status:.status, why:.why} ],
                scenarioCoverage: ( [ .[] | (.scenarioCoverage // [])[] ] | unique_by(.name) ),
                status: ( [ .[].status ] as $s
                  | if   ($s|any(.=="fail"))    then "fail"
                    elif ($s|any(.=="blocked")) then "blocked"
                    elif ($s|all(.=="skipped")) then "skipped"
                    else "pass" end ) }' $FILES > merged.json
          fi
          jq --arg run "$RUN_URL" --arg enf "$REQUIRE_REAL" \
             '. + {enforcement:$enf, evidence_url:$run, generatedAt:(now|todateiso8601)}' \
             merged.json > out/gate-report-cloud.json
          cat out/gate-report-cloud.json
          OVERALL="$(jq -r .status out/gate-report-cloud.json)"
          echo "overall_status=$OVERALL" >> "$GITHUB_OUTPUT"
          {
            echo "## Cloud cert (AWS) — $OVERALL";
            echo "";
            echo "| cell | status | why |"; echo "|---|---|---|";
            jq -r '.cells[] | "| \(.cell) | \(.status) | \(.why) |"' out/gate-report-cloud.json;
            echo "";
            echo "### Extended scenarios (MCP/Studio/GP/demo)";
            jq -r '.scenarioCoverage[]? | "- **\(.name)**: \(.status) — \(.why)"' out/gate-report-cloud.json;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated cloud gate-report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloud-gate-report
          path: out/gate-report-cloud.json

      - name: Enforce
        run: |
          set -e
          OVERALL='${{ steps.assemble.outputs.overall_status }}'
          echo "cloud cert overall: $OVERALL (require_real=${{ inputs.require_real || false }})"
          # A real FAIL always reddens the job. skipped/blocked are tolerated here (surfaced in the
          # report + honoured by the train's aggregate + promote's allowed-skip list).
          [ "$OVERALL" = "fail" ] && { echo "::error::cloud cert FAILED"; exit 1; } || echo "not red"
