name: e2e-cloud-aws

on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Immutable candidate snapshot ref
        type: string
        default: ""
      lock_run_id:
        description: Release train run containing the frozen candidate-manifest artifact
        type: string
        default: ""
      prepared_ref:
        description: Unadmitted data-only snapshot at refs/prepared-deployments/<sha>; never a candidate ref
        required: false
        type: string
        default: ""
      require_real:
        description: "Promote BLOCKED/parity-divergence/not-certified scenarios to FAIL (per-RC, with creds wired)"
        type: boolean
        default: false
      target:
        description: "AWS runtime target to validate"
        type: choice
        options: [all, aws-serverless, aws-ecs, aws-eks]
        default: all
      redis_mode:
        description: "Redis must remain disabled"
        type: choice
        options: ["off"]
        default: "off"
      cost_ceiling_usd:
        description: "Per-run USD ceiling: the live estimate gates this run; Cost Explorer actuals gate the next"
        type: string
        default: "20"
      run_iac_live:
        description: "Also dispatch the full honua-iac live AWS harness"
        type: boolean
        default: true
      genuine_model_bedrock:
        description: "Enable Bedrock on selected ECS cells (or explicitly requested Preview Lambda cells) for the genuine-model journey (billed tokens)"
        type: boolean
        default: false
      bedrock_model:
        description: "Bedrock model for the genuine-model cells (exact us. profile, e.g. us.anthropic.claude-sonnet-4-6 or us.openai.gpt-6.1-terra); empty uses the pinned module default"
        type: string
        default: ""
      lock_digest:
        description: "sha256:<hex> of the platform lock; supply lock_run_id on dispatch"
        type: string
        default: ""
  workflow_call:
    inputs:
      update_rollback_run_id: { required: false, type: string, default: "" }
      update_rollback_mode: { required: false, type: string, default: "rehearsal" }
      update_rollback_prior_run_id: { required: false, type: string, default: "" }
      candidate_ref: { required: false, type: string, default: "" }
      prepared_ref: { required: false, type: string, default: "" }
      require_real:
        type: boolean
        default: false
      target:
        type: string
        default: all
      redis_mode:
        type: string
        default: "off"
      cost_ceiling_usd:
        description: "Per-run USD ceiling: the live estimate gates this run; Cost Explorer actuals gate the next"
        type: string
        default: "20"
      run_iac_live:
        type: boolean
        default: true
      genuine_model_bedrock:
        type: boolean
        default: false
      bedrock_model: { required: false, type: string, default: "" }
      trial_id: { required: false, type: string, default: "" }
      lock_run_id: { required: false, type: string, default: "" }
      lock_digest:
        type: string
        default: ""
    secrets:
      UPDATE_ROLLBACK_CONTROLLER_ENV: { required: false }
      RELEASE_GH_TOKEN:
        required: false
      TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED:
        required: false
    outputs:
      overall_status:
        description: "pass | fail | blocked | skipped — retired producer; always blocked"
        value: ${{ jobs.retired.outputs.status }}


permissions: {}

jobs:
  retired:
    name: Terraform cloud cells retired
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    outputs:
      status: ${{ steps.retired.outputs.status }}
    steps:
      - name: Refuse retired cloud-cell execution
        id: retired
        run: |
          echo "status=blocked" >> "$GITHUB_OUTPUT"
          echo "::error::Terraform cloud cells are retired. Use the maintained deployment qualification; this producer supplies no release evidence. See docs/RETIRED-CLOUD-CELLS.md."
          exit 1
