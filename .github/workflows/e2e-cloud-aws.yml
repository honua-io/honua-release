# Cross-cloud parity tier — AWS serverless (docs/TEST-STRATEGY.md Phase B, AWS-first).
#
# Deploys a real honua-server via the honua-iac serverless example, runs the canonical (slim) parity
# set against its endpoint, asserts parity with the reference (local docker) when provided, and tears
# down (ephemeral + reaper). This is the "also runs cloud integration" layer of the release train.
#
# Honesty (AGENTS.md): until the AWS role + a deployable Lambda-AOT (ECR) image + the IaC are wired,
# the run is BLOCKED, never a fake green. The nightly run defaults to NOT require_real (BLOCKED is
# tolerated and surfaced); the release train and an explicit dispatch can set require_real so a
# BLOCKED/parity-divergence is a hard red. OIDC into AWS — no static creds.
#
# To make it actually deploy, set the repo/org variable HONUA_AWS_ROLE_ARN (an OIDC role this repo may
# assume) and HONUA_LAMBDA_IMAGE_URI (an ECR `*-lambda-aot` image); see the job env below.

name: e2e-cloud-aws

on:
  schedule:
    - cron: "17 7 * * *"          # nightly; the train consumes the latest green (Phase 2)
  workflow_dispatch:
    inputs:
      require_real:
        description: "Promote BLOCKED/parity-divergence to FAIL (run once AWS infra is wired)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      require_real:
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write                 # OIDC -> AWS (no static creds)

concurrency:
  group: e2e-cloud-aws            # one ephemeral env at a time
  cancel-in-progress: false

jobs:
  parity:
    # The deploy-target x Redis matrix: all 3 AWS targets, each with Redis on and off, so the platform
    # is proven to behave identically everywhere and with/without its cache. Each cell is independent
    # (fail-fast off) so one blocked/red cell doesn't hide the others.
    strategy:
      fail-fast: false
      matrix:
        target: [aws-serverless, aws-ecs, aws-eks]
        redis: ["off", "on"]
    name: "${{ matrix.target }} / redis-${{ matrix.redis }}"
    runs-on: ubuntu-latest
    env:
      AWS_REGION: "us-east-1"
      # Set as repo/org variables to enable a real deploy; empty => the cell reports BLOCKED honestly.
      HONUA_LAMBDA_IMAGE_URI: ${{ vars.HONUA_LAMBDA_IMAGE_URI }}
      HONUA_ECS_IMAGE: ${{ vars.HONUA_ECS_IMAGE }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout honua-iac (terraform tree)
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-iac
          path: _honua-iac
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true   # private/absent => HONUA_IAC_DIR stays unset => BLOCKED, not a crash

      - name: Checkout honua-helm (chart for the EKS cell)
        if: matrix.target == 'aws-eks'
        uses: actions/checkout@v4
        with:
          repository: honua-io/honua-helm
          path: _honua-helm
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - run: python -m pip install pytest

      # The gate's own verdict + parity logic must be trustworthy before we trust a run.
      - name: Self-test the cloud parity logic
        run: python -m pytest e2e/test_cloud.py -q

      # OIDC into AWS — only when a role is configured; otherwise the cell reports BLOCKED.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: "Run ${{ matrix.target }} / redis-${{ matrix.redis }} parity"
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          HONUA_HELM_DIR: ${{ github.workspace }}/_honua-helm
        run: |
          set -euo pipefail
          [ -d "$HONUA_IAC_DIR/infrastructure/terraform" ] || unset HONUA_IAC_DIR
          [ -d "$HONUA_HELM_DIR" ] || unset HONUA_HELM_DIR
          if [ "${{ inputs.require_real || false }}" = "true" ]; then
            python e2e/run_cloud.py --target "${{ matrix.target }}" --redis "${{ matrix.redis }}" --require-real
          else
            python e2e/run_cloud.py --target "${{ matrix.target }}" --redis "${{ matrix.redis }}"
          fi

      - name: Teardown reaper (backstop)
        if: always()
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
        run: |
          # run_cloud already tears down; belt-and-suspenders so nothing lingers on credits even if the
          # cell was cancelled mid-apply. Sweep every AWS example root.
          if [ -n "${{ vars.HONUA_AWS_ROLE_ARN }}" ]; then
            for ROOT in "$HONUA_IAC_DIR"/infrastructure/terraform/examples/aws \
                        "$HONUA_IAC_DIR"/infrastructure/terraform/examples/aws-serverless \
                        "$HONUA_IAC_DIR"/infrastructure/terraform/examples/aws-eks; do
              [ -d "$ROOT/.terraform" ] && terraform -chdir="$ROOT" destroy -auto-approve -no-color -input=false || true
            done
          else
            echo "no real deploy was attempted (BLOCKED) — nothing to reap"
          fi

      - name: Upload cloud gate-report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-cloud-aws-gate-report-${{ matrix.target }}-redis-${{ matrix.redis }}
          path: e2e/gate-report-cloud.json
          if-no-files-found: warn
