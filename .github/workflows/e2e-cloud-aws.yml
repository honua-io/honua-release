# AWS promise journeys: four required GA cells, {aws-ecs, aws-serverless} x Redis off/on, where
# aws-serverless is Lambda + AWS Batch geoprocessing; EKS is informational Preview evidence. The mixed
# ECS + Batch cell is out of the 2026.1 rc.3 matrix: its IaC root does not exist yet (restore it when
# honua-iac#209 lands).
# Every cell retains attempts, records its live cost estimate before teardown, and always runs its teardown job.
# Extended MCP / Studio / GP / demo seams use the local drivers on the live endpoint before teardown.
# They and the pinned journey clients run in each cell's credential-free journey job
# (e2e-cloud-aws-cell.yml, honua-release#381). The reviewed site's CSP genuinely BLOCKs top-demo on an
# AWS hostname (honua-release#450); strict require_real still fails that cell. A driver FAIL always
# fails, including bootstrap dispatches.
name: e2e-cloud-aws

on:
  schedule:
    - cron: "17 7 * * *"          # nightly; the train consumes the latest green (Phase 2)
  workflow_dispatch:
    inputs:
      require_real:
        description: "Promote BLOCKED/parity-divergence/not-certified scenarios to FAIL (per-RC, with creds wired)"
        type: boolean
        default: false
      target:
        description: "AWS runtime target to validate"
        type: choice
        options: [all, aws-serverless, aws-ecs, aws-eks]
        default: all
      redis_mode:
        description: "Redis mode(s) to validate"
        type: choice
        options: [both, "off", "on"]
        default: both
      cost_ceiling_usd:
        description: "Per-run USD ceiling: the live estimate gates this run; Cost Explorer actuals gate the next"
        type: string
        default: "20"
      run_iac_live:
        description: "Also dispatch the full honua-iac live AWS harness"
        type: boolean
        default: true
      genuine_model_bedrock:
        description: "Enable Bedrock on the aws-ecs/redis-off cell for the genuine-model journey (billed tokens)"
        type: boolean
        default: false
      lock_digest:
        description: "sha256:<hex> of the platform lock the genuine-model canary binds to (empty: the canary runs unbound and records blocked)"
        type: string
        default: ""
  workflow_call:
    inputs:
      candidate_ref: { required: false, type: string, default: "" }
      require_real:
        type: boolean
        default: false
      target:
        type: string
        default: all
      redis_mode:
        type: string
        default: both
      cost_ceiling_usd:
        description: "Per-run USD ceiling: the live estimate gates this run; Cost Explorer actuals gate the next"
        type: string
        default: "20"
      run_iac_live:
        type: boolean
        default: true
      genuine_model_bedrock:
        type: boolean
        default: false
      # Fix unit J3: the genuine-model canary runs on the Bedrock cell after its journey, bound to this lock.
      lock_digest:
        type: string
        default: ""
    secrets:
      RELEASE_GH_TOKEN:
        required: false
    outputs:
      overall_status:
        description: "pass | fail | blocked | skipped — aggregate of exactly the four GA journey cells"
        value: ${{ jobs.cloud-report.outputs.overall_status }}

permissions:
  contents: read
  actions: write                  # dispatch the honua-iac cloud harness (iac-live wrapper)
  id-token: write                 # OIDC -> AWS (no static creds)

concurrency:
  group: e2e-cloud-aws            # one ephemeral env at a time
  cancel-in-progress: false

jobs:
  candidate:
    name: "Resolve manifest cloud candidates"
    runs-on: ubuntu-latest
    outputs:
      iac_ref: ${{ steps.pins.outputs.iac_ref }}
      helm_ref: ${{ steps.pins.outputs.helm_ref }}
      server_ref: ${{ steps.pins.outputs.server_ref }}
      server_image: ${{ steps.pins.outputs.server_image }}
      ecs_architecture: ${{ steps.pins.outputs.ecs_architecture }}
      lambda_image: ${{ steps.lambda-ecr.outputs.lambda_image }}
      lambda_architecture: ${{ steps.pins.outputs.lambda_architecture }}
      gp_batch_image: ${{ steps.pins.outputs.gp_batch_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r e2e/requirements.txt
      - name: Read exact cloud component SHAs from the platform manifest
        id: pins
        env:
          # Presence of the OIDC role decides whether the pending-ecr-mirror sentinel is acceptable:
          # with no role nothing is mirrored (the cell self-skips), so an unknown post-mirror digest
          # is honest. With a role configured the mirror DOES run and the sentinel is a hard failure.
          HONUA_AWS_ROLE_ARN: ${{ vars.HONUA_AWS_ROLE_ARN }}
        run: |
          python - <<'PY'
          import os
          import re
          import yaml

          manifest = yaml.safe_load(open("platform-manifest.yaml", encoding="utf-8"))
          components = manifest.get("components") or {}
          server = components.get("honua-server") or {}
          pins = {
              "iac_ref": str((components.get("honua-iac") or {}).get("sha", "")),
              "helm_ref": str((components.get("honua-helm") or {}).get("sha", "")),
              "server_ref": str(server.get("sha", "")),
          }
          for name, value in pins.items():
              if not re.fullmatch(r"[0-9a-f]{40}", value):
                  raise SystemExit(f"{name} is not an exact 40-character commit SHA: {value!r}")
          image = str(server.get("image", ""))
          digest = str(server.get("digest", ""))
          if not image or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("honua-server image and exact sha256 digest are required")
          # honua-iac >= 5b09d0d refuses a tag next to the digest (`repo:tag@sha256:` is a mutable
          # reference); hand the module `repository@digest` only, the tag stays in the manifest.
          repository = re.sub(r":[^/@]+$", "", image.split("@", 1)[0])
          pins["server_image"] = f"{repository}@{digest}"
          ecs_architecture = str(server.get("awsEcsArchitecture", ""))
          if ecs_architecture not in {"arm64", "x86_64"}:
              raise SystemExit("honua-server awsEcsArchitecture must be arm64 or x86_64")
          pins["ecs_architecture"] = ecs_architecture
          # The Lambda+Batch cell's Batch job and its pre-serving migration run the generic server
          # image's amd64 child by digest; honua-iac's gp_batch_image refuses a tag.
          amd64 = str((server.get("platformDigests") or {}).get("amd64", ""))
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", amd64):
              raise SystemExit("honua-server platformDigests.amd64 must be an exact sha256 digest")
          repository = image.rsplit(":", 1)[0] if "/" not in image.rsplit(":", 1)[-1] else image
          pins["gp_batch_image"] = f"{repository}@{amd64}"
          lambda_image = str(server.get("awsLambdaImage", ""))
          lambda_digest = str(server.get("awsLambdaDigest", ""))
          lambda_ecr_digest = str(server.get("awsLambdaEcrDigest", ""))
          lambda_architecture = str(server.get("awsLambdaArchitecture", ""))
          if not lambda_image.startswith("ghcr.io/honua-io/honua-server:"):
              raise SystemExit("honua-server awsLambdaImage must be an exact Honua GHCR tag")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", lambda_digest):
              raise SystemExit("honua-server awsLambdaDigest must be an exact sha256 digest")
          # honua-release#99: the post-mirror ECR digest is only knowable by actually pushing to ECR
          # (ECR re-serialises the OCI manifest as Docker schema 2, so it differs from the GHCR
          # digest and cannot be reproduced by a stock registry). On a re-pin the new value is
          # therefore unknown until this job runs once. The manifest may say so with exactly one
          # documented sentinel — never a stale digest from a previous pin, never an invented one.
          # The mirror step below still runs on the sentinel: it pushes, resolves the real digest,
          # asserts ECR preserved the source config, and then FAILS with the value to record. So the
          # sentinel buys a bootstrap round-trip, not a skipped verification.
          pending_ecr_mirror = "pending-ecr-mirror"
          if lambda_ecr_digest != pending_ecr_mirror and not re.fullmatch(r"sha256:[0-9a-f]{64}", lambda_ecr_digest):
              raise SystemExit(
                  "honua-server awsLambdaEcrDigest must be an exact sha256 digest or the literal "
                  f"{pending_ecr_mirror!r} sentinel (honua-release#99)"
              )
          if lambda_architecture != "x86_64":
              raise SystemExit(
                  "honua-server awsLambdaArchitecture must be x86_64 for the 2026.1 Lambda GA "
                  f"target (release#282); got {lambda_architecture!r}"
              )
          pins["lambda_source"] = f"{lambda_image}@{lambda_digest}"
          pins["lambda_source_digest"] = lambda_digest
          pins["lambda_ecr_digest"] = lambda_ecr_digest
          pins["lambda_architecture"] = lambda_architecture
          pins["lambda_ecr_tag"] = f"rc-{manifest['platformRelease']}-lambda-aot-{pins['server_ref'][:7]}-{lambda_architecture}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name, value in pins.items():
                  output.write(f"{name}={value}\n")
          PY

      - name: Configure AWS credentials for the candidate Lambda mirror
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Mirror the exact Lambda candidate into same-region ECR
        id: lambda-ecr
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        env:
          SOURCE_IMAGE: ${{ steps.pins.outputs.lambda_source }}
          SOURCE_DIGEST: ${{ steps.pins.outputs.lambda_source_digest }}
          EXPECTED_ECR_DIGEST: ${{ steps.pins.outputs.lambda_ecr_digest }}
          SOURCE_ARCHITECTURE: ${{ steps.pins.outputs.lambda_architecture }}
          TARGET_TAG: ${{ steps.pins.outputs.lambda_ecr_tag }}
        run: |
          set -euo pipefail
          # release#282: docker pull/tag/push re-encodes the image config, so ECR would store a
          # different artifact from the pinned digest. crane copy uploads the manifest bytes.
          # The pending-ecr-mirror sentinel still fails closed after that copy. This step prints
          # the digest the operator must record; it does not write platform-manifest.yaml and it
          # does not discharge the certification lane.
          if [ "$SOURCE_ARCHITECTURE" != "x86_64" ]; then
            echo "::error::honua-server awsLambdaArchitecture must be x86_64 for the 2026.1 Lambda GA target (release#282); got ${SOURCE_ARCHITECTURE}"
            exit 1
          fi
          CRANE_VERSION="v0.22.1"
          CRANE_SHA256="0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0"
          case "$(uname -m)" in
            x86_64) ;;
            *) echo "::error::Lambda mirror runner must be x86_64 to match the GA target"; exit 1 ;;
          esac
          archive="$RUNNER_TEMP/go-containerregistry.tar.gz"
          curl -fsSL --retry 5 --retry-all-errors -o "$archive" \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  ${archive}" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP" crane
          install -m 0755 "$RUNNER_TEMP/crane" "$RUNNER_TEMP/bin/crane"
          export PATH="$RUNNER_TEMP/bin:$PATH"

          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          REPOSITORY="honua-server"
          TARGET="${REGISTRY}/${REPOSITORY}:${TARGET_TAG}"

          SOURCE_MANIFEST="$(docker buildx imagetools inspect --raw "$SOURCE_IMAGE")"
          if [ "$(jq -r 'has("manifests")' <<<"$SOURCE_MANIFEST")" = "true" ]; then
            echo "::error::Lambda source digest must be a single-platform manifest, not a multi-platform index"
            exit 1
          fi
          SOURCE_CONFIG="$(jq -er '.config.digest' <<<"$SOURCE_MANIFEST")"
          SOURCE_LAYERS="$(jq -ce '[.layers[].digest]' <<<"$SOURCE_MANIFEST")"
          SOURCE_PLATFORM="$(crane config "$SOURCE_IMAGE" | jq -er '.architecture')"
          if [ "$SOURCE_PLATFORM" != "amd64" ]; then
            echo "::error::Lambda source config architecture is ${SOURCE_PLATFORM}, expected amd64 for x86_64"
            exit 1
          fi

          ecr_manifest_for() {
            aws ecr batch-get-image --repository-name "$REPOSITORY" \
              --image-ids "$1" \
              --accepted-media-types application/vnd.oci.image.manifest.v1+json application/vnd.docker.distribution.manifest.v2+json \
              --query 'images[0].imageManifest' --output text
          }
          assert_mirror_matches_source() {
            local digest="$1"
            local manifest layers
            manifest="$(ecr_manifest_for "imageDigest=${digest}")" || return 1
            ECR_CONFIG="$(jq -er '.config.digest' <<<"$manifest")" || return 1
            layers="$(jq -ce '[.layers[].digest]' <<<"$manifest")" || return 1
            if [ "$ECR_CONFIG" != "$SOURCE_CONFIG" ]; then
              echo "::error::ECR Lambda config $ECR_CONFIG does not match source config $SOURCE_CONFIG"
              return 1
            fi
            if [ "$layers" != "$SOURCE_LAYERS" ]; then
              echo "::error::ECR Lambda layer digests do not match the exact source artifact"
              return 1
            fi
          }
          mirror_exact() {
            aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
            crane copy "$SOURCE_IMAGE" "$TARGET"
          }

          aws ecr describe-repositories --repository-names "$REPOSITORY" >/dev/null
          EXISTING="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids imageTag="$TARGET_TAG" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"

          # honua-release#99 bootstrap: on a fresh honua-server pin the post-mirror ECR digest is not
          # yet knowable, so the manifest carries the pending-ecr-mirror sentinel. Mirror anyway,
          # verify ECR preserved the source config and layers, then FAIL with the digest to record.
          # The pin is not certified until the manifest declares that returned digest up front.
          if [ "$EXPECTED_ECR_DIGEST" = "pending-ecr-mirror" ]; then
            if [ -z "$EXISTING" ] || [ "$EXISTING" = "None" ]; then
              mirror_exact
              EXISTING="$(aws ecr describe-images --repository-name "$REPOSITORY" \
                --image-ids imageTag="$TARGET_TAG" --query 'imageDetails[0].imageDigest' --output text)"
            elif ! assert_mirror_matches_source "$EXISTING"; then
              # A prior docker pull/tag/push stored a re-encoded manifest under this tag.
              # ECR's digest then differs even when the tag name is the one this pin uses.
              # Replace that copy; do not record it.
              aws ecr batch-delete-image --repository-name "$REPOSITORY" \
                --image-ids "imageTag=${TARGET_TAG}" >/dev/null
              mirror_exact
              EXISTING="$(aws ecr describe-images --repository-name "$REPOSITORY" \
                --image-ids imageTag="$TARGET_TAG" --query 'imageDetails[0].imageDigest' --output text)"
            fi
            assert_mirror_matches_source "$EXISTING" || exit 1
            echo "::error::awsLambdaEcrDigest is the pending-ecr-mirror sentinel. ECR preserved the source config; record this in platform-manifest.yaml and re-run (honua-release#99): $EXISTING"
            exit 1
          fi

          if [ -n "$EXISTING" ] && [ "$EXISTING" != "None" ] && [ "$EXISTING" != "$EXPECTED_ECR_DIGEST" ]; then
            echo "::error::immutable Lambda candidate tag $TARGET_TAG already points at $EXISTING, expected $EXPECTED_ECR_DIGEST"
            exit 1
          fi
          if [ "$EXISTING" != "$EXPECTED_ECR_DIGEST" ]; then
            mirror_exact
          fi

          RESOLVED="$(aws ecr describe-images --repository-name "$REPOSITORY" \
            --image-ids imageTag="$TARGET_TAG" --query 'imageDetails[0].imageDigest' --output text)"
          if [ "$RESOLVED" != "$EXPECTED_ECR_DIGEST" ]; then
            echo "::error::ECR Lambda digest $RESOLVED does not match manifest ECR digest $EXPECTED_ECR_DIGEST"
            exit 1
          fi
          assert_mirror_matches_source "$RESOLVED" || exit 1
          echo "lambda_image=${REGISTRY}/${REPOSITORY}@${RESOLVED}" >> "$GITHUB_OUTPUT"

  parity:
    needs: candidate
    # Four GA cells plus two informational Preview (EKS) cells; failures never hide other attempts.
    # Each cell is its own provision -> journey -> teardown chain (e2e-cloud-aws-cell.yml): the
    # pinned clients run in a job that holds no AWS credential and no OIDC token (honua-release#381).
    strategy:
      fail-fast: false
      # VPC QUOTA, not throughput tuning. Every cell stands up its own VPC in AWS_REGION, and the
      # full matrix is 4 targets x 2 redis modes = 8 cells. With the account's default VPC that needs
      # 9 VPC slots against a default per-region quota of 5 (L-F678F1CE), so an unthrottled matrix
      # cannot pass in a stock account: the cells that lose the race die on
      #   Error: creating EC2 VPC: api error VpcLimitExceeded: The maximum number of VPCs has been reached.
      # which reads like a broken cell rather than a capacity ceiling. Observed on run 32193955519,
      # where four cells took slots and the rest failed.
      #
      # max-parallel keeps concurrent VPC demand at 2 + the default VPC, leaving headroom for the
      # demo VPC and any validation cell that has not been reaped yet (honua-iac#142). Raising the
      # quota is the other half of the fix and is tracked separately; this is the half that does not
      # depend on an AWS support ticket, and it stays correct afterwards. It bounds whole cells: a
      # cell's VPC lives from its provision job to its teardown job, inside one called workflow.
      max-parallel: 2
      matrix:
        # aws-mixed is out for 2026.1 rc.3 (no examples/aws-mixed root); restore it when honua-iac#209 lands.
        target: ${{ fromJSON((inputs.target == '' || inputs.target == 'all') && '["aws-serverless","aws-ecs","aws-eks"]' || format('["{0}"]', inputs.target)) }}
        redis: ${{ fromJSON((inputs.redis_mode == '' || inputs.redis_mode == 'both') && '["off","on"]' || format('["{0}"]', inputs.redis_mode)) }}
    name: "${{ matrix.target }} / redis-${{ matrix.redis }}"
    permissions:
      contents: read
      actions: read                   # the admit job reads the journey runner's address artifact
      id-token: write                 # provision / admit / teardown only; never the journey job
    uses: ./.github/workflows/e2e-cloud-aws-cell.yml
    with:
      target: ${{ matrix.target }}
      redis: ${{ matrix.redis }}
      # A reusable-workflow call cannot carry continue-on-error; the cell's own jobs do, for Preview.
      preview: ${{ matrix.target == 'aws-eks' }}
      candidate_ref: ${{ inputs.candidate_ref }}
      require_real: ${{ inputs.require_real || false }}
      cost_ceiling_usd: ${{ inputs.cost_ceiling_usd || '20' }}
      # Both deployable artifacts are resolved from the frozen platform manifest by the candidate job.
      iac_ref: ${{ needs.candidate.outputs.iac_ref }}
      helm_ref: ${{ needs.candidate.outputs.helm_ref }}
      server_image: ${{ needs.candidate.outputs.server_image }}
      ecs_architecture: ${{ needs.candidate.outputs.ecs_architecture }}
      lambda_image: ${{ needs.candidate.outputs.lambda_image }}
      lambda_architecture: ${{ needs.candidate.outputs.lambda_architecture }}
      gp_batch_image: ${{ needs.candidate.outputs.gp_batch_image }}
      # Bedrock is billed: only the genuine-model cell (ECS, Redis off), only when asked for.
      enable_bedrock: ${{ (inputs.genuine_model_bedrock || false) && matrix.target == 'aws-ecs' && matrix.redis == 'off' }}
      lock_digest: ${{ inputs.lock_digest || '' }}
    secrets:
      RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}

  # ── iac-live: WRAP honua-iac's real cloud harness (terraform-manual-validation.yml, run_live) ────────
  iac-live:
    # Supplemental Preview infrastructure evidence; GA certification is the four journey cells.
    continue-on-error: true
    name: "iac-live (terraform-manual-validation, run_live=aws)"
    needs: candidate
    if: ${{ github.event_name == 'schedule' || inputs.run_iac_live }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch + poll honua-iac terraform-manual-validation (run_live, AWS)
        id: iac
        env:
          # The wrapper needs BOTH a dispatch token (to trigger honua-iac Actions) and the OIDC role
          # (so honua-iac's live job can auth to AWS). Missing either => self-skip.
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || '' }}
          AWS_ROLE: ${{ vars.HONUA_AWS_ROLE_ARN }}
          REQUIRE_REAL: ${{ inputs.require_real || false }}
          IAC_REF: ${{ needs.candidate.outputs.iac_ref }}
          SERVER_REF: ${{ needs.candidate.outputs.server_ref }}
          ECS_IMAGE: ${{ needs.candidate.outputs.server_image }}
        run: |
          set -uo pipefail
          STATUS=skipped; WHY="cloud-creds-unset"
          if [ -z "$GH_TOKEN" ] || [ -z "$AWS_ROLE" ]; then
            if [ "$REQUIRE_REAL" = "true" ]; then
              STATUS=fail; WHY="required cloud certification evidence missing: cloud-creds-unset"
              echo "::error title=required cloud-cert missing::iac-live cannot skip on a real release cut"
            else
              echo "::notice title=cloud-cert self-skipped::iac-live: cloud-creds-unset (optional dry-run path)"
            fi
          else
            REPO=honua-io/honua-iac
            WF=terraform-manual-validation.yml
            REF=trunk
            echo "dispatching $WF from $REPO/$REF against IAC $IAC_REF and server $SERVER_REF with run_live=true cloud=aws"
            # Record the dispatch time so we can find the run we just triggered.
            SINCE="$(date -u +%FT%TZ)"
            gh workflow run "$WF" --repo "$REPO" --ref "$REF" \
              -f candidate_ref="$IAC_REF" -f honua_server_ref="$SERVER_REF" -f aws_ecs_image="$ECS_IMAGE" \
              -f cloud=aws -f deployment_profile=ephemeral -f run_live=true \
              -f run_k8s=false -f run_aks=false -f run_eks=false -f run_drift=false \
              >/tmp/iac-dispatch.log 2>&1 || { STATUS=fail; WHY="failed to dispatch $WF (token scope? branch $REF?)"; cat /tmp/iac-dispatch.log; }
            if [ "$STATUS" != "fail" ]; then
              RUN_ID=""
              for _ in $(seq 1 12); do
                sleep 10
                RUN_ID="$(gh run list --repo "$REPO" --workflow "$WF" --created ">=$SINCE" \
                          --json databaseId,createdAt --jq 'sort_by(.createdAt)|reverse|.[0].databaseId' 2>/dev/null || true)"
                [ -n "$RUN_ID" ] && [ "$RUN_ID" != "null" ] && break
              done
              if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
                STATUS=blocked; WHY="dispatched but could not resolve the honua-iac run id"
              else
                echo "watching honua-iac run $RUN_ID"
                gh run watch "$RUN_ID" --repo "$REPO" --exit-status >/tmp/iac-watch.log 2>&1 && CONC=success || CONC=failure
                URL="$(gh run view "$RUN_ID" --repo "$REPO" --json url --jq .url 2>/dev/null || echo '')"
                if [ "$CONC" = "success" ]; then STATUS=pass; WHY="honua-iac $IAC_REF live AWS validation passed ($URL)";
                else STATUS=fail; WHY="honua-iac $IAC_REF live AWS validation failed ($URL)"; fi
              fi
            fi
          fi
          echo "iac-live -> $STATUS ($WHY)"
          mkdir -p out
          jq -n --arg s "$STATUS" --arg w "$WHY" \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{gate:"cloud-iac-live", status:$s, why:$w, evidence_url:$run}' > out/gate-report-cloud.json
          cat out/gate-report-cloud.json

      - name: Upload iac-live report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-iac-live-report
          path: out/gate-report-cloud.json
          if-no-files-found: warn

  # ── cloud-report: assemble ONE machine-readable gate-report the train parses (never scrape logs) ─────
  cloud-report:
    needs: [candidate, parity, iac-live]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.assemble.outputs.overall_status }}
    steps:
      # Every parity and iac-live job has finished before this job starts; the final run cost
      # reading must be taken after this instant.
      - name: Record aggregation start
        id: started
        run: echo "at=$(date -u +%FT%TZ)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Receipts were bound to the candidate snapshot's manifest; validate against that same manifest.
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r e2e/requirements.txt
      - name: Download all cloud reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*cloud*report*"
          path: reports
        continue-on-error: true

      # Owner decision 9: the run's cost is the sum of the cells' live estimates (each read from the
      # cell's Terraform state before destroy), and Cost Explorer's lagged actuals for EARLIER runs
      # (by the honua-release:run-id tag) are recorded here so an over-ceiling run fails the next
      # certifying run. Read-only: ce:ListCostAllocationTags + ce:GetCostAndUsage (e2e/README.md).
      - name: Configure AWS credentials for Cost Explorer (OIDC, read-only use)
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Meter the run cost (cell estimates + prior-run Cost Explorer actuals)
        env:
          HONUA_CLOUD_COST_CEILING_USD: ${{ inputs.cost_ceiling_usd || '20' }}
        run: |
          set -euo pipefail
          python e2e/cost_meter.py run --reports reports --output e2e/cloud-evidence/run-cost.json
          python e2e/cost_meter.py prior-runs --output e2e/cloud-evidence/prior-run-costs.json
      - name: Assemble cloud gate-report.json
        id: assemble
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REQUIRE_REAL: ${{ inputs.require_real || false }}
          CANDIDATE_RESULT: ${{ needs.candidate.result }}
          FULL_SCOPE: ${{ (github.event_name == 'schedule' || ((inputs.target == '' || inputs.target == 'all') && (inputs.redis_mode == '' || inputs.redis_mode == 'both') )) && 'true' || 'false' }}
          REQUESTED_TARGET: ${{ inputs.target || 'all' }}
          REQUESTED_REDIS: ${{ inputs.redis_mode || 'both' }}
          REQUESTED_IAC_LIVE: ${{ github.event_name == 'schedule' || inputs.run_iac_live }}
          HONUA_CLOUD_COST_CEILING_USD: ${{ inputs.cost_ceiling_usd || '20' }}
          AGGREGATION_STARTED_AT: ${{ steps.started.outputs.at }}
        # The meter step above wrote e2e/cloud-evidence/run-cost.json (the run's estimate) after every
        # cloud job finished. Missing, stale or over-ceiling fails the gate; an earlier run's settled
        # Cost Explorer actual over its ceiling fails a full-scope run.
        run: |
          set -euo pipefail
          mkdir -p out
          python e2e/cloud_journey.py --reports reports --output merged.json \
            --final-cost "${HONUA_CLOUD_COST_REPORT:-e2e/cloud-evidence/run-cost.json}" \
            --final-cost-after "$AGGREGATION_STARTED_AT"             --prior-run-costs e2e/cloud-evidence/prior-run-costs.json
          if [ "$CANDIDATE_RESULT" != "success" ]; then
            jq --arg why "candidate prerequisite ended $CANDIDATE_RESULT" \
              '.status="fail" | .why=$why' merged.json > checked.json
            mv checked.json merged.json
          fi
          jq --arg run "$RUN_URL" --arg enf "$REQUIRE_REAL" --arg full "$FULL_SCOPE" \
             --arg target "$REQUESTED_TARGET" --arg redis "$REQUESTED_REDIS" \
             --arg iac "$REQUESTED_IAC_LIVE" \
             '. + {enforcement:$enf, evidence_url:$run, generatedAt:(now|todateiso8601),
                    certifying:false,
                    certifyingScope:($full == "true"),
                    requestedScope:{target:$target,redis:$redis,runIacLive:($iac == "true")}}
              | if .status == "pass" and $full != "true" then
                  .status = "blocked"
                  | .why = "focused dispatch is diagnostic only; all four GA target x Redis cells are required for certification"
                else . end' \
             merged.json > out/gate-report-cloud.json

          # cloud-parity certifying is not release#282. lambdaGaQualification stays the literal
          # pending value; a green serverless cell must not be readable as the Lambda GA bill.
          jq --arg full "$FULL_SCOPE" --arg enf "$REQUIRE_REAL" \
            '.certifying = ($full == "true" and $enf == "true" and .status == "pass")
             | .lambdaGaQualification = "pending"' \
            out/gate-report-cloud.json > out/gate-report-cloud.certification.json
          mv out/gate-report-cloud.certification.json out/gate-report-cloud.json
          cat out/gate-report-cloud.json
          OVERALL="$(jq -r .status out/gate-report-cloud.json)"
          echo "overall_status=$OVERALL" >> "$GITHUB_OUTPUT"
          {
            echo "## Cloud cert (AWS) — $OVERALL";
            echo "";
            echo "| cell | evidence tier | status | why |"; echo "|---|---|---|---|";
            jq -r '.cells[] | "| \(.cell) | \(.evidenceTier) | \(.status) | \(.why) |"' out/gate-report-cloud.json;
            echo "";
            echo "### Extended scenarios (live MCP/Studio/GP/demo drivers)";
            jq -r '.cells[] | .cell as $cell | .scenarioCoverage[]? | "- **\($cell) / \(.name)**: \(.status) — \(.why)"' out/gate-report-cloud.json;
            echo "";
            echo "### Promise journey attempts (manifest-pinned imported driver)";
            jq -r '.cells[] | .cell as $cell | .journeyAttempts[]? | "- **\($cell)** attempt \(.number): \(.receipt)"' out/gate-report-cloud.json;
            echo "";
            echo "### Canary probes (honua-release#61 — generic/no-seed-id mode)";
            jq -r '.canaryProbes[]? | "- **\(.name)**: \(.status) — \(.why)"' out/gate-report-cloud.json;
            echo "";
            echo "### Run cost (owner decision 9)";
            jq -r '.finalCost // {} | "- this run (live estimate): \(.status // "none") $\(.estimateUsd // .amountUsd // "n/a") of $\(.ceilingUsd // "n/a") \(.why // "")"' out/gate-report-cloud.json;
            jq -r '.priorRunCosts // {} | "- earlier runs (Cost Explorer): \(.status // "none") \(.why // "")"' out/gate-report-cloud.json;
            jq -r '.priorRunCosts.runs[]? | "  - run \(.runId): \(.status) $\(.actualUsd) of $\(.ceilingUsd) (\(.ceilingSource), through \(.actualAsOf))"' out/gate-report-cloud.json;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregated cloud gate-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-gate-report
          path: out/gate-report-cloud.json

      - name: Enforce
        run: |
          set -e
          OVERALL='${{ steps.assemble.outputs.overall_status }}'
          echo "cloud cert overall: $OVERALL (require_real=${{ inputs.require_real || false }})"
          # A real FAIL always reddens the job. skipped/blocked are tolerated here (surfaced in the
          # report + honoured by the train's aggregate + promote's allowed-skip list).
          [ "$OVERALL" = "fail" ] && { echo "::error::cloud cert FAILED"; exit 1; } || echo "not red"
