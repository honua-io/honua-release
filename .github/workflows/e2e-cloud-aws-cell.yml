# One AWS cloud cell, called once per matrix cell by e2e-cloud-aws.yml (honua-release#381).
#
# The manifest-pinned clients and the npm/browser seam drivers run in a job that holds no AWS
# credential and no OIDC token. Scrubbing the environment cannot hide a parent process's startup
# environment (/proc/$PPID/environ), so the credentials are kept off that runner entirely:
#   provision (OIDC + AWS) -> journey (contents: read only) -> teardown (OIDC + AWS, always)
# admit (OIDC + AWS) runs beside the journey: it seals the cell's application key to a key the journey
# runner generated, and opens the cell's ingress to the journey runner's own /32, which is a different
# address from the provisioning runner's.
# The Terraform working directory reaches teardown sealed: the artifact holds ciphertext only (this
# repository and its artifacts are public); the key and digest live in Secrets Manager.
name: e2e-cloud-aws-cell

on:
  workflow_call:
    inputs:
      update_rollback_run_id: { required: false, type: string, default: "" }
      update_rollback_mode: { required: false, type: string, default: "rehearsal" }
      update_rollback_prior_run_id: { required: false, type: string, default: "" }
      target: { required: true, type: string }
      redis: { required: true, type: string }
      preview: { required: true, type: boolean }
      candidate_ref: { required: false, type: string, default: "" }
      prepared_ref: { required: false, type: string, default: "" }
      require_real: { required: false, type: boolean, default: false }
      cost_ceiling_usd: { required: false, type: string, default: "20" }
      iac_ref: { required: true, type: string }
      helm_ref: { required: true, type: string }
      server_image: { required: true, type: string }
      ecs_architecture: { required: true, type: string }
      lambda_image: { required: false, type: string, default: "" }
      lambda_architecture: { required: true, type: string }
      # The manifest's generic server image (amd64 child by digest): the Lambda+Batch cell's Batch
      # job image and the image its pre-serving migration runs on the provision runner.
      gp_batch_image: { required: false, type: string, default: "" }
      enable_bedrock: { required: false, type: boolean, default: false }
      # The cell's Bedrock model, provisioned as bedrock_ai_model and used by its canary, so the server's
      # disclosure approval and the canary name the same model. Empty: the pinned module default.
      bedrock_model: { required: false, type: string, default: "" }
      # Fix unit J3: the genuine-model canary runs after this cell's journey whenever Bedrock is on
      # (opt-in on approved ECS/Lambda GA cells), bound to this lock digest. Empty on a
      # manual dispatch: the canary binds to the manifest-pinned server image and counts for no lock.
      lock_digest: { required: false, type: string, default: "" }
    secrets:
      UPDATE_ROLLBACK_CONTROLLER_ENV: { required: false }
      RELEASE_GH_TOKEN:
        required: false
      # The genuine-model canary's Ed25519 seed (base64). Read only by the provision step of a
      # Bedrock cell, which stores it in a run-owned Secrets Manager secret for the cell's signer.
      TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED:
        required: false

permissions:
  contents: read

env:
  HONUA_DEPLOYMENT_PREPARED: ${{ inputs.prepared_ref != '' }}
  # Prepared/admitted cohorts must include the reviewed typed OIDC fixture support. A strict cell
  # does too: on the Redis-on cell the S11 installed-client row mints its bearer from this run-owned
  # issuer and the journey's 8.tenant-isolation denial needs its second principal (#377). Without it
  # a require_real trunk dispatch can only report both BLOCKED, i.e. FAIL (run 40435209970).
  # The Preview aws-eks cells provision it on every dispatch: the GA single-tenant ruling covers only
  # the aws-ecs cells, so an EKS journey can pass only with the second-tenant principal, and without
  # it every non-strict EKS run recorded 8.tenant-isolation BLOCKED (#377, run 40832572972). The
  # fixture changes no verdict rule; require_real keeps its own meaning.
  HONUA_CLOUD_TENANT_FIXTURE: ${{ inputs.prepared_ref != '' || inputs.candidate_ref != '' || inputs.require_real || inputs.target == 'aws-eks' }}
  AWS_REGION: "us-east-1"
  HONUA_LAMBDA_IMAGE_URI: ${{ inputs.lambda_image }}
  HONUA_LAMBDA_ARCHITECTURE: ${{ inputs.lambda_architecture }}
  HONUA_ECS_IMAGE: ${{ inputs.server_image }}
  HONUA_ECS_ARCHITECTURE: ${{ inputs.ecs_architecture }}
  HONUA_GP_BATCH_IMAGE: ${{ inputs.gp_batch_image }}
  HONUA_MIGRATE_IMAGE: ${{ inputs.gp_batch_image }}
  HONUA_ENABLE_BEDROCK_AI: ${{ inputs.enable_bedrock }}
  HONUA_BEDROCK_AI_MODEL: ${{ inputs.bedrock_model }}
  HONUA_CLOUD_COST_CEILING_USD: ${{ inputs.cost_ceiling_usd || '20' }}
  HONUA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  CELL_DIR: e2e/cloud-evidence/${{ github.run_id }}/${{ github.run_attempt }}/${{ inputs.target }}/redis-${{ inputs.redis }}
  CELL_ARTIFACT: ${{ inputs.target }}-redis-${{ inputs.redis }}-${{ github.run_attempt }}

jobs:
  provision:
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.preview }}
    permissions:
      contents: read
      actions: read
      id-token: write                 # OIDC -> AWS (no static creds)
    # Identifiers only. Job outputs and step env are printed in the public job log, so the cell's
    # application key goes to Secrets Manager and reaches the journey sealed to its own key.
    outputs:
      endpoint: ${{ steps.provision.outputs.endpoint }}
      admission: ${{ steps.provision.outputs.admission }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # e2e-cloud-aws runs one concurrency lane per target, so its group no longer excludes cell
      # retirement or another run of the same target. Checked here, in the job that creates resources,
      # so a partial rerun of this job checks again:
      # - no cloud-cell-retirement is active (a retirement and a provision must never address one cell);
      # - no other active e2e-cloud-aws run shares this run id's first six digits, which name_prefix
      #   uses: a same-target run (e.g. the nightly `all` lane and an aws-ecs lane) would otherwise
      #   collide on named resources.
      - name: Refuse while a cell retirement or a same-prefix cloud run is active
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          retiring=0; same_prefix=0
          for state in queued in_progress waiting requested pending; do
            n="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/cloud-cell-retirement.yml/runs?status=${state}&per_page=1" --jq '.total_count')"
            retiring=$(( retiring + n ))
            # gh api --jq takes no jq variables; compare the ids in the shell. A checked assignment
            # first, so a failed lookup fails the step instead of reading as "no other runs".
            ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/e2e-cloud-aws.yml/runs?status=${state}&per_page=100" --jq '.workflow_runs[].id')"
            for id in $ids; do
              if [ "$id" != "$RUN_ID" ] && [ "${id:0:6}" = "${RUN_ID:0:6}" ]; then same_prefix=$(( same_prefix + 1 )); fi
            done
          done
          if [ "$retiring" -gt 0 ]; then
            echo "::error title=cell retirement active::a cloud-cell-retirement run is active; rerun this cell after it completes"
            exit 1
          fi
          if [ "$same_prefix" -gt 0 ]; then
            echo "::error title=cell name prefix in use::another active e2e-cloud-aws run shares this run id's name prefix; rerun after it completes"
            exit 1
          fi

      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - name: Use the unadmitted prepared deployment inputs
        if: ${{ inputs.prepared_ref }}
        uses: ./.github/actions/prepared-deployment-input
        with:
          prepared_ref: ${{ inputs.prepared_ref }}
          candidate_ref: ${{ inputs.candidate_ref }}
      - name: Checkout honua-iac (terraform tree)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-iac
          ref: ${{ inputs.iac_ref }}
          path: _honua-iac
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true   # private/absent => HONUA_IAC_DIR stays unset => self-skip, not a crash

      - name: Checkout honua-helm (chart for the EKS cell)
        if: inputs.target == 'aws-eks'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-helm
          ref: ${{ inputs.helm_ref }}
          path: _honua-helm
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Install cloud runner dependencies
        # PyYAML (canary quarantine, the EKS cell's chart dependency resolution) is a declared runner
        # dependency, so install the declared set rather than assuming the runner image carries it.
        run: python -m pip install -r e2e/requirements.txt pytest

      - name: Install the seed's database client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      # The gate's own verdict + parity logic must be trustworthy before we trust a run.
      - name: Self-test the cloud parity logic
        run: python -m pytest e2e/test_cloud.py e2e/test_aws_eks.py -q

      # OIDC into AWS — only when a role is configured; otherwise an optional cell self-skips and a
      # require_real cell fails closed.
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Resolve the ephemeral runner's own /32
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        run: |
          set -euo pipefail
          export RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          python -c 'import ipaddress,os; ipaddress.IPv4Address(os.environ["RUNNER_IP"])'
          # serverless/ECS: PostGIS bootstrap reaches RDS from here.
          echo "HONUA_AWS_DB_INGRESS_CIDR=${RUNNER_IP}/32" >> "$GITHUB_ENV"
          # EKS: the runner drives kubectl/helm from outside the VPC, so the cluster's public API
          # endpoint and the chart's load balancer are opened to THIS runner and nothing else.
          # ECS: same address, same reason, for the ALB security group — the aws-ecs module defaults
          # to VPC-only HTTP ingress, which silently made every probe on that cell unreachable
          # (honua-release#128). The probes run from this runner, so this is the address that must
          # get in; the admit job later adds the journey runner's address the same way.
          echo "HONUA_AWS_RUNNER_CIDR=${RUNNER_IP}/32" >> "$GITHUB_ENV"

      # Provision, readiness, canonical + canary probes and the database seed. No pinned client,
      # npm package or browser runs in this job.
      - name: Authenticate transition baseline before any AWS provisioning
        if: ${{ inputs.update_rollback_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          PRIOR_RUN: ${{ inputs.update_rollback_prior_run_id }}
          PROOF_MODE: ${{ inputs.update_rollback_mode }}
          ENABLED: ${{ vars.HONUA_AWS_UPDATE_ROLLBACK_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/trunk
          test "$ENABLED" = true
          mkdir -p "$RUNNER_TEMP/rollback-prior"
          if [ "$PROOF_MODE" = qualification ]; then
            python3 -c 'import re,sys; assert re.fullmatch(r"[1-9][0-9]*",sys.argv[1])' "$PRIOR_RUN"
            gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name certified-candidate --dir "$RUNNER_TEMP/rollback-prior"
            cmp platform-manifest.yaml "$RUNNER_TEMP/rollback-prior/platform-manifest.yaml"
          else
            test "$PROOF_MODE" = rehearsal
            cp platform-manifest.yaml "$RUNNER_TEMP/rollback-prior/"
          fi
          echo "HONUA_UPDATE_ROLLBACK_PRIOR_INPUTS=$RUNNER_TEMP/rollback-prior" >> "$GITHUB_ENV"
      - name: "Provision ${{ inputs.target }} / redis-${{ inputs.redis }}"
        id: provision
        env:
          # Full SDK workflows run on the Redis-on GA cells, with the SQL prepared here.
          HONUA_CLOUD_INSTALLED_CLIENTS: "true"
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          HONUA_UPDATE_ROLLBACK_ENABLED: ${{ inputs.update_rollback_run_id != '' }}
          HONUA_UPDATE_ROLLBACK_ECS_SAFETY: ${{ vars.HONUA_UPDATE_ROLLBACK_ECS_SAFETY }}
          HONUA_UPDATE_ROLLBACK_MODE: ${{ inputs.update_rollback_mode }}
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          HONUA_HELM_DIR: ${{ github.workspace }}/_honua-helm
          HONUA_CLOUD_PROVISION_MARKER: ${{ runner.temp }}/honua-cloud-provision-attempted
          # honua-iac#216: the Redis-on ECS cell needs the operator-owned key-ring certificate secret
          # (owner step in e2e/README.md). Empty when the repository variables are unset.
          HONUA_AWS_OPERATION_KEY_RING_SECRET_ARN: ${{ vars.HONUA_AWS_OPERATION_KEY_RING_SECRET_ARN }}
          HONUA_AWS_OPERATION_KEY_RING_SECRET_KMS_KEY_ARN: ${{ vars.HONUA_AWS_OPERATION_KEY_RING_SECRET_KMS_KEY_ARN }}
          # Operator-owned audit hash-chain key secret (recommended; owner step in e2e/README.md).
          HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_ARN: ${{ vars.HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_ARN }}
          HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_KMS_KEY_ARN: ${{ vars.HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_KMS_KEY_ARN }}
          # honua-release#450: the aws-ecs, aws-serverless and (once the pinned root declares
          # domain_name) aws-eks cells get a per-run HTTPS hostname
          # <run id>-<target>-redis-<on|off>.cert.<parent> in this public hosted zone (owner step in
          # e2e/README.md). Not secrets. Unset (forks, other accounts) => the default endpoint, as before.
          HONUA_AWS_CELL_DNS_ZONE_ID: ${{ vars.HONUA_AWS_CELL_DNS_ZONE_ID }}
          HONUA_AWS_CELL_DNS_PARENT: ${{ vars.HONUA_AWS_CELL_DNS_PARENT }}
          # honua-release#377 stage 6: the Redis-on ECS cell runs two tasks, and the Redis-on EKS cell
          # two chart replicas, (MultiNode) with shared file storage in this operator-owned bucket
          # (owner step in e2e/README.md). Unset => one task / replica.
          # The Redis-on Lambda cell shares it with its Batch workers once its root declares the inputs
          # (honua-iac#243); then an unset bucket refuses that cell (S10 background import, #548).
          HONUA_AWS_CELL_FILE_STORAGE_BUCKET: ${{ vars.HONUA_AWS_CELL_FILE_STORAGE_BUCKET }}
          # Bedrock cells sign genuine-model transcripts with the canary key, as local-docker does, so
          # the candidate's manifest matches TERMINAL_MODEL_SIGNING_MANIFEST_SHA256. run_cloud.py
          # removes it from its environment on read and hands it to Secrets Manager on a pipe.
          TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED: ${{ inputs.enable_bedrock && secrets.TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED || '' }}
        run: |
          set -euo pipefail
          [ -d "$HONUA_IAC_DIR/infrastructure/terraform" ] || unset HONUA_IAC_DIR
          [ -d "$HONUA_HELM_DIR" ] || unset HONUA_HELM_DIR
          if [ "${{ inputs.require_real }}" = "true" ]; then
            python e2e/run_cloud.py --phase provision --target "${{ inputs.target }}" --redis "${{ inputs.redis }}" --require-real
          else
            python e2e/run_cloud.py --phase provision --target "${{ inputs.target }}" --redis "${{ inputs.redis }}"
          fi

      # Runs after a failed or cancelled provision too: anything apply created must reach teardown.
      - name: Seal the Terraform state for teardown
        if: always()
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          HONUA_CLOUD_PROVISION_MARKER: ${{ runner.temp }}/honua-cloud-provision-attempted
        run: |
          set -euo pipefail
          if [ -f "$HONUA_CLOUD_PROVISION_MARKER" ]; then
            python e2e/run_cloud.py --phase seal-state --target "${{ inputs.target }}" --redis "${{ inputs.redis }}" \
              --bundle "$RUNNER_TEMP/cell-state/state.enc"
          else
            echo "provisioning never started — nothing to seal"
          fi

      - name: Upload the sealed state
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-cell-state-${{ env.CELL_ARTIFACT }}
          path: ${{ runner.temp }}/cell-state/state.enc
          if-no-files-found: ignore
          retention-days: 14   # cloud-cell-retirement.yml recovers a failed teardown from these

      - name: Upload the provision handoff
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-cell-handoff-${{ env.CELL_ARTIFACT }}
          # Identifiers and verdicts only; this repository's artifacts are public.
          path: |
            ${{ env.CELL_DIR }}/provision.json
            ${{ env.CELL_DIR }}/deployment-execution-inputs.json
            ${{ env.CELL_DIR }}/deployment-terraform-inputs.json
            ${{ env.CELL_DIR }}/deployment-helm-inputs.json
            ${{ env.CELL_DIR }}/deployment-actuation.json
            ${{ env.CELL_DIR }}/executed-manifest.yaml
            ${{ env.CELL_DIR }}/extended/seed-manifest.json
            ${{ env.CELL_DIR }}/receipt-*.json
            ${{ env.CELL_DIR }}/target-*.json
            ${{ env.CELL_DIR }}/serving-refusal-*.json
          if-no-files-found: warn
          retention-days: 14   # cloud-cell-retirement.yml recovers a failed teardown from these

  # ── journey: NO id-token, NO AWS credentials. The pinned clients and seam drivers run here. ─────────
  journey:
    needs: provision
    if: ${{ needs.provision.outputs.endpoint != '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.preview }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # First, before any third-party code: this runner's address (the admit job opens the cell's
      # ingress to exactly it) and a fresh RSA key the cell's application key is sealed to.
      - name: Introduce this runner to the admit job
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          python3 -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          mkdir -p "$RUNNER_TEMP/journey-hello" "$RUNNER_TEMP/journey-key"
          echo "${RUNNER_IP}/32" > "$RUNNER_TEMP/journey-hello/cidr"
          ( umask 077; openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 \
              -out "$RUNNER_TEMP/journey-key/private.pem" )
          openssl pkey -in "$RUNNER_TEMP/journey-key/private.pem" -pubout -out "$RUNNER_TEMP/journey-hello/public.pem"
      - name: Upload this runner's address and public key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-cell-journey-hello-${{ env.CELL_ARTIFACT }}
          path: ${{ runner.temp }}/journey-hello/
          if-no-files-found: error
          retention-days: 1

      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - name: Use the unadmitted prepared deployment inputs
        if: ${{ inputs.prepared_ref }}
        uses: ./.github/actions/prepared-deployment-input
        with:
          prepared_ref: ${{ inputs.prepared_ref }}
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Install journey runner dependencies
        run: python -m pip install -r e2e/requirements.txt
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      # The checkout below is static so the code driven on this host stays review-visible. The
      # candidate declares its demo source in the (possibly overlaid) platform manifest, so that
      # canonical pin, not only the compatibility copy, must equal the reviewed one: a candidate
      # that moves evidenceSources.demos fails closed here instead of certifying other demos.
      - name: Resolve the reviewed demo source
        run: |
          python - <<'PY'
          import yaml
          reviewed = "b024902e2c4bc41bf7a5ce39d159bf65e35c9675"
          source = (yaml.safe_load(open("platform-manifest.yaml")).get("evidenceSources") or {}).get("demos") or {}
          if source.get("repository") != "honua-io/honua-site" or source.get("producerSha") != reviewed:
              raise SystemExit("candidate evidenceSources.demos differs from the reviewed workflow pin")
          if yaml.safe_load(open("certification/conformance-evidence.yaml"))["demos"]["sourceRef"] != reviewed:
              raise SystemExit("demo sourceRef differs from the reviewed workflow pin")
          PY
      - name: Checkout the pinned demo pages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-site
          ref: b024902e2c4bc41bf7a5ce39d159bf65e35c9675
          path: _site
          persist-credentials: false
      # Root installs only the distro packages named here: the list is Playwright 1.61.1's own
      # ubuntu24.04 chromium + font set (--with-deps, less headed-only xvfb), so a runner image move
      # fails this step loudly instead of letting Playwright pick packages. npm skips lifecycle
      # scripts; the browser download runs as the runner user. This job holds no cloud credential.
      # Browser bytes are keyed on the exact Playwright version and runner image, so one CDN outage
      # does not decide a cell (run 39603816191 logged getaddrinfo ENOTFOUND
      # playwright.download.prss.microsoft.com). A cache hit still runs `playwright install`, which
      # finds the pinned revisions present and downloads nothing.
      # restore + an explicit save right after the install: the combined actions/cache only saves
      # in its post step on a successful job, and journey jobs that fail on a scenario (run
      # 39705901768) would then never populate the cache.
      - name: Restore the pinned Playwright browsers
        id: pw_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.61.1-chromium-ubuntu-24.04-${{ runner.arch }}
      - name: Install pinned extended driver clients
        env:
          E2E_PW_HOME: ${{ runner.temp }}/cloud-playwright
        run: |
          set -euo pipefail
          . /etc/os-release
          [ "$ID-$VERSION_ID" = ubuntu-24.04 ] || {
            echo "::error ::chromium dependency list is for ubuntu-24.04, runner is $ID-$VERSION_ID"; exit 1; }
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 libcups2t64 \
            libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0 libx11-6 libxcb1 \
            libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2 \
            libfontconfig1 libfreetype6 fonts-liberation fonts-noto-color-emoji fonts-unifont \
            fonts-ipafont-gothic fonts-wqy-zenhei fonts-tlwg-loma-otf fonts-freefont-ttf \
            xfonts-cyrillic xfonts-scalable
          mkdir -p "$E2E_PW_HOME"
          npm install --prefix "$E2E_PW_HOME" --ignore-scripts --no-audit --no-fund \
            --save-exact playwright@1.61.1
          # Bounded retry. After the first miss, pin the download host to cdn.playwright.dev (the
          # mirror that served every byte when the default host's DNS failed) rather than rotating
          # through a host that does not resolve.
          for attempt in 1 2 3; do
            if node "$E2E_PW_HOME/node_modules/playwright/cli.js" install chromium; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error ::chromium download failed on 3 attempts (default hosts, then PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.playwright.dev)"
              exit 1
            fi
            export PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.playwright.dev
            sleep $((attempt * 20))
          done
          echo "E2E_PW_HOME=$E2E_PW_HOME" >> "$GITHUB_ENV"
          echo "E2E_PLAYWRIGHT_VERSION=1.61.1" >> "$GITHUB_ENV"
          echo "E2E_SITE_DIR=$GITHUB_WORKSPACE/_site" >> "$GITHUB_ENV"
          echo "E2E_SITE_SHA=b024902e2c4bc41bf7a5ce39d159bf65e35c9675" >> "$GITHUB_ENV"
      - name: Save the pinned Playwright browsers
        if: steps.pw_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.61.1-chromium-ubuntu-24.04-${{ runner.arch }}

      - name: Download the provision handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-cell-handoff-${{ env.CELL_ARTIFACT }}
          path: ${{ env.CELL_DIR }}

      # The admit job uploads the sealed key while this job installs its clients. This job holds no
      # token for the Actions API, so it watches the public run's artifact list anonymously.
      - name: Wait for the sealed application key
        env:
          NAME: cloud-cell-key-${{ env.CELL_ARTIFACT }}
          CELL: ${{ inputs.target }} / redis-${{ inputs.redis }}
        run: |
          set -uo pipefail
          key_count() {
            curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$NAME" \
              | jq -r '.total_count' 2>/dev/null || echo 0
          }
          for i in $(seq 1 45); do
            [ "$(key_count)" = 1 ] && exit 0
            # Every third poll (anonymous reads are rate-limited), look at the admit job itself: one
            # that already ended unsuccessfully will never deliver, so report its real cause now
            # instead of after 15 minutes of waiting.
            if [ $((i % 3)) = 0 ]; then
              peer="$(curl -fsS "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
                | jq -r --arg cell "$CELL" '[.jobs[] | select(.name | endswith("admit")) | select(.name | contains($cell))][0]
                    | select(.status == "completed" and .conclusion != "success")
                    | "\(.conclusion) at step \([.steps[]? | select(.conclusion == "failure") | .name][0] // "(none recorded: runner lost?)")"' \
                2>/dev/null || true)"
              if [ -n "$peer" ]; then
                [ "$(key_count)" = 1 ] && exit 0
                echo "::error::the admit job ended ($peer) without delivering the cell's sealed application key"
                exit 1
              fi
            fi
            sleep 20
          done
          echo "::error::the admit job never delivered the cell's sealed application key"
          exit 1
      - name: Download the sealed application key
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-cell-key-${{ env.CELL_ARTIFACT }}
          path: ${{ runner.temp }}/journey-key/sealed

      # The seam drivers, then the imported journey (run_live installs the pinned clients with
      # --ignore-scripts), against the endpoint the handoff names. The handoff's run, attempt and
      # candidate digest must be this run's.
      # Data-driven control-plane roster (operator ruling on honua-release#785): the server's Admin
      # parity exports at the source sha of the candidate this cell deployed.
      - name: Fetch the server parity exports at the candidate's source sha
        id: roster
        run: python certification/terminal-journey/fetch_roster.py --out "$RUNNER_TEMP/roster" --github-output "$GITHUB_OUTPUT"
      - name: "Run the ${{ inputs.target }} / redis-${{ inputs.redis }} journey"
        env:
          HONUA_CLOUD_REST_ROSTER: ${{ steps.roster.outputs.rest }}
          HONUA_CLOUD_MCP_ROSTER: ${{ steps.roster.outputs.mcp }}
          HONUA_CLOUD_ROSTER_SOURCE_SHA: ${{ steps.roster.outputs.sha }}
        run: |
          python e2e/run_cloud.py --phase journey --target "${{ inputs.target }}" --redis "${{ inputs.redis }}" \
            --sealed-key "$RUNNER_TEMP/journey-key/sealed/app-key.sealed" --private-key "$RUNNER_TEMP/journey-key/private.pem"

      # Genuine-model canary (fix unit J3): after the cell journey, against the same endpoint, chained to
      # this job's passing deterministic receipt and bound to the lock digest. Bedrock is reached by
      # the cell's task role; this job still holds no AWS credential. The row it writes is what the
      # nightly mint retains as promotion-receipts/nightly-model-journey.
      # Founder re-tier 2026-10-25 (wedge-critical-retier-2026-10-25): the canary is out of RC admission.
      # A failed canary, or one that wrote no row, is retained as a fail receipt by the mint and never
      # fails this GA cell's journey job.
      - name: Run the genuine-model canary on ${{ inputs.target }} / redis-${{ inputs.redis }}
        if: ${{ always() && inputs.enable_bedrock }}
        continue-on-error: true
        env:
          LOCK_DIGEST: ${{ inputs.lock_digest }}
          TERMINAL_MODEL_NAME: ${{ inputs.bedrock_model || vars.TERMINAL_MODEL_NAME || 'us.anthropic.claude-sonnet-4-6' }}
          TERMINAL_MODEL_RUNTIME: aws-bedrock
          TERMINAL_MODEL_QUANTIZATION: provider-managed
          TERMINAL_MODEL_SIGNING_MANIFEST_SHA256: ${{ vars.TERMINAL_MODEL_SIGNING_MANIFEST_SHA256 }}
        run: |
          set -euo pipefail
          case "${{ inputs.target }}/redis-${{ inputs.redis }}" in
            aws-ecs/redis-off|aws-ecs/redis-on|aws-serverless/redis-off|aws-serverless/redis-on) ;;
            *) echo "::error::the genuine-model canary requires an approved AWS GA cell"; exit 1 ;;
          esac
          python -m pip install "cryptography>=45.0"
          # The nightly train passes its qualification lock digest and every attempt binds to it. A
          # manual dispatch has no nightly lock: the canary then runs once bound to the manifest-pinned
          # server image its green deterministic receipt verified (2026-10-22 ruling: RC gates bind any
          # build). Its row records that binding with a null lockDigest, so it counts for no lock.
          binding=()
          if [ -n "$LOCK_DIGEST" ]; then
            binding=(--lock-digest "$LOCK_DIGEST")
          else
            echo "::notice::no lock_digest (manual dispatch): the genuine-model canary binds to the pinned server image and counts for no lock"
          fi
          python e2e/run_cloud.py --phase model-canary --target "${{ inputs.target }}" --redis "${{ inputs.redis }}" \
            --sealed-key "$RUNNER_TEMP/journey-key/sealed/app-key.sealed" --private-key "$RUNNER_TEMP/journey-key/private.pem" \
            "${binding[@]}"
      # Matches the train's journey-gate-report* download, which feeds mint_nightly_lock --declare-evidence.
      - name: Upload the nightly-model-journey row
        if: ${{ always() && inputs.enable_bedrock }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-gate-report-nightly-model-${{ env.CELL_ARTIFACT }}
          path: |
            ${{ env.CELL_DIR }}/model-journey/gate-report-journey.json
            ${{ env.CELL_DIR }}/model-journey/model-canary-*.json
          if-no-files-found: error

      - name: Upload the journey receipts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-cell-journey-${{ env.CELL_ARTIFACT }}
          # Driver scratch output can hold the application key; only the redacted reports travel.
          path: |
            ${{ env.CELL_DIR }}/journey.json
            ${{ env.CELL_DIR }}/receipt-*.json
            ${{ env.CELL_DIR }}/target-*.json
            ${{ env.CELL_DIR }}/serving-refusal-*.json
            ${{ env.CELL_DIR }}/setup-discovery-*.json
            ${{ env.CELL_DIR }}/extended/gate-report.json
            ${{ env.CELL_DIR }}/installed-clients/receipt.json
            ${{ env.CELL_DIR }}/extended/seed-manifest.json
          if-no-files-found: warn
          retention-days: 1

  # ── admit: seal the application key to the journey runner, open the cell's ingress to its /32 ──────
  admit:
    needs: provision
    if: ${{ needs.provision.outputs.endpoint != '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ inputs.preview }}
    permissions:
      contents: read
      actions: read                   # read the journey runner's introduction artifact while it runs
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r e2e/requirements.txt
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1
      - name: Resolve the ephemeral runner's own /32
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          python -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          echo "HONUA_AWS_RUNNER_CIDR=${RUNNER_IP}/32" >> "$GITHUB_ENV"
      - name: Download the provision handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-cell-handoff-${{ env.CELL_ARTIFACT }}
          path: ${{ env.CELL_DIR }}
      - name: Wait for the journey runner's introduction
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          NAME: cloud-cell-journey-hello-${{ env.CELL_ARTIFACT }}
          CELL: ${{ inputs.target }} / redis-${{ inputs.redis }}
        run: |
          set -euo pipefail
          hello() {
            found="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$NAME" \
              --jq '.total_count' 2>/dev/null || echo 0)"
            [ "$found" = 1 ] || return 1
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir "$RUNNER_TEMP/journey-hello"
          }
          # A journey job that already ended (failed, cancelled, or its runner process died) will
          # never introduce itself: fail now with its conclusion and failed step, not after 20 min.
          peer_filter='[.jobs[] | select(.name | endswith("journey")) | select(.name | contains($cell))][0]
            | select(.status == "completed" and .conclusion != "success")
            | "\(.conclusion) at step \([.steps[]? | select(.conclusion == "failure") | .name][0] // "(none recorded: runner lost?)")"'
          for _ in $(seq 1 120); do
            hello && exit 0
            peer="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" 2>/dev/null \
              | jq -r --arg cell "$CELL" "$peer_filter" 2>/dev/null || true)"
            if [ -n "$peer" ]; then
              hello && exit 0
              echo "::error::the journey runner ended ($peer) before introducing itself"
              exit 1
            fi
            sleep 10
          done
          echo "::error::the journey runner never introduced itself"
          exit 1
      - name: Seal the application key to the journey runner
        run: |
          set -euo pipefail
          python e2e/run_cloud.py --phase deliver-key --target "${{ inputs.target }}" --redis "${{ inputs.redis }}" \
            --public-key "$RUNNER_TEMP/journey-hello/public.pem" --sealed-key "$RUNNER_TEMP/journey-key/app-key.sealed"
      - name: Upload the sealed application key
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cloud-cell-key-${{ env.CELL_ARTIFACT }}
          path: ${{ runner.temp }}/journey-key/app-key.sealed
          if-no-files-found: error
          retention-days: 1
      - name: "Admit the journey runner to ${{ inputs.target }} / redis-${{ inputs.redis }}"
        if: ${{ needs.provision.outputs.admission != 'none' }}
        env:
          # A per-run HTTPS hostname is a Route53 alias of the cell's ALB: admit resolves it here
          # to find the security group, and opens 443 (the endpoint's scheme) to the journey runner.
          HONUA_AWS_CELL_DNS_ZONE_ID: ${{ vars.HONUA_AWS_CELL_DNS_ZONE_ID }}
        run: |
          set -euo pipefail
          python e2e/run_cloud.py --phase admit --target "${{ inputs.target }}" --redis "${{ inputs.redis }}" \
            --cidr "$(head -c 64 "$RUNNER_TEMP/journey-hello/cidr")"

  # ── teardown: always; destroys whatever provision created, then decides the cell's verdict ─────────
  teardown:
    needs: [provision, journey, admit]
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: false
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Receipts were bound to the candidate snapshot's manifest; validate against that same manifest.
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - name: Use the unadmitted prepared deployment inputs
        if: ${{ inputs.prepared_ref }}
        uses: ./.github/actions/prepared-deployment-input
        with:
          prepared_ref: ${{ inputs.prepared_ref }}
          candidate_ref: ${{ inputs.candidate_ref }}
      - name: Checkout honua-iac (terraform tree)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-iac
          ref: ${{ inputs.iac_ref }}
          path: _honua-iac
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true
      - name: Checkout the reviewed complete-cell retirement helper
        if: inputs.target == 'aws-serverless'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-iac
          # Must equal cloud-cell-retirement.yml's pin and e2e/normal_cell_retirement.py HELPER_SHA256.
          # honua-iac#299: the 1587c8a helper listed the guardrail-denied standing honua-cert-*
          # functions, so every ordinary Lambda teardown died AccessDenied and stranded its cell.
          ref: eeca0567ea7ab7ab45dc5f426e998f2c7ff84d54 # reviewed honua-iac#299 trunk merge
          path: _retirement-tools
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
      - name: Require retirement helper trunk ancestry
        if: inputs.target == 'aws-serverless'
        run: git -C _retirement-tools merge-base --is-ancestor HEAD origin/trunk
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - run: python -m pip install -r e2e/requirements.txt
      - name: Configure AWS credentials (OIDC)
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1
      # Destroy reuses the apply's variable set; this runner's /32 satisfies its CIDR inputs and, on
      # EKS, is granted cluster API access so the chart's load balancer is deleted before the VPC.
      - name: Resolve the ephemeral runner's own /32
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        run: |
          set -euo pipefail
          RUNNER_IP="$(curl -fsS https://checkip.amazonaws.com | tr -d '[:space:]')"
          python -c 'import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])' "$RUNNER_IP"
          echo "HONUA_AWS_DB_INGRESS_CIDR=${RUNNER_IP}/32" >> "$GITHUB_ENV"
          echo "HONUA_AWS_RUNNER_CIDR=${RUNNER_IP}/32" >> "$GITHUB_ENV"
      - name: Download the provision handoff
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-cell-handoff-${{ env.CELL_ARTIFACT }}
          path: ${{ env.CELL_DIR }}
        continue-on-error: true       # absent => the teardown verdict says so and fails closed
      # Kept apart from the provision handoff: teardown re-verifies every receipt against what
      # provision observed and copies only verified files into the cell's evidence directory.
      - name: Download the journey receipts
        if: ${{ needs.journey.result != 'skipped' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-cell-journey-${{ env.CELL_ARTIFACT }}
          path: ${{ runner.temp }}/journey-upload
        continue-on-error: true
      - name: Download the sealed state
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cloud-cell-state-${{ env.CELL_ARTIFACT }}
          path: ${{ runner.temp }}/cell-state
        continue-on-error: true
      - name: Restore the Terraform state
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          HONUA_CLOUD_PROVISION_MARKER: ${{ runner.temp }}/honua-cloud-provision-attempted
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/cell-state/state.enc" ]; then
            python e2e/run_cloud.py --phase open-state --target "${{ inputs.target }}" --redis "${{ inputs.redis }}" \
              --bundle "$RUNNER_TEMP/cell-state/state.enc"
          else
            echo "no sealed state — provisioning never started or its state was lost (teardown decides)"
          fi
      - name: Prepare authenticated transition bundles and protected controller inputs
        if: ${{ inputs.update_rollback_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TRANSITION_RUN: ${{ inputs.update_rollback_run_id }}
          PRIOR_RUN: ${{ inputs.update_rollback_prior_run_id }}
          PROOF_MODE: ${{ inputs.update_rollback_mode }}
          CONTROLLER_ENV: ${{ secrets.UPDATE_ROLLBACK_CONTROLLER_ENV }}
          ENABLED: ${{ vars.HONUA_AWS_UPDATE_ROLLBACK_ENABLED }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/trunk
          test "$ENABLED" = true
          mkdir -p "$RUNNER_TEMP/rollback-prior" "$RUNNER_TEMP/rollback-candidate"
          python3 -c 'import re,sys; assert re.fullmatch(r"[1-9][0-9]*",sys.argv[1])' "$TRANSITION_RUN"
          case "$PROOF_MODE" in
            rehearsal)
              cp platform-manifest.yaml "$RUNNER_TEMP/rollback-prior/"
              gh run download "$TRANSITION_RUN" --repo "$GITHUB_REPOSITORY" --name prepared-deployment --dir "$RUNNER_TEMP/rollback-candidate"
              ;;
            qualification)
              python3 -c 'import re,sys; assert re.fullmatch(r"[1-9][0-9]*",sys.argv[1])' "$PRIOR_RUN"
              gh run download "$PRIOR_RUN" --repo "$GITHUB_REPOSITORY" --name certified-candidate --dir "$RUNNER_TEMP/rollback-prior"
              gh run download "$TRANSITION_RUN" --repo "$GITHUB_REPOSITORY" --name certified-candidate --dir "$RUNNER_TEMP/rollback-candidate"
              ;;
            *) exit 1 ;;
          esac
          # A reviewed optional pack is tracked in the trusted workflow source. Its exact bytes
          # must match BOTH retained manifest hashes before the runtime may use it.
          if [ -f certification/update-rollback-workload.json ]; then
            cp certification/update-rollback-workload.json "$RUNNER_TEMP/rollback-candidate/update-rollback-workload.json"
          fi
          (umask 077; printf '%s' "$CONTROLLER_ENV" > "$RUNNER_TEMP/rollback-controller.env")
      - name: Prove actual AWS update and rollback after the baseline journey
        if: ${{ inputs.update_rollback_run_id != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          CELL_TARGET: ${{ inputs.target }}
          CELL_REDIS: ${{ inputs.redis }}
          PROOF_MODE: ${{ inputs.update_rollback_mode }}
          HONUA_UPDATE_ROLLBACK_CONTROLLER_ROLE_ARN: ${{ vars.HONUA_UPDATE_ROLLBACK_CONTROLLER_ROLE_ARN }}
          HONUA_UPDATE_ROLLBACK_ECR_REPOSITORY: ${{ vars.HONUA_UPDATE_ROLLBACK_ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          case "$CELL_TARGET" in
            aws-ecs) ROOT=examples/aws ;;
            aws-serverless) ROOT=examples/aws-serverless ;;
            *) exit 1 ;;
          esac
          terraform -chdir="$HONUA_IAC_DIR/infrastructure/terraform/$ROOT" init -input=false -no-color >/dev/null
          WORKLOAD_ARGS=()
          if [ -f "$RUNNER_TEMP/rollback-candidate/update-rollback-workload.json" ]; then
            WORKLOAD_ARGS=(--gp-workload "$RUNNER_TEMP/rollback-candidate/update-rollback-workload.json")
          fi
          python e2e/run_cloud.py --phase update-rollback --target "$CELL_TARGET" --redis "$CELL_REDIS" "${WORKLOAD_ARGS[@]}" \
            --prior-inputs "$RUNNER_TEMP/rollback-prior" --transition-inputs "$RUNNER_TEMP/rollback-candidate" \
            --update-rollback-mode "$PROOF_MODE" --controller-env "$RUNNER_TEMP/rollback-controller.env" \
            --serving-fixture "$RUNNER_TEMP/journey-upload/extended/seed-manifest.json" --journey-dir "$RUNNER_TEMP/journey-upload"
      - name: Remove private controller startup input
        if: ${{ always() && inputs.update_rollback_run_id != '' }}
        run: rm -f "$RUNNER_TEMP/rollback-controller.env"
      # J6: an ECS cell leaves its tasks' exit cause in the cell artifact and this job log — every
      # task's stoppedReason, the last 300 CloudWatch log lines of each stopped task's containers
      # (and the newest task's), credentials redacted, and each task definition's environment
      # variable NAMES (never values). A serverless cell leaves the last 300 lines of each of its
      # Lambda functions' log groups (API + control-plane event functions) and of its Batch job log
      # groups when GP Batch is enabled, redacted the same way, plus each function's state and
      # environment variable NAMES (diagnostics-lambda.json). Read while the cell still exists: the
      # log groups are destroyed with it. Runs for ready cells too. Informational: it never changes
      # the verdict.
      # An EKS cell leaves its namespace's pods, events, jobs and the server's last 300 log lines
      # (diagnostics-eks.json), redacted the same way; this runner is admitted to the cluster API first.
      - name: Capture cell readiness diagnostics
        if: ${{ always() && (inputs.target == 'aws-ecs' || inputs.target == 'aws-serverless' || inputs.target == 'aws-eks') && vars.HONUA_AWS_ROLE_ARN != '' }}
        continue-on-error: true
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          HONUA_CLOUD_PROVISION_MARKER: ${{ runner.temp }}/honua-cloud-provision-attempted
          CELL_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [ ! -f "$HONUA_CLOUD_PROVISION_MARKER" ]; then echo "nothing provisioned"; exit 0; fi
          case "$CELL_TARGET" in
            aws-ecs) ROOT=examples/aws ;;
            aws-serverless) ROOT=examples/aws-serverless ;;
            aws-eks) ROOT="" ;;
            *) echo "no diagnostics for $CELL_TARGET"; exit 0 ;;
          esac
          if [ -n "$ROOT" ]; then
            terraform -chdir="$HONUA_IAC_DIR/infrastructure/terraform/$ROOT" init -input=false -no-color >/dev/null
          fi
          python e2e/run_cloud.py --phase diagnose --target "$CELL_TARGET" --redis "${{ inputs.redis }}"
      # FAIL-CLOSED: if the cell provisioned anything and cleanup cannot complete, this step goes red
      # instead of leaving an orphaned VPC/cluster billing (honua-iac#142). Before destroy, the cell's
      # live cost estimate (e2e/cost_meter.py: Terraform-state inventory x hours + measured Lambda/API/
      # Batch usage) is written into the cell gate-report's `cost` (owner decision 9).
      - name: "Tear down ${{ inputs.target }} / redis-${{ inputs.redis }} and decide the cell"
        if: always()
        # The runner separates Preview qualification from mandatory cleanup; no error is swallowed.
        env:
          HONUA_IAC_DIR: ${{ github.workspace }}/_honua-iac
          HONUA_SERVERLESS_RETIREMENT_HELPER: ${{ github.workspace }}/_retirement-tools/infrastructure/terraform/validation/scripts/aws/serverless_cell_retirement.py
          HONUA_CLOUD_PROVISION_MARKER: ${{ runner.temp }}/honua-cloud-provision-attempted
          # honua-iac#216: the Redis-on ECS cell needs the operator-owned key-ring certificate secret
          # (owner step in e2e/README.md). Empty when the repository variables are unset.
          HONUA_AWS_OPERATION_KEY_RING_SECRET_ARN: ${{ vars.HONUA_AWS_OPERATION_KEY_RING_SECRET_ARN }}
          HONUA_AWS_OPERATION_KEY_RING_SECRET_KMS_KEY_ARN: ${{ vars.HONUA_AWS_OPERATION_KEY_RING_SECRET_KMS_KEY_ARN }}
          # Operator-owned audit hash-chain key secret (recommended; owner step in e2e/README.md).
          HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_ARN: ${{ vars.HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_ARN }}
          HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_KMS_KEY_ARN: ${{ vars.HONUA_AWS_AUDIT_CHAIN_KEY_SECRET_KMS_KEY_ARN }}
          # honua-release#450: the aws-ecs, aws-serverless and aws-eks cells' per-run HTTPS hostname
          # <run id>-<target>-redis-<on|off>.cert.<parent> in this public hosted zone (owner step in
          # e2e/README.md). Not secrets. Teardown recomputes the same name and confirms its records and certificate are gone.
          HONUA_AWS_CELL_DNS_ZONE_ID: ${{ vars.HONUA_AWS_CELL_DNS_ZONE_ID }}
          HONUA_AWS_CELL_DNS_PARENT: ${{ vars.HONUA_AWS_CELL_DNS_PARENT }}
          # honua-release#377 stage 6: the Redis-on ECS cell runs two tasks, and the Redis-on EKS cell
          # two chart replicas, (MultiNode) with shared file storage in this operator-owned bucket
          # (owner step in e2e/README.md). Unset => one task / replica.
          # The Redis-on Lambda cell shares it with its Batch workers once its root declares the inputs
          # (honua-iac#243); then an unset bucket refuses that cell (S10 background import, #548).
          HONUA_AWS_CELL_FILE_STORAGE_BUCKET: ${{ vars.HONUA_AWS_CELL_FILE_STORAGE_BUCKET }}
        run: |
          set -euo pipefail
          [ -d "$HONUA_IAC_DIR/infrastructure/terraform" ] || unset HONUA_IAC_DIR
          ARGS=(--phase teardown --target "${{ inputs.target }}" --redis "${{ inputs.redis }}"
                --journey-dir "$RUNNER_TEMP/journey-upload")
          if [ "${{ inputs.require_real }}" = "true" ]; then ARGS+=(--require-real); fi
          python e2e/run_cloud.py "${ARGS[@]}"

      - name: Bind transition proof to actual cleanup and metered cost
        if: ${{ always() && inputs.update_rollback_run_id != '' }}
        run: |
          python tools/collect_update_rollback.py --cell "$CELL_DIR/update-rollback-cell.json" \
            --cloud-report e2e/gate-report-cloud.json --output "$CELL_DIR/update-rollback-cell.json"
      - name: Refuse incomplete cleanup on every topology
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json
          import sys
          from pathlib import Path
          sys.path.insert(0, "e2e")
          from cloud_journey import cleanup_failure
          report = json.loads(Path("e2e/gate-report-cloud.json").read_text())
          problem = cleanup_failure(report)
          if problem:
              raise SystemExit(problem)
          if report.get("cost", {}).get("status") == "fail":
              raise SystemExit("run cost ceiling exceeded")
          PYCODE

      - name: Upload cloud gate-report (per cell)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-cloud-aws-gate-report-${{ inputs.target }}-redis-${{ inputs.redis }}
          path: |
            e2e/gate-report-cloud.json
            e2e/cloud-evidence/**/cell-retirement.json
            e2e/cloud-evidence/**/state-retirement.enc
            e2e/cloud-evidence/**/update-rollback-cell.json
            e2e/cloud-evidence/**/extended/gate-report.json
            e2e/cloud-evidence/**/receipt-*.json
            e2e/cloud-evidence/**/target-*.json
            e2e/cloud-evidence/**/serving-refusal-*.json
            e2e/cloud-evidence/**/extended/seed-manifest.json
            e2e/cloud-evidence/**/diagnostics-*.json
            e2e/cloud-evidence/**/deployment-execution-inputs.json
            e2e/cloud-evidence/**/deployment-terraform-inputs.json
            e2e/cloud-evidence/**/deployment-helm-inputs.json
            e2e/cloud-evidence/**/deployment-actuation.json
            e2e/cloud-evidence/**/executed-manifest.yaml
            e2e/cloud-evidence/**/deployment-cell-receipt.json
          if-no-files-found: warn
