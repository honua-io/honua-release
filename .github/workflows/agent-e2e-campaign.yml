      - name: Require reviewed private controller handoff
        # No fallback to a GitHub-hosted controller with private SQL credentials.
        run: |
          set -euo pipefail
          for source in tools/hosted_pilot/controller_handoff.py certification/agent-e2e/controller-handoff.json; do
            git ls-files --error-unmatch -- "$source" >/dev/null
            test -s "$source"
            test ! -L "$source"
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install private dispatch SDK
        run: python -m pip install 'boto3>=1.40,<2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: agent-e2e-frozen-${{ github.run_attempt }}
          path: campaign
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AGENT_E2E_DISPATCH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Execute explicit implemented A/B development case
        env:
          DEVELOPMENT_CASE: ${{ inputs.development_case }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/agent-e2e-private/development"
          python3 tools/hosted_pilot/controller_handoff.py \
            --configuration certification/agent-e2e/controller-handoff.json \
            --bundle campaign --operation execute --case-id "$DEVELOPMENT_CASE" \
            --timeout 7200 --output "$RUNNER_TEMP/agent-e2e-private/development/outcome.json" \
            --evidence-directory "$RUNNER_TEMP/agent-e2e-private/development/evidence"
      - name: Retain native dispatch outcome receipts including first failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-e2e-development-${{ github.run_attempt }}
          # Raw evidence and controller logs stay in private native custody.
          path: ${{ runner.temp }}/agent-e2e-private/development/outcome.json
          if-no-files-found: warn
          retention-days: 90
