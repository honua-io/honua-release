name: agent-e2e-campaign
# Trusted producer for #619/#627. Qualification requires the full scenario
# backend; development requires an explicit implemented A/B case. Reviewed
# source configuration is required before any model/runtime call.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed trusted trunk release-train/nightly candidate-manifest run
        required: true
        type: string
      candidate_run_attempt:
        description: Exact candidate freeze run attempt; old artifacts from another attempt are refused
        required: true
        type: string
      mode:
        description: Development keeps C held out; qualification requires all 252 including EKS
        required: true
        default: development
        type: choice
        options: [development, qualification, bootstrap]
      development_case:
        description: One implemented A/B case for nonqualifying development (target comes from case ID)
        required: false
        default: P10:A:aws-ecs-redis-on
        type: string
permissions:
  contents: read
  actions: read
  attestations: read
# One candidate-wide store/ledger is also protected by the durable fenced lease.
concurrency:
  group: agent-e2e-campaign
  cancel-in-progress: false
env:
  TERMINAL_MODEL_NAME: ${{ vars.TERMINAL_MODEL_NAME || 'us.anthropic.claude-sonnet-5-5' }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze:
    if: inputs.mode != 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      campaign_digest: ${{ steps.freeze.outputs.campaign_digest }}
    steps:
      - name: Require trusted trunk and configured private dispatch role
        env:
          ROLE: ${{ vars.AGENT_E2E_DISPATCH_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/trunk
          test "$GITHUB_REPOSITORY" = honua-io/honua-release
          test -n "$ROLE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require reviewed private controller handoff
        # No fallback to a GitHub-hosted controller with private SQL credentials.
        run: |
          set -euo pipefail
          for source in tools/hosted_pilot/controller_handoff.py certification/agent-e2e/controller-handoff.json; do
            git ls-files --error-unmatch -- "$source" >/dev/null
            test -s "$source"
            test ! -L "$source"
          done
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install candidate binding dependencies
        run: python -m pip install 'pyyaml>=6.0' 'jsonschema>=4.23'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: candidate-manifest
          path: candidate-input
      - name: Authenticate candidate artifact before freezing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          python tools/agent_e2e_candidate.py --candidate-root candidate-input \
            --run-id "$CANDIDATE_RUN" --run-attempt "$CANDIDATE_ATTEMPT" \
            --output candidate-input/candidate-provenance.json
      - name: Read exact original funding producer for a named amendment
        id: funding
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          config = json.loads(Path('certification/agent-e2e/campaign-inputs.json').read_text())
          if 'budgetPolicy' in config:
              original = config['bootstrap']
              assert set(original) == {'artifactDigest', 'sourceSha', 'runId', 'runAttempt'}
              assert type(original['runId']) is int and original['runId'] > 0
              assert type(original['runAttempt']) is int and original['runAttempt'] > 0
              with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                  output.write('run_id='+str(original['runId'])+'\n')
                  output.write('run_attempt='+str(original['runAttempt'])+'\n')
          PYTHON
      - name: Download the original funding artifact without AWS authority
        if: steps.funding.outputs.run_id != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.funding.outputs.run_id }}
          name: agent-e2e-budget-bootstrap-${{ steps.funding.outputs.run_attempt }}
          path: bootstrap-import
      - name: Freeze reviewed campaign before paid execution
        id: freeze
        env:
          MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          FUNDING_RUN: ${{ steps.funding.outputs.run_id }}
        run: |
          set -euo pipefail
          funding_args=()
          if [ -n "$FUNDING_RUN" ]; then
            funding_args=(--bootstrap-artifact bootstrap-import/bootstrap-accounting.json)
          fi
          python tools/agent_e2e_campaign.py freeze --mode "$MODE" \
            --lock candidate-input/frozen-lock/platform-lock.json \
            --candidate-provenance candidate-input/candidate-provenance.json \
            "${funding_args[@]}" \
            --bundle campaign | tee freeze-result.json
          python - <<'PYTHON'
          import json, os, pathlib
          result = json.loads(pathlib.Path('freeze-result.json').read_text())
          assert result['status'] == 'frozen'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('campaign_digest='+result['campaignDigest']+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Frozen pre-execution campaign digest: `'+result['campaignDigest']+'`\n')
          PYTHON
      - name: Retain immutable pre-execution inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-e2e-frozen-${{ github.run_attempt }}
          path: campaign/
          if-no-files-found: error
          retention-days: 90
  develop:
    needs: freeze
    if: inputs.mode == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
