          role-to-assume: ${{ vars.AGENT_E2E_DISPATCH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Validate all real cases, semantics, cleanup and candidate spending
        # The helper restores only authenticated finalized bundle outputs after
        # native success; its nonzero native exit prevents attestation below.
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/agent-e2e-private/finalize"
          python3 tools/hosted_pilot/controller_handoff.py \
            --configuration certification/agent-e2e/controller-handoff.json \
            --bundle campaign --operation finalize \
            --timeout 1500 --output "$RUNNER_TEMP/agent-e2e-private/finalize/outcome.json" \
            --evidence-directory "$RUNNER_TEMP/agent-e2e-private/finalize/evidence"
      - name: Attest only complete successful qualification
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            campaign/campaign.json
            campaign/trusted-inventory.json
      - name: Publish consumer-compatible qualification bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-e2e-campaign-${{ github.run_attempt }}
          path: |
            campaign/campaign.json
            campaign/trusted-inventory.json
            campaign/qualification-lock.json
            campaign/expectations.json
            campaign/budget-ledger.json
            campaign/budget-bootstrap-original.json
            campaign/attempt-registry.json
            campaign/qualification-summary.json
            campaign/candidate-provenance.json
            campaign/receipts/
            campaign/evidence/
          if-no-files-found: error
          retention-days: 90

  bootstrap:
    if: inputs.mode == 'bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Reject bootstrap sealing outside protected release trunk
        run: |
          test "$GITHUB_REF" = refs/heads/trunk
          test "$GITHUB_REPOSITORY" = honua-io/honua-release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install candidate binding dependencies
        run: python -m pip install 'pyyaml>=6.0' 'jsonschema>=4.23'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: candidate-manifest
          path: candidate-input
      - name: Authenticate original candidate and seal reviewed nonzero accounting
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          python tools/agent_e2e_candidate.py --candidate-root candidate-input \
            --run-id "$CANDIDATE_RUN" --run-attempt "$CANDIDATE_ATTEMPT" \
            --output candidate-input/candidate-provenance.json
          mkdir -p budget-bootstrap
          python tools/hosted_pilot/budget_bootstrap.py \
            --configuration certification/agent-e2e/bootstrap.json \
            --lock candidate-input/frozen-lock/platform-lock.json \
            --provenance candidate-input/candidate-provenance.json \
            --output budget-bootstrap/bootstrap-accounting.json
      - name: Attest original accounting without running a model or creating cloud resources
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: budget-bootstrap/bootstrap-accounting.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-e2e-budget-bootstrap-${{ github.run_attempt }}
          path: budget-bootstrap/bootstrap-accounting.json
          if-no-files-found: error
          retention-days: 90
