name: agent-e2e-campaign
# Trusted producer for #619/#627. Qualification requires the full scenario
# backend; development requires an explicit implemented A/B case. Reviewed
# source configuration is required before any model/runtime call.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Completed trusted trunk release-train/nightly candidate-manifest run
        required: true
        type: string
      candidate_run_attempt:
        description: Exact candidate freeze run attempt; old artifacts from another attempt are refused
        required: true
        type: string
      mode:
        description: Development keeps C held out; qualification requires all 252 including EKS
        required: true
        default: development
        type: choice
        options: [development, qualification]
      development_case:
        description: One implemented A/B case for nonqualifying development (target comes from case ID)
        required: false
        default: P10:A:local-docker
        type: string
permissions:
  contents: read
  actions: read
  attestations: read
# One candidate-wide store/ledger is also protected by the durable fenced lease.
concurrency:
  group: agent-e2e-campaign
  cancel-in-progress: false
env:
  TERMINAL_MODEL_NAME: ${{ vars.TERMINAL_MODEL_NAME || 'us.anthropic.claude-sonnet-5-5' }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      campaign_digest: ${{ steps.freeze.outputs.campaign_digest }}
    steps:
      - name: Require trusted trunk and configured controller role
        env:
          ROLE: ${{ vars.AGENT_E2E_CONTROLLER_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/trunk
          test "$GITHUB_REPOSITORY" = honua-io/honua-release
          test -n "$ROLE"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install candidate binding dependencies
        run: python -m pip install 'pyyaml>=6.0' 'jsonschema>=4.23'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.candidate_run_id }}
          name: candidate-manifest
          path: candidate-input
      - name: Authenticate candidate artifact before freezing
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_run_attempt }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          python tools/agent_e2e_candidate.py --candidate-root candidate-input \
            --run-id "$CANDIDATE_RUN" --run-attempt "$CANDIDATE_ATTEMPT" \
            --output candidate-input/candidate-provenance.json
      - name: Freeze reviewed campaign before paid execution
        id: freeze
        env:
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python tools/agent_e2e_campaign.py freeze --mode "$MODE" \
            --lock candidate-input/frozen-lock/platform-lock.json \
            --candidate-provenance candidate-input/candidate-provenance.json \
            --bundle campaign | tee freeze-result.json
          python - <<'PYTHON'
          import json, os, pathlib
          result = json.loads(pathlib.Path('freeze-result.json').read_text())
          assert result['status'] == 'frozen'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('campaign_digest='+result['campaignDigest']+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as stream:
              stream.write('Frozen pre-execution campaign digest: `'+result['campaignDigest']+'`\n')
          PYTHON
      - name: Retain immutable pre-execution inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-e2e-frozen-${{ github.run_attempt }}
          path: campaign/
          if-no-files-found: error
          retention-days: 90
  develop:
    needs: freeze
    if: inputs.mode == 'development'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install controller SDK
        run: python -m pip install 'boto3>=1.40,<2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agent-e2e-frozen-${{ github.run_attempt }}
          path: campaign
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AGENT_E2E_CONTROLLER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Execute explicit implemented A/B development case
        env:
          DEVELOPMENT_CASE: ${{ inputs.development_case }}
        run: |
          set -euo pipefail
          python tools/agent_e2e_campaign.py execute --bundle campaign --case-id "$DEVELOPMENT_CASE"
      - name: Retain actual diagnostics including first failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-e2e-development-${{ github.run_attempt }}
          path: |
            campaign/journals/
            campaign/last-execution.json
            campaign/execution-summary.json
          if-no-files-found: warn
          retention-days: 90
  docker:
    if: inputs.mode == 'qualification'
    needs: freeze
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install controller SDK
        run: python -m pip install 'boto3>=1.40,<2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agent-e2e-frozen-${{ github.run_attempt }}
          path: campaign
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AGENT_E2E_CONTROLLER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Execute bounded real local-docker shards serially
        # Runtime calls start only IaC-defined jobs; this workflow creates no AWS resources.
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5; do
            python tools/agent_e2e_campaign.py execute --bundle campaign \
              --target local-docker --shard "$shard" --shards 6
          done
      - name: Retain actual diagnostics including first failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-e2e-diagnostics-docker-${{ github.run_attempt }}
          path: |
            campaign/journals/
            campaign/last-execution.json
          if-no-files-found: warn
          retention-days: 90
  ecs:
    if: inputs.mode == 'qualification'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install controller SDK
        run: python -m pip install 'boto3>=1.40,<2'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: agent-e2e-frozen-${{ github.run_attempt }}
          path: campaign
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          role-to-assume: ${{ vars.AGENT_E2E_CONTROLLER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Execute bounded real aws-ecs-redis-on shards serially
        # Runtime calls start only IaC-defined jobs; this workflow creates no AWS resources.
        run: |
          set -euo pipefail
          for shard in 0 1 2 3 4 5; do
            python tools/agent_e2e_campaign.py execute --bundle campaign \
              --target aws-ecs-redis-on --shard "$shard" --shards 6
          done
      - name: Retain actual diagnostics including first failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agent-e2e-diagnostics-ecs-${{ github.run_attempt }}
          path: |
            campaign/journals/
            campaign/last-execution.json
          if-no-files-found: warn
          retention-days: 90
  eks:
    if: inputs.mode == 'qualification'
    needs: ecs
    runs-on: ubuntu-latest
