# Operate-stage harness.
#
# pull_request runs the pilot on local stand-in images. workflow_dispatch runs the same
# runner. mode=live with priced=yes is trunk-only and is not started by a pull request.
# A full run downloads the named prior run's operate-summary and refuses unless that
# summary completed with no stop reasons.
name: Operate stage harness

on:
  pull_request:
    paths:
      - certification/agent-ops/**
      - .github/workflows/agent-ops.yml
  workflow_dispatch:
    inputs:
      mode:
        description: stub is the scripted operator. live is a priced model call.
        required: true
        type: choice
        default: stub
        options:
          - stub
          - live
      priced:
        description: yes is required before a live model call
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"
      target:
        description: local-docker runs the compose target. aws-ecs is unwired.
        required: true
        type: choice
        default: local-docker
        options:
          - local-docker
          - aws-ecs
      arm:
        description: primary is the shipped Sonnet 4.6 configuration. The other choices are the latest models.
        required: true
        type: choice
        default: primary
        options:
          - primary
          - opus-5-5
          - sonnet-5-5
          - gpt-6.1-sol
          - gpt-6.1-terra
      scope:
        description: pilot is the three named trials. full runs the development rows after a clean pilot.
        required: true
        type: choice
        default: pilot
        options:
          - pilot
          - full
      prior_run_id:
        description: GitHub run id whose operate-summary has no stop reasons. Required when scope is full.
        required: false
        type: string
        default: ""
      spend_cap_usd:
        description: Stop before the next trial once measured spend reaches this many USD.
        required: true
        type: string
        default: "250"
      newer_sha:
        description: honua-server trunk commit the newer image was built from. Required for a live run.
        required: false
        type: string
        default: ""
      newer_digest:
        description: Published sha256 digest. Used instead of the trunk-<sha>-amd64 tag when set.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  real-compose-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install smoke dependencies
        run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=45.0" pytest
      - name: Log in to the image registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Exercise real town seed and public traffic
        env:
          OPS_SMOKE_OUT: ${{ runner.temp }}/ops-real-smoke
        run: bash certification/agent-ops/real_smoke.sh

  pilot-stub:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=45.0" pytest
      - name: Unit checks
        run: python -m pytest certification/agent-ops -q
      - name: Refuse a live client with no endpoint
        env:
          UNSET_OUT: ${{ runner.temp }}/operate-unset
          TERMINAL_MODEL_BASE_URL: ""
          TERMINAL_MODEL_API_KEY: ""
          TERMINAL_MODEL_SIGNING_MANIFEST_SHA256: ""
        run: |
          set -euo pipefail
          set +e
          python certification/agent-ops/runner.py \
            --target local-docker \
            --model live \
            --priced-ok \
            --arm primary \
            --pilot \
            --rows certification/agent-ops/rows/development.jsonl \
            --out "$UNSET_OUT"
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          out = Path(os.environ["UNSET_OUT"])
          summary = json.loads((out / "summary.json").read_text())
          reasons = summary["stop"]["reasons"]
          if reasons != ["endpoint"]:
              raise SystemExit(f"expected an endpoint stop, got {reasons}")
          if (out / "trials.jsonl").exists():
              raise SystemExit("an unset endpoint started trials")
          PY
      - name: Tag local stand-in images
        run: |
          docker build -t honua-server:trunk certification/agent-ops/ci-image
          docker tag honua-server:trunk ghcr.io/honua-io/honua-server:2026.1-rc
          docker tag honua-server:trunk postgis/postgis:16-3.4
      - name: Pilot against local images
        run: |
          python certification/agent-ops/runner.py \
            --target local-docker \
            --model stub \
            --arm primary \
            --pilot \
            --execute-compose \
            --image-source local \
            --ledger "$RUNNER_TEMP/operate/ledger.json" \
            --spend-cap 250 \
            --rows certification/agent-ops/rows/development.jsonl \
            --out "$RUNNER_TEMP/operate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: operate-summary
          retention-days: 90
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/operate/summary.json
            ${{ runner.temp }}/operate/ledger.json
            ${{ runner.temp }}/operate/trials.jsonl
            ${{ runner.temp }}/operate/transcripts
            ${{ runner.temp }}/operate/audit

  stub:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stub' && inputs.priced == 'no'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=45.0" pytest
      - name: Unit checks
        run: python -m pytest certification/agent-ops -q
      - name: Scripted local run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ inputs.scope }}" = "full" ]; then
            test -n "${{ inputs.prior_run_id }}"
            gh run download "${{ inputs.prior_run_id }}" --repo "$GITHUB_REPOSITORY" -n operate-summary -D "$RUNNER_TEMP/prior"
            SCOPE=(--pilot-summary "$RUNNER_TEMP/prior/summary.json")
          else
            SCOPE=(--pilot)
          fi
          EXTRA=()
          if [ "${{ inputs.target }}" = "local-docker" ]; then
            docker build -t honua-server:trunk certification/agent-ops/ci-image
            docker tag honua-server:trunk ghcr.io/honua-io/honua-server:2026.1-rc
            docker tag honua-server:trunk postgis/postgis:16-3.4
            EXTRA=(--execute-compose --image-source local --ledger "$RUNNER_TEMP/operate/ledger.json" --spend-cap "${{ inputs.spend_cap_usd }}")
          fi
          python certification/agent-ops/runner.py \
            --target "${{ inputs.target }}" \
            --model stub \
            --arm "${{ inputs.arm }}" \
            "${SCOPE[@]}" \
            "${EXTRA[@]}" \
            --rows certification/agent-ops/rows/development.jsonl \
            --out "$RUNNER_TEMP/operate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: operate-summary
          retention-days: 90
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/operate/summary.json
            ${{ runner.temp }}/operate/ledger.json
            ${{ runner.temp }}/operate/trials.jsonl
            ${{ runner.temp }}/operate/transcripts
            ${{ runner.temp }}/operate/audit

  live-refused:
    if: github.event_name == 'workflow_dispatch' && ((inputs.mode == 'live' && inputs.priced != 'yes') || (inputs.mode == 'stub' && inputs.priced == 'yes'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse an invalid mode and price combination
        run: echo "live requires priced=yes; stub requires priced=no" && exit 1

  live:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'live' && inputs.priced == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      actions: read
      packages: read
    steps:
      - name: Refuse live trials until real evidence is wired
        run: echo "not-real: live trial execution and independent observations are not wired" && exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Refuse off trunk
        run: test "$GITHUB_REF" = refs/heads/trunk
      - name: Require the recorded trunk sha
        run: echo "${{ inputs.newer_sha }}" | grep -Eq '^[0-9a-f]{40}$'
      - name: Require the prior pilot for a full run
        if: inputs.scope == 'full'
        run: test -n "${{ inputs.prior_run_id }}"
      - name: Check out honua-server at the recorded sha
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-server
          ref: ${{ inputs.newer_sha }}
          path: honua-server
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install harness dependencies
        run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23" "cryptography>=45.0" "boto3>=1.35,<2" pytest
      - name: Log in to the image registry
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # Pull or build before assuming the short-lived Bedrock role: a cold AOT build can
      # outlast its session. The live runner then validates and uses these local images.
      - name: Prepare candidate images
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          DOCKER_BUILDKIT: "1"
          NEWER_SHA: ${{ inputs.newer_sha }}
          NEWER_DIGEST: ${{ inputs.newer_digest }}
        run: |
          python - <<'PYCODE'
          import os, sys
          from pathlib import Path
          sys.path.insert(0, "certification/agent-ops")
          from targets import prepare_images
          result = prepare_images(source="pull", newer_sha=os.environ["NEWER_SHA"],
                                  newer_digest=os.environ["NEWER_DIGEST"] or None,
                                  server_source=Path("honua-server"))
          if not result["ok"]:
              raise SystemExit(result["detail"])
          PYCODE
      - name: Assume the Bedrock-enabled role (OIDC)
        id: aws
        if: ${{ vars.HONUA_AWS_ROLE_ARN != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HONUA_AWS_ROLE_ARN }}
          aws-region: us-east-1
          output-credentials: true
          output-env-credentials: false
      - name: Require the assumed Bedrock credentials
        env:
          HONUA_CANARY_AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
        run: test -n "$HONUA_CANARY_AWS_ACCESS_KEY_ID"
      - name: Mint the composed server admin key
        run: |
          set -euo pipefail
          key="$(python -c 'import secrets; print(secrets.token_hex(32))')"
          echo "::add-mask::$key"
          echo "HONUA_ADMIN_PASSWORD=$key" >> "$GITHUB_ENV"
      - name: Live run
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          DOCKER_BUILDKIT: "1"
          OPERATE_ARM: ${{ inputs.arm }}
          HONUA_CANARY_AWS_ACCESS_KEY_ID: ${{ steps.aws.outputs.aws-access-key-id }}
          HONUA_CANARY_AWS_SECRET_ACCESS_KEY: ${{ steps.aws.outputs.aws-secret-access-key }}
          HONUA_CANARY_AWS_SESSION_TOKEN: ${{ steps.aws.outputs.aws-session-token }}
          HONUA_CANARY_STUDIO_AI_ENABLED: "true"
          HONUA_CANARY_BEDROCK_REGION: us-east-1
          HONUA_CANARY_TRANSCRIPT_KEY_ID: terminal-model-canary
          HONUA_CANARY_TRANSCRIPT_KEY_REFERENCE: env://HONUA_CANARY_TRANSCRIPT_SIGNING_SEED
          HONUA_CANARY_TRANSCRIPT_SIGNING_SEED: ${{ secrets.TERMINAL_MODEL_TRANSCRIPT_SIGNING_SEED }}
          HONUA_PORT: "8147"
          TERMINAL_MODEL_BASE_URL: http://127.0.0.1:8147/api
          TERMINAL_MODEL_API_KEY: ${{ env.HONUA_ADMIN_PASSWORD }}
          TERMINAL_MODEL_RUNTIME: aws-bedrock
          TERMINAL_MODEL_QUANTIZATION: provider-managed
          TERMINAL_MODEL_SIGNING_MANIFEST_SHA256: ${{ vars.TERMINAL_MODEL_SIGNING_MANIFEST_SHA256 }}
        run: |
          export HONUA_CANARY_BEDROCK_MODEL="$(python -c 'import os, sys; sys.path.insert(0, "certification/agent-ops"); from constants import ARMS; print(ARMS[os.environ["OPERATE_ARM"]]["bedrock"])')"
          if [ "${{ inputs.scope }}" = "full" ]; then
            gh run download "${{ inputs.prior_run_id }}" --repo "$GITHUB_REPOSITORY" -n operate-summary -D "$RUNNER_TEMP/prior"
            SCOPE=(--pilot-summary "$RUNNER_TEMP/prior/summary.json")
          else
            SCOPE=(--pilot)
          fi
          DIGEST=()
          if [ -n "${{ inputs.newer_digest }}" ]; then
            DIGEST=(--newer-digest "${{ inputs.newer_digest }}")
          fi
          python certification/agent-ops/runner.py \
            --target "${{ inputs.target }}" \
            --model live \
            --priced-ok \
            --arm "${{ inputs.arm }}" \
            --execute-compose \
            --image-source local \
            --newer-sha "${{ inputs.newer_sha }}" \
            --server-source honua-server \
            "${DIGEST[@]}" \
            --ledger "$RUNNER_TEMP/operate/ledger.json" \
            --spend-cap "${{ inputs.spend_cap_usd }}" \
            "${SCOPE[@]}" \
            --rows certification/agent-ops/rows/development.jsonl \
            --out "$RUNNER_TEMP/operate"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: operate-summary
          retention-days: 90
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/operate/summary.json
            ${{ runner.temp }}/operate/ledger.json
            ${{ runner.temp }}/operate/trials.jsonl
            ${{ runner.temp }}/operate/transcripts
            ${{ runner.temp }}/operate/audit
