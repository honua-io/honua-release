name: gate-dr

on:
  pull_request:
    paths:
      - "tools/validate_dr_receipt.py"
      - "tools/test_validate_dr_receipt.py"
      - "tools/fixtures/dr/**"
      - ".github/workflows/gate-dr.yml"
      - ".github/workflows/release-train.yml"
      - ".github/actions/candidate-input/**"
      - "tools/test_candidate_input_action.py"
  # The gate runs when the trunk producer (dr-drill-local-docker: weekly, on manifest pushes, or
  # dispatched) finishes, so the 24-hour freshness bound is measured against a receipt minted
  # minutes earlier. A fixed cron of its own had no receipt to read: vars.HONUA_DR_RECEIPT_URL was
  # never set, so every scheduled run since September failed at the fetch step.
  workflow_run:
    workflows: [dr-drill-local-docker]
    types: [completed]
    branches: [trunk]
  # Backstop a few hours after the producer's own Monday/Thursday slots, inside the 24-hour bound.
  schedule:
    - cron: "47 12 * * 1,4"
  workflow_dispatch:
    inputs:
      receipt_url:
        description: >-
          HTTPS URL of the candidate-bound full-platform DR receipt. Empty resolves the receipt the
          newest successful trunk run of dr-drill-local-docker published.
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      candidate_ref: { required: false, type: string, default: "" }
      receipt_url:
        required: true
        type: string
      candidate_bundle:
        description: Use the release train's frozen candidate-manifest artifact
        default: false
        type: boolean

permissions:
  contents: read
  attestations: read
  actions: read                 # resolve the trunk producer run's receipt-location artifact

jobs:
  contract:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" pytest
      - name: Check out the reviewed GP receipt contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-server
          ref: 6937fcee585240ce49e36de726d131e9abb13d4a
          path: gp-qualification
      # release#231 WI-8: record the fixture revision git reports for each checkout, for the lock's
      # $.fixtures. Recording never changes this gate's verdict; a missing record refuses the mint.
      - name: Record the fixture revisions this job checked out
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python "$GITHUB_WORKSPACE/tools/fixture_revisions.py" emit --gate gate-dr --job contract
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --out "$RUNNER_TEMP/fixture-revisions/fixture-revisions.json"
          "honua-io/honua-server=gp-qualification"
      - name: Upload the fixture revision record
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-revisions-gate-dr-contract
          path: ${{ runner.temp }}/fixture-revisions/fixture-revisions.json
          if-no-files-found: error
          overwrite: true
      - name: Prove GP repins and incomplete crash receipts are rejected
        run: python -m unittest discover -s gp-qualification/scripts/qualification -p test_gp_candidate_binding.py
      - name: Prove incomplete receipts are rejected
        run: python -m pytest tools/test_validate_dr_receipt.py -q
      # The train's gate_dr adopts its candidate_ref here, on Windows; this is the only Windows
      # consumer of candidate-input, so prove the real adoption shell runs on this runner.
      - name: Prove candidate inputs adopt on this Windows runner
        run: python -m pytest tools/test_candidate_input_action.py -q -k "existing_train_default or subdirectory or lf_on_windows"

  receipt:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0"
      - name: Download the frozen candidate configuration
        if: inputs.candidate_bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-manifest
          path: candidate-input
      # An explicit URL (dispatch input, train input or repository variable) wins. Otherwise the URL
      # comes from the receipt-location artifact of the trunk producer run: the one that triggered
      # this run, or the newest successful non-PR trunk run. Only the location is taken from the
      # artifact; the bytes it points at are still attestation-verified below against the producer
      # workflow identity and refs/heads/trunk, and freshness-checked by validate_dr_receipt.py.
      - name: Resolve the full-platform receipt location
        id: receipt_source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_URL: ${{ inputs.receipt_url || vars.HONUA_DR_RECEIPT_URL }}
          PRODUCER_RUN: ${{ github.event.workflow_run.id }}
          PRODUCER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          PRODUCER_EVENT: ${{ github.event.workflow_run.event }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$INPUT_URL" ]; then
            echo "receipt source: explicit URL"
            echo "receipt_url=$INPUT_URL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$PRODUCER_RUN" ]; then
            if [ "$PRODUCER_EVENT" = "pull_request" ] || [ "$PRODUCER_CONCLUSION" != "success" ]; then
              echo "::error::trunk DR producer run $PRODUCER_RUN ($PRODUCER_EVENT) concluded $PRODUCER_CONCLUSION; it published no receipt"
              exit 1
            fi
            run="$PRODUCER_RUN"
          else
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/dr-drill-local-docker.yml/runs?branch=trunk&status=success&per_page=30" \
              --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty')"
            [ -n "$run" ] || { echo "::error::no successful trunk dr-drill-local-docker run has published a receipt"; exit 1; }
          fi
          name="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?per_page=100" \
            --jq '[.artifacts[] | select(.name | startswith("dr-receipt-location-")) | select(.expired | not)] | sort_by(.created_at) | last | .name // empty')"
          [ -n "$name" ] || { echo "::error::producer run $run has no unexpired dr-receipt-location artifact"; exit 1; }
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$name" --dir "$RUNNER_TEMP/receipt-location"
          url="$(python -c 'import json,sys;print(json.load(open(sys.argv[1]))["receipt_url"])' "$RUNNER_TEMP/receipt-location/receipt-location.json")"
          echo "receipt source: producer run https://github.com/$GITHUB_REPOSITORY/actions/runs/$run ($name)"
          echo "receipt_url=$url" >> "$GITHUB_OUTPUT"
      - name: Fetch full-platform receipt
        env:
          RECEIPT_URL: ${{ steps.receipt_source.outputs.receipt_url }}
        shell: pwsh
        run: |
          $receiptUri = $null
          if (![Uri]::TryCreate($env:RECEIPT_URL, [UriKind]::Absolute, [ref]$receiptUri) -or $receiptUri.Scheme -ne 'https' -or $receiptUri.UserInfo) {
            throw 'Missing or invalid full-platform DR receipt_url: HTTPS required'
          }
          Invoke-WebRequest -Uri $receiptUri -MaximumRedirection 0 -OutFile "$env:RUNNER_TEMP/dr-receipt.json"
      # `--repo` alone is not a trust boundary. Any same-repository pull request can run a
      # workflow that holds `attestations: write` and mint an attestation associated with this
      # repository, so a repository-only check would accept a receipt fabricated by unmerged
      # code. Pin the signing workflow identity and the trusted source ref: only the reviewed
      # producer, running from trunk, can supply a receipt this gate accepts. When the
      # full-platform producer is established, repoint --signer-workflow at it here.
      - name: Verify receipt producer attestation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh attestation verify "$env:RUNNER_TEMP/dr-receipt.json" `
            --repo honua-io/honua-release `
            --signer-workflow honua-io/honua-release/.github/workflows/dr-drill-local-docker.yml `
            --source-ref refs/heads/trunk
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reject missing substrates or restart observations
        env:
          CANDIDATE_BUNDLE: ${{ inputs.candidate_bundle }}
        shell: pwsh
        run: |
          # The full-platform producer (e2e/dr-drill/full_platform.py) always binds
          # candidateLockDigest to platform-manifest.yaml bytes, never platform-lock.json, so the
          # gate must hash that same document under both intake paths. Under the train
          # (candidate_bundle=true) that is the frozen candidate-manifest artifact's own copy of
          # platform-manifest.yaml, not the checkout's — the artifact is what freeze actually
          # certified. See e2e/dr-drill/README.md.
          $candidatePath = 'platform-manifest.yaml'
          if ($env:CANDIDATE_BUNDLE -eq 'true') { $candidatePath = 'candidate-input/platform-manifest.yaml' }
          python tools/validate_dr_receipt.py --candidate $candidatePath --receipt "$env:RUNNER_TEMP/dr-receipt.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check out the reviewed GP receipt consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-server
          ref: 6937fcee585240ce49e36de726d131e9abb13d4a
          path: gp-qualification
      # release#231 WI-8: record the fixture revision git reports for each checkout, for the lock's
      # $.fixtures. Recording never changes this gate's verdict; a missing record refuses the mint.
      - name: Record the fixture revisions this job checked out
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: >-
          python "$GITHUB_WORKSPACE/tools/fixture_revisions.py" emit --gate gate-dr --job receipt
          --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
          --out "$RUNNER_TEMP/fixture-revisions/fixture-revisions.json"
          "honua-io/honua-server=gp-qualification"
      - name: Upload the fixture revision record
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fixture-revisions-gate-dr-receipt
          path: ${{ runner.temp }}/fixture-revisions/fixture-revisions.json
          if-no-files-found: error
          overwrite: true
      - name: Require candidate-bound staged-output restore and crash proof
        env:
          CANDIDATE_BUNDLE: ${{ inputs.candidate_bundle }}
        shell: pwsh
        run: |
          $candidatePath = 'platform-manifest.yaml'
          if ($env:CANDIDATE_BUNDLE -eq 'true') { $candidatePath = 'candidate-input/platform-manifest.yaml' }
          python gp-qualification/scripts/qualification/gp-candidate-binding.py `
            --manifest $candidatePath --receipt "$env:RUNNER_TEMP/dr-receipt.json" `
            --output "$env:RUNNER_TEMP/gp-validated.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Preserve validated receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-platform-dr-receipt
          path: ${{ runner.temp }}/dr-receipt.json
          if-no-files-found: error
          retention-days: 90
