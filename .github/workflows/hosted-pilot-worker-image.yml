name: Hosted pilot selected public worker image
on:
  workflow_dispatch:
    inputs:
      config_path:
        description: Reviewed foundation deployments config bound by this image build's original owner reservation
        required: true
        type: string
      budget_version_id:
        description: Actual immutable owner budget version reserved for this workflow run
        required: true
        type: string
      budget_sha256:
        description: Actual SHA256 of that retained nonzero owner budget
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hosted-pilot-worker-image
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: hosted-pilot-apply
    permissions:
      contents: read
      id-token: write
    env:
      PILOT_ACCOUNT_ID: ${{ vars.HOSTED_PILOT_ACCOUNT_ID }}
      PILOT_REGION: ${{ vars.HOSTED_PILOT_REGION }}
      PILOT_WORKER_REPOSITORY: ${{ vars.HOSTED_PILOT_WORKER_ECR_REPOSITORY }}
      PILOT_PLAN_BUCKET: ${{ vars.HOSTED_PILOT_PLAN_BUCKET }}
      PILOT_PLAN_KMS_ARN: ${{ vars.HOSTED_PILOT_PLAN_KMS_ARN }}
      PILOT_CONFIG_PATH: ${{ inputs.config_path }}
      PILOT_BUDGET_VERSION_ID: ${{ inputs.budget_version_id }}
      PILOT_BUDGET_SHA256: ${{ inputs.budget_sha256 }}
      PILOT_OPERATION: apply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Require reviewed exact public knowledge source
        id: source
        run: |
          set -euo pipefail
          git ls-files --error-unmatch certification/agent-e2e/worker-image.json
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          value = json.loads(Path('certification/agent-e2e/worker-image.json').read_text())
          knowledge = value['knowledge']
          assert knowledge['sourceRepository'] == 'https://github.com/honua-io/honua-server'
          assert re.fullmatch('[a-f0-9]{40}', knowledge['sourceRevision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('revision='+knowledge['sourceRevision']+'\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-server
          ref: ${{ steps.source.outputs.revision }}
          path: worker-knowledge-source
          token: ${{ secrets.RELEASE_GH_TOKEN }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.HOSTED_PILOT_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.HOSTED_PILOT_REGION }}
          allowed-account-ids: ${{ vars.HOSTED_PILOT_ACCOUNT_ID }}
          role-session-name: pilot-worker-image-${{ github.run_id }}
      - name: Build public-only A/B exports, run real container controls and publish immutable image
        run: python3 tools/hosted_pilot/worker_image.py
      - name: Retain actual immutable worker image metadata
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hosted-pilot-worker-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hosted-pilot-worker-image.json
          if-no-files-found: error
          retention-days: 30
