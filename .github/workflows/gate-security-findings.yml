# Public finding dispositions verify merged PR citations independently of release working papers.
# Candidate-bound private severity counts are checked by gate-security-private-summary.yml.
name: gate-security-findings

on:
  pull_request:
    paths:
      - "contracts/security-findings.json"
      - "tools/security_findings.py"
      - "tools/github_api.py"
      - "tools/test_security_findings.py"
      - ".github/workflows/gate-security-findings.yml"
  schedule:
    - cron: "53 5 * * *"
  workflow_dispatch:
  workflow_call:
    outputs:
      overall_status:
        value: ${{ jobs.security-findings.outputs.overall_status }}

permissions:
  contents: read
  pull-requests: read

# In a workflow_call the github context is the caller's: github.workflow keeps the call from
# gate-security (or the train) out of the standalone schedule's group; otherwise
# cancel-in-progress lets either run cancel the other.
concurrency:
  group: gate-security-findings-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-findings:
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.verdict.outputs.overall_status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pytest PyYAML
      - name: Self-test the security findings rules
        run: python -m pytest tools/test_security_findings.py -q
      - name: Verify fixed rows against their merged PRs
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/security_findings.py
          echo "overall_status=pass" >> "$GITHUB_OUTPUT"
