name: Agent map source controls

on:
  pull_request:
    paths:
      - 'e2e/agent-map/**'
      - '.github/workflows/agent-map-source-controls.yml'
  push:
    branches: [trunk]
    paths:
      - 'e2e/agent-map/**'
      - '.github/workflows/agent-map-source-controls.yml'

permissions:
  contents: read

concurrency:
  group: agent-map-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e/agent-map/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Load the provider adapter without model calls
        working-directory: e2e/agent-map
        run: |
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          HONUA_AGENT_CLIENT=legacy node --input-type=module -e "await import('./agent-loop.mjs')"
          HONUA_AGENT_CLIENT=mantle node --input-type=module -e "await import('./agent-loop.mjs')"
          mkdir -p ../../artifacts/agent-map-source
          npm ls --all --json > ../../artifacts/agent-map-source/installed-provider-packages.json
      - name: Install locked app dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck the app against the installed packages
        run: npm run typecheck
      - name: Build the served browser app
        run: npm run build
      - name: Retain the source-build package identities
        if: always()
        run: |
          mkdir -p ../../../artifacts/agent-map-source
          npm ls --all --json > ../../../artifacts/agent-map-source/installed-packages.json
          cp package-lock.json ../../../artifacts/agent-map-source/package-lock.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: agent-map-source-controls-${{ github.run_attempt }}
          path: artifacts/agent-map-source/
          if-no-files-found: error
