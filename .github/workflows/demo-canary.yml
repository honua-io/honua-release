# Scheduled demo canary (honua-release#61, P4 of the release-safety epic #58).
#
# Runs the canonical slim set (incl. the live capability-manifest check, honua-release#61 item 1) plus
# the full canary probe set (e2e/canary_probes.py — corrected 2026-07-20 protocol reachability probes,
# ported from honua-server's docs/internal/demo/scripts/demo-b-probes.sh, plus STAC/EDR/OData/
# OGC-Features/tiles/per-service-WMS-WMTS-WCS/geocoding-latency) against https://demo.honua.io every 6
# hours. This is a HYBRID-train evidence producer (docs/HYBRID-TRAIN.md): it runs on its own schedule
# against the ALWAYS-ON public demo deployment, independent of any specific release candidate — it is
# NOT wired as a release-train gate job. Its output (a versioned live-canary-evidence.json envelope) is
# meant to be consumed/joined by honua-evidence (honua-io/honua-evidence#8), the same "produce evidence
# out-of-band, consume it with freshness bounds" shape as the honua-esri-compat lane.
#
# Honesty (AGENTS.md): geocoding-latency is REPORT-ONLY (honua-server#2948, known-broken pending VPC
# egress) and never fails the run. Every other check/probe can genuinely fail. `HONUA_DEMO_API_KEY` is
# an OPTIONAL repo secret — key-gated probes (metrics, admin-metrics-health, deploy-preflight, and the
# `available=true` half of the capability-manifest check) report BLOCKED (not FAIL) without it, and the
# run stays green (exit 0) as long as nothing GENUINELY fails. On a real FAIL, a single tracking issue
# (label `demo-canary,automated`) is opened/updated — never a new issue per run — mirroring
# honua-server's cite-evidence-report.yml pattern.

name: demo-canary

on:
  schedule:
    - cron: "23 */6 * * *"   # every 6 hours
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target base URL to canary"
        required: false
        type: string
        default: "https://demo.honua.io"

permissions:
  contents: read
  issues: write

concurrency:
  group: demo-canary
  cancel-in-progress: false

env:
  HONUA_DEMO_BASE_URL: ${{ inputs.base_url || vars.HONUA_DEMO_BASE_URL || 'https://demo.honua.io' }}
  HONUA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  canary:
    runs-on: ubuntu-latest
    outputs:
      status: ${{ steps.canary.outputs.status }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r e2e/requirements.txt pytest

      # The check/probe logic's own correctness must be proven before we trust a live run against it.
      - name: Self-test the canonical + canary probe logic
        run: python -m pytest e2e/test_cloud.py e2e/test_canary_probes.py -q

      - name: Run the demo canary
        id: canary
        env:
          HONUA_DEMO_API_KEY: ${{ secrets.HONUA_DEMO_API_KEY }}
        run: |
          set -uo pipefail
          python e2e/demo_canary.py --base "$HONUA_DEMO_BASE_URL" > /tmp/canary.log 2>&1
          RC=$?
          cat /tmp/canary.log
          STATUS="$(python -c "import json;print(json.load(open('e2e/gate-report-demo-canary.json'))['status'])" 2>/dev/null || echo fail)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "## Demo canary — $HONUA_DEMO_BASE_URL — $STATUS";
            echo "";
            echo '```';
            cat /tmp/canary.log;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          # A key-configured note so a red run is diagnosable at a glance (was the key even wired?).
          if [ -z "${HONUA_DEMO_API_KEY:-}" ]; then
            echo "::notice title=demo-canary::HONUA_DEMO_API_KEY is not set — key-gated probes (metrics, admin-metrics-health, deploy-preflight, capability-manifest available=true) report BLOCKED, not FAIL."
          fi
          exit "$RC"

      - name: Upload demo-canary gate-report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-canary-gate-report
          path: e2e/gate-report-demo-canary.json
          if-no-files-found: warn

      # Versioned live-canary evidence envelope for honua-evidence#8's join (see docs/HYBRID-TRAIN.md —
      # the schema there is a PROPOSAL, since honua-evidence#8 had not defined one as of this writing).
      - name: Upload live-canary evidence envelope
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-canary-evidence
          path: e2e/live-canary-evidence.json
          if-no-files-found: warn

      - name: Check out the evidence landing zone
        if: ${{ always() && hashFiles('e2e/live-canary-evidence.json') != '' }}
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: honua-io/honua-evidence
          ref: trunk
          token: ${{ secrets.RELEASE_GH_TOKEN }}
          path: evidence-repo
          fetch-depth: 0

      - name: Publish the versioned envelope to honua-evidence
        id: publish_evidence
        if: ${{ always() && hashFiles('e2e/live-canary-evidence.json') != '' }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          destination="evidence-repo/data/producers/live-canary/demo-${RUN_ID}.json"
          cp e2e/live-canary-evidence.json "$destination"

          cd evidence-repo
          git config user.name "Mike McDougall"
          git config user.email "mike@honua.io"
          git add "data/producers/live-canary/demo-${RUN_ID}.json"
          git commit -m "chore: ingest demo canary evidence ${RUN_ID}"

          for attempt in 1 2 3; do
            if git pull --rebase origin trunk && git push origin HEAD:trunk; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 2))"
          done
          echo "Failed to publish the live-canary envelope after 3 attempts" >&2
          exit 1

      - name: Report an evidence-delivery failure
        if: ${{ always() && steps.canary.outcome == 'success' && steps.publish_evidence.outcome != 'success' }}
        run: |
          echo "::error title=Live-canary evidence publication failed::The demo canary passed, but its evidence envelope was not delivered to honua-evidence."
          echo "## Evidence delivery failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The demo canary passed, but the live-canary envelope was not delivered to honua-evidence. This is an evidence-pipeline failure, not a demo regression." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Open/update issue on a genuine FAIL
        if: ${{ always() && github.event_name == 'schedule' && steps.canary.outcome == 'failure' && steps.canary.outputs.status == 'fail' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Demo canary: scheduled run against demo.honua.io failed';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `## Demo Canary Alert

            The scheduled \`demo-canary\` run against \`${{ env.HONUA_DEMO_BASE_URL }}\` reported a
            genuine FAIL (not just BLOCKED — see the run's step summary for the full per-check
            breakdown; BLOCKED entries from missing \`HONUA_DEMO_API_KEY\` or the known geocoding gap
            (honua-server#2948) do not trigger this alert).

            **Run**: ${runUrl}

            ## Acceptance Criteria

            - Identify which check/probe genuinely failed (see the run's job summary) and root-cause it
              — a real regression on the live demo deployment, not just an unwired secret.
            - Re-run this workflow (workflow_dispatch) to confirm green before closing.

            This issue was created automatically by the demo-canary workflow.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'demo-canary,automated'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Recurred: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['demo-canary', 'automated', 'high-priority']
              });
            }
