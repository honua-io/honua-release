# Scheduled demo canary (honua-release#61, P4 of the release-safety epic #58).
#
# Runs the canonical slim set (incl. the live capability-manifest check, honua-release#61 item 1) plus
# the full canary probe set (e2e/canary_probes.py — corrected 2026-07-20 protocol reachability probes,
# ported from honua-server's docs/internal/demo/scripts/demo-b-probes.sh, plus STAC/EDR/OData/
# OGC-Features/tiles/per-service-WMS-WMTS-WCS/geocoding-latency) against https://demo.honua.io every 6
# hours while a governed selected-lock burn is active, daily otherwise. This is a HYBRID-train evidence producer (docs/HYBRID-TRAIN.md): it runs on its own schedule
# against the ALWAYS-ON public demo deployment. Optional burn mode authenticates the selected candidate; it is
# NOT wired as a release-train gate job. Its output (a versioned live-canary-evidence.json envelope) is
# meant to be consumed/joined by honua-evidence (honua-io/honua-evidence#8), the same "produce evidence
# out-of-band, consume it with freshness bounds" shape as the honua-esri-compat lane.
#
# Honesty (AGENTS.md): geocoding-latency is REPORT-ONLY (honua-server#2948, known-broken pending VPC
# egress) and never fails the run. Every other check/probe can genuinely fail — and a failure that is
# KNOWN and OWNED is QUARANTINED, never deleted (honua-release#84): e2e/canary-quarantine.yaml maps the
# probe to an owning issue, e2e/quarantine.py downgrades its FAIL to `quarantined` until the entry's
# `reviewBy` expires (after which it reddens the run again), and the step summary below prints a table
# linking every quarantined probe to its issue — so a remaining failure is owned, not silent. The
# live-canary envelope published to honua-evidence still reports a quarantined probe `red`.
# `HONUA_DEMO_API_KEY` is
# an OPTIONAL repo secret — key-gated probes (metrics, admin-metrics-health, deploy-preflight, and the
# `available=true` half of the capability-manifest check) report BLOCKED (not FAIL) without it, and the
# run stays green (exit 0) as long as nothing GENUINELY fails. On a real FAIL, a single tracking issue
# (label `demo-canary,automated`) is opened/updated — never a new issue per run — mirroring
# honua-server's cite-evidence-report.yml pattern.

name: demo-canary

on:
  schedule:
    # Daily monitoring; the additional slots run only during a governed selected-lock burn.
    - cron: "23 6 * * *"
    - cron: "23 0,12,18 * * *"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Target base URL to canary"
        required: false
        type: string
        default: "https://demo.honua.io"

permissions:
  contents: read
  issues: write
  actions: read
  attestations: read
  id-token: write # optional read-only ECS identity role; no deploy credentials

concurrency:
  group: demo-canary
  cancel-in-progress: false

env:
  HONUA_DEMO_BASE_URL: ${{ inputs.base_url || vars.HONUA_DEMO_BASE_URL || 'https://demo.honua.io' }}
  HONUA_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  canary:
    if: ${{ github.event_name != 'schedule' || github.event.schedule == '23 6 * * *' || vars.DEMO_CANARY_PROMOTION_RECORD != '' }}
    runs-on: ubuntu-latest
    env:
      SELECTED_PROMOTION_RECORD: ${{ vars.DEMO_CANARY_PROMOTION_RECORD }}
      DEMO_CANARY_REGION: ${{ vars.DEMO_CANARY_REGION }}
      DEMO_CANARY_CLUSTER: ${{ vars.DEMO_CANARY_CLUSTER }}
      DEMO_CANARY_SERVICE: ${{ vars.DEMO_CANARY_SERVICE }}
      DEMO_CANARY_CONTAINER: ${{ vars.DEMO_CANARY_CONTAINER }}
      DEMO_CANARY_ZONE: ${{ vars.DEMO_CANARY_ZONE }}
    outputs:
      status: ${{ steps.canary.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install -r e2e/requirements.txt pytest

      - name: Install cosign for retained mint verification
        if: ${{ env.SELECTED_PROMOTION_RECORD != '' }}
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Authenticate the selected committed promotion record and retained mint
        if: ${{ env.SELECTED_PROMOTION_RECORD != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/demo_canary_binding.py prepare --record "$SELECTED_PROMOTION_RECORD" \
            --root "$RUNNER_TEMP/demo-canary-candidate" --base "$HONUA_DEMO_BASE_URL"

      - name: Assume the approved read-only ECS observation role
        if: ${{ env.SELECTED_PROMOTION_RECORD != '' }}
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEMO_CANARY_READ_ROLE_ARN }}
          aws-region: ${{ vars.DEMO_CANARY_REGION }}

      - name: Observe selected ECS deployment before probes
        id: deployment_before
        if: ${{ env.SELECTED_PROMOTION_RECORD != '' }}
        run: |
          python tools/demo_canary_binding.py observe --root "$RUNNER_TEMP/demo-canary-candidate" --base "$HONUA_DEMO_BASE_URL"

      # The check/probe logic's own correctness must be proven before we trust a live run against it.
      - name: Self-test the canonical + canary probe + quarantine logic
        run: python -m pytest e2e/test_cloud.py e2e/test_canary_probes.py e2e/test_quarantine.py tools/test_demo_canary_binding.py -q

      - name: Run the demo canary
        id: canary
        env:
          HONUA_DEMO_API_KEY: ${{ secrets.HONUA_DEMO_API_KEY }}
        run: |
          set -uo pipefail
          # The step shell is `bash -e`: capture the exit code explicitly, or a failing canary aborts
          # here before the log, the status output and the tracking issue below ever see it.
          RC=0
          ARGS=(--base "$HONUA_DEMO_BASE_URL")
          if [ -n "${HONUA_CANARY_CANDIDATE_SHA:-}" ]; then ARGS+=(--candidate-sha "$HONUA_CANARY_CANDIDATE_SHA" --bound-candidate); fi
          python e2e/demo_canary.py "${ARGS[@]}" > /tmp/canary.log 2>&1 || RC=$?
          cat /tmp/canary.log
          STATUS="$(python -c "import json;print(json.load(open('e2e/gate-report-demo-canary.json'))['status'])" 2>/dev/null || echo fail)"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          {
            echo "## Demo canary — $HONUA_DEMO_BASE_URL — $STATUS";
            echo "";
            echo '```';
            cat /tmp/canary.log;
            echo '```';
          } >> "$GITHUB_STEP_SUMMARY"
          # honua-release#84 AC: every remaining failure carries an owning issue LINKED FROM THE RUN
          # SUMMARY. Quarantined probes are real failures held green by e2e/canary-quarantine.yaml, so
          # they get their own table rather than being buried in the log above. Registry rot (expired /
          # stale / unknown entries) is surfaced as an annotation so nobody has to read the log to see it.
          python - <<'PY' || true
          import json, os, pathlib
          audit = (json.loads(pathlib.Path("e2e/gate-report-demo-canary.json").read_text())
                   .get("quarantine") or {})
          lines = []
          if audit.get("applied"):
              lines += ["", "### Quarantined probes (failing, owned, not silenced)", "",
                        "| probe | owning issue | since | review by | reason |", "|---|---|---|---|---|"]
              lines += [f"| `{e['probe']}` | {e['issue']} | {e['since']} | {e['reviewBy']} | {e['reason']} |"
                        for e in audit["applied"]]
              lines += ["", "These are still reported `red` to honua-evidence — quarantine moves the CI "
                        "verdict, never the evidence verdict."]
          for kind, note in (("expired", "is past its reviewBy — the probe is failing the run again"),
                             ("stale", "is no longer failing — delete the entry"),
                             ("unknown", "is not a probe this canary emits (renamed?)")):
              for e in audit.get(kind, []):
                  lines += ["", f"> **Quarantine {kind}**: `{e['probe']}` {note} ({e['issue']})."]
                  print(f"::warning title=demo-canary quarantine {kind}::{e['probe']} {note} — {e['issue']}")
          if lines:
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          PY
          # A key-configured note so a red run is diagnosable at a glance (was the key even wired?).
          if [ -z "${HONUA_DEMO_API_KEY:-}" ]; then
            echo "::notice title=demo-canary::HONUA_DEMO_API_KEY is not set — key-gated probes (metrics, admin-metrics-health, deploy-preflight, capability-manifest available=true) report BLOCKED, not FAIL."
          fi
          exit "$RC"

      - name: Bind canary evidence to the selected lock and unchanged live deployment
        if: ${{ always() && env.SELECTED_PROMOTION_RECORD != '' && steps.deployment_before.outcome == 'success' && hashFiles('e2e/live-canary-evidence.json') != '' }}
        run: |
          python tools/demo_canary_binding.py bind --root "$RUNNER_TEMP/demo-canary-candidate" --base "$HONUA_DEMO_BASE_URL"

      - name: Upload demo-canary gate-report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-canary-gate-report
          path: e2e/gate-report-demo-canary.json
          if-no-files-found: warn

      # Versioned live-canary evidence envelope for honua-evidence#8's join (see docs/HYBRID-TRAIN.md —
      # the schema there is a PROPOSAL, since honua-evidence#8 had not defined one as of this writing).
      - name: Upload live-canary evidence envelope
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-canary-evidence
          path: e2e/live-canary-evidence.json
          if-no-files-found: warn

      - name: Check out the evidence landing zone
        if: ${{ always() && hashFiles('e2e/live-canary-evidence.json') != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-evidence
          ref: trunk
          token: ${{ secrets.RELEASE_GH_TOKEN }}
          path: evidence-repo
          fetch-depth: 0

      - name: Publish the versioned envelope to honua-evidence
        id: publish_evidence
        if: ${{ always() && hashFiles('e2e/live-canary-evidence.json') != '' }}
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          destination="evidence-repo/data/producers/live-canary/demo-${RUN_ID}.json"
          cp e2e/live-canary-evidence.json "$destination"

          cd evidence-repo
          git config user.name "Mike McDougall"
          git config user.email "mike@honua.io"
          git add "data/producers/live-canary/demo-${RUN_ID}.json"
          git commit -m "chore: ingest demo canary evidence ${RUN_ID}"

          for attempt in 1 2 3; do
            if git pull --rebase origin trunk && git push origin HEAD:trunk; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 2))"
          done
          echo "Failed to publish the live-canary envelope after 3 attempts" >&2
          exit 1

      - name: Trigger evidence aggregation and Pages deployment
        id: dispatch_aggregate
        if: ${{ always() && steps.publish_evidence.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          gh api --method POST repos/honua-io/honua-evidence/dispatches \
            -f event_type=producer-updated

      - name: Report an evidence-delivery failure
        if: ${{ always() && steps.canary.outcome == 'success' && (steps.publish_evidence.outcome != 'success' || steps.dispatch_aggregate.outcome != 'success') }}
        env:
          PUBLISH_OUTCOME: ${{ steps.publish_evidence.outcome }}
          DISPATCH_OUTCOME: ${{ steps.dispatch_aggregate.outcome }}
        run: |
          if [ "$PUBLISH_OUTCOME" != "success" ]; then
            detail="the live-canary envelope was not delivered to honua-evidence"
          else
            detail="the envelope was delivered, but the honua-evidence aggregate and Pages deployment were not triggered"
          fi
          echo "::error title=Live-canary evidence pipeline failed::The demo canary passed, but $detail."
          echo "## Evidence pipeline failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The demo canary passed, but $detail. This is an evidence-pipeline failure, not a demo regression." >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # One issue for any failed scheduled run: a genuine canary FAIL, or a failed evidence step
      # (binding/publication) that would otherwise leave the run red with nobody told.
      - name: Open/update issue on a failed scheduled run
        if: ${{ always() && github.event_name == 'schedule' && (steps.canary.outputs.status == 'fail' || failure()) }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const title = 'Demo canary: scheduled run against demo.honua.io failed';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = `## Demo Canary Alert

            The scheduled \`demo-canary\` run against \`${{ env.HONUA_DEMO_BASE_URL }}\` reported a
            genuine, UNOWNED FAIL — see the run's step summary for the full per-check breakdown.
            BLOCKED entries (missing \`HONUA_DEMO_API_KEY\`, the known geocoding gap honua-server#2948)
            and QUARANTINED entries (a known failure already owned by an issue in
            \`e2e/canary-quarantine.yaml\`) do not trigger this alert.

            **Run**: ${runUrl}
            **Canary status**: \`${{ steps.canary.outputs.status || 'not produced' }}\` (a \`pass\` here means an
            evidence binding/publication step failed instead — see the failed step in the run).

            ## Acceptance Criteria

            - Identify which check/probe genuinely failed (see the run's job summary) and root-cause it
              — a real regression on the live demo deployment, not just an unwired secret.
            - Re-run this workflow (workflow_dispatch) to confirm green before closing.

            This issue was created automatically by the demo-canary workflow.
            `;

            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'demo-canary,automated'
            });

            const existingIssue = issues.data.find(issue => issue.title === title);

            if (existingIssue) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existingIssue.number,
                body: `Recurred: ${runUrl}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['demo-canary', 'automated', 'high-priority']
              });
            }
