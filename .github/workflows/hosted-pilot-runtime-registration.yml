name: Hosted pilot original native runtime registration
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agent-e2e-campaign
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Reject registration outside protected release trunk
        run: |
          test "$GITHUB_REPOSITORY" = honua-io/honua-release
          test "$GITHUB_REF" = refs/heads/trunk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Resolve reviewed wheel bytes before privileged AWS credentials exist
        run: |
          set -euo pipefail
          git ls-files --error-unmatch certification/agent-e2e/runtime-registration-handoff.json
          python -m pip download --require-hashes --only-binary=:all: --dest _registrar-wheels -r certification/hosted-pilot/controller/requirements.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: registrar-reviewed-wheels
          path: _registrar-wheels
          if-no-files-found: error
          retention-days: 1
  register:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Require actual reviewed registrar handoff and complete source dependencies
        run: |
          git ls-files --error-unmatch certification/agent-e2e/runtime-registration-handoff.json
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: registrar-reviewed-wheels
          path: _registrar-wheels
      - name: Install only reviewed offline wheels before AWS authentication
        run: |
          python -m pip install --no-index --no-cache-dir --require-hashes --only-binary=:all: --find-links _registrar-wheels -r certification/hosted-pilot/controller/requirements.txt
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AGENT_E2E_DISPATCH_ROLE_ARN }}
          aws-region: us-east-1
          allowed-account-ids: '585192672263'
          role-session-name: pilot-register-${{ github.run_id }}
      - name: Claim once and observe only original private registration execution
        run: |
          set -euo pipefail
          umask 077
          python tools/hosted_pilot/runtime_registration_dispatch.py \
            --output "$RUNNER_TEMP/runtime-registration-outcome.json"
      - name: Retain original launch and stopped-task metadata including unknown outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-pilot-runtime-registration-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runtime-registration-outcome.json
          if-no-files-found: error
          retention-days: 90
