# Release gate (i) — upgrade. Is upgrading from the previous platform release to the candidate safe?
#
# Two layers:
#   static-compat  Decidable now (tools/check_upgrade.py, unit-tested): the candidate must not strand any
#                  client the PRIOR release shipped (compat-matrix), and its DB schema must be forward-only.
#   kind-upgrade   The real seed -> apply -> migrate -> health smoke, reusing the honua-helm
#                  install -> upgrade -> rollback pattern (honua-helm CI `install-upgrade-rollback-smoke`):
#                  a kind cluster + PostGIS + Redis, `helm install` the honua-2026.1 image, run the real
#                  e2e seeder, `helm upgrade` to an immutable post-106 image, assert the migration journal
#                  advanced and seed rows survived, then `helm rollback` and query those rows through the
#                  prior image. That last query is the expand-contract proof.
#
# The prior release's manifest/image is read from the latest `honua-*` GitHub Release (created by
# promote); until one exists the cross-release half is BLOCKED (never a fake green). The kind smoke
# SELF-SKIPS cleanly (blocked, exit 0) when the helm chart or the server image can't be reached, so a
# no-creds local cut still runs the static layer. enforcement=strict promotes blocked -> fail.

name: gate-upgrade
run-name: "gate-upgrade ${{ inputs.platform_label }} (${{ inputs.enforcement }})"

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      platform_label: { required: false, type: string, default: "dev-local" }
      enforcement:    { required: false, type: choice, options: [bootstrap, strict], default: bootstrap }
  workflow_call:
    inputs:
      platform_label: { required: false, type: string, default: "dev-local" }
      enforcement:    { required: false, type: string, default: bootstrap }
    secrets:
      RELEASE_GH_TOKEN: { required: false }
    outputs:
      overall_status:
        description: "pass | fail | blocked"
        value: ${{ jobs.report.outputs.overall_status }}

permissions:
  contents: read
  packages: read

env:
  # First-release upgrade fixture. honua-2026.1 is schema 106; this immutable image is built from
  # honua-server 52a56a19a266935fccc79312708b469e92ee3cbe and contains migration 107.
  UPGRADE_CANDIDATE_IMAGE: ghcr.io/honua-io/honua-server:nightly-aot-52a56a1
  UPGRADE_CANDIDATE_SCHEMA_FLOOR: "107"

concurrency:
  group: gate-upgrade-${{ github.ref }}-${{ inputs.platform_label }}
  cancel-in-progress: true

jobs:
  # ── static: compat-matrix + forward-only schema (decidable now, unit-tested) ─────────────────────
  static-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" pytest

      - name: Self-test the upgrade logic
        run: python -m pytest tools/test_slo_upgrade.py -q -k upgrade

      - name: Fetch the previous platform release's manifest
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          PREV="$(gh release list --repo "${{ github.repository }}" --limit 30 \
                  --json tagName --jq '[.[]|select(.tagName|startswith("honua-"))][0].tagName' 2>/dev/null || true)"
          if [ -n "$PREV" ] && gh release download "$PREV" --repo "${{ github.repository }}" \
               --pattern 'finalized-manifest.yaml' --dir prior >/tmp/dl.log 2>&1; then
            echo "prev=$PREV" >> "$GITHUB_OUTPUT"
            echo "found prior release: $PREV"
          else
            echo "prev=" >> "$GITHUB_OUTPUT"
            echo "no prior platform release (honua-*) to upgrade from yet"
          fi

      - name: Evaluate upgrade compatibility
        id: eval
        run: |
          set -uo pipefail
          ENF='${{ inputs.enforcement }}'
          if [ -z "${{ steps.prior.outputs.prev }}" ]; then
            # FIRST PLATFORM RELEASE. No honua-* release exists, so there is no upgrade path in
            # existence to certify — not an unverified one, a non-existent one. Reporting `blocked`
            # here made the first cut unpromotable by construction: finalize_release refuses any
            # blocked gate, and this branch can only be true before the first tag, so nothing anyone
            # did could ever clear it.
            #
            # This is SELF-LIMITING and that is what makes it safe: the moment any honua-* release is
            # tagged, `prev` is non-empty forever and this branch can never be taken again. Every
            # subsequent cut runs the real prior-vs-candidate comparison below and must pass it.
            STATUS=pass; WHY="first platform release — no prior honua-* release exists, so there is no upgrade path to certify (self-limiting: the next cut compares against this one)"; RC=0
          elif [ "$ENF" = "strict" ]; then
            python tools/check_upgrade.py --prior-manifest prior/finalized-manifest.yaml --require-real; RC=$?
            if [ "$RC" = "0" ]; then STATUS=pass; else STATUS=fail; fi; WHY="see log"
          else
            python tools/check_upgrade.py --prior-manifest prior/finalized-manifest.yaml; RC=$?
            if [ "$RC" = "0" ]; then STATUS=pass; else STATUS=fail; fi; WHY="see log"
          fi
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: upgrade-static-compat
          status: ${{ env.status || 'fail' }}
          source: manifest
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}
          prefix: upg-

  # ── kind smoke: seed prior schema -> helm upgrade to candidate -> health -> rollback ─────────────
  kind-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.14.4"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0"

      - name: Resolve candidate + prior server images
        id: images
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -uo pipefail
          CAND="$UPGRADE_CANDIDATE_IMAGE"
          echo "candidate=$CAND" >> "$GITHUB_OUTPUT"
          # This is deliberately the exact first-release prerelease, not "latest honua-*" and never
          # a same-image fallback. A missing baseline is BLOCKED/FAIL under strict enforcement.
          PRIOR=""
          if gh release download honua-2026.1 --repo "${{ github.repository }}" \
               --pattern 'finalized-manifest.yaml' --dir _prior >/dev/null 2>&1; then
            PRIOR="$(python -c "import yaml;print((yaml.safe_load(open('_prior/finalized-manifest.yaml')).get('components',{}).get('honua-server',{}) or {}).get('image','') or '')")"
          fi
          echo "prior=$PRIOR" >> "$GITHUB_OUTPUT"
          CROSS="$([ -n "$PRIOR" ] && [ "$PRIOR" != "$CAND" ] && echo yes || echo no)"
          echo "cross_release=$CROSS" >> "$GITHUB_OUTPUT"
          echo "candidate=$CAND prior=$PRIOR cross_release=$CROSS"

      - name: Checkout honua-helm chart
        id: chart
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-helm
          path: _honua-helm
          token: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        continue-on-error: true

      - name: Pre-pull images (separates infra-absence=blocked from real upgrade failure=fail)
        id: pull
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -uo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u honua --password-stdin >/dev/null 2>&1 || true
          OK=1
          for IMG in "${{ steps.images.outputs.prior }}" "${{ steps.images.outputs.candidate }}"; do
            [ -n "$IMG" ] && docker pull "$IMG" >/tmp/pull.log 2>&1 || { OK=0; echo "cannot pull $IMG"; tail -n 3 /tmp/pull.log || true; }
          done
          echo "pullable=$OK" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        if: steps.chart.outcome == 'success' && steps.pull.outputs.pullable == '1'
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: honua-upgrade

      - name: Seed prior schema -> upgrade to candidate -> health -> rollback
        id: smoke
        if: always()
        env:
          PRIOR: ${{ steps.images.outputs.prior }}
          CAND: ${{ steps.images.outputs.candidate }}
          ENF: ${{ inputs.enforcement }}
          CROSS: ${{ steps.images.outputs.cross_release }}
        run: |
          set -uo pipefail
          STATUS=blocked; WHY=""
          if [ "${{ steps.chart.outcome }}" != "success" ]; then
            STATUS=blocked; WHY="honua-helm chart not reachable (no RELEASE_GH_TOKEN?) — kind smoke self-skipped"
          elif [ "${{ steps.pull.outputs.pullable }}" != "1" ]; then
            STATUS=blocked; WHY="server image(s) not pullable (private/unpublished) — kind smoke self-skipped"
          elif [ "$CROSS" = "no" ]; then
            STATUS=blocked; WHY="honua-2026.1 baseline image is missing or equals the migration candidate — real upgrade cannot run"
          else
            CHART="$(dirname "$(find _honua-helm -name Chart.yaml | head -n1)")"
            NS=honua-upgrade
            kubectl create namespace "$NS" || true
            # PostGIS + Redis (persistent backing so the schema seeded pre-upgrade survives the upgrade).
            kubectl apply -n "$NS" -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: honua-postgis, labels: { app.kubernetes.io/name: honua-postgis } }
          spec:
            replicas: 1
            selector: { matchLabels: { app.kubernetes.io/name: honua-postgis } }
            template:
              metadata: { labels: { app.kubernetes.io/name: honua-postgis } }
              spec:
                containers:
                  - name: postgis
                    image: postgis/postgis:16-3.4-alpine
                    ports: [ { containerPort: 5432 } ]
                    env:
                      - { name: POSTGRES_USER, value: honua }
                      - { name: POSTGRES_PASSWORD, value: honua }
                      - { name: POSTGRES_DB, value: honua }
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: honua-postgis }
          spec:
            selector: { app.kubernetes.io/name: honua-postgis }
            ports: [ { name: postgresql, port: 5432, targetPort: 5432 } ]
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: honua-redis, labels: { app.kubernetes.io/name: honua-redis } }
          spec:
            replicas: 1
            selector: { matchLabels: { app.kubernetes.io/name: honua-redis } }
            template:
              metadata: { labels: { app.kubernetes.io/name: honua-redis } }
              spec:
                containers:
                  - name: redis
                    image: redis:7.2-alpine
                    ports: [ { containerPort: 6379 } ]
                    readinessProbe:
                      exec: { command: [redis-cli, ping] }
                      initialDelaySeconds: 2
                      periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: honua-redis }
          spec:
            selector: { app.kubernetes.io/name: honua-redis }
            ports: [ { name: redis, port: 6379, targetPort: 6379 } ]
          YAML
            kubectl rollout status deployment/honua-postgis -n "$NS" --timeout=180s || true
            kubectl rollout status deployment/honua-redis -n "$NS" --timeout=180s || true
            helm dependency build "$CHART" || helm dependency update "$CHART" || true

            # Load images into kind so the cluster doesn't need registry creds at pod-pull time.
            kind load docker-image "$PRIOR" --name honua-upgrade || true
            [ "$CAND" != "$PRIOR" ] && kind load docker-image "$CAND" --name honua-upgrade || true

            COMMON=(--namespace "$NS" --wait --timeout 12m
                    --set postgresql.enabled=false
                    --set redis.enabled=false
                    --set 'secret.env.ConnectionStrings__DefaultConnection=Host=honua-postgis;Port=5432;Database=honua;Username=honua;Password=honua'
                    --set 'secret.env.ConnectionStrings__redis=honua-redis:6379'
                    --set 'secret.env.HONUA_ADMIN_PASSWORD=UpgradeCiAdmin!2026'
                    --set 'secret.env.Security__ConnectionEncryption__MasterKey=upgrade-kind-master-key-2026-rc2-0001'
                    --set image.pullPolicy=IfNotPresent)

            db_query() {
              kubectl exec -n "$NS" deployment/honua-postgis -- \
                env PGPASSWORD=honua psql -U honua -d honua -Atc "$1"
            }
            start_server_forward() {
              SERVER_SERVICE="$(kubectl get service -n "$NS" \
                -l app.kubernetes.io/instance=honua \
                -o jsonpath='{.items[0].metadata.name}')"
              [ -n "$SERVER_SERVICE" ] || return 1
              kubectl port-forward -n "$NS" "service/$SERVER_SERVICE" 18080:80 > /tmp/port-forward.log 2>&1 &
              PF_PID=$!
              for _ in $(seq 1 60); do
                curl -fsS http://127.0.0.1:18080/healthz/ready >/dev/null && return 0
                sleep 2
              done
              return 1
            }
            stop_server_forward() {
              [ -z "${PF_PID:-}" ] || kill "$PF_PID" 2>/dev/null || true
              PF_PID=""
            }

            set -x
            # 1) INSTALL prior — startup migrations seed the PRIOR schema.
            if helm install honua "$CHART" --set image.repository="${PRIOR%:*}" --set image.tag="${PRIOR##*:}" "${COMMON[@]}" >/tmp/install.log 2>&1; then
              BEFORE_VERSIONS="$(db_query 'SELECT count(*) FROM public.schema_versions;' 2>/tmp/before-db.log || true)"
              if start_server_forward && E2E_BASE=http://127.0.0.1:18080 \
                   E2E_API_KEY='UpgradeCiAdmin!2026' E2E_DB_HOST=honua-postgis \
                   E2E_PSQL="kubectl exec -i -n $NS deployment/honua-postgis -- env PGPASSWORD=honua psql -U honua -d honua" \
                   E2E_OUT=/tmp/upg-seed bash e2e/harness/seed/seed.sh >/tmp/seed.log 2>&1; then
                stop_server_forward
                SRC_ID="$(jq -r '.slice1.e2e_src_fs.layerId' /tmp/upg-seed/seed-manifest.json)"
                BEFORE_SRC="$(db_query 'SELECT count(*) FROM honua_data.e2e_src_fs;')"
                BEFORE_ZONING="$(db_query 'SELECT count(*) FROM honua_data.maui_zoning;')"
                if ! [[ "$SRC_ID" =~ ^[0-9]+$ ]]; then
                  STATUS=fail; WHY="real e2e seed did not publish the e2e_src_fs layer (layerId=$SRC_ID)"
                fi
              else
                stop_server_forward
                STATUS=fail; WHY="honua-2026.1 installed but the real e2e seed failed"; tail -n 80 /tmp/seed.log || true
              fi
              # 2) UPGRADE to candidate — then prove journal advancement and seed survival.
              if [ "$STATUS" != "fail" ] && helm upgrade honua "$CHART" --set image.repository="${CAND%:*}" --set image.tag="${CAND##*:}" "${COMMON[@]}" >/tmp/upgrade.log 2>&1; then
                helm test honua -n "$NS" --timeout 6m >/tmp/test.log 2>&1 && HT=ok || HT=failed
                AFTER_VERSIONS="$(db_query 'SELECT count(*) FROM public.schema_versions;' 2>/tmp/after-db.log || true)"
                CANDIDATE_SCHEMA="$(db_query "SELECT COALESCE(max(substring(scriptname from '([0-9]{3})_')::integer), 0) FROM public.schema_versions;" 2>/tmp/schema-floor.log || true)"
                AFTER_SRC="$(db_query 'SELECT count(*) FROM honua_data.e2e_src_fs;' || true)"
                AFTER_ZONING="$(db_query 'SELECT count(*) FROM honua_data.maui_zoning;' || true)"
                if ! [[ "$BEFORE_VERSIONS" =~ ^[0-9]+$ && "$AFTER_VERSIONS" =~ ^[0-9]+$ && "$AFTER_VERSIONS" -gt "$BEFORE_VERSIONS" ]]; then
                  STATUS=fail; WHY="candidate did not advance public.schema_versions ($BEFORE_VERSIONS -> $AFTER_VERSIONS)"
                elif ! [[ "$CANDIDATE_SCHEMA" =~ ^[0-9]+$ && "$CANDIDATE_SCHEMA" -ge "$UPGRADE_CANDIDATE_SCHEMA_FLOOR" ]]; then
                  STATUS=fail; WHY="candidate schema $CANDIDATE_SCHEMA is below required floor $UPGRADE_CANDIDATE_SCHEMA_FLOOR"
                elif [ "$BEFORE_SRC:$BEFORE_ZONING" != "2:12" ] || [ "$AFTER_SRC:$AFTER_ZONING" != "$BEFORE_SRC:$BEFORE_ZONING" ]; then
                  STATUS=fail; WHY="seeded rows did not survive upgrade (source $BEFORE_SRC->$AFTER_SRC, zoning $BEFORE_ZONING->$AFTER_ZONING)"
                # 3) ROLLBACK IMAGE only; retain migrated DB and query seed data through the prior app.
                elif helm rollback honua 1 -n "$NS" --wait --timeout 12m >/tmp/rollback.log 2>&1; then
                  if [ "$HT" = "ok" ] && start_server_forward && \
                     curl -fsS -H 'X-API-Key: UpgradeCiAdmin!2026' \
                       "http://127.0.0.1:18080/rest/services/e2e/FeatureServer/$SRC_ID/query?where=1%3D1&returnCountOnly=true&f=json" \
                       -o /tmp/rollback-query.json && [ "$(jq -r '.count // -1' /tmp/rollback-query.json)" = "2" ]; then
                    stop_server_forward
                    STATUS=pass; WHY="schema_versions advanced $BEFORE_VERSIONS->$AFTER_VERSIONS (schema $CANDIDATE_SCHEMA); seeded rows survived; prior image served 2 seeded features against migrated schema"
                  else
                    stop_server_forward
                    STATUS=fail; WHY="prior image rollback did not serve seeded data against the migrated schema"; tail -n 40 /tmp/test.log || true
                  fi
                else
                  STATUS=fail; WHY="rollback to the prior revision failed"; tail -n 40 /tmp/rollback.log || true
                fi
              elif [ "$STATUS" != "fail" ]; then
                kubectl logs -n "$NS" -l app.kubernetes.io/instance=honua \
                  --all-containers --prefix --tail=500 > /tmp/candidate.log 2>&1 || true
                kubectl logs -n "$NS" -l app.kubernetes.io/instance=honua \
                  --all-containers --prefix --previous --tail=500 > /tmp/candidate-previous.log 2>&1 || true
                STATUS=fail; WHY="helm upgrade to the candidate failed (forward migration / readiness)"; tail -n 60 /tmp/upgrade.log || true
              fi
            else
              STATUS=fail; WHY="helm install of the honua-2026.1 prior image failed"; tail -n 60 /tmp/install.log || true
            fi
            set +x
          fi
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"
          echo "$WHY"

      - name: Capture evidence
        if: always()
        run: |
          mkdir -p /tmp/upg
          helm history honua -n honua-upgrade > /tmp/upg/history.txt 2>&1 || true
          kubectl get pods -n honua-upgrade -o wide > /tmp/upg/pods.txt 2>&1 || true
          kubectl get events -n honua-upgrade --sort-by=.lastTimestamp > /tmp/upg/events.txt 2>&1 || true
          for phase in install seed upgrade test rollback before-db after-db schema-floor port-forward rollback-query candidate candidate-previous; do
            if [ -f "/tmp/${phase}.log" ]; then
              cp "/tmp/${phase}.log" "/tmp/upg/${phase}.log"
            fi
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-kind-evidence
          path: /tmp/upg
          if-no-files-found: warn

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: upgrade-kind-smoke
          status: ${{ env.status || 'fail' }}
          source: kind
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}
          prefix: upg-

  # ── report — aggregate the upg- fragments; fail per enforcement ──────────────────────────────────
  report:
    needs: [static-compat, kind-upgrade]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.assemble.outputs.overall_status }}
    steps:
      - name: Download fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: upg-gate-fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble gate-report.json
        id: assemble
        env:
          PLATFORM_LABEL: ${{ inputs.platform_label }}
          ENFORCEMENT: ${{ inputs.enforcement }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          jq -s \
            --arg label "$PLATFORM_LABEL" --arg enf "$ENFORCEMENT" \
            --arg ts "$(date -u +%FT%TZ)" --arg run "$RUN_URL" '
            def decided(enf):
              if .status=="pass" then "pass"
              # skipped = a layer that honestly cannot run in this context (e.g. no prior release to
              # upgrade from in a dry run). Tolerated under bootstrap (does not reduce the gate); a real
              # cut (strict) forbids it. Handled explicitly so a skipped fragment is never mis-scored as
              # a hard fail by the else-branch.
              elif .status=="skipped" then (if enf=="strict" then "fail" else "skipped" end)
              elif .status=="blocked" then (if enf=="strict" then "fail" else "blocked" end)
              else "fail" end;
            ( [ .[] | . + {decided: decided($enf)} ] ) as $g
            | { gate:"upgrade", platform_label:$label, enforcement:$enf, generatedAt:$ts, evidence_url:$run,
                gates:$g,
                summary:{ pass:([$g[]|select(.decided=="pass")]|length),
                          skipped:([$g[]|select(.decided=="skipped")]|length),
                          blocked:([$g[]|select(.decided=="blocked")]|length),
                          fail:([$g[]|select(.decided=="fail")]|length) },
                overallStatus:( if any($g[];.decided=="fail") then "fail"
                                elif any($g[];.decided=="blocked") then "blocked" else "pass" end) }' \
            fragments/*.json > out/gate-report.json
          cat out/gate-report.json
          OVERALL=$(jq -r .overallStatus out/gate-report.json)
          echo "overall_status=$OVERALL" >> "$GITHUB_OUTPUT"
          {
            echo "## Upgrade gate — $OVERALL";
            echo "| layer | status | why |"; echo "|---|---|---|";
            jq -r '.gates[] | "| \(.gate) | \(.decided) | \(.why) |"' out/gate-report.json;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-gate-report
          path: out/gate-report.json

      - name: Enforce
        run: |
          set -e
          OVERALL='${{ steps.assemble.outputs.overall_status }}'
          echo "upgrade gate: $OVERALL (enforcement=${{ inputs.enforcement }})"
          [ "$OVERALL" = "fail" ] && { echo "::error::upgrade gate FAILED"; exit 1; } || echo "not red"
