# Release gate (i) — upgrade. Is upgrading from the previous platform release to the candidate safe?
#
# Two layers:
#   static-compat  Decidable now (tools/check_upgrade.py, unit-tested): the candidate must not strand any
#                  client the PRIOR release shipped (compat-matrix), and its DB schema must be forward-only.
#   kind-upgrade   The real seed -> apply -> migrate -> health smoke, reusing the honua-helm
#                  install -> upgrade -> rollback pattern (honua-helm CI `install-upgrade-rollback-smoke`):
#                  a kind cluster + PostGIS + Redis, `helm install` the prior release (or immutable
#                  first-cut schema-106 baseline), run the real e2e seeder, `helm upgrade` to the
#                  manifest candidate, assert the migration journal
#                  advanced and seed rows survived, then `helm rollback` and query those rows through the
#                  prior image. That last query is the expand-contract proof.
#
# The prior release's manifest/image is read from the latest promoted `honua-*` GitHub Release (not a
# pre-release, signed platform lock attached — tools/check_upgrade.py prior_platform_release, ruling
# R26); until one exists the signed-lock kind smoke is blocked. TRUNK-CANDIDATE FALLBACK: while it is
# blocked, the same install -> seed -> upgrade -> verify -> rollback -> prior-serves sequence runs on a
# substitute pair (tools/upgrade_trunk_pair.py: the previous honua-server pin in this manifest's trunk
# history, or the honua-2026.1 pre-release server, each installed with its own pinned chart, -> the
# manifest candidate) under the separate
# fragment upgrade-kind-trunk-candidate-<scenario>. Its receipt says `priorSource: trunk-candidate`,
# `certifiedReleasePair: false`; the signed-lock fragment stays blocked. A trunk-candidate FAIL
# (migrations did not advance, seeded rows lost, prior image cannot serve after rollback) fails
# the gate. The kind smoke
# SELF-SKIPS cleanly (blocked, exit 0) when the helm chart or the server image can't be reached, so a
# no-creds local cut still runs the static layer. enforcement=strict promotes blocked -> fail.
#
# Trigger scope: static-compat is the FAST, decidable-now half (manifest diff + unit-tested logic, no
# cluster) so it runs on pull_request too, scoped to the files it actually evaluates — a candidate
# manifest change that strands an old client or regresses the DB schema floor is this PR's fault and
# should redden it before merge, not wait for the nightly/release lane. kind-upgrade is the expensive
# real seed/upgrade/rollback smoke against a live cluster; it stays release-train/nightly/dispatch-only
# (skipped on pull_request) per the "fast checks per PR, expensive cells in targeted lanes" contract.

name: gate-upgrade
run-name: "gate-upgrade ${{ inputs.platform_label }} (${{ inputs.enforcement }})"

on:
  pull_request:
    paths:
      - "platform-manifest.yaml"
      - "compatibility-matrix.yaml"
      - "tools/check_upgrade.py"
      - "tools/test_check_upgrade.py"
      - "tools/semver.py"
      - "tools/test_slo_upgrade.py"
      - "tools/upgrade_recovery.py"
      - "tools/test_upgrade_recovery.py"
      - "tools/upgrade_lock_binding.py"
      - "tools/test_upgrade_lock_binding.py"
      - "tools/inject_upgrade_failure.py"
      - "tools/test_inject_upgrade_failure.py"
      - "tools/upgrade_trunk_pair.py"
      - "tools/test_upgrade_trunk_pair.py"
      - ".github/workflows/gate-upgrade.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      platform_label: { required: false, type: string, default: "dev-local" }
      enforcement:    { required: false, type: choice, options: [bootstrap, strict], default: bootstrap }
      failure_scenario:
        description: "Deterministic recovery game day (rollback-failure passes when it is correctly classified rollback-failed with evidence + operator instructions; it fails only if the classifier is wrong)"
        required: false
        type: choice
        options: [normal, post-migration-readiness, bad-config, migration-boundary, rollback-failure]
        default: normal
      trunk_prior:
        description: "Prior image for the trunk-candidate fallback when no signed prior lock exists (never a certified release pair)"
        required: false
        type: choice
        options: [previous-pin, honua-2026.1]
        default: previous-pin
  workflow_call:
    inputs:
      candidate_ref: { required: false, type: string, default: "" }
      platform_label: { required: false, type: string, default: "dev-local" }
      enforcement:    { required: false, type: string, default: bootstrap }
      failure_scenario: { required: false, type: string, default: normal }
      trunk_prior: { required: false, type: string, default: previous-pin }
    secrets:
      RELEASE_GH_TOKEN: { required: false }
    outputs:
      overall_status:
        description: "pass | fail | blocked"
        value: ${{ jobs.report.outputs.overall_status }}

permissions:
  contents: read
  packages: read
  id-token: write
  attestations: write

env:
  # Immutable schema-106 baseline for the first platform cut. After the first promotion, the prior
  # image always comes from the latest honua-* release manifest instead.
  FIRST_RELEASE_BASELINE_IMAGE: ghcr.io/honua-io/honua-server:nightly-aot-ac30266

concurrency:
  group: gate-upgrade-${{ github.ref }}-${{ inputs.platform_label }}
  cancel-in-progress: true

jobs:
  # ── static: compat-matrix + forward-only schema (decidable now, unit-tested) ─────────────────────
  static-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" pytest

      - name: Self-test the upgrade logic
        run: |
          set -euo pipefail
          python -m pytest tools/test_slo_upgrade.py tools/test_upgrade_recovery.py tools/test_upgrade_lock_binding.py -q -k "upgrade or recovery or lock_binding"
          python -m pytest tools/test_check_upgrade.py -q
          python -m pytest tools/test_upgrade_trunk_pair.py -q

      - name: Fetch the previous platform release's manifest
        id: prior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # R26 (#376): the prior release is a promoted, non-pre-release honua-* release carrying a
          # signed platform lock — the same resolver the rollback target uses. Pre-release snapshots
          # (the 2026-08-20 honua-2026.1) never count. A failed lookup or download is not "no prior
          # release": it blocks instead of taking the first-release basis.
          if ! PREV="$(python tools/check_upgrade.py --resolve-prior-release "${{ github.repository }}")"; then
            echo "lookup=failed" >> "$GITHUB_OUTPUT"
            echo "prev=" >> "$GITHUB_OUTPUT"
          elif [ -z "$PREV" ]; then
            echo "prev=" >> "$GITHUB_OUTPUT"
            echo "no prior platform release (promoted honua-* with a signed lock) to upgrade from yet"
          elif gh release download "$PREV" --repo "${{ github.repository }}" \
               --pattern 'finalized-manifest.yaml' --dir prior >/tmp/dl.log 2>&1; then
            echo "prev=$PREV" >> "$GITHUB_OUTPUT"
            echo "found prior release: $PREV"
          else
            cat /tmp/dl.log
            echo "lookup=failed" >> "$GITHUB_OUTPUT"
            echo "prev=" >> "$GITHUB_OUTPUT"
          fi

      - name: Evaluate upgrade compatibility
        id: eval
        run: |
          set -uo pipefail
          ENF='${{ inputs.enforcement }}'
          if [ "${{ steps.prior.outputs.lookup }}" = "failed" ]; then
            STATUS=blocked; WHY="prior platform release lookup or manifest download failed — not evidence that no prior release exists"; RC=1
          elif [ -z "${{ steps.prior.outputs.prev }}" ]; then
            # FIRST PLATFORM RELEASE (R26). No promoted honua-* release exists, so there is no upgrade path in
            # existence to certify — not an unverified one, a non-existent one. Reporting `blocked`
            # here made the first cut unpromotable by construction: finalize_release refuses any
            # blocked gate, and this branch can only be true before the first tag, so nothing anyone
            # did could ever clear it.
            #
            # This is SELF-LIMITING and that is what makes it safe: the moment promote publishes a
            # honua-* release with its signed lock, `prev` is non-empty forever and this branch can never be taken again. Every
            # subsequent cut runs the real prior-vs-candidate comparison below and must pass it.
            STATUS=pass; WHY="first platform release (R26) — no promoted honua-* release with a signed lock exists, so there is no upgrade path to certify (self-limiting: the next cut compares against this one)"; RC=0
          elif [ "$ENF" = "strict" ]; then
            python tools/check_upgrade.py --prior-manifest prior/finalized-manifest.yaml --require-real; RC=$?
            if [ "$RC" = "0" ]; then STATUS=pass; else STATUS=fail; fi; WHY="see log"
          else
            python tools/check_upgrade.py --prior-manifest prior/finalized-manifest.yaml; RC=$?
            if [ "$RC" = "0" ]; then STATUS=pass; else STATUS=fail; fi; WHY="see log"
          fi
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: upgrade-static-compat
          status: ${{ env.status || 'fail' }}
          source: manifest
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}
          prefix: upg-

  # ── kind smoke: seed prior schema -> helm upgrade to candidate -> health -> rollback ─────────────
  # Expensive real layer: release-train/nightly/dispatch only (never pull_request — see trigger note).
  kind-upgrade:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(github.event_name == 'schedule' && '["normal","post-migration-readiness","bad-config","migration-boundary","rollback-failure"]' || format('["{0}"]', inputs.failure_scenario || 'normal')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The trunk-candidate fallback reads the previous honua-server pin from manifest history.
          fetch-depth: 0
      - name: Use the immutable candidate inputs
        if: ${{ inputs.candidate_ref }}
        uses: ./.github/actions/candidate-input
        with:
          candidate_ref: ${{ inputs.candidate_ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v3.14.4"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install "pyyaml>=6.0" "jsonschema>=4.23"

      - name: Resolve exact signed locks, images, schema, and chart package
        id: images
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -uo pipefail
          mkdir -p _locks
          VERIFIED=0
          # Same R26 resolver as static-compat; an empty or failed lookup leaves VERIFIED=0 (blocked).
          PREV="$(python tools/check_upgrade.py --resolve-prior-release "${{ github.repository }}" || true)"
          if [ -n "$PREV" ] && gh release download "$PREV" --repo "${{ github.repository }}" \
               --pattern 'platform-lock.json' --dir _locks/prior >/tmp/prior-lock-download.log 2>&1 \
               && [ -f platform-lock.json ]; then
            cp platform-lock.json _locks/candidate.json
            cp _locks/prior/platform-lock.json _locks/prior.json
            if python tools/validate_platform_lock.py _locks/candidate.json \
               && python tools/validate_platform_lock.py _locks/prior.json \
               && gh attestation verify _locks/candidate.json --repo "${{ github.repository }}" >/tmp/candidate-lock-verify.log 2>&1 \
               && gh attestation verify _locks/prior.json --repo "${{ github.repository }}" >/tmp/prior-lock-verify.log 2>&1; then
              VERIFIED=1
            fi
          fi
          if [ "$VERIFIED" = 1 ]; then
            eval "$(python - <<'PY'
          import shlex, sys
          sys.path.insert(0, 'tools')
          import upgrade_lock_binding as b
          a, z = b.load(__import__('pathlib').Path('_locks/prior.json')), b.load(__import__('pathlib').Path('_locks/candidate.json'))
          manifest_digest = b.bytes_digest(__import__('pathlib').Path('platform-manifest.yaml'))
          matrix_digest = b.bytes_digest(__import__('pathlib').Path('compatibility-matrix.yaml'))
          if z['sourceInputs']['platformManifest']['sha256'] != manifest_digest or z['sourceInputs']['compatibilityMatrix']['sha256'] != matrix_digest:
              raise SystemExit('candidate lock source-input bytes do not match this checkout')
          prior, candidate = b.image_binding(a, 'amd64'), b.image_binding(z, 'amd64')
          prior_chart, candidate_chart = b.chart_binding(a), b.chart_binding(z)
          values = {'PRIOR':prior['reference'], 'CAND':candidate['reference'], 'CANDIDATE_SCHEMA':z['components']['honua-server']['schemaVersions']['database'],
                    'PRIOR_SOURCE_REVISION':prior['sourceRevision'], 'CANDIDATE_SOURCE_REVISION':candidate['sourceRevision'],
                    'DECLARED_JOURNAL_SHA':z['components']['honua-server']['migrationJournalSha256'],
                    'PRIOR_CHART_COORDINATE':prior_chart['coordinate'], 'PRIOR_CHART_VERSION':prior_chart['version'], 'PRIOR_CHART_DIGEST':prior_chart['digest'], 'PRIOR_CHART_SHA256':prior_chart['sha256'],
                    'CANDIDATE_CHART_COORDINATE':candidate_chart['coordinate'], 'CANDIDATE_CHART_VERSION':candidate_chart['version'], 'CANDIDATE_CHART_DIGEST':candidate_chart['digest'], 'CANDIDATE_CHART_SHA256':candidate_chart['sha256'],
                    'PRIOR_LOCK_DIGEST':b.bytes_digest(__import__('pathlib').Path('_locks/prior.json')), 'CANDIDATE_LOCK_DIGEST':b.bytes_digest(__import__('pathlib').Path('_locks/candidate.json'))}
          print(';'.join(f'{key}={shlex.quote(str(value))}' for key,value in values.items()))
          PY
            )" || VERIFIED=0
          fi
          echo "candidate=${CAND:-}" >> "$GITHUB_OUTPUT"
          echo "prior=${PRIOR:-}" >> "$GITHUB_OUTPUT"
          echo "candidate_schema=${CANDIDATE_SCHEMA:-}" >> "$GITHUB_OUTPUT"
          echo "declared_journal_sha=${DECLARED_JOURNAL_SHA:-}" >> "$GITHUB_OUTPUT"
          echo "prior_source_revision=${PRIOR_SOURCE_REVISION:-}" >> "$GITHUB_OUTPUT"
          echo "candidate_source_revision=${CANDIDATE_SOURCE_REVISION:-}" >> "$GITHUB_OUTPUT"
          for PHASE in PRIOR CANDIDATE; do
            phase="$(printf '%s' "$PHASE" | tr '[:upper:]' '[:lower:]')"
            eval "echo ${phase}_chart_coordinate=\${${PHASE}_CHART_COORDINATE:-}"
            eval "echo ${phase}_chart_version=\${${PHASE}_CHART_VERSION:-}"
            eval "echo ${phase}_chart_digest=\${${PHASE}_CHART_DIGEST:-}"
            eval "echo ${phase}_chart_sha256=\${${PHASE}_CHART_SHA256:-}"
          done >> "$GITHUB_OUTPUT"
          echo "prior_lock_digest=${PRIOR_LOCK_DIGEST:-}" >> "$GITHUB_OUTPUT"
          echo "candidate_lock_digest=${CANDIDATE_LOCK_DIGEST:-}" >> "$GITHUB_OUTPUT"
          echo "verified=$VERIFIED" >> "$GITHUB_OUTPUT"
          CROSS="$([ "$VERIFIED" = 1 ] && [ "$PRIOR" != "$CAND" ] && echo yes || echo no)"
          echo "cross_release=$CROSS" >> "$GITHUB_OUTPUT"
          echo "candidate=${CAND:-} prior=${PRIOR:-} signed-locks=$VERIFIED cross_release=$CROSS"

      # No signed prior lock: pick the substitute pair so the real lifecycle still executes. This is
      # never a certified release pair and never clears the signed-lock fragment (see header).
      - name: Resolve the trunk-candidate fallback pair
        id: fallback
        if: steps.images.outputs.verified != '1'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
          TRUNK_PRIOR: ${{ inputs.trunk_prior || 'previous-pin' }}
        run: |
          set -uo pipefail
          ARGS=()
          if [ "$TRUNK_PRIOR" = honua-2026.1 ]; then
            gh release download honua-2026.1 --repo "${{ github.repository }}" \
              --pattern 'finalized-manifest.yaml' --dir _trunk_prior >/tmp/trunk-prior-download.log 2>&1 || cat /tmp/trunk-prior-download.log
            ARGS=(--prior-manifest _trunk_prior/finalized-manifest.yaml --prior-label "honua-2026.1 pre-release snapshot (not a promoted platform release)")
          fi
          python tools/upgrade_trunk_pair.py resolve --candidate-manifest platform-manifest.yaml "${ARGS[@]}" | tee /tmp/trunk-pair.env
          cat /tmp/trunk-pair.env >> "$GITHUB_OUTPUT"
          python - <<'PY' > /tmp/trunk-pair.json
          import json
          print(json.dumps(dict(line.rstrip("\n").split("=", 1) for line in open("/tmp/trunk-pair.env") if "=" in line)))
          PY

      - name: Fetch the manifest-pinned chart source (trunk-candidate fallback)
        id: trunk_chart
        if: steps.fallback.outputs.ready == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-helm
          ref: ${{ steps.fallback.outputs.helm_sha }}
          path: _chart/trunk
          persist-credentials: false

      - name: Fetch the prior's manifest-pinned chart source (trunk-candidate fallback)
        id: trunk_prior_chart
        if: steps.fallback.outputs.ready == '1'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: honua-io/honua-helm
          ref: ${{ steps.fallback.outputs.prior_helm_sha }}
          path: _chart/trunk-prior
          persist-credentials: false

      - name: Pull lock-bound Helm chart packages
        id: chart
        if: steps.images.outputs.verified == '1'
        env:
          PRIOR_CHART_COORDINATE: ${{ steps.images.outputs.prior_chart_coordinate }}
          PRIOR_CHART_VERSION: ${{ steps.images.outputs.prior_chart_version }}
          PRIOR_CHART_SHA256: ${{ steps.images.outputs.prior_chart_sha256 }}
          CANDIDATE_CHART_COORDINATE: ${{ steps.images.outputs.candidate_chart_coordinate }}
          CANDIDATE_CHART_VERSION: ${{ steps.images.outputs.candidate_chart_version }}
          CANDIDATE_CHART_SHA256: ${{ steps.images.outputs.candidate_chart_sha256 }}
        run: |
          set -euo pipefail
          for PHASE in prior candidate; do
            mkdir -p "_chart/$PHASE"
            upper="$(printf '%s' "$PHASE" | tr '[:lower:]' '[:upper:]')"
            eval "coordinate=\${${upper}_CHART_COORDINATE}"
            eval "version=\${${upper}_CHART_VERSION}"
            eval "expected=\${${upper}_CHART_SHA256}"
            helm pull "oci://$coordinate" --version "$version" --destination "_chart/$PHASE" >"/tmp/${PHASE}-chart-pull.log" 2>&1
            PACKAGE="$(find "_chart/$PHASE" -maxdepth 1 -name '*.tgz' -type f -print -quit)"
            test -n "$PACKAGE"
            test "sha256:$(sha256sum "$PACKAGE" | awk '{print $1}')" = "$expected"
            tar -xzf "$PACKAGE" -C "_chart/$PHASE"
            echo "$PHASE=$(dirname "$(find "_chart/$PHASE" -name Chart.yaml -type f -print -quit)")"
          done >> "$GITHUB_OUTPUT"

      - name: Pre-pull images (separates infra-absence=blocked from real upgrade failure=fail)
        id: pull
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN || github.token }}
        run: |
          set -uo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u honua --password-stdin >/dev/null 2>&1 || true
          OK=1
          for IMG in "${{ steps.images.outputs.prior || steps.fallback.outputs.prior }}" "${{ steps.images.outputs.candidate || steps.fallback.outputs.candidate }}"; do
            [ -n "$IMG" ] && docker pull "$IMG" >/tmp/pull.log 2>&1 || { OK=0; echo "cannot pull $IMG"; tail -n 3 /tmp/pull.log || true; }
          done
          echo "pullable=$OK" >> "$GITHUB_OUTPUT"

      - name: Create kind cluster
        if: (steps.chart.outcome == 'success' || (steps.trunk_chart.outcome == 'success' && steps.trunk_prior_chart.outcome == 'success')) && steps.pull.outputs.pullable == '1'
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: honua-upgrade

      - name: Seed prior schema -> upgrade to candidate -> health -> rollback
        id: smoke
        if: always()
        env:
          # Signed-lock values when both locks verified; otherwise the trunk-candidate fallback pair.
          # In fallback mode the *_LOCK_DIGEST values are manifest/identity digests, not lock digests.
          PRIOR: ${{ steps.images.outputs.prior || steps.fallback.outputs.prior }}
          CAND: ${{ steps.images.outputs.candidate || steps.fallback.outputs.candidate }}
          DECLARED_SCHEMA: ${{ steps.images.outputs.candidate_schema || steps.fallback.outputs.candidate_schema }}
          DECLARED_JOURNAL_SHA: ${{ steps.images.outputs.declared_journal_sha }}
          PRIOR_SOURCE_REVISION: ${{ steps.images.outputs.prior_source_revision || steps.fallback.outputs.prior_source_revision }}
          CANDIDATE_SOURCE_REVISION: ${{ steps.images.outputs.candidate_source_revision || steps.fallback.outputs.candidate_source_revision }}
          PRIOR_LOCK_DIGEST: ${{ steps.images.outputs.prior_lock_digest || steps.fallback.outputs.prior_manifest_digest }}
          CANDIDATE_LOCK_DIGEST: ${{ steps.images.outputs.candidate_lock_digest || steps.fallback.outputs.candidate_manifest_digest }}
          ENF: ${{ inputs.enforcement }}
          CROSS: ${{ steps.images.outputs.verified == '1' && steps.images.outputs.cross_release || steps.fallback.outputs.cross }}
          FAILURE_SCENARIO: ${{ matrix.scenario }}
          TRUNK_READY: ${{ steps.fallback.outputs.ready }}
          TRUNK_UNAVAILABLE_WHY: ${{ steps.fallback.outputs.why }}
          TRUNK_CHART_OUTCOME: ${{ steps.trunk_chart.outcome == 'success' && steps.trunk_prior_chart.outcome || steps.trunk_chart.outcome }}
          # Kept out of the script body: a run block containing any expression is evaluated as one
          # expression, and this one exceeds Actions' 21000-character expression limit.
          SIGNED_VERIFIED: ${{ steps.images.outputs.verified }}
          SIGNED_CHART_OUTCOME: ${{ steps.chart.outcome }}
          SIGNED_PRIOR_CHART: ${{ steps.chart.outputs.prior }}
          SIGNED_CANDIDATE_CHART: ${{ steps.chart.outputs.candidate }}
          PULLABLE: ${{ steps.pull.outputs.pullable }}
        run: |
          set -uo pipefail
          STATUS=blocked; WHY=""
          SIGNED_LOCK_WHY="exact signed prior/candidate platform locks are unavailable or invalid"
          MODE=signed-lock
          if [ "$SIGNED_VERIFIED" != 1 ] && [ "$TRUNK_READY" = 1 ]; then
            MODE=trunk-candidate
            echo "TRUNK-CANDIDATE FALLBACK: $SIGNED_LOCK_WHY; running prior-source=trunk-candidate $PRIOR -> $CAND (not a certified release pair)"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = signed-lock ] && [ "$SIGNED_VERIFIED" != 1 ]; then
            STATUS=blocked; WHY="$SIGNED_LOCK_WHY${TRUNK_UNAVAILABLE_WHY:+; $TRUNK_UNAVAILABLE_WHY}"
          elif [ "$MODE" = signed-lock ] && [ "$SIGNED_CHART_OUTCOME" != "success" ]; then
            STATUS=blocked; WHY="lock-bound honua-helm package is unavailable or its checksum mismatched"
          elif [ "$MODE" = trunk-candidate ] && [ "$TRUNK_CHART_OUTCOME" != "success" ]; then
            STATUS=blocked; WHY="manifest-pinned honua-helm chart source could not be fetched"
          elif [ "$PULLABLE" != "1" ]; then
            STATUS=blocked; WHY="server image(s) not pullable (private/unpublished) — kind smoke self-skipped"
          elif [ "$CROSS" = "no" ]; then
            STATUS=blocked; WHY="prior baseline image is missing or equals the manifest candidate — real migration upgrade cannot run"
          else
            if [ "$MODE" = trunk-candidate ]; then
              # Each side's own manifest-pinned chart source: install the prior as its manifest
              # shipped it, upgrade chart + image together, and `helm rollback` restores both.
              PRIOR_CHART="_chart/trunk-prior/honua"
              CANDIDATE_CHART="_chart/trunk/honua"
            else
              PRIOR_CHART="$SIGNED_PRIOR_CHART"
              CANDIDATE_CHART="$SIGNED_CANDIDATE_CHART"
            fi
            NS=honua-upgrade
            kubectl create namespace "$NS" || true
            # PostGIS + Redis (persistent backing so the schema seeded pre-upgrade survives the upgrade).
            kubectl apply -n "$NS" -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: honua-postgis, labels: { app.kubernetes.io/name: honua-postgis } }
          spec:
            replicas: 1
            selector: { matchLabels: { app.kubernetes.io/name: honua-postgis } }
            template:
              metadata: { labels: { app.kubernetes.io/name: honua-postgis } }
              spec:
                containers:
                  - name: postgis
                    image: postgis/postgis:16-3.4-alpine
                    ports: [ { containerPort: 5432 } ]
                    env:
                      - { name: POSTGRES_USER, value: honua }
                      - { name: POSTGRES_PASSWORD, value: honua }
                      - { name: POSTGRES_DB, value: honua }
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: honua-postgis }
          spec:
            selector: { app.kubernetes.io/name: honua-postgis }
            ports: [ { name: postgresql, port: 5432, targetPort: 5432 } ]
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata: { name: honua-redis, labels: { app.kubernetes.io/name: honua-redis } }
          spec:
            replicas: 1
            selector: { matchLabels: { app.kubernetes.io/name: honua-redis } }
            template:
              metadata: { labels: { app.kubernetes.io/name: honua-redis } }
              spec:
                containers:
                  - name: redis
                    image: redis:7.2-alpine
                    ports: [ { containerPort: 6379 } ]
                    readinessProbe:
                      exec: { command: [redis-cli, ping] }
                      initialDelaySeconds: 2
                      periodSeconds: 2
          ---
          apiVersion: v1
          kind: Service
          metadata: { name: honua-redis }
          spec:
            selector: { app.kubernetes.io/name: honua-redis }
            ports: [ { name: redis, port: 6379, targetPort: 6379 } ]
          YAML
            kubectl rollout status deployment/honua-postgis -n "$NS" --timeout=180s || true
            kubectl rollout status deployment/honua-redis -n "$NS" --timeout=180s || true
            helm dependency build "$PRIOR_CHART" || helm dependency update "$PRIOR_CHART" || true
            helm dependency build "$CANDIDATE_CHART" || helm dependency update "$CANDIDATE_CHART" || true

            # Do NOT `kind load` these digest references. kind imports a digest-only image under a
            # synthetic docker.io/library/import-<date>@sha256 name, and containerd then refuses the
            # pod with CreateContainerError "failed to check if this is a checkpoint image" (run
            # 39662331927). The pre-pull step above already proved both digests are pullable, so
            # the kind node pulls exactly those digests from the registry itself.
            for IMG in "$PRIOR" "$CAND"; do
              case "$IMG" in
                *@sha256:*) ;;
                *) kind load docker-image "$IMG" --name honua-upgrade || true ;;
              esac
            done

            # With Redis connected in Production the server enables the durable operation secret
            # channel and exits at startup without a key-ring certificate ("'Operations:SecretChannel:
            # KeyRingCertificatePath' is required", run 39664663981). Mint a per-run PKCS#12 key ring
            # (as certification/control-plane-parity does) and an audit chain key, mounted the same
            # way for install, upgrade and rollback.
            KEYRING_PASSWORD="$(openssl rand -hex 24)"; AUDIT_CHAIN_KEY="$(openssl rand -hex 32)"
            echo "::add-mask::$KEYRING_PASSWORD"; echo "::add-mask::$AUDIT_CHAIN_KEY"
            openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/keyring.key -out /tmp/keyring.crt \
              -days 2 -subj /CN=honua-upgrade-kind-keyring >/dev/null 2>&1
            openssl pkcs12 -export -inkey /tmp/keyring.key -in /tmp/keyring.crt -out /tmp/keyring.pfx \
              -passout "pass:$KEYRING_PASSWORD"
            kubectl create secret generic honua-upgrade-keyring -n "$NS" --from-file=keyring.pfx=/tmp/keyring.pfx
            cat > /tmp/upg-keyring-values.yaml <<'YAML'
          extraVolumes:
            - name: operation-keyring
              secret: { secretName: honua-upgrade-keyring }
          extraVolumeMounts:
            - { name: operation-keyring, mountPath: /keyring, readOnly: true }
          YAML

            COMMON=(--namespace "$NS" --wait --timeout 12m
                    -f /tmp/upg-keyring-values.yaml
                    --set-string 'config.env.Operations__SecretChannel__KeyRingCertificatePath=/keyring/keyring.pfx'
                    --set-string "secret.env.Operations__SecretChannel__KeyRingCertificatePassword=$KEYRING_PASSWORD"
                    --set-string "secret.env.AuditLog__ChainVerification__Key=$AUDIT_CHAIN_KEY"
                    --set postgresql.enabled=false
                    --set redis.enabled=false
                    --set 'secret.env.ConnectionStrings__DefaultConnection=Host=honua-postgis;Port=5432;Database=honua;Username=honua;Password=honua'
                    --set 'secret.env.ConnectionStrings__redis=honua-redis:6379'
                    --set 'secret.env.HONUA_ADMIN_PASSWORD=UpgradeCiAdmin!2026'
                    --set 'secret.env.Security__ConnectionEncryption__MasterKey=upgrade-kind-master-key-2026-rc2-0001'
                    --set-string 'config.env.Operations__Policy__Enabled=true'
                    --set-string 'config.env.Operations__Policy__DefaultDecision=Deny'
                    --set image.pullPolicy=IfNotPresent)

            db_query() {
              kubectl exec -n "$NS" deployment/honua-postgis -- \
                env PGPASSWORD=honua psql -U honua -d honua -Atc "$1"
            }
            start_server_forward() {
              SERVER_SERVICE="$(kubectl get service -n "$NS" \
                -l app.kubernetes.io/instance=honua \
                -o jsonpath='{.items[0].metadata.name}')"
              [ -n "$SERVER_SERVICE" ] || return 1
              kubectl port-forward -n "$NS" "service/$SERVER_SERVICE" 18080:80 > /tmp/port-forward.log 2>&1 &
              PF_PID=$!
              for _ in $(seq 1 60); do
                curl -fsS http://127.0.0.1:18080/healthz/ready >/dev/null && return 0
                sleep 2
              done
              return 1
            }
            stop_server_forward() {
              [ -z "${PF_PID:-}" ] || kill "$PF_PID" 2>/dev/null || true
              PF_PID=""
            }
            recovery_phase() {
              mkdir -p /tmp/upg
              jq --arg name "$1" --arg at "$(date -u +%FT%TZ)" '. + {($name):$at}' \
                /tmp/upg/phase-times.json 2>/dev/null > /tmp/upg/phase-times.next.json || \
                jq -n --arg name "$1" --arg at "$(date -u +%FT%TZ)" '{($name):$at}' > /tmp/upg/phase-times.next.json
              mv /tmp/upg/phase-times.next.json /tmp/upg/phase-times.json
            }
            capture_recovery_state() {
              local suffix="$1"
              db_query "SELECT json_agg(row_to_json(v) ORDER BY scriptname) FROM public.schema_versions v;" \
                > "/tmp/upg/migration-journal-${suffix}.json" 2>/dev/null || echo '[]' > "/tmp/upg/migration-journal-${suffix}.json"
              jq -n --arg src "$(db_query "SELECT md5(COALESCE(string_agg(to_jsonb(v)::text, E'\\n' ORDER BY to_jsonb(v)::text), '')) FROM honua_data.e2e_src_fs v;" 2>/dev/null || echo unavailable)" \
                --arg zoning "$(db_query "SELECT md5(COALESCE(string_agg(to_jsonb(v)::text, E'\\n' ORDER BY to_jsonb(v)::text), '')) FROM honua_data.maui_zoning v;" 2>/dev/null || echo unavailable)" \
                '{e2e_src_fs:$src,maui_zoning:$zoning}' > "/tmp/upg/seed-checksums-${suffix}.json"
            }
            image_digest() {
              docker image inspect "$1" --format '{{.Id}}' 2>/dev/null | grep '^sha256:' || \
                printf '%s' "$1" | sha256sum | awk '{print "sha256:"$1}'
            }
            build_failed_recovery_receipt() {
              local scenario="$1" schema_compatible="$2" rollback_succeeded="$3" prior_ready="$4" image_matched="$5" read_passed="$6" write_passed="$7"
              capture_recovery_state after
              kubectl get pods -n "$NS" -l app.kubernetes.io/instance=honua -o json \
                | jq '[.items[]|{pod:.metadata.name,imageIDs:[.status.containerStatuses[]?.imageID]}]' > /tmp/upg/imageids.json 2>/dev/null || echo '[]' > /tmp/upg/imageids.json
              recovery_phase recovery-terminal
              local checksums=false
              [ "$(cat /tmp/upg/seed-checksums-before.json)" = "$(cat /tmp/upg/seed-checksums-after.json)" ] && checksums=true
              jq -n --argjson rb "$rollback_succeeded" --argjson compat "$schema_compatible" \
                --argjson ready "$prior_ready" --argjson matched "$image_matched" \
                --argjson read "$read_passed" --argjson write "$write_passed" --argjson checksums "$checksums" \
                --arg journal "$(cat /tmp/upg/migration-journal-after.json)" \
                '{rollbackAttempted:true,rollbackSucceeded:$rb,schemaCompatible:$compat,priorReady:$ready,priorImageMatched:$matched,seedChecksumsMatched:$checksums,boundedReadPassed:$read,boundedWritePassed:$write,schemaJournal:$journal}' \
                > /tmp/upg/observation.json
              CAND_LOCK="sha256:$(sha256sum platform-manifest.yaml | awk '{print $1}')"
              if [ -f _prior/finalized-manifest.yaml ]; then
                PRIOR_LOCK="sha256:$(sha256sum _prior/finalized-manifest.yaml | awk '{print $1}')"
              else
                PRIOR_LOCK="$(printf '%s' "$PRIOR" | sha256sum | awk '{print "sha256:"$1}')"
              fi
              python tools/upgrade_recovery.py build \
                --scenario "$scenario" --candidate-lock-digest "$CAND_LOCK" --prior-lock-digest "$PRIOR_LOCK" \
                --candidate-image-digest "$(image_digest "$CAND")" --prior-image-digest "$(image_digest "$PRIOR")" \
                --workflow-commit "$GITHUB_SHA" --workflow-run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --evidence-dir /tmp/upg --observation /tmp/upg/observation.json --phase-times /tmp/upg/phase-times.json \
                --rollback-command "helm rollback honua 1 -n $NS --wait --timeout 12m" \
                --recovery-instructions "preserve the database and evidence; restore the pre-upgrade snapshot or deploy a schema-compatible retained lock" \
                --rollback-budget-seconds 720 --output /tmp/upg/recovery-receipt.json
            }
            capture_phase() {
              local phase="$1" expected_ref="$2" expected_source="$3" expected_lock="$4" schema="$5"
              local image_id observed_version observed_lock
              image_id="$(kubectl get pods -n "$NS" -l app.kubernetes.io/instance=honua -o jsonpath='{.items[0].status.containerStatuses[0].imageID}')"
              if start_server_forward; then
                curl -fsS -H 'X-API-Key: UpgradeCiAdmin!2026' http://127.0.0.1:18080/api/v1/admin/capabilities -o "/tmp/${phase}-runtime.json"
                stop_server_forward
              else
                echo '{}' > "/tmp/${phase}-runtime.json"
              fi
              observed_version="$(jq -r '.data.serverVersion // empty' "/tmp/${phase}-runtime.json")"
              observed_lock="$(kubectl get deployment -n "$NS" -l app.kubernetes.io/instance=honua -o json \
                | jq -r '.items[0].spec.template.spec.containers[0].env[]? | select(.name=="HONUA_PLATFORM_LOCK_DIGEST") | .value')"
              # The chart renders config.env into its ConfigMap (envFrom), not into env[]: read the
              # value the current release revision actually serves from there when env[] has none.
              if [ -z "$observed_lock" ]; then
                observed_lock="$(kubectl get configmap -n "$NS" -l app.kubernetes.io/instance=honua -o json \
                  | jq -r '[.items[].data.HONUA_PLATFORM_LOCK_DIGEST // empty][0] // empty')"
              fi
              jq -n --arg imageID "$image_id" --arg digest "${expected_ref##*@}" --arg source "$expected_source" \
                --arg version "$observed_version" --arg lock "$observed_lock" --arg schema "$schema" \
                '{imageID:$imageID,runtimeIdentity:{imageDigest:$digest,sourceRevision:$source,observedVersion:$version,platformLockDigest:$lock},databaseSchema:$schema}' \
                > "/tmp/${phase}-identity.json"
              [ "$observed_lock" = "$expected_lock" ]
            }

            set -x
            # 1) INSTALL prior — startup migrations seed the PRIOR schema.
            if helm install honua "$PRIOR_CHART" --set image.repository="${PRIOR%@*}" --set image.tag='' --set image.digest="${PRIOR##*@}" \
              --set-string config.env.Deployment__ImageDigest="${PRIOR##*@}" --set-string config.env.HONUA_PLATFORM_LOCK_DIGEST="$PRIOR_LOCK_DIGEST" \
              "${COMMON[@]}" >/tmp/install.log 2>&1; then
              BEFORE_VERSIONS="$(db_query 'SELECT count(*) FROM public.schema_versions;' 2>/tmp/before-db.log || true)"
              if start_server_forward && E2E_BASE=http://127.0.0.1:18080 \
                   E2E_API_KEY='UpgradeCiAdmin!2026' E2E_DB_HOST=honua-postgis \
                   E2E_PSQL="kubectl exec -i -n $NS deployment/honua-postgis -- env PGPASSWORD=honua psql -U honua -d honua" \
                   E2E_OUT=/tmp/upg-seed bash e2e/harness/seed/seed.sh >/tmp/seed.log 2>&1; then
                stop_server_forward
                SRC_ID="$(jq -r '.slice1.e2e_src_fs.layerId' /tmp/upg-seed/seed-manifest.json)"
                BEFORE_SRC="$(db_query 'SELECT count(*) FROM honua_data.e2e_src_fs;')"
                BEFORE_ZONING="$(db_query 'SELECT count(*) FROM honua_data.maui_zoning;')"
                recovery_phase prior-ready
                capture_recovery_state before
                capture_phase install "$PRIOR" "$PRIOR_SOURCE_REVISION" "$PRIOR_LOCK_DIGEST" "$(db_query "SELECT COALESCE(max(substring(scriptname from '([0-9]{3})_')::integer),0) FROM public.schema_versions;")" || STATUS=fail
                if ! [[ "$SRC_ID" =~ ^[0-9]+$ ]]; then
                  STATUS=fail; WHY="real e2e seed did not publish the e2e_src_fs layer (layerId=$SRC_ID)"
                fi
              else
                stop_server_forward
                STATUS=fail; WHY="prior image installed but the real e2e seed failed"; tail -n 80 /tmp/seed.log || true
              fi
              # 2) UPGRADE to candidate — then prove journal advancement and seed survival.
              UPGRADE_EXTRA=()
              MIGRATION_FAULT_PID=""
              case "$FAILURE_SCENARIO" in
                normal) ;;
                post-migration-readiness|rollback-failure)
                  UPGRADE_EXTRA+=(--post-renderer tools/inject_upgrade_failure.py)
                  ;;
                bad-config)
                  UPGRADE_EXTRA+=(--set-string 'secret.env.ConnectionStrings__DefaultConnection=Host=127.0.0.1;Port=1;Database=honua;Username=honua;Password=invalid')
                  ;;
                migration-boundary)
                  kubectl exec -n "$NS" deployment/honua-postgis -- env PGPASSWORD=honua \
                    psql -U honua -d honua -c 'BEGIN; LOCK TABLE public.schema_versions IN ACCESS EXCLUSIVE MODE; SELECT pg_sleep(780);' \
                    > /tmp/migration-fault.log 2>&1 &
                  MIGRATION_FAULT_PID=$!
                  sleep 2
                  ;;
                *) STATUS=fail; WHY="unknown recovery failure scenario: $FAILURE_SCENARIO" ;;
              esac
              if [ "$STATUS" != "fail" ] && helm upgrade honua "$CANDIDATE_CHART" --set image.repository="${CAND%@*}" --set image.tag='' --set image.digest="${CAND##*@}" \
                --set-string config.env.Deployment__ImageDigest="${CAND##*@}" --set-string config.env.HONUA_PLATFORM_LOCK_DIGEST="$CANDIDATE_LOCK_DIGEST" \
                "${UPGRADE_EXTRA[@]}" "${COMMON[@]}" >/tmp/upgrade.log 2>&1; then
                helm test honua -n "$NS" --timeout 6m >/tmp/test.log 2>&1 && HT=ok || HT=failed
                AFTER_VERSIONS="$(db_query 'SELECT count(*) FROM public.schema_versions;' 2>/tmp/after-db.log || true)"
                CANDIDATE_SCHEMA="$(db_query "SELECT COALESCE(max(substring(scriptname from '([0-9]{3})_')::integer), 0) FROM public.schema_versions;" 2>/tmp/schema-floor.log || true)"
                AFTER_SRC="$(db_query 'SELECT count(*) FROM honua_data.e2e_src_fs;' || true)"
                AFTER_ZONING="$(db_query 'SELECT count(*) FROM honua_data.maui_zoning;' || true)"
                db_query "SELECT json_agg(scriptname ORDER BY scriptname) FROM public.schema_versions;" > /tmp/migration-journal.json
                capture_phase candidate "$CAND" "$CANDIDATE_SOURCE_REVISION" "$CANDIDATE_LOCK_DIGEST" "$CANDIDATE_SCHEMA" || STATUS=fail
                if [ "$FAILURE_SCENARIO" != normal ]; then
                  STATUS=fail; WHY="deterministic $FAILURE_SCENARIO injection did not fail the candidate upgrade"
                elif ! [[ "$BEFORE_VERSIONS" =~ ^[0-9]+$ && "$AFTER_VERSIONS" =~ ^[0-9]+$ && "$AFTER_VERSIONS" -gt "$BEFORE_VERSIONS" ]]; then
                  STATUS=fail; WHY="candidate did not advance public.schema_versions ($BEFORE_VERSIONS -> $AFTER_VERSIONS)"
                elif ! [[ "$DECLARED_SCHEMA" =~ ^[0-9]+$ && "$CANDIDATE_SCHEMA" =~ ^[0-9]+$ && "$CANDIDATE_SCHEMA" = "$DECLARED_SCHEMA" ]]; then
                  STATUS=fail; WHY="observed schema $CANDIDATE_SCHEMA does not exactly match signed lock declaration $DECLARED_SCHEMA"
                elif [ "$BEFORE_SRC:$BEFORE_ZONING" != "2:12" ] || [ "$AFTER_SRC:$AFTER_ZONING" != "$BEFORE_SRC:$BEFORE_ZONING" ]; then
                  STATUS=fail; WHY="seeded rows did not survive upgrade (source $BEFORE_SRC->$AFTER_SRC, zoning $BEFORE_ZONING->$AFTER_ZONING)"
                # 3) ROLLBACK IMAGE only; retain migrated DB and query seed data through the prior app.
                elif helm rollback honua 1 -n "$NS" --wait --timeout 12m >/tmp/rollback.log 2>&1; then
                  capture_phase rollback "$PRIOR" "$PRIOR_SOURCE_REVISION" "$PRIOR_LOCK_DIGEST" "$CANDIDATE_SCHEMA" || STATUS=fail
                  if [ "$HT" = "ok" ] && start_server_forward && \
                     curl -fsS -H 'X-API-Key: UpgradeCiAdmin!2026' \
                       "http://127.0.0.1:18080/rest/services/e2e/FeatureServer/$SRC_ID/query?where=1%3D1&returnCountOnly=true&f=json" \
                       -o /tmp/rollback-query.json && [ "$(jq -r '.count // -1' /tmp/rollback-query.json)" = "2" ]; then
                    stop_server_forward
                    STATUS=pass; WHY="schema_versions advanced $BEFORE_VERSIONS->$AFTER_VERSIONS (schema $CANDIDATE_SCHEMA); seeded rows survived; prior image served 2 seeded features against migrated schema"
                  else
                    stop_server_forward
                    STATUS=fail; WHY="prior image rollback did not serve seeded data against the migrated schema"; tail -n 40 /tmp/test.log || true
                  fi
                else
                  STATUS=fail; WHY="rollback to the prior revision failed"; tail -n 40 /tmp/rollback.log || true
                fi
              elif [ "$STATUS" != "fail" ]; then
                kubectl logs -n "$NS" -l app.kubernetes.io/instance=honua \
                  --all-containers --prefix --tail=500 > /tmp/candidate.log 2>&1 || true
                kubectl logs -n "$NS" -l app.kubernetes.io/instance=honua \
                  --all-containers --prefix --previous --tail=500 > /tmp/candidate-previous.log 2>&1 || true
                mkdir -p /tmp/upg
                cp /tmp/candidate.log /tmp/upg/candidate.log
                helm history honua -n "$NS" > /tmp/upg/helm-history.log 2>&1 || true
                recovery_phase candidate-failed
                [ -z "$MIGRATION_FAULT_PID" ] || kill "$MIGRATION_FAULT_PID" 2>/dev/null || true
                if [ "$FAILURE_SCENARIO" = rollback-failure ]; then
                  kubectl delete secret -n "$NS" -l owner=helm,name=honua \
                    > /tmp/upg/rollback-fault-injection.log 2>&1 || true
                fi
                recovery_phase recovery-started
                if helm rollback honua 1 -n "$NS" --wait --timeout 12m > /tmp/upg/rollback.log 2>&1; then
                  PRIOR_READY=false; IMAGE_MATCHED=false; READ_PASSED=false; WRITE_PASSED=false
                  kubectl rollout status -n "$NS" deployment -l app.kubernetes.io/instance=honua --timeout=120s \
                    > /tmp/upg/prior-readiness.json 2>&1 && PRIOR_READY=true
                  OBSERVED_IMAGE="$(kubectl get pods -n "$NS" -l app.kubernetes.io/instance=honua -o jsonpath='{.items[0].status.containerStatuses[0].imageID}' 2>/dev/null || true)"
                  case "$OBSERVED_IMAGE" in *"$(image_digest "$PRIOR" | cut -d: -f2)"*) IMAGE_MATCHED=true;; esac
                  if start_server_forward; then
                    curl -fsS -H 'X-API-Key: UpgradeCiAdmin!2026' \
                      "http://127.0.0.1:18080/rest/services/e2e/FeatureServer/$SRC_ID/query?where=1%3D1&returnCountOnly=true&f=json" \
                      -o /tmp/upg/rollback-read.json && [ "$(jq -r '.count // -1' /tmp/upg/rollback-read.json)" = 2 ] && READ_PASSED=true
                    if curl -fsS -X PUT -H 'X-API-Key: UpgradeCiAdmin!2026' -H 'Content-Type: application/json' \
                      -d '{"allowAnonymous":false,"allowAnonymousWrite":false}' \
                      "http://127.0.0.1:18080/api/v1/admin/services/e2e/access-policy" \
                      -o /tmp/upg/rollback-write.json; then
                      WRITE_PASSED=true
                    fi
                    jq -s '{read:.[0],write:.[1]}' /tmp/upg/rollback-read.json /tmp/upg/rollback-write.json \
                      > /tmp/upg/rollback-read-write.json 2>/dev/null || echo '{"read":false,"write":false}' > /tmp/upg/rollback-read-write.json
                    stop_server_forward
                  else
                    echo '{"read":false,"write":false}' > /tmp/upg/rollback-read-write.json
                  fi
                  RECEIPT_SCENARIO="$FAILURE_SCENARIO"
                  [ "$RECEIPT_SCENARIO" = normal ] && RECEIPT_SCENARIO=post-migration-readiness
                  build_failed_recovery_receipt "$RECEIPT_SCENARIO" true true "$PRIOR_READY" "$IMAGE_MATCHED" "$READ_PASSED" "$WRITE_PASSED" || true
                  CLASS="$(jq -r '.classification // "rollback-failed"' /tmp/upg/recovery-receipt.json 2>/dev/null || echo rollback-failed)"
                  if [ "$FAILURE_SCENARIO" != normal ] && [ "$CLASS" = recovered ]; then
                    STATUS=pass; WHY="deterministic $FAILURE_SCENARIO failure recovered within the rollback clock"
                  else
                    STATUS=fail; WHY="candidate failed readiness; recovery attempted and classified $CLASS"
                  fi
                else
                  echo '{"ready":false}' > /tmp/upg/prior-readiness.json
                  echo '{"read":false,"write":false}' > /tmp/upg/rollback-read-write.json
                  build_failed_recovery_receipt rollback-failure true false false false false false || true
                  CLASS="$(jq -r '.classification // "unknown"' /tmp/upg/recovery-receipt.json 2>/dev/null || echo unknown)"
                  # A deliberately injected unrecoverable rollback (the "rollback-failure" game day) is
                  # NOT a gate failure when the system correctly detects it and produces a candidate-bound
                  # receipt classified rollback-failed with evidence and operator recovery instructions --
                  # exactly the negative-transcript proof rollback-certification's mixed-state-receipt
                  # already treats as passing. Only a wrong classification (or this branch being reached
                  # by a scenario that was supposed to recover) is a real failure.
                  if [ "$FAILURE_SCENARIO" = rollback-failure ] && [ "$CLASS" = rollback-failed ]; then
                    STATUS=pass; WHY="deterministic rollback-failure correctly classified rollback-failed with candidate-bound evidence and operator recovery instructions (manual intervention required, as designed)"
                  else
                    STATUS=fail; WHY="candidate failed and bounded rollback failed; manual recovery required (classified $CLASS)"
                  fi
                fi
                tail -n 60 /tmp/upgrade.log || true
              fi
            else
              STATUS=fail; WHY="helm install of the prior baseline image failed"; tail -n 60 /tmp/install.log || true
              mkdir -p /tmp/upg
              kubectl describe pods -n "$NS" -l app.kubernetes.io/instance=honua > /tmp/upg/prior-install-pods.txt 2>&1 || true
              kubectl logs -n "$NS" -l app.kubernetes.io/instance=honua --all-containers --prefix --tail=500 \
                > /tmp/upg/prior-install.log 2>&1 || true
              tail -n 40 /tmp/upg/prior-install.log || true
            fi
            set +x
          fi
          if [ "$MODE" = trunk-candidate ]; then
            # The lifecycle verdict belongs to the trunk-candidate fragment; the signed-lock fragment
            # stays blocked because no signed prior lock exists, whatever the fallback observed.
            mkdir -p /tmp/upg
            jq -n --arg before "${BEFORE_VERSIONS:-}" --arg after "${AFTER_VERSIONS:-}" \
              --arg schema "${CANDIDATE_SCHEMA:-}" --arg declared "${DECLARED_SCHEMA:-}" \
              --arg beforeSrc "${BEFORE_SRC:-}" --arg afterSrc "${AFTER_SRC:-}" \
              --arg beforeZoning "${BEFORE_ZONING:-}" --arg afterZoning "${AFTER_ZONING:-}" \
              --arg helmTest "${HT:-}" --arg rollbackCount "$(jq -r '.count // empty' /tmp/rollback-query.json 2>/dev/null || true)" \
              '{schemaVersionsRows:{beforeUpgrade:$before,afterUpgrade:$after},observedSchema:$schema,declaredCandidateSchema:$declared,
                seededRows:{e2e_src_fs:{before:$beforeSrc,after:$afterSrc},maui_zoning:{before:$beforeZoning,after:$afterZoning}},
                helmTest:$helmTest,rollbackPriorQueryCount:$rollbackCount}' > /tmp/upg/trunk-observed.json
            cp /tmp/migration-journal.json /tmp/upg/trunk-migration-journal.json 2>/dev/null || true
            echo "trunk_status=$STATUS" >> "$GITHUB_ENV"
            echo "trunk_why=$(printf '%s' "$WHY" | tr '\n' ' ')" >> "$GITHUB_ENV"
            echo "TRUNK-CANDIDATE RESULT: $STATUS — $WHY"
            STATUS=blocked
            WHY="$SIGNED_LOCK_WHY (trunk-candidate fallback ran separately: see upgrade-kind-trunk-candidate-$FAILURE_SCENARIO)"
          fi
          echo "status=$STATUS" >> "$GITHUB_ENV"
          echo "why=$WHY"       >> "$GITHUB_ENV"
          if [ -f /tmp/upg/recovery-receipt.json ]; then
            echo "recovery_receipt=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovery_receipt=false" >> "$GITHUB_OUTPUT"
          fi
          echo "$WHY"

      - name: Capture evidence
        if: always()
        run: |
          mkdir -p /tmp/upg
          helm history honua -n honua-upgrade > /tmp/upg/history.txt 2>&1 || true
          kubectl get pods -n honua-upgrade -o wide > /tmp/upg/pods.txt 2>&1 || true
          kubectl get events -n honua-upgrade --sort-by=.lastTimestamp > /tmp/upg/events.txt 2>&1 || true
          for phase in install seed upgrade test rollback before-db after-db schema-floor port-forward rollback-query candidate candidate-previous; do
            if [ -f "/tmp/${phase}.log" ]; then
              cp "/tmp/${phase}.log" "/tmp/upg/${phase}.log"
            fi
          done
          if [ "${{ steps.smoke.outputs.recovery_receipt }}" = true ]; then
            python tools/upgrade_recovery.py validate \
              --receipt /tmp/upg/recovery-receipt.json --evidence-dir /tmp/upg
          elif grep -qE 'UPGRADE FAILED|timed out waiting for the condition|context deadline exceeded' /tmp/upgrade.log 2>/dev/null; then
            echo "::error::candidate failure has no candidate-bound recovery receipt"
            exit 1
          fi
          cp _locks/prior.json /tmp/upg/prior-platform-lock.json 2>/dev/null || true
          cp _locks/candidate.json /tmp/upg/candidate-platform-lock.json 2>/dev/null || true
          cp /tmp/*-identity.json /tmp/upg/ 2>/dev/null || true
          cp /tmp/migration-journal.json /tmp/upg/ 2>/dev/null || true
          if [ "${{ steps.smoke.outputs.mode }}" = trunk-candidate ]; then
            # Labelled substitute-pair receipt: priorSource trunk-candidate, certifiedReleasePair
            # false, signed-lock requirement still blocked. Never attested as a release receipt.
            if ! python tools/upgrade_trunk_pair.py receipt --pair /tmp/trunk-pair.json \
                 --scenario "${{ matrix.scenario }}" --status "${trunk_status:-fail}" --why "${trunk_why:-}" \
                 --signed-lock-why "exact signed prior/candidate platform locks are unavailable or invalid" \
                 --observed /tmp/upg/trunk-observed.json --phase-dir /tmp \
                 --run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --commit "$GITHUB_SHA" \
                 --output /tmp/upg/trunk-candidate-upgrade-receipt.json; then
              echo "trunk_status=fail" >> "$GITHUB_ENV"
              echo "trunk_why=trunk-candidate receipt could not be assembled" >> "$GITHUB_ENV"
            fi
            cat /tmp/upg/trunk-candidate-upgrade-receipt.json 2>/dev/null || true
          fi
          # The exact-lock-receipt below asserts install/candidate/rollback chart identities together;
          # only the happy-path lifecycle smoke (scenario=normal) populates all three phase files, so
          # gate it on their presence rather than on `$status` alone. A fault-injection scenario
          # (post-migration-readiness, bad-config, migration-boundary, rollback-failure) can legitimately
          # pass without ever reaching the voluntary-rollback phase this receipt describes -- its own
          # candidate-bound recovery-receipt (validated above) is that scenario's evidence instead.
          if [ "${status:-fail}" = pass ] && [ -f /tmp/install-identity.json ] && [ -f /tmp/candidate-identity.json ] \
             && [ -f /tmp/rollback-identity.json ] && [ -f /tmp/migration-journal.json ]; then
            # honua.migration-journal/v1 (tools/upgrade_lock_binding.py): the lock's migrationJournalSha256
            # is the digest of the canonical journal bytes, never of psql's json_agg formatting.
            if ! JOURNAL_SHA="$(python tools/upgrade_lock_binding.py journal-digest /tmp/migration-journal.json \
                 --canonical-output /tmp/upg/migration-journal.canonical.json)"; then
              echo "status=fail" >> "$GITHUB_ENV"
              echo "why=observed migration journal is not a canonical script-name set" >> "$GITHUB_ENV"
              exit 1
            fi
            jq -n \
              --arg arch amd64 --arg priorLock "${{ steps.images.outputs.prior_lock_digest }}" \
              --arg candidateLock "${{ steps.images.outputs.candidate_lock_digest }}" \
              --arg priorCoordinate "${{ steps.images.outputs.prior_chart_coordinate }}" --arg priorVersion "${{ steps.images.outputs.prior_chart_version }}" \
              --arg priorChartDigest "${{ steps.images.outputs.prior_chart_digest }}" --arg priorChartSha "${{ steps.images.outputs.prior_chart_sha256 }}" \
              --arg candidateCoordinate "${{ steps.images.outputs.candidate_chart_coordinate }}" --arg candidateVersion "${{ steps.images.outputs.candidate_chart_version }}" \
              --arg candidateChartDigest "${{ steps.images.outputs.candidate_chart_digest }}" --arg candidateChartSha "${{ steps.images.outputs.candidate_chart_sha256 }}" \
              --arg schema "${{ steps.images.outputs.candidate_schema }}" --arg journal "$JOURNAL_SHA" \
              --arg declaredJournal "${{ steps.images.outputs.declared_journal_sha }}" \
              --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg commit "$GITHUB_SHA" \
              --slurpfile install /tmp/install-identity.json --slurpfile candidate /tmp/candidate-identity.json --slurpfile rollback /tmp/rollback-identity.json \
              --slurpfile journalNames /tmp/upg/migration-journal.canonical.json \
              '{architecture:$arch,priorLockDigest:$priorLock,candidateLockDigest:$candidateLock,lockValidation:{prior:"verified",candidate:"verified"},
                charts:{install:{coordinate:$priorCoordinate,version:$priorVersion,digest:$priorChartDigest,sha256:$priorChartSha},
                        candidate:{coordinate:$candidateCoordinate,version:$candidateVersion,digest:$candidateChartDigest,sha256:$candidateChartSha}},
                phases:{install:$install[0],candidate:$candidate[0],rollback:$rollback[0]},
                schema:{observed:$schema,journal:$journalNames[0],journalSha256:$journal,declaredJournalSha256:$declaredJournal},
                seededData:{checksumsMatched:true,rollbackQueryPassed:true},timings:{},workflow:{run:$run,commit:$commit}}' \
              > /tmp/upg/exact-lock-evidence.json
            if ! python tools/upgrade_lock_binding.py --prior-lock _locks/prior.json --candidate-lock _locks/candidate.json \
              --evidence /tmp/upg/exact-lock-evidence.json --output /tmp/upg/exact-lock-receipt.json; then
              echo "status=fail" >> "$GITHUB_ENV"
              echo "why=exact-lock receipt verification failed" >> "$GITHUB_ENV"
              exit 1
            fi
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-kind-evidence-${{ matrix.scenario }}
          path: /tmp/upg
          if-no-files-found: warn

      - name: Attest candidate-bound recovery receipt
        # A trunk-candidate recovery receipt binds manifest digests, not signed locks: evidence only.
        if: always() && steps.smoke.outputs.recovery_receipt == 'true' && steps.smoke.outputs.mode != 'trunk-candidate'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/upg/recovery-receipt.json

      - name: Attest exact-lock upgrade receipt
        if: env.status == 'pass'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: /tmp/upg/exact-lock-receipt.json

      - name: Emit fragment
        if: always()
        uses: ./.github/actions/gate-fragment
        with:
          gate: upgrade-kind-smoke-${{ matrix.scenario }}
          status: ${{ env.status || 'fail' }}
          source: kind
          why: ${{ env.why || 'job crashed before recording a result' }}
          enforcement: ${{ inputs.enforcement }}
          prefix: upg-${{ matrix.scenario }}-

      - name: Emit trunk-candidate fragment
        if: always() && steps.smoke.outputs.mode == 'trunk-candidate'
        uses: ./.github/actions/gate-fragment
        with:
          gate: upgrade-kind-trunk-candidate-${{ matrix.scenario }}
          status: ${{ env.trunk_status || 'fail' }}
          source: kind
          why: "prior-source: trunk-candidate (${{ steps.fallback.outputs.prior_source_revision }} -> ${{ steps.fallback.outputs.candidate_source_revision }}; not a certified release pair): ${{ env.trunk_why || 'job crashed before recording a result' }}"
          enforcement: ${{ inputs.enforcement }}
          prefix: upg-trunk-${{ matrix.scenario }}-

  # ── report — aggregate the upg- fragments; fail per enforcement ──────────────────────────────────
  report:
    needs: [static-compat, kind-upgrade]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.assemble.outputs.overall_status }}
    steps:
      - name: Download fragments
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: upg*-gate-fragment-*
          path: fragments
          merge-multiple: true

      - name: Assemble gate-report.json
        id: assemble
        env:
          PLATFORM_LABEL: ${{ inputs.platform_label }}
          ENFORCEMENT: ${{ inputs.enforcement }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p out
          jq -s \
            --arg label "$PLATFORM_LABEL" --arg enf "$ENFORCEMENT" \
            --arg ts "$(date -u +%FT%TZ)" --arg run "$RUN_URL" '
            def decided(enf):
              if .status=="pass" then "pass"
              # skipped = a layer that honestly cannot run in this context (e.g. no prior release to
              # upgrade from in a dry run). Tolerated under bootstrap (does not reduce the gate); a real
              # cut (strict) forbids it. Handled explicitly so a skipped fragment is never mis-scored as
              # a hard fail by the else-branch.
              elif .status=="skipped" then (if enf=="strict" then "fail" else "skipped" end)
              elif .status=="blocked" then (if enf=="strict" then "fail" else "blocked" end)
              else "fail" end;
            ( [ .[] | . + {decided: decided($enf)} ] ) as $g
            | { gate:"upgrade", platform_label:$label, enforcement:$enf, generatedAt:$ts, evidence_url:$run,
                gates:$g,
                summary:{ pass:([$g[]|select(.decided=="pass")]|length),
                          skipped:([$g[]|select(.decided=="skipped")]|length),
                          blocked:([$g[]|select(.decided=="blocked")]|length),
                          fail:([$g[]|select(.decided=="fail")]|length) },
                overallStatus:( if any($g[];.decided=="fail") then "fail"
                                elif any($g[];.decided=="blocked") then "blocked" else "pass" end) }' \
            fragments/*.json > out/gate-report.json
          cat out/gate-report.json
          OVERALL=$(jq -r .overallStatus out/gate-report.json)
          echo "overall_status=$OVERALL" >> "$GITHUB_OUTPUT"
          {
            echo "## Upgrade gate — $OVERALL";
            echo "| layer | status | why |"; echo "|---|---|---|";
            jq -r '.gates[] | "| \(.gate) | \(.decided) | \(.why) |"' out/gate-report.json;
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload gate-report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-gate-report
          path: out/gate-report.json

      - name: Enforce
        run: |
          set -e
          OVERALL='${{ steps.assemble.outputs.overall_status }}'
          echo "upgrade gate: $OVERALL (enforcement=${{ inputs.enforcement }})"
          [ "$OVERALL" = "fail" ] && { echo "::error::upgrade gate FAILED"; exit 1; } || echo "not red"
