# Publishes the exact qualified bytes; does not repack, rebuild or advance platform pins.
name: gp-devkit-publish
run-name: "Publish qualified GP devkit ${{ inputs.version }}"
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful gp-devkit-candidate run
        required: true
        type: string
      candidate_attempt:
        description: Exact successful run attempt
        required: true
        default: '1'
        type: string
      candidate_artifact_id:
        description: Immutable gp-devkit-qualified-candidate Actions artifact id
        required: true
        type: string
      image_artifact_id:
        description: Immutable gp-devkit-qualified-image Actions artifact id
        required: true
        type: string
      release_sha:
        description: Full merged honua-release SHA that produced the candidate
        required: true
        type: string
      server_sha:
        description: Full merged honua-server SHA in the qualified package
        required: true
        type: string
      version:
        description: Exact qualified package version
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gp-devkit-publication-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'honua-io/honua-release' && github.ref == 'refs/heads/trunk'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify publication gate regression tests
        run: |
          python3 -m pip install pytest
          python3 -m pytest tools/test_gp_devkit_publish.py tools/test_gp_devkit_artifacts.py -q
      - name: Verify successful candidate, source closure, archives and attestations
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ATTEMPT: ${{ inputs.candidate_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          IMAGE_ARTIFACT_ID: ${{ inputs.image_artifact_id }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          SERVER_SHA: ${{ inputs.server_sha }}
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          test -n "$GH_TOKEN" || { echo 'RELEASE_GH_TOKEN is required for governed cross-repository publication.' >&2; exit 1; }
          python3 tools/gp_devkit_publish.py prepare \
            --run-id "$CANDIDATE_RUN_ID" --attempt "$CANDIDATE_ATTEMPT" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" --image-artifact-id "$IMAGE_ARTIFACT_ID" \
            --release-sha "$RELEASE_SHA" --server-sha "$SERVER_SHA" --version "$PACKAGE_VERSION" --output publication
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the preserved image and unique public server release assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: python3 tools/gp_devkit_publish.py publish --input publication
      - name: Read immutable publication identity
        id: identity
        run: |
          python3 - <<'PY'
          import json, os
          value = json.load(open('publication/published/published.json'))['sandboxImage']
          name, digest = value.split('@', 1)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('name=' + name + '\n' + 'digest=' + digest + '\n')
          PY
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.identity.outputs.name }}
          subject-digest: ${{ steps.identity.outputs.digest }}
          push-to-registry: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gp-devkit-publication
          path: publication/published
          if-no-files-found: error
          retention-days: 90
  anonymous-consumption:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gp-devkit-publication
          path: publication
      # Fresh runner. No Docker login and no token environment in the consumer step.
      - name: Verify anonymous package install and immutable image pull
        run: |
          python3 tools/gp_devkit_public_consumption.py \
            --candidate-directory publication/candidate --release-identity publication/published.json \
            --registry-manifest publication/registry-manifest.json --output anonymous-consumption
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gp-devkit-anonymous-consumption
          path: anonymous-consumption/public-consumption.json
          if-no-files-found: error
          retention-days: 90
