name: gate-native-ecs-qualification

on:
  workflow_call:
    inputs:
      candidate_digest:
        required: true
        type: string
      server_image:
        required: true
        type: string
      lock_digest:
        required: true
        type: string
      require_model:
        required: true
        type: boolean
    outputs:
      overall_status:
        value: ${{ jobs.qualification.outputs.status }}

permissions:
  actions: read
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.verify.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml jsonschema
      - name: Resolve the candidate-specific qualification and pin its attempt
        id: producer
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          identity="$(printf '%s\n' "$CANDIDATE_DIGEST" "$LOCK_DIGEST" | sha256sum | cut -d' ' -f1)"
          artifact="native-ecs-qualification-$identity"
          run_id="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/artifacts" -f name="$artifact" \
            --jq '.artifacts | map(select(.expired == false)) | first | .workflow_run.id // empty')"
          [[ "$run_id" =~ ^[1-9][0-9]*$ ]] || { echo "::error::No native ECS qualification for the frozen candidate"; exit 1; }
          api="repos/$GITHUB_REPOSITORY/actions/runs/$run_id"
          attempt="$(gh api "$api" --jq .run_attempt)"
          [[ "$attempt" =~ ^[1-9][0-9]*$ ]]
          gh api "$api/attempts/$attempt" > producer-run.json
          {
            echo "artifact=$artifact"
            echo "run_id=$run_id"
            echo "attempt=$attempt"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-manifest
          path: candidate-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.producer.outputs.run_id }}
          name: ${{ steps.producer.outputs.artifact }}
          path: qualification
      - name: Verify native installation, journey, refusal and cleanup
        id: verify
        env:
          CANDIDATE_DIGEST: ${{ inputs.candidate_digest }}
          SERVER_IMAGE: ${{ inputs.server_image }}
          LOCK_DIGEST: ${{ inputs.lock_digest }}
          REQUIRE_MODEL: ${{ inputs.require_model }}
          SOURCE_RUN_ID: ${{ steps.producer.outputs.run_id }}
          SOURCE_ATTEMPT: ${{ steps.producer.outputs.attempt }}
        run: |
          set -euo pipefail
          model=()
          if [[ "$REQUIRE_MODEL" == true ]]; then model+=(--require-model); fi
          python tools/check_native_ecs_qualification.py \
            --root qualification --run producer-run.json --repository "$GITHUB_REPOSITORY" \
            --run-id "$SOURCE_RUN_ID" --attempt "$SOURCE_ATTEMPT" \
            --candidate candidate-input/platform-manifest.yaml --candidate-digest "$CANDIDATE_DIGEST" \
            --server-image "$SERVER_IMAGE" --lock-digest "$LOCK_DIGEST" \
            --train-run-id "$GITHUB_RUN_ID" --train-attempt "$GITHUB_RUN_ATTEMPT" \
            --out out "${model[@]}"
          echo "status=pass" >> "$GITHUB_OUTPUT"
      - name: Retain verified train observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journey-gate-report-native-ecs
          path: out/
          if-no-files-found: error
